<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Choose a style — DreamTube</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<!-- Analytics: PostHog (product analytics + funnels + A/B experiments) and Meta Pixel
     (ad conversion tracking for Meta ads). Both blocks below no-op safely — no script
     load, no network call, no console error — until real keys are set in
     js/analytics-config.js. See docs/ANALYTICS_SETUP.md for the full setup story,
     including why GA4 is deliberately not installed yet (no Google Ads channel yet). -->
<script src="js/analytics-config.js"></script>
<script>
  // PostHog web snippet — https://posthog.com/docs/getting-started/install

    posthog.init(POSTHOG_KEY, {
      api_host: POSTHOG_HOST,
      defaults: '2026-05-30',
      session_recording: {
        // PostHog already masks every input/textarea's typed value by default in session
        // replay (maskAllInputs defaults to true) — pinned explicitly here so a future

        // (passwords, and — the reason this matters most for DreamTube — the personal,
        // sometimes vulnerable dream text people type into #dream-text and future
        // free-text quiz-funnel screens) in session replays without anyone noticing.
        // See also the `ph-no-capture` class on #dream-text in create.html, a second,
        // independent layer of the same protection for that specific field. DO NOT

        maskAllInputs: true

</script>
<script>
  // Meta Pixel base code — https://developers.facebook.com/docs/meta-pixel/get-started
  // The <noscript> fallback pixel <img> from Meta's standard snippet is deliberately
  // left out: it can't be gated behind the same placeholder check (a <noscript> tag only
  // renders when JS is off, so no JS-side check can stop it firing with a placeholder ID),
  // and this app requires JavaScript to function at all (js/store.js is the entire
  // client-side "backend"), so a no-JS visitor already has a non-functional app either
  // way. Add it back once META_PIXEL_ID is a real value, if desired:
  //   <noscript><img height="1" width="1" style="display:none"
  //     src="https://www.facebook.com/tr?id=REAL_ID&ev=PageView&noscript=1" /></noscript>
  if (typeof META_PIXEL_ID !== 'undefined' && META_PIXEL_ID !== 'REPLACE_WITH_REAL_PIXEL_ID') {
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', META_PIXEL_ID);
    fbq('track', 'PageView');
  }
</script>
</head>
<body>

<div id="app">
  <div class="topbar"><a class="icon-btn" href="create.html" id="style-back"></a><div style="font-weight:700; font-size:14px;">Choose a style</div><div style="width:36px;"></div></div>
  <div class="px" style="flex:1; display:flex; flex-direction:column;">
    <div class="style-grid" id="style-grid">
      <div class="style-card" data-style="Cartoon"><div class="sc-bg sc-cartoon"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Cartoon</div></div></div>
      <div class="style-card" data-style="Cinematic"><div class="sc-bg sc-cinematic"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Cinematic</div></div></div>
      <div class="style-card" data-style="Anime"><div class="sc-bg sc-anime"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Anime</div></div></div>
      <div class="style-card" data-style="Realistic"><div class="sc-bg sc-realistic"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Realistic</div></div></div>
    </div>
    <div style="flex:1"></div>
    <!-- Image-vs-video picker — Direction A, the segmented toggle (Ron's
         confirmed choice, see docs/IMAGE_GENERATION_SPEC.md §5/§9). Video
         is pre-selected so existing behavior is unchanged unless a user
         deliberately picks Image. Reuses the char-mode-row/char-mode-btn
         visual pattern under new class names (.media-type-row/
         .media-type-btn) to avoid coupling this to the character sheet's
         own Describe/Upload-photo toggle. -->
    <div class="media-type-row" id="media-type-row">
      <div class="media-type-btn" data-media-type="image">Image</div>
      <div class="media-type-btn active" data-media-type="video">Video</div>
    </div>
    <button class="btn btn-primary btn-block" id="generate-btn" disabled style="margin-bottom:22px;">Generate Video</button>
  </div>

  <div class="modal-overlay" id="modal-quota">
    <div class="modal-card">
      <div class="modal-title">Out of tokens for now</div>
      <!-- Free during beta — this deliberately never frames running out of
           tokens as "pay to continue" (there's no live payment flow at all
           right now). It's purely a wait-a-bit state: the daily free grant
           refills automatically, no purchase required. See shop.html's own
           beta banner for the same framing. id'd (modal-quota-body) so the
           image-vs-video picker below can swap this copy in place — see
           updateMediaTypeUI(). This static text is a pre-JS placeholder
           only (updateMediaTypeUI() overwrites it synchronously on load,
           before this modal is ever shown) — its daily-grant number is
           kept in sync with DEFAULT_DAILY_GRANT_AMOUNT below by hand. -->
      <div class="modal-body" id="modal-quota-body">Generating a video costs 100 tokens. Free during beta — no card needed — you'll get 10 more automatically within 24 hours.</div>
      <div class="modal-row">
        <button class="btn btn-ghost" style="flex:1;" id="quota-cancel">Not now</button>
        <button class="btn btn-warm" style="flex:1;" id="quota-buy">Token shop</button>
      </div>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script>
  if(!DreamStore.getCurrentUser()){ location.href = 'login.html'; }
  document.getElementById('style-back').innerHTML = Icons.back;
  Array.prototype.forEach.call(document.querySelectorAll('.sc-icon'), function(el){ el.innerHTML = Icons.palette; });
  Array.prototype.forEach.call(document.querySelectorAll('.sc-check'), function(el){ el.innerHTML = Icons.check; });
  var draft = DreamStore.getDraft();
  if(!draft.caption){ location.href = 'create.html'; }

  var selected = null;
  var grid = document.getElementById('style-grid');
  var genBtn = document.getElementById('generate-btn');
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.style-card');
    if(!card) return;
    Array.prototype.forEach.call(grid.querySelectorAll('.style-card'), function(c){ c.classList.remove('selected'); });
    card.classList.add('selected');
    selected = card.dataset.style;
    genBtn.disabled = false;
  });

  // ===== Token balance pre-check =====
  // Convenience-only, client-side pre-check (see js/store.js's
  // getTokenStatus doc comment) — fetched once on load, never awaited at
  // click time, so a slow/failed/never-resolving fetch simply leaves
  // tokenStatus null and the generate button behaves exactly as it does
  // today (fail open). The real enforcement is generate-video.js's
  // server-side E112 check (or generate-image.js's E412) — the threshold
  // checked below reacts to whichever media type is currently selected.
  // Declared before the media-type picker below since its quota copy reads
  // tokenStatus.dailyGrantAmount live (see DEFAULT_DAILY_GRANT_AMOUNT's own
  // comment for why a hardcoded number is exactly the bug class this fixes).
  var tokenStatus = null;
  DreamStore.getTokenStatus().then(function(status){
    tokenStatus = status;
    updateMediaTypeUI(); // refresh the quota copy below with the real daily-grant number, in case it rendered first with the fallback
  }).catch(function(){ tokenStatus = null; });

  // ===== Image-vs-video picker (Direction A — segmented toggle) =====
  // Video is pre-selected on every visit to this screen (not a remembered
  // preference across sessions) — see docs/IMAGE_GENERATION_SPEC.md §5:
  // existing behavior is unchanged unless a user deliberately taps Image.
  var IMAGE_TOKEN_COST = 10;
  var VIDEO_TOKEN_COST = 100;
  var selectedMediaType = 'video';
  var mediaTypeRow = document.getElementById('media-type-row');
  var quotaBody = document.getElementById('modal-quota-body');

  // Fallback only for the brief window before the async getTokenStatus()
  // call above resolves (this screen's copy is re-rendered the instant it
  // does) — mirrors entitlements.js's real DAILY_GRANT_AMOUNT (10 as of
  // 2026-07-24's token-economy retune) and js/store.js's own no-email
  // fallback of the same value, so this never goes stale on its own if
  // that constant changes again without every hardcoded copy of the
  // number being hunted down by hand (the actual bug this replaces).
  var DEFAULT_DAILY_GRANT_AMOUNT = 10;
  function dailyGrantAmountText(){
    return (tokenStatus && tokenStatus.dailyGrantAmount) || DEFAULT_DAILY_GRANT_AMOUNT;
  }

  function updateMediaTypeUI(){
    Array.prototype.forEach.call(mediaTypeRow.querySelectorAll('.media-type-btn'), function(b){
      b.classList.toggle('active', b.dataset.mediaType === selectedMediaType);
    });
    genBtn.textContent = selectedMediaType === 'image' ? 'Generate Image' : 'Generate Video';
    var grant = dailyGrantAmountText();
    quotaBody.textContent = selectedMediaType === 'image'
      ? ('Generating an image costs 10 tokens. Free during beta — no card needed — you\'ll get ' + grant + ' more automatically within 24 hours.')
      : ('Generating a video costs 100 tokens. Free during beta — no card needed — you\'ll get ' + grant + ' more automatically within 24 hours.');
  }
  mediaTypeRow.addEventListener('click', function(e){
    var btn = e.target.closest('.media-type-btn');
    if(!btn) return;
    selectedMediaType = btn.dataset.mediaType;
    updateMediaTypeUI();
  });
  updateMediaTypeUI();

  function tokensBlockGeneration(){
    var cost = selectedMediaType === 'image' ? IMAGE_TOKEN_COST : VIDEO_TOKEN_COST;
    return !!(tokenStatus && tokenStatus.balance < cost);
  }

  function proceedToGenerate(){
    DreamStore.setDraft({ style: selected, mediaType: selectedMediaType, sourceImageUrl: null });
    location.href = 'processing.html';
  }

  var quotaModal = document.getElementById('modal-quota');

  genBtn.addEventListener('click', function(){
    if(tokensBlockGeneration()){ quotaModal.classList.add('open'); return; }
    proceedToGenerate();
  });
  document.getElementById('quota-cancel').addEventListener('click', function(){
    quotaModal.classList.remove('open');
  });
  document.getElementById('quota-buy').addEventListener('click', function(){
    location.href = 'shop.html';
  });
</script>
</body>
</html>
