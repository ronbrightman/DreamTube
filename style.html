<script>

  // The <noscript> fallback pixel <img> from Meta's standard snippet is deliberately
  // left out: it can't be gated behind the same placeholder check (a <noscript> tag only
  // renders when JS is off, so no JS-side check can stop it firing with a placeholder ID),
  // and this app requires JavaScript to function at all (js/store.js is the entire
  // client-side "backend"), so a no-JS visitor already has a non-functional app either
  // way. Add it back once META_PIXEL_ID is a real value, if desired:
  //   <noscript><img height="1" width="1" style="display:none"

  if (typeof META_PIXEL_ID !== 'undefined' && META_PIXEL_ID !== 'REPLACE_WITH_REAL_PIXEL_ID') {
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

</script>
</head>
<body>

<div id="app" class="scroll-shell">
  <div class="topbar"><a class="icon-btn" href="create.html" id="style-back"></a><div style="font-weight:700; font-size:14px;">Choose a style</div><div id="topbar-token-chip-slot"></div></div>
  <div class="px" style="flex:1; display:flex; flex-direction:column; overflow-y:auto; min-height:0;">
    <!-- Story recap card -- founder-required pre-generation preview (tracker
         item for-product-split-prompttext-storytext-f-yt5kc7, point 4): the
         user must see the actual human-readable dream description BEFORE
         spending tokens, never the chip flow's own camera-direction/style
         prompt text. See the script below for how #style-recap-text gets
         populated. -->
    <div class="story-recap-card" id="style-recap-card" style="display:none;">
      <div class="story-recap-label">Your dream</div>
      <div class="story-recap-text" id="style-recap-text" dir="auto"></div>
    </div>
    <div class="style-grid" id="style-grid">
      <div class="style-card" data-style="Cartoon"><div class="sc-bg sc-cartoon"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Cartoon</div></div></div>
      <div class="style-card" data-style="Cinematic"><div class="sc-bg sc-cinematic"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Cinematic</div></div></div>
      <div class="style-card" data-style="Anime"><div class="sc-bg sc-anime"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Anime</div></div></div>
      <div class="style-card" data-style="Realistic"><div class="sc-bg sc-realistic"></div><div class="sc-overlay"></div><div class="sc-check"></div><div class="sc-content"><div class="sc-icon"></div><div class="sc-name">Realistic</div></div></div>
    </div>
    <div style="flex:1"></div>
    <!-- Image-vs-video picker — Direction A, the segmented toggle (Ron's
         confirmed choice, see docs/IMAGE_GENERATION_SPEC.md §5/§9). Video
         is pre-selected so existing behavior is unchanged unless a user
         deliberately picks Image. Reuses the char-mode-row/char-mode-btn
         visual pattern under new class names (.media-type-row/
         .media-type-btn) to avoid coupling this to the character sheet's
         own Describe/Upload-photo toggle. -->
    <div class="media-type-row" id="media-type-row">
      <div class="media-type-btn" data-media-type="image">Image</div>
      <div class="media-type-btn active" data-media-type="video">Video</div>
    </div>
    <!-- Audio/music toggle -- REMOVED (tracker item for-product-build-
         founder-approved-08-03-jlkjy9). Full history, for context:
           1. tracker item for-product-audio-on-off-choice-at-creat-dyyr98
              (founder-approved 2026-07-28): added default-OFF, since
              generate-video.js's generate_audio:false genuinely billed
              less at the time.
           2. tracker item for-product-turn-off-audio-dialogue-gene-ooeyoj
              (founder directive 2026-08-02): Veo's native audio was
              lip-syncing invented dialogue the user never wrote, so
              generate_audio became unconditionally FALSE server-side for
              EVERY video, forever (generate-video.js/start-pending-
              generation.js) -- this toggle was shown disabled-with-a-note
              ("Unavailable...") since it could no longer do anything.
           3. tracker item for-product-build-founder-approved-08-03-jlkjy9
              (Option B, founder-approved 2026-08-03): the toggle became
              REAL again, controlling a reusable, style-matched AMBIENT
              MUSIC BED (one-time-generated static assets, assets/
              music-beds/*.wav, see js/music-bed.js's own header comment
              for the full tradeoff writeup), played back CLIENT-SIDE only.
           4. SAME tracker item, founder simplification (2026-08-03, THIS
              state): "NO TOGGLE. Since the music beds are free, music is
              simply ALWAYS ON -- every dream video plays with its
              style-matched bed, no user choice." The toggle, its
              choice-card markup, and the musicBedOn field it used to write
              onto the draft/dream are removed entirely -- no disabled/
              "unavailable" placeholder left behind, per this codebase's
              own no-dead-UI rule. js/music-bed.js's eligible() now grants
              a bed to every dream with a video + known style, full stop --
              see that file's own header comment.

         Screen real estate: deliberately left removed, not replaced with a
         static "Music: always on" line -- this screen already has a
         flex-spacer (the empty `<div style="flex:1">` above) absorbing the
         freed space, and this exact tracker item already set the "just
         delete it, no placeholder" precedent once before, when the old
         #music-style-row chip picker (dreamy/cinematic/upbeat/ambient) was
         removed outright rather than left disabled -- same call here for
         consistency. The video FILE itself is still, and remains,
         permanently silent (generate_audio:false, item 2 above,
         untouched); mute stays available in the player exactly as
         before. -->
    <button class="btn btn-primary btn-block" id="generate-btn" disabled style="margin-bottom:22px;">Generate Video</button>
  </div>


</div>

<script src="js/icons.js"></script>
<!-- wizard-chips: exposes WizardChips.humanizeDreamText, used to strip a funnel dream's
     engineered camera/lighting/style prompt down to the human story for the preview recap
     (founder 2026-08-15). -->
<script src="js/wizard-chips.js"></script>
<script src="js/store.js"></script>
<script src="js/pwa.js"></script>
<script src="js/sheet-dismiss.js"></script>
<script src="js/purchase-sheet.js"></script>
<script>
  if(!DreamStore.getCurrentUser()){ location.href = 'login.html'; }
  document.getElementById('style-back').innerHTML = Icons.back;
  Array.prototype.forEach.call(document.querySelectorAll('.sc-icon'), function(el){ el.innerHTML = Icons.palette; });
  Array.prototype.forEach.call(document.querySelectorAll('.sc-check'), function(el){ el.innerHTML = Icons.check; });
  var draft = DreamStore.getDraft();
  if(!draft.caption){ location.href = 'create.html'; }

  // ===== Story recap card (tracker item
  // for-product-split-prompttext-storytext-f-yt5kc7, point 4) =====
  // create.html already computed an immediate, zero-cost storyText for
  // every path (verbatim for Write-it/Record-it/chips-with-free-text; a
  // deterministic chip-only template otherwise — see js/wizard-chips.js's
  // buildDeterministicStory) and set draft.needsStoryRewrite true ONLY for
  // that last case. This page is the natural "preview" moment (the user
  // reads it, picks a style, then taps Generate) — reached via a real page
  // navigation, so an in-flight fetch started on create.html couldn't have
  // survived to here anyway. currentStoryText is what's ACTUALLY shown at
  // all times; currentDraftPatch() below persists exactly this value, so
  // whatever's on screen the instant Generate is tapped is what gets
  // saved — never a promise of something better that never rendered.
  // humanized (founder 2026-08-15): the recap the user reads (and the storyText this
  // page persists) must be the HUMAN dream story, never a funnel dream's engineered
  // camera/lighting/style prompt. The generation prompt (draft.caption -> promptText) is
  // carried separately and left engineered — currentDraftPatch never touches it.
  var currentStoryText = WizardChips.humanizeDreamText(draft.storyText || draft.caption);
  function renderStoryRecap(){
    var card = document.getElementById('style-recap-card');
    var textEl = document.getElementById('style-recap-text');
    if(!card || !textEl) return; // page has since navigated away -- see the fetch .then() below
    if(!currentStoryText){ card.style.display = 'none'; return; }
    textEl.textContent = currentStoryText;
    card.style.display = 'block';
  }
  renderStoryRecap();

  if(draft.needsStoryRewrite){
    // Fire-and-forget, best-effort upgrade — never awaited, never blocks
    // Generate, never shown as a loading/wait state (the deterministic
    // template above is already presentable). A network failure, a slow
    // response, or an E6xx rejection all silently no-op here, leaving
    // currentStoryText exactly as it already was.
    fetch('/.netlify/functions/rewrite-dream-story', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ promptText: draft.caption })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(!result.ok || !result.data || !result.data.storyText) return;
      currentStoryText = result.data.storyText;
      renderStoryRecap();
    }).catch(function(){ /* best-effort — see comment above */ });
  }

  // A purchase sheet opened from THIS page always sends the checkout's
  // successUrl to home.html (the one page that knows how to auto-resume
  // from the draft — see js/purchase-sheet.js — since tracker item
  // for-product-funnel-ending-v2-founder-ins-tfuu0q removed processing.html),
  // so this page only ever sees ?checkout=cancelled (its own cancelUrl
  // points back at itself). Cleared quietly, no error shown, per spec.
  (function handleCheckoutCancelled(){
    if(PurchaseSheet.readCheckoutParam() === 'cancelled'){
      PurchaseSheet.clearPendingPurchaseMarker();
      PurchaseSheet.fireCheckoutCancelled('blocked_action');
    }
  })();

  var selected = null;
  var grid = document.getElementById('style-grid');
  var genBtn = document.getElementById('generate-btn');
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.style-card');
    if(!card) return;
    Array.prototype.forEach.call(grid.querySelectorAll('.style-card'), function(c){ c.classList.remove('selected'); });
    card.classList.add('selected');
    selected = card.dataset.style;
    genBtn.disabled = false;
  });

  // ===== Token balance pre-check =====
  // Convenience-only, client-side pre-check (see js/store.js's
  // getTokenStatus doc comment) — fetched once on load, never awaited at
  // click time, so a slow/failed/never-resolving fetch simply leaves
  // tokenStatus null and the generate button behaves exactly as it does
  // today (fail open). The real enforcement is generate-video.js's
  // server-side E112 check (or generate-image.js's E412) — the threshold
  // checked below reacts to whichever media type is currently selected.
  //
  // Topbar balance chip (tracker item
  // for-product-build-out-of-tokens-purchase-2y8hyw, item 3) — reuses the
  // same tokenStatus fetch below, no extra network call.
  var topbarChip = PurchaseSheet.mountBalanceChip(document.getElementById('topbar-token-chip-slot'));

  var tokenStatus = null;
  DreamStore.getTokenStatus().then(function(status){
    tokenStatus = status;
    PurchaseSheet.renderBalanceChip(topbarChip, status);
    // Auto-open ONCE per day when claimable (tracker item
    // for-product-build-the-daily-token-claim--fngrwd, item 4) — chip
    // stays the fallback entry point if dismissed.
    PurchaseSheet.maybeAutoOpenClaimSheet(status, {
      onClaimed: function(){
        DreamStore.getTokenStatus().then(function(fresh){
          tokenStatus = fresh;
          PurchaseSheet.renderBalanceChip(topbarChip, fresh);
        }).catch(function(){});
      }
    });
  }).catch(function(){ tokenStatus = null; });

  // ===== Image-vs-video picker (Direction A — segmented toggle) =====
  // Video is pre-selected on every visit to this screen (not a remembered
  // preference across sessions) — see docs/IMAGE_GENERATION_SPEC.md §5:
  // existing behavior is unchanged unless a user deliberately taps Image.
  var IMAGE_TOKEN_COST = 10;
  var VIDEO_TOKEN_COST = 100;
  var selectedMediaType = 'video';
  var mediaTypeRow = document.getElementById('media-type-row');

  // Audio/music toggle removed entirely (tracker item for-product-build-
  // founder-approved-08-03-jlkjy9, founder simplification 2026-08-03) — see
  // the markup's own removal comment above for the full history. Music is
  // now always on for every video dream (js/music-bed.js's eligible()), no
  // client-side choice to render, persist, or wire a click handler for.

  function updateMediaTypeUI(){
    Array.prototype.forEach.call(mediaTypeRow.querySelectorAll('.media-type-btn'), function(b){
      b.classList.toggle('active', b.dataset.mediaType === selectedMediaType);
    });
    genBtn.textContent = selectedMediaType === 'image' ? 'Generate Image' : 'Generate Video';
  }
  mediaTypeRow.addEventListener('click', function(e){
    var btn = e.target.closest('.media-type-btn');
    if(!btn) return;
    selectedMediaType = btn.dataset.mediaType;
    updateMediaTypeUI();
  });
  updateMediaTypeUI();

  function tokensBlockGeneration(){
    var cost = selectedMediaType === 'image' ? IMAGE_TOKEN_COST : VIDEO_TOKEN_COST;
    return !!(tokenStatus && tokenStatus.balance < cost);
  }

  // Single source of truth for the draft this screen persists — read live
  // (selected/selectedMediaType) at call time, never a captured/stale
  // snapshot, and shared by both proceedToGenerate (the unblocked path) and
  // the out-of-tokens sheet's persistDraft below (the blocked path) so the
  // two can never silently drift apart. audioOn/musicStyle are the retired
  // server-request fields — permanently false/null (generate-video.js's own
  // header comment; item 2 in the removed toggle's history comment above —
  // untouched by the music-bed feature). musicBedOn no longer exists at all
  // (removed along with the toggle — see that comment's point 4): music-bed
  // eligibility is now computed entirely from the finished dream's own
  // videoUrl/style (js/music-bed.js's eligible()), nothing to persist here.
  //
  // storyText: currentStoryText (tracker item for-product-split-
  // prompttext-storytext-f-yt5kc7) — reads whatever the recap card is
  // CURRENTLY showing, live, at call time, same "never a stale snapshot"
  // discipline as everything else here. This is what makes point 4's
  // requirement literally true: the story saved onto the finished dream
  // is always exactly what this screen showed before Generate was tapped.
  function currentDraftPatch(){
    return {
      style: selected, mediaType: selectedMediaType, sourceImageUrl: null,
      audioOn: false, musicStyle: null,
      storyText: currentStoryText
    };
  }

  function proceedToGenerate(){
    DreamStore.setDraft(currentDraftPatch());
    // Lands directly on home.html now (tracker item for-product-funnel-
    // ending-v2-founder-ins-tfuu0q, founder GO 2026-07-31 evening,
    // explicitly extended to in-app creation too) — processing.html's
    // dedicated wait screen is gone. `?generate=1` is the explicit signal
    // home.html's own load-time handling needs to submit THIS draft fresh
    // (rather than assume it's just an ordinary Home visit with a leftover
    // draft object sitting around from a previous session) — see that
    // page's own "fresh in-app submission" script block. Stripped from the
    // URL there via history.replaceState, same as ?checkout=success, so a
    // refresh never re-submits.
    location.href = 'home.html?generate=1';
  }

  // ===== Out-of-tokens purchase sheet =====
  // Founder directive 2026-07-26: "the store must come up whenever a user
  // tries any action without enough tokens" — replaces the old
  // #modal-quota (a plain "wait or visit the shop" dialog with no
  // arithmetic, no one-tap purchase, and no draft persistence). Fixes the
  // audit-found bug that used to leave this screen's picked style/media
  // type unsaved whenever generation was blocked: persistDraft below runs
  // BEFORE the sheet ever renders (see js/purchase-sheet.js's show()),
  // not only on the unblocked path proceedToGenerate() already covered.
  genBtn.addEventListener('click', function(){
    if(tokensBlockGeneration()){
      var cost = selectedMediaType === 'image' ? IMAGE_TOKEN_COST : VIDEO_TOKEN_COST;
      PurchaseSheet.show({
        mediaType: selectedMediaType,
        cost: cost,
        balance: tokenStatus ? tokenStatus.balance : 0,
        tokenStatus: tokenStatus,
        source: 'blocked_action',
        persistDraft: function(){
          DreamStore.setDraft(currentDraftPatch());
        },
        // Review finding, round 4: without this, a claim made via the
        // sheet's own inline "Claim +N" button (to unblock THIS action)
        // left this page's own cached tokenStatus/topbar chip stale --
        // same refresh already wired into maybeAutoOpenClaimSheet above.
        onClaimed: function(){
          DreamStore.getTokenStatus().then(function(fresh){
            tokenStatus = fresh;
            PurchaseSheet.renderBalanceChip(topbarChip, fresh);
          }).catch(function(){});
        },
        // Proceed callback (tracker item for-product-low-out-of-tokens-
        // sheet-inli-uqt6or): fires when balance now covers cost, whether
        // that's the show()-time guard above (a server-vs-client balance
        // race) or an in-sheet inline claim that itself bridges the gap
        // -- see js/purchase-sheet.js's claimInline() doc comment.
        // proceedToGenerate() already does its own full persistDraft +
        // navigate, same as the unblocked click path just below, so this
        // is safe to call regardless of which of those two triggers it.
        onAfford: proceedToGenerate,
        // "Make it as an image instead" fallback (tracker item
        // for-product-out-of-tokens-sheet-founder--dg5q1y) -- only offered
        // when the blocked action is itself a video (this is a general
        // route, style.html's own media-type picker -- an already-selected
        // image path never needs a cheaper alternative offered). The
        // draft's caption/style/storyText are already persisted above
        // (persistDraft), so this only needs to flip mediaType (and clear
        // the video-only audio fields) before resuming — same
        // ?generate=1/home.html destination proceedToGenerate() above
        // already uses (processing.html is gone — see that function's own
        // comment), so home.html submits this same draft fresh, now as an
        // image, same "carry the same prompt content" contract as the
        // unblocked path.
        onImageFallback: selectedMediaType === 'video' ? function(){
          DreamStore.setDraft({ mediaType: 'image', audioOn: false, musicStyle: null });
          location.href = 'home.html?generate=1';
        } : undefined
      });
      return;
    }
    proceedToGenerate();
  });
</script>
</body>
</html>
