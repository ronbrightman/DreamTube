  series:[{k:"funnel_entrants",label:"Funnel entrants"},{k:"ree",label:"Reached email (REE)"},{k:"signups",label:"Signups"},{k:"returning_members",label:"Returning members"}]},
 {title:"Engagement — what signed-up users do",kind:"c",
  note:"Tap legend colors to hide/show lines.",
  series:[{k:"videos_total",label:"Videos"},{k:"published",label:"Published"},{k:"likes",label:"Likes"},{k:"interpretations",label:"Interpretations"},{k:"daily_claims",label:"Claims"}]},
 {title:"Money — spend vs model cost (split) vs revenue",kind:"m",
  note:"Cost split is an approximation on the shared fal account (creative pipeline costs subtracted) until the app gets its own key.",
  series:[{k:"marketing_spend_usd",label:"Marketing spend"},{k:"model_cost_creative_usd",label:"Model cost \u00B7 creative"},{k:"model_cost_users_usd",label:"Model cost \u00B7 users"},{k:"revenue_usd",label:"Revenue"}]}
];
var comboHidden=COMBOS.map(function(){return {}});
function comboChart(combo,ci){
 var hidden=comboHidden[ci];
 var days=DAYS, W=680,H=150,PL=6,PB=16,n=days.length;
 var max=0;
 var vals=combo.series.map(function(s,si){
  return days.map(function(d){var v=d[s.k]; if(v!=null&&!hidden[si]&&v>max)max=v; return v});
 });
 var xs=function(i){return PL+i*((W-2*PL)/(n-1))};
 var ys=function(v){return (H-PB)-(max? v/max*(H-PB-8):0)};
 var svg='<svg viewBox="0 0 '+W+' '+H+'">';
 svg+='<line x1="0" y1="'+ys(max)+'" x2="'+W+'" y2="'+ys(max)+'" stroke="rgba(255,255,255,.08)"/><text x="2" y="'+(ys(max)-3)+'" font-size="9" fill="#736e87">'+fmt(max,combo.kind)+'</text>';
 vals.forEach(function(varr,si){
  if(hidden[si])return;
  var path="",started=false;
  varr.forEach(function(v,i){ if(v==null){started=false;return} path+=(started?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1)+" ";started=true; });
  svg+='<path d="'+path+'" fill="none" stroke="'+PALHEX[si]+'" stroke-width="2"/>';
  varr.forEach(function(v,i){ if(v==null)return;
   svg+='<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="6" fill="transparent" stroke="none" data-tip="'+days[i].date.slice(5)+' \u00B7 '+combo.series[si].label+': '+fmt(v,combo.kind)+'"/>';
   svg+='<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="2.2" fill="'+PALHEX[si]+'" stroke="#1b1823" stroke-width="1" pointer-events="none"/>';
  });
 });
 days.forEach(function(d,i){ if(i%3===0||i===n-1)svg+='<text x="'+xs(i)+'" y="'+(H-3)+'" font-size="8.5" fill="#736e87" text-anchor="middle">'+d.date.slice(5)+'</text>'});
 svg+='</svg>';
 var legend='<div class="legend">'+combo.series.map(function(s,i){
  return '<span class="lg'+(hidden[i]?" off":"")+'" data-ci="'+ci+'" data-si="'+i+'"><i style="background:'+PALHEX[i]+'"></i><span>'+s.label+'</span></span>'}).join("")+'</div>';
 return '<div class="combo" id="combo-'+ci+'"><div class="t">'+combo.title+'</div>'+legend+svg+(combo.note?'<div class="secnote" style="margin:2px 0 4px">'+combo.note+'</div>':"")+'</div>';
}
function renderCombos(){
 document.getElementById("combos").innerHTML=COMBOS.map(function(cb,ci){return comboChart(cb,ci)}).join("");
}
document.addEventListener("click",function(e){
 var lg=e.target.closest(".lg"); if(!lg||lg.getAttribute("data-ci")==null)return;
 var ci=+lg.getAttribute("data-ci"), si=+lg.getAttribute("data-si");
 comboHidden[ci][si]=!comboHidden[ci][si];
 renderCombos();
});
var TOTALS=[["signups","Signups","c"],["new_users","New visitors","c"],["returning_members","Returning members","c"],["first_videos","First videos","c"],["videos_total","Videos made","c"],["images_total","Images made","c"],["published","Published","c"],["likes","Likes given","c"],["interpretations","Interpretations","c"],["daily_claims","Daily claims","c"],["second_day_claims","2nd-day claims","c"],["purchases","Purchases","c"],["revenue_usd","Revenue $","m"],["marketing_spend_usd","Marketing spend $","m"],["model_cost_users_usd","Model cost · users $","m"],["model_cost_creative_usd","Model cost · creative $","m"],["funnel_entrants","Funnel entrants","c"],["ree","Reached email (REE)","c"]];
function sum(days,k){var s=0,any=false;days.forEach(function(d){if(d[k]!=null){s+=d[k];any=true}});return any?s:null}
var tfDays=0;
function view(){ return tfDays? DAYS.slice(-tfDays) : DAYS; }
function card(title,vals,kind,agg,offset){
 var W=200,H=64,n=vals.length,max=0;
 vals.forEach(function(v){if(v!=null&&v>max)max=v});
 var bw=Math.max(2,Math.floor(W/n)-2);
 var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
 vals.forEach(function(v,i){
  var x=i*(W/n)+1;
  if(v==null){svg+='<rect class="nullband" x="'+x+'" y="0" width="'+bw+'" height="'+H+'"/>';return;}
  var h=max?Math.max(v>0?3:1,Math.round((v/max)*(H-6))):1;
  svg+='<rect class="bar'+(kind==="m"?" money":"")+'" x="'+x+'" y="'+(H-h)+'" width="'+bw+'" height="'+h+'" rx="2" data-tip="'+DAYS[offset+i].date.slice(5)+' · '+fmt(v,kind)+'"/>';
 });
 svg+='</svg>';
 return '<div class="mini"><div class="t">'+title+'</div><div class="big">'+agg+'</div>'+svg+'<div class="foot">peak '+fmt(max||null,kind)+'</div></div>';
}
function ratioDefs(){return [
 ["Cost per signup $",function(d){return (d.marketing_spend_usd!=null&&d.signups>0)?d.marketing_spend_usd/d.signups:null},"m"],
 ["Cost per new visitor $",function(d){return (d.marketing_spend_usd!=null&&d.new_users>0)?d.marketing_spend_usd/d.new_users:null},"m"],
 ["Model cost per USER video $",function(d){return (d.model_cost_users_usd!=null&&d.videos_total>0)?d.model_cost_users_usd/d.videos_total:null},"m"],
 ["Videos per creator",function(d){var c=d.first_videos;return (d.videos_total!=null&&c>0)?d.videos_total/c:null},"c"],
 ["Signup rate % (of entrants)",function(d){return (d.signups!=null&&d.funnel_entrants>0)?100*d.signups/d.funnel_entrants:null},"p"],
 ["REE→signup %",function(d){return (d.signups!=null&&d.ree>0)?100*d.signups/d.ree:null},"p"]];}
function render(){
 var days=view(), offset=DAYS.length-days.length;
 document.getElementById("totals").innerHTML=TOTALS.map(function(m){
  var vals=days.map(function(d){return d[m[0]]});
  return card(m[1],vals,m[2],(m[2]==="m"?fmt(sum(days,m[0]),"m"):fmt(sum(days,m[0]),"c"))+" total",offset);
 }).join("");
 document.getElementById("ratios").innerHTML=ratioDefs().map(function(r){
  var vals=days.map(r[1]);
  var have=vals.filter(function(v){return v!=null});
  var avg=have.length? have.reduce(function(a,b){return a+b},0)/have.length : null;
  return card(r[0],vals,r[2],(avg!=null?("avg "+fmt(avg,r[2])):"no verified days"),offset);
 }).join("");
 var t='<table><tr><th>date</th>'+TOTALS.map(function(m){return '<th>'+m[1]+'</th>'}).join("")+'</tr>';
 days.forEach(function(d){t+='<tr><td>'+d.date+'</td>'+TOTALS.map(function(m){return '<td>'+fmt(d[m[0]],m[2])+'</td>'}).join("")+'</tr>'});
 document.getElementById("twrap").innerHTML=t+'</table>';
}
document.getElementById("tf-chips").addEventListener("click",function(e){
 var c=e.target.closest(".chip"); if(!c)return;
 document.querySelectorAll("#tf-chips .chip").forEach(function(x){x.classList.remove("on")});
 c.classList.add("on"); tfDays=parseInt(c.getAttribute("data-tf"),10)||0; render();
});
document.getElementById("today-mode").addEventListener("click",function(e){
 var c=e.target.closest(".chip"); if(!c)return;
 document.querySelectorAll("#today-mode .chip").forEach(function(x){x.classList.remove("on")});
 c.classList.add("on"); kpiCompare();
});
document.getElementById("tbl-btn").addEventListener("click",function(){
 var w=document.getElementById("twrap"); var show=w.style.display!=="block";
 w.style.display=show?"block":"none"; this.textContent=show?"Hide data table":"Show data table";
});
var tip=document.getElementById("tip");
document.addEventListener("pointerover",function(e){
 var r=e.target.closest("[data-tip]");
 if(!r){tip.style.opacity=0;return}
 tip.textContent=r.getAttribute("data-tip"); tip.style.opacity=1;
});
document.addEventListener("pointermove",function(e){
 if(tip.style.opacity=="1"){tip.style.left=Math.min(e.clientX+10,window.innerWidth-130)+"px";tip.style.top=(e.clientY-30)+"px"}
});
document.getElementById("gen-sub").textContent="Data as of "+D.generated_at.slice(0,16).replace("T"," ")+" UTC · regenerated with every morning summary";
document.getElementById("notes").innerHTML="<b>Data honesty notes:</b><br>"+D.notes.map(function(x){return "· "+x}).join("<br>");
kpiCompare(); renderCombos(); render();
</script></body></html>
