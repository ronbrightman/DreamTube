<!--
  Dream-builder wizard — chip-first, one-question-per-screen dream builder
  that replaces the old free-text "describe your dream" box for brand-new
  (pre-signup) visitors. See dreamtube-growth/WIZARD_SPEC.md for the full
  spec this implements (steps/copy/chips, prompt-assembly logic, the
  confirmed "build the dream first, sign up after" seam) and tracker items
  for-product-build-the-dream-builder-wiza-28did1 /
  for-product-generate-during-signup-aband-73jyud.

  SEAM/ROUTING JUDGMENT CALL (flagged, not silently decided): the spec's
  own tracker item left "confirm the funnel -> app seam" open. This file
  is a brand-new, self-contained pre-signup entry point in THIS repo,
  reachable from index.html's "Get Started" (changed to point here instead
  of the external dreamtube-growth funnel) — it does NOT touch or replace
  start.html, which keeps serving the existing external-growth-funnel
  ?resume=1 handoff completely unchanged (that funnel's own hook/quiz/
  dream-capture/style-picker screens live in the separate dreamtube-growth
  repo, out of scope for this build). See this branch's PR description /
  the build report for the full reasoning.

  FLOW (steps, one screen each, chip-first / zero required typing):
    0 Subject   ("Who's the dream about?")   — reuses the character sheet
    1 Setting   ("Where does it take place?") — reuses+widens scenery chips
    2 Action    ("What's happening?")         — NEW, required, no skip
    3 Mood      ("What's the mood?")          — NEW
    4 Style     ("Pick a look")               — reuses style.html's cards
    5 Free text (optional escape hatch)       — the demoted old textarea
    6 Signup wall (renderSignupWall) — ONE hybrid screen, at parity with
      start.html's screen 13 (founder order, tracker item
      for-product-wizard-signup-wall-is-the-ol-lt1l9j): the forming-veil
      "your dream is already forming" indicator on top, the (flag-gated)
      Facebook Login button + "or" divider, then a single EMAIL field —
      passwordless-first, exactly the live screen-13 wall, NOT the old
      username+password form. Submitting fires start-pending-generation.js
      (the real, billed generation — BEFORE any account exists) in
      parallel with DreamStore.signupPasswordless(email); a brand-new
      email is signed straight in, an already-registered one swaps to the
      same enter-the-code step screen 13 uses. Success claims the pending
      job (claim-pending-generation.js), adopts it
      (DreamStore.adoptPendingGeneration) and hands off straight to
      home.html, which resumes polling it with ZERO changes needed
      there (it already checks DreamStore.getPendingJob() on load).
      This wall REPLACED the former two-step tail (renderContact's
      email-only capture + renderSignup's username+password form) — see
      git history for those; the founder's explicit intent was that the
      organic path ends the same way the paid funnel does.

  Camera chips are deliberately NOT a step here (see WIZARD_SPEC.md:
  "demoted to inferred-not-asked") — js/wizard-chips.js infers camera +
  lighting from the Action/Mood/POV selections and bakes them directly
  into the assembled caption text (see that file's own doc comment for why
  this does NOT also pass characterIds through the description-bearing
  path, to avoid a doubled-up character description in the final prompt).
-->
</head>
<body>

<div id="app" class="funnel-app">
  <div class="fn-topbar">
    <button class="fn-back" id="fnBack" aria-label="Back" type="button"></button>
    <div class="fn-progress" id="fnProgress"></div>
    <div class="fn-topbar-spacer"></div>
  </div>
  <div class="fn-screen" id="fnScreen"></div>
</div>

<style>
  /* Dark "night" funnel shell (tracker item
     for-product-realign-index-html-organic-w-lzbmfu, founder 07-31) —
     this used to be a verbatim copy of start.html's OWN former light
     "dawn" shell, back when start.html's Advanced/pricing screens were
     still light. start.html's own funnel tail moved to a dark 'night'
     phase for its remaining screens (tracker item
     for-product-funnel-handoff-screens-theme-5ttymn) but this file was
     never updated to match, leaving it the one light-themed screen on the
     organic path — a real, felt "different pages" experience the founder
     hit directly walking index.html -> wizard.html right after the
     (already-dark) ad funnel. Values below are start.html's own resolved
     'night' phase colors (see that file's PHASES.night constant and
     applyPhase, ~start.html:1958) ported here directly as this file's
     single, permanent theme — wizard.html never needs start.html's
     multi-phase switching machinery (it only ever had ONE look to begin
     with), so these are hardcoded, not phase-swapped. */
  #app.funnel-app{
    --fn-ink:#FFFFFF; --fn-ink-soft:#C9C4DA; --fn-ink-faint:#8A84A0;
    --fn-card:rgba(255,255,255,0.08); --fn-line:rgba(255,255,255,0.14);
    --fn-accent-grad:linear-gradient(135deg,#B0A8DC,#9FC6E8 55%,#F3C08C);
    --fn-accent-solid:#7C82C4;
    --fn-font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    --fn-font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    background:linear-gradient(160deg,#211B33,#14121F 55%,#0A0912);
    font-family:var(--fn-font-body);
    /* #app's own base rule (css/styles.css) only sets min-height:100dvh
       -- a floor, not a cap. .sheet-overlay is position:absolute;inset:0
       against #app (its nearest positioning ancestor), so on a real
       Subject-step character sheet with a lot of characters, #app could
       grow taller than one viewport and the sheet would anchor to the
       bottom of THAT oversized box instead of the visible screen --
       reproducing the exact "sheet unreachable" bug this whole fix
       exists to close, via a different mechanism (tracker item
       for-product-sheet-dismissal-app-wide-fix-rlay70, review round 1).
       height:100dvh matches the same real cap result.html/profile.html
       already rely on via their own .fill/.scroll-shell classes --
       .fn-screen below already has the matching overflow-y:auto;
       min-height:0 internal-scroll half of that pattern, just missing
       this outer half until now. */
    height:100dvh;
  }

  .fn-topbar{ display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 4px; flex:none;}
  .fn-back{ width:34px; height:34px; border-radius:50%; flex:none; cursor:pointer; background:var(--fn-card); border:1px solid var(--fn-line); color:var(--fn-ink); display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent;}
  .fn-back .icon, .fn-back svg{ width:15px; height:15px;}
  .fn-topbar-spacer{ width:34px; flex:none;}
  .fn-progress{ flex:1; display:flex; gap:4px;}
  .fn-progress i{ flex:1; height:3px; border-radius:3px; background:var(--fn-line); display:block;}
  .fn-progress i.done{ background:var(--fn-ink); opacity:.55;}
  .fn-progress i.now{ background:var(--fn-ink);}

  .fn-screen{ flex:1; display:flex; flex-direction:column; padding:18px 24px calc(24px + env(safe-area-inset-bottom,0px)); position:relative; overflow-y:auto; min-height:0; color:var(--fn-ink);}

  .fn-eyebrow{ font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--fn-ink-faint); margin-bottom:10px;}
  .fn-headline{ font-family:var(--fn-font-display); font-size:25px; font-weight:600; letter-spacing:-0.005em; line-height:1.25; text-wrap:balance; margin-bottom:10px; color:var(--fn-ink);}
  .fn-body-copy{ font-size:14.5px; color:var(--fn-ink-soft); line-height:1.55; margin-bottom:18px;}
  .fn-mini-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--fn-ink-faint); margin:14px 0 8px;}
  .fn-mini-label:first-child{ margin-top:0;}
  .fn-spacer{ flex:1;}

  .fn-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .fn-chip{ padding:9px 15px; border-radius:100px; background:var(--fn-card); border:1px solid var(--fn-line); font-size:13px; font-weight:700; color:var(--fn-ink); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .fn-chip.sel{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}

  /* "+N more" / "Show less" expander chip (Action step curation — tracker
     item for-product-wizard-step-3-has-too-many-c-lrg1ct). Dashed/
     transparent so it reads as a disclosure affordance, not a selectable
     option — same visual language as css/styles.css's .char-chip-add
     "+ Add character" tile elsewhere in this app, not an invented look. */
  .fn-chip-more{ padding:9px 15px; border-radius:100px; background:transparent; border:1px dashed var(--fn-line); font-size:13px; font-weight:700; color:var(--fn-ink-soft); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .fn-chip-more:hover{ border-color:var(--fn-accent-solid); color:var(--fn-ink);}

  /* Character chips (Subject step) reuse create.html/start.html's exact
     .char-chip/.char-chip-add classes, dark-themed to match this shell —
     see start.html's own identical override block (its 'night' phase) for
     the same reasoning. */
  #app.funnel-app .char-chip{ background:var(--fn-card); border-color:var(--fn-line); color:var(--fn-ink);}
  #app.funnel-app .char-chip .chip-check{ border-color:var(--fn-ink-faint);}
  #app.funnel-app .char-chip.selected{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-chip.selected .chip-check{ background:#fff; border-color:#fff;}
  #app.funnel-app .char-chip.selected .chip-check .icon{ opacity:1; color:var(--fn-accent-solid);}
  #app.funnel-app .char-chip .chip-edit{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-chip.selected .chip-edit{ color:#fff; opacity:.75;}
  #app.funnel-app .char-chip-add{ background:transparent; border:1px dashed var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-chip-add:hover{ border-color:var(--fn-accent-solid); color:var(--fn-ink);}
  /* .sheet/.sheet-handle/.sheet-title are DELIBERATELY not overridden here
     anymore (unlike the old light "dawn" theme, which needed a light
     override) -- css/styles.css's own base .sheet rules already resolve
     dark (var(--bg-app), var(--border-strong), inherited white text) —
     exactly this shell's own night look, with no override needed. */
  #app.funnel-app .char-mode-row .char-mode-btn{ background:rgba(255,255,255,.05); border-color:var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-mode-row .char-mode-btn.active{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-photo-preview{ background:rgba(255,255,255,.05); border-color:var(--fn-line);}
  #app.funnel-app .char-photo-empty{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-photo-hint{ color:var(--fn-ink-soft);}
  #app.funnel-app .btn-secondary{ background:transparent; border:1px solid var(--fn-line); color:var(--fn-ink);}
  #app.funnel-app .btn-secondary:hover{ background:rgba(255,255,255,.05); border-color:var(--fn-ink-faint);}

  /* Style step (Step 5) reuses style.html's real .style-card/.sc-* classes
     from css/styles.css verbatim — same grid, same preview images. */
  #app.funnel-app .style-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}

  textarea.fn-field, input.fn-field{ background:var(--fn-card); border:1px solid var(--fn-line); border-radius:16px; padding:14px 15px; font-family:var(--fn-font-body); color:var(--fn-ink); font-size:15px; width:100%; margin-bottom:12px; display:block;}
  textarea.fn-field{ resize:none; line-height:1.5;}
  textarea.fn-field::placeholder, input.fn-field::placeholder{ color:var(--fn-ink-faint);}
  textarea.fn-field:focus, input.fn-field:focus{ outline:2px solid var(--fn-accent-solid); border-color:transparent;}

  .fn-field-pw-wrap{ position:relative; margin-bottom:12px;}
  .fn-field-pw-wrap .fn-field{ margin-bottom:0; padding-right:46px;}
  .fn-field-pw-toggle{ position:absolute; right:4px; top:0; bottom:0; width:38px; background:none; border:none; color:var(--fn-ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fn-field-pw-toggle svg, .fn-field-pw-toggle .icon{ width:18px; height:18px;}

  .fn-err-text{ font-size:12.5px; color:#C4485B; min-height:16px; margin:2px 0 8px;}

  /* Flat white CTA instead of the pastel --fn-accent-grad -- reads as
     intentional/high-contrast against this shell's near-black background,
     same treatment start.html's own 'night' phase gives .fn-btn-primary
     (~start.html:220), ported here as the permanent default since this
     shell has no light phase to fall back to anymore. */
  .fn-btn-primary{ background:#fff; color:#221d2c; font-weight:800; font-size:15.5px; border:none; border-radius:100px; padding:15px; text-align:center; width:100%; box-shadow:none; cursor:pointer; font-family:var(--fn-font-body); -webkit-tap-highlight-color:transparent;}
  .fn-btn-primary:disabled{ opacity:.42; cursor:not-allowed; box-shadow:none;}
  .fn-small-link{ background:none; border:none; color:var(--fn-ink-soft); font-size:12.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; text-align:center; width:100%; padding:10px 0 0; cursor:pointer;}

  .fn-price-note{ font-size:12px; color:var(--fn-ink-soft); text-align:center; margin:2px 0 0;}

  /* "+ Something else" progressive-disclosure reveal (per the spec: a
     collapsed tap that reveals a small text input, not an always-visible
     box) — shared across every step that has one. */
  .fn-other-reveal{ margin:-6px 0 14px;}
  .fn-other-reveal input{ margin-bottom:0;}

  /* POV toggle (Action step) — a plain accessible checkbox styled as a
     switch, off by default per the spec. */
  .fn-toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:14px; background:var(--fn-card); border:1px solid var(--fn-line); margin-bottom:18px;}
  .fn-toggle-row span{ font-size:13.5px; font-weight:700; color:var(--fn-ink);}
  .fn-switch{ position:relative; width:42px; height:24px; flex:none;}
  .fn-switch input{ opacity:0; width:0; height:0;}
  .fn-switch .fn-switch-track{ position:absolute; inset:0; background:var(--fn-line); border-radius:100px; transition:.15s; cursor:pointer;}
  .fn-switch .fn-switch-track:before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .fn-switch input:checked + .fn-switch-track{ background:var(--fn-accent-grad);}
  .fn-switch input:checked + .fn-switch-track:before{ transform:translateX(18px);}

  .fn-microcopy{ font-size:12.5px; color:var(--fn-ink-faint); margin:-8px 0 16px; line-height:1.5;}

  .fn-spin{ width:44px; height:44px; border-radius:50%; border:3px solid var(--fn-line); border-top-color:var(--fn-accent-solid); margin:0 auto 20px; animation:fnspin 1s linear infinite;}
  @keyframes fnspin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .fn-spin{ animation:none;} }
  .fn-loading-line{ font-size:13px; color:var(--fn-ink-soft); text-align:center; margin-bottom:6px;}

  /* ===== Signup wall (screen-13 parity — tracker item
     for-product-wizard-signup-wall-is-the-ol-lt1l9j). Every rule below is
     ported from start.html's own proven screen-13 implementation (see that
     file's <style> block for each rule's original doc comment and the
     tracker items behind it), swapped onto this shell's fixed --fn-*
     tokens instead of start.html's per-phase --phase-* variables (this
     file has exactly one theme, see the head-of-style comment above). =====

     Vertical-distribution layer (start.html's .fn-signup-stage, tracker
     item for-product-signup-screen-layout-fixes-f-3hclmj — founder:
     "SPREAD IT OUT"): leftover vertical space is distributed as real
     breathing room between every beat via flex:1 spacers, instead of
     pooling below the CTA. See fnStageHtml() in the script below. */
  .fn-signup-stage{ display:flex; flex-direction:column; min-height:100%;}
  .fn-stage-spacer{ flex:1; min-height:14px;}

  /* The standard "or" social-login separator between the Facebook button
     and the email field — rendered ONLY when the Facebook button itself is
     (see facebookOrDividerHtml's shared isFacebookLoginConfigured() guard
     in the script below). */
  .fn-or-divider{ display:flex; align-items:center; gap:12px; margin:0; color:var(--fn-ink-faint); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;}
  .fn-or-divider::before, .fn-or-divider::after{ content:''; flex:1; height:1px; background:var(--fn-line);}

  /* The "your dream is forming" veil — shimmer-sweep + spinning-arc +
     caption over a live nebula/aurora drift layer, the same convention
     home.html's day0card and start.html's screen 13 already use (tracker
     items for-product-build-now-email-wall-fix-1-n-6qvebd and
     for-product-forming-veil-replace-the-fla-nwbe60 — see start.html for
     the full original reasoning on each piece; values copied verbatim,
     these are self-contained colors with no theme tokens involved). */
  .fn-forming-frame{
    position:relative; height:118px; border-radius:16px; overflow:hidden; margin-bottom:16px;
    background:#171034; /* plain fallback fill, painted under .fn-form-nebula */
  }
  .fn-forming-frame.fnstyle-default{
    --fn-neb-1:rgba(163,90,255,.55); --fn-neb-2:rgba(83,140,255,.5); --fn-neb-3:rgba(255,255,255,.10);
    --fn-neb-base1:#241348; --fn-neb-base2:#2c1a5e; --fn-neb-base3:#141040;
  }
  .fn-forming-frame.fnstyle-cartoon{
    --fn-neb-1:rgba(255,158,84,.55); --fn-neb-2:rgba(255,92,163,.5); --fn-neb-3:rgba(255,224,140,.16);
    --fn-neb-base1:#4a2038; --fn-neb-base2:#5c2b1c; --fn-neb-base3:#2a1024;
  }
  .fn-forming-frame.fnstyle-cinematic{
    --fn-neb-1:rgba(88,132,255,.5); --fn-neb-2:rgba(64,52,150,.55); --fn-neb-3:rgba(190,205,255,.10);
    --fn-neb-base1:#101530; --fn-neb-base2:#182450; --fn-neb-base3:#080a1c;
  }
  .fn-forming-frame.fnstyle-anime{
    --fn-neb-1:rgba(255,86,201,.55); --fn-neb-2:rgba(84,222,255,.5); --fn-neb-3:rgba(255,255,255,.14);
    --fn-neb-base1:#3a1250; --fn-neb-base2:#173b5e; --fn-neb-base3:#170e3a;
  }
  .fn-forming-frame.fnstyle-realistic{
    --fn-neb-1:rgba(126,204,150,.5); --fn-neb-2:rgba(232,190,108,.45); --fn-neb-3:rgba(200,230,210,.10);
    --fn-neb-base1:#132a20; --fn-neb-base2:#2c3a1e; --fn-neb-base3:#0f150e;
  }
  .fn-forming-frame .fn-form-nebula{
    position:absolute; inset:-35%;
    background:
      radial-gradient(42% 42% at 28% 32%, var(--fn-neb-1), transparent 70%),
      radial-gradient(48% 48% at 76% 72%, var(--fn-neb-2), transparent 68%),
      radial-gradient(60% 60% at 50% 50%, var(--fn-neb-3), transparent 75%),
      linear-gradient(155deg, var(--fn-neb-base1), var(--fn-neb-base2) 55%, var(--fn-neb-base3));
    animation: fnNebulaDrift 13s ease-in-out infinite alternate, fnNebulaHue 17s ease-in-out infinite alternate;
  }
  /* Populated only on the rare chance a preview happens to already be
     available (see tryShowFormingPreview's own doc comment below) — hidden
     by default; heavily blurred + scaled so it reads as an early glimpse,
     never a finished reveal. */
  .fn-forming-still{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(20px) saturate(1.15) brightness(.82); transform:scale(1.15); }
  .fn-forming-frame .fn-form-sweep{
    position:absolute; inset:-10%;
    background:linear-gradient(115deg, transparent 34%, rgba(255,255,255,.09) 46%, rgba(207,200,255,.16) 50%, rgba(255,255,255,.09) 54%, transparent 66%);
    animation:fnFormSweep 2.6s ease-in-out infinite alternate;
  }
  .fn-forming-frame .fn-form-arc{
    position:absolute; left:50%; top:36%; width:30px; height:30px; margin:-15px 0 0 -15px;
    animation:fnArcSpin 1.6s linear infinite;
  }
  .fn-forming-frame .fn-form-arc circle{ fill:none; stroke:rgba(255,255,255,.9); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:46 28;}
  .fn-forming-frame .fn-form-caption{
    position:absolute; left:0; right:0; bottom:11px; text-align:center;
    font-size:12.5px; font-weight:700; letter-spacing:.01em; color:#e7e2fb;
    text-shadow:0 1px 6px rgba(12,10,26,.8);
  }
  @keyframes fnFormSweep{ 0%{ transform:translateX(-70%) skewX(-12deg);} 100%{ transform:translateX(70%) skewX(-12deg);} }
  @keyframes fnArcSpin{ to{ transform:rotate(360deg);} }
  @keyframes fnNebulaDrift{
    0%{ transform:translate(-3%,-2%) rotate(-3deg) scale(1.02); }
    50%{ transform:translate(3%,2.5%) rotate(3deg) scale(1.08); }
    100%{ transform:translate(-2%,3%) rotate(-2deg) scale(1.04); }
  }
  @keyframes fnNebulaHue{
    0%{ filter:hue-rotate(0deg) saturate(1.05); }
    50%{ filter:hue-rotate(16deg) saturate(1.25); }
    100%{ filter:hue-rotate(-12deg) saturate(1.1); }
  }
  @media (prefers-reduced-motion: reduce){ .fn-forming-frame .fn-form-sweep, .fn-forming-frame .fn-form-arc, .fn-forming-frame .fn-form-nebula{ animation:none !important;} }
</style>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/facebook-config.js"></script>
<script src="js/pwa.js"></script>
<script src="js/sheet-dismiss.js"></script>
<script src="js/wizard-chips.js"></script>
<script>
(function(){
  'use strict';

  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{ posthog.capture(name, props || {}); }catch(e){ /* analytics must never break the wizard */ }
    }
  }
  function esc(str){ var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  // ===== Facebook Login — return-leg markers (screen-13 parity, tracker
  // item for-product-wizard-signup-wall-is-the-ol-lt1l9j) =====
  // facebook-oauth-callback.js 302s back to THIS page (via the strictly
  // allowlisted `rp=wizard` resume param the signup wall packs into the
  // OAuth `state` — see that function's redirect() and startFacebookLogin
  // below), carrying exactly one of the same three markers start.html's
  // own return leg documents:
  //   ?bt=<session-transfer token>  — signed in; consume it and complete
  //                                    the wall (boot() below)
  //   ?fb_error=<slug>              — failed closed; inline error on the
  //                                    wall, email path fully usable
  //   ?fb_needs_email=<marker>      — Facebook confirmed who they are but
  //                                    returned no email; ask for one field
  // Read BEFORE anything else touches the URL — DreamStore's own
  // consumeSessionTransferTokenFromUrlSync strips `bt` the moment it runs.
  var fbTransferPresent = !!getParam('bt');
  var facebookErrorSlug = getParam('fb_error');
  var facebookNeedsEmailToken = getParam('fb_needs_email');
  var resumedFromFacebook = !!(fbTransferPresent || facebookErrorSlug || facebookNeedsEmailToken);

  // Already-signed-in visitors have no business in a PRE-signup wizard —
  // send them to the normal logged-in "New Dream" flow instead (create.html's
  // own chip wizard retrofit covers the same chip-first experience there).
  // Gated on !resumedFromFacebook, same as start.html's own equivalent
  // guard: the Facebook return leg is an active identity exchange in
  // progress that must be allowed to finish here, even if this browser
  // also happens to hold an unrelated older session.
  if(!resumedFromFacebook && DreamStore.getCurrentUser()){ location.href = 'create.html'; return; }

  // Returning-but-currently-logged-out entry guard (tracker item
  // for-product-life-origin-generate-handoff-founder-repro-8yc4wm, founder
  // repro on dreamtube.life: logging out then "revisiting the site" landed
  // straight on this wizard's first question, "Who's the dream about?",
  // with no welcome/choice screen shown first — against docs/
  // JOURNEY_MANIFEST.md's own Journey 2, where index.html's welcome
  // screen always comes first). This wizard is purpose-built for a
  // GENUINELY brand-new visitor (docs/JOURNEY_MANIFEST.md: "organic/
  // direct visitors ... go straight into the pre-signup wizard.html
  // dream-builder") — it has no concept of "resume" at all (`cur` above
  // always starts at 0, DreamStore.clearDraft() below wipes any leftover
  // draft unconditionally), so it was never vulnerable to resuming
  // MID-funnel. The actual gap: DreamStore.hasLocalAccountHistory() (see
  // that function's own doc comment) can be true here even while nobody
  // is currently signed in — state.accounts survives logout() by design,
  // so this exact browser/origin may already hold a real account from
  // earlier in this same session (signed up, used the app, then logged
  // out — precisely dreamtube.life's first-ever-on-this-origin scenario).
  // Landing THAT visitor in a flow built to sign up a stranger, with no
  // link back to logging into their real account anywhere on it, is a
  // real, lossy entry-routing bug regardless of how they physically got
  // here (a bookmark, browser history/autocomplete, or an old Add-to-
  // Home-Screen shortcut from before they had an account all reach this
  // same URL) — bounced back to index.html instead, whose "Already have
  // an account? Log in" link is the correct next step for them.
  //
  // ROUND 2 FIX (tracker item for-product-urgent-founder-repro-index-g-
  // c6boa9, founder repro: on dreamtube1.netlify.app, a returning-logged-
  // out visitor's own explicit "Get Started" click on index.html bounced
  // straight back to index.html again — reading as a broken loop). The
  // guard above was unconditional, so it fired even when the visitor had
  // JUST seen index.html's own "Already have an account? Log in" link and
  // deliberately chose Get Started anyway (maybe they want a fresh
  // account on a shared device, maybe they don't remember the old
  // password and would rather not deal with it right now) — that's an
  // informed choice this guard has no business overriding a second time.
  // index.html's Get Started link now marks itself with ?entry=index; the
  // guard only fires on its ABSENCE — i.e. still catches a direct/
  // bookmarked/history hit straight to this URL (no marker), but an
  // explicit click-through from index.html always proceeds. A genuinely
  // first-time visitor (hasLocalAccountHistory() false) is unaffected
  // either way, exactly as docs/JOURNEY_MANIFEST.md documents.
  // (Also gated on !resumedFromFacebook, same reasoning as the signed-in
  // guard above — a Facebook round trip legitimately re-lands here without
  // the ?entry=index marker, and may itself have just created the local
  // account history this guard reads.)
  var cameFromIndexGetStarted = new URLSearchParams(location.search).get('entry') === 'index';
  if(!resumedFromFacebook && !cameFromIndexGetStarted && DreamStore.hasLocalAccountHistory()){ location.href = 'index.html'; return; }
  if(cameFromIndexGetStarted){
    var __cleanParams = new URLSearchParams(location.search);
    __cleanParams.delete('entry');
    var __cleanQs = __cleanParams.toString();
    history.replaceState(null, '', location.pathname + (__cleanQs ? '?' + __cleanQs : ''));
  }

  DreamStore.clearDraft();

  // ===================================================================
  // Character staging — identical pattern to start.html's own pre-signup
  // character staging (see that file's head-of-file comment for the full
  // rationale: DreamStore.saveCharacter requires a logged-in user, but
  // signup doesn't happen until Step 7 here). Characters are staged
  // locally and flushed into real DreamStore characters the moment signup
  // succeeds, via flushStagedCharactersToStore below.
  // ===================================================================
  var staged = { characters: [], subjectCharacterIds: [] };
  var charEditingId = null;
  var charSubMode = 'describe';
  var charPendingPhotoDataUrl = null;
  // Bumped on every open AND every close (see openCharSheet/closeCharSheet
  // below) so a pending resizeImageFile call started by one sheet
  // "instance" can tell, once it resolves, whether it's still talking
  // about the instance that's still on screen. Same pattern as create.html/
  // profile.html's charSheetToken/identitySheetToken — see the photo-input
  // change handler (inside renderSubject below), the only reader of this
  // token.
  var charSheetToken = 0;

  // Non-character subject state ("A stranger" / "An animal or creature" /
  // "No people" / "+ Something else"). Multi-select model (see this file's
  // own design note below renderSubject) -- staged.subjectCharacterIds
  // (any number of staged characters) and subjectOtherKind (at most ONE of
  // these four, still single-select among themselves) compose TOGETHER,
  // resolved into WizardChips.assembleCaption's `subjects` array input at
  // hand-off time (see currentChipFields below).
  var subjectOtherKind = null; // 'stranger' | 'animal' | 'none' | 'other' | null -- single-select among these four only
  var subjectOtherText = '';

  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function localSaveCharacter(patch){
    var name = (patch.name || '').trim();
    var description = (patch.description || '').trim();
    var isSelf = !!patch.isSelf;
    var photoDataUrl = (isSelf && patch.photoDataUrl) ? patch.photoDataUrl : null;
    if(!isSelf && !name) return { ok:false, error:'Give this character a name.' };
    if(!description && !photoDataUrl) return { ok:false, error: isSelf ? 'Add a description or a photo.' : 'Add a short description.' };
    var existing = patch.id ? staged.characters.filter(function(c){ return c.id === patch.id; })[0] : null;
    if(!existing && isSelf) existing = staged.characters.filter(function(c){ return c.isSelf; })[0] || null;
    if(existing){
      existing.name = name;
      existing.description = description;
      if(isSelf) existing.photoDataUrl = photoDataUrl; else delete existing.photoDataUrl;
      return { ok:true, character: existing };
    }
    var character = { id: 'local' + Math.random().toString(36).slice(2, 9), name: name, isSelf: isSelf, description: description };
    if(isSelf && photoDataUrl) character.photoDataUrl = photoDataUrl;
    staged.characters.push(character);
    return { ok:true, character: character };
  }
  function localDeleteCharacter(id){
    staged.characters = staged.characters.filter(function(c){ return c.id !== id; });
    var idx = staged.subjectCharacterIds.indexOf(id);
    if(idx !== -1) staged.subjectCharacterIds.splice(idx, 1);
  }

  /**
   * Toggles a single character's selection independently of every other
   * currently-selected character or the separate subjectOtherKind chip --
   * tapping an already-selected chip deselects just that one; tapping an
   * unselected one adds it. See this file's own design note below
   * renderSubject for why this replaced the old single-active-subject model.
   */
  function toggleSubjectCharacter(id){
    var idx = staged.subjectCharacterIds.indexOf(id);
    if(idx === -1) staged.subjectCharacterIds.push(id); else staged.subjectCharacterIds.splice(idx, 1);
  }

  /**
   * Called once, right after a real signup or login succeeds (from
   * completeSignupAndAdvance, the wall's one shared continuation — see
   * that function below) — turns staged local characters into real
   * DreamStore characters and remaps every id in
   * staged.subjectCharacterIds (potentially more than one) onto its real
   * id. Returns the id map itself so the caller can also remap the
   * already-computed local ids it separately holds
   * (assembled.characterIdsForGeneration was computed before this flush
   * and still holds local ids until re-mapped with this).
   */
  function flushStagedCharactersToStore(){
    var idMap = {};
    staged.characters.forEach(function(c){
      var result = DreamStore.saveCharacter({ isSelf: c.isSelf, name: c.name, description: c.description, photoDataUrl: c.photoDataUrl || null });
      if(result.ok) idMap[c.id] = result.character.id;
    });
    staged.subjectCharacterIds = staged.subjectCharacterIds.map(function(id){ return idMap[id] || id; });
    return idMap;
  }

  function openCharSheet(mode, existing){
    charSheetToken++;
    charEditingId = existing ? existing.id : null;
    document.getElementById('char-sheet-title').textContent = mode === 'self'
      ? (existing ? 'Edit yourself' : 'Add yourself')
      : (existing ? 'Edit character' : 'Add a character');
    var nameInput = document.getElementById('char-name-input');
    nameInput.style.display = mode === 'self' ? 'none' : 'block';
    nameInput.value = existing ? existing.name : '';
    document.getElementById('char-desc-input').value = existing ? (existing.description || '') : '';
    document.getElementById('char-desc-input').dataset.mode = mode;
    document.getElementById('char-error').textContent = '';
    document.getElementById('char-delete-link').style.display = existing ? 'block' : 'none';
    document.getElementById('char-mode-row').style.display = mode === 'self' ? 'flex' : 'none';
    charPendingPhotoDataUrl = (mode === 'self' && existing && existing.photoDataUrl) ? existing.photoDataUrl : null;
    setCharSubMode(mode === 'self' && charPendingPhotoDataUrl ? 'photo' : 'describe');
    document.getElementById('sheet-character-overlay').classList.add('open');
  }
  function closeCharSheet(){
    charSheetToken++;
    document.getElementById('sheet-character-overlay').classList.remove('open');
  }
  function renderCharPhotoPreview(){
    var preview = document.getElementById('char-photo-preview');
    var removeLink = document.getElementById('char-photo-remove');
    if(charPendingPhotoDataUrl){
      preview.innerHTML = '<img src="' + charPendingPhotoDataUrl + '" alt="">';
      removeLink.style.display = 'block';
    } else {
      preview.innerHTML = '<div class="char-photo-empty">No photo yet</div>';
      removeLink.style.display = 'none';
    }
  }
  function setCharSubMode(mode){
    charSubMode = mode;
    Array.prototype.forEach.call(document.querySelectorAll('#char-mode-row .char-mode-btn'), function(b){
      b.classList.toggle('active', b.dataset.charMode === mode);
    });
    document.getElementById('char-desc-input').style.display = mode === 'describe' ? 'block' : 'none';
    document.getElementById('char-photo-area').style.display = mode === 'photo' ? 'block' : 'none';
    renderCharPhotoPreview();
  }

  // ===================================================================
  // Step 1 — Subject ("Who's the dream about?")
  //
  // DESIGN NOTE, round 2 (superseding the single-active-subject model
  // below) — tracker item for-product-wizard-characters-step-is-si-paxp07,
  // founder repro 2026-08-02: "in the wizard, choosing Me and then adding
  // another character (e.g. a stranger) UNCHECKS Me -- the step behaves as
  // one-choice when a dream can contain multiple characters (Me AND
  // someone known AND a stranger). Founder intent = multi-select." This is
  // an explicit, dated override of the judgment call made below when this
  // step first shipped — that call turned out to directly contradict how
  // the founder actually wants to use his own product, confirmed by a live
  // repro, not a hypothetical. The single-active-subject reasoning is left
  // in place (not deleted) immediately below for the historical record —
  // this codebase's own convention for a design that changed, per this
  // task's instructions — but it no longer describes current behavior.
  //
  // NEW MODEL: every staged character chip (Me + each "Someone I know")
  // toggles INDEPENDENTLY — tapping a selected chip deselects only that
  // one; any number can be selected at once (staged.subjectCharacterIds).
  // The four "other" chips (stranger/animal/none/other, #subject-other-row)
  // stay a SEPARATE single-select group among THEMSELVES (subjectOtherKind,
  // unchanged type/shape) — picking one still only ever has at most one of
  // those four active — but that group now COMPOSES with the multi-select
  // characters rather than being mutually exclusive with them. This exact
  // shape was chosen (not the alternative of also multi-selecting the
  // "other" row itself) because it's what the founder's own worked example
  // literally describes: "Me AND someone known AND a stranger" is TWO
  // staged characters (Me + someone known) selected together, PLUS "a
  // stranger" — itself one of the four "other" chips — picked ALONGSIDE
  // them as a third, additional element, not a fully-independent multi-
  // select applied to the other-chips row too (nothing in the founder's
  // wording implies wanting e.g. "a stranger" AND "an animal" AND "no
  // people" all active together, which still has no coherent combined
  // meaning — the same problem the superseded reasoning below correctly
  // identified, just scoped now to only that one row instead of the whole
  // step). See currentChipFields below for how this composes into
  // WizardChips.assembleCaption's new `subjects` array input, and that
  // module's own doc comment for why the array shape (vs. touching
  // assembleCaption's existing singular contract, still used unchanged by
  // create.html's own separate single-select "Build it" subject step) was
  // the less invasive of the two options this task flagged.
  //
  // ── Superseded reasoning (kept for the record, no longer current) ──
  // the spec calls this row "multi-select," but "A stranger" / "An animal
  // or creature" / "No people — just a place/thing" are semantically
  // mutually exclusive with each other AND with picking a real character
  // — there's no sound rule for combining, say, "No people" with a
  // selected character. This implements a single-active-subject model
  // instead: exactly one of {a selected character} or {one of the other
  // four chips} drives the assembled prompt's subject at a time. Tapping
  // "Someone I know" can still be used repeatedly to build up a reusable
  // roster of several saved characters (exactly like create.html today);
  // only ONE of them is picked as the active chip at a time, same
  // single-select semantics as the standalone chips.
  // ===================================================================
  function charChipDisplayName(c){ return c.name || (c.isSelf ? 'Me' : ''); }
  function charChipHTML(c, selected){
    return '<div class="char-chip' + (selected ? ' selected' : '') + '" data-char-select="' + c.id + '">' +
      '<span class="chip-check"><span class="icon">' + Icons.check + '</span></span>' +
      '<span class="chip-edit-area" data-char-edit="' + c.id + '">' +
        '<span>' + esc(charChipDisplayName(c)) + '</span>' +
        '<span class="chip-edit icon">' + Icons.pencil + '</span>' +
      '</span>' +
    '</div>';
  }
  function renderSubjectChips(){
    var row = document.getElementById('subject-chip-row');
    if(!row) return;
    var hasSelf = staged.characters.some(function(c){ return c.isSelf; });
    var html = staged.characters.map(function(c){
      return charChipHTML(c, staged.subjectCharacterIds.indexOf(c.id) !== -1);
    }).join('');
    if(!hasSelf) html += '<div class="char-chip-add" id="subj-add-self"><span class="icon">' + Icons.userPlus + '</span> Me</div>';
    html += '<div class="char-chip-add" id="subj-add-other"><span class="icon">' + Icons.plus + '</span> Someone I know</div>';
    row.innerHTML = html;
    var addSelfBtn = document.getElementById('subj-add-self');
    if(addSelfBtn) addSelfBtn.addEventListener('click', function(){ openCharSheet('self', null); });
    document.getElementById('subj-add-other').addEventListener('click', function(){ openCharSheet('other', null); });

    Array.prototype.forEach.call(document.querySelectorAll('#subject-other-row .fn-chip'), function(chipEl){
      chipEl.classList.toggle('sel', chipEl.dataset.subjOther === subjectOtherKind);
    });
    var otherReveal = document.getElementById('subject-other-reveal');
    if(otherReveal) otherReveal.style.display = subjectOtherKind === 'other' ? 'block' : 'none';
  }

  // Mounted ONCE, as a direct child of #app -- NOT rebuilt inside
  // renderSubject's own el.innerHTML (which used to embed this sheet's
  // markup directly inside #fnScreen, the funnel's own scrollable
  // internal region). That nesting was the real root cause behind a
  // review finding on tracker item
  // for-product-sheet-dismissal-app-wide-fix-rlay70 (round 1): a
  // position:absolute descendant of a scrolling, position:relative
  // ancestor (#fnScreen -- see its own .fn-screen{...position:relative;
  // overflow-y:auto...} rule) is positioned against THAT ancestor's own
  // scrollable content box, not the real viewport or even #app's own
  // (now correctly capped, see #app.funnel-app's height:100dvh above)
  // box -- so if #fnScreen ever scrolls for ANY reason (a real user
  // scroll, or the browser's own scroll-anchoring compensating for a
  // layout shift elsewhere on a long Subject screen), the sheet's
  // rendered position moves with it, independent of anything this
  // fix's own #app height cap can address. Confirmed via a real
  // Playwright repro: inflating #fnScreen's content and opening the
  // sheet left it rendered entirely off-screen (negative y), with
  // tap-outside unable to reach it at all.
  //
  // The fix matches how every other sheet in the app is structured
  // (result.html/profile.html/create.html/start.html/js/purchase-
  // sheet.js): always a direct child of #app itself, never nested
  // inside an inner scrolling sub-region. ensureCharSheetMounted()
  // below is the one-time mount + wire, matching js/purchase-sheet.js's
  // own ensureMounted() convention -- idempotent (checked via
  // charSheetMounted) since renderSubject (and so this call) can run
  // again on a later revisit to the Subject step (goToStep(0) via Back).
  var charSheetMounted = false;
  function ensureCharSheetMounted(){
    if(charSheetMounted) return;
    charSheetMounted = true;

    var wrap = document.createElement('div');
    wrap.className = 'sheet-overlay';
    wrap.id = 'sheet-character-overlay';
    wrap.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-title" id="char-sheet-title">Add a character</div>' +
        '<input class="fn-field" id="char-name-input" placeholder="Name (e.g. Mom, my friend Alex)" dir="auto">' +
        '<div class="char-mode-row" id="char-mode-row" style="display:none;">' +
          '<div class="char-mode-btn" data-char-mode="describe">Describe</div>' +
          '<div class="char-mode-btn" data-char-mode="photo">Upload photo</div>' +
        '</div>' +
        '<textarea class="fn-field" id="char-desc-input" placeholder="Describe how they look..." dir="auto" style="min-height:90px;"></textarea>' +
        '<div class="char-photo-area" id="char-photo-area" style="display:none;">' +
          '<div class="char-photo-preview" id="char-photo-preview"><div class="char-photo-empty">No photo yet</div></div>' +
          '<div class="char-photo-hint">' + "A photo of a child or teen can't be used for video generation — use Describe instead for them." + '</div>' +
          '<input type="file" accept="image/*" id="char-photo-input" style="display:none;">' +
          '<button type="button" class="btn btn-secondary btn-block" id="char-photo-pick-btn">Choose photo</button>' +
          '<span class="char-photo-remove" id="char-photo-remove" style="display:none;">Remove photo</span>' +
        '</div>' +
        '<div class="err-text" id="char-error"></div>' +
        '<button class="fn-btn-primary" id="char-save-btn" type="button">Save</button>' +
        '<div style="height:10px;"></div>' +
        '<span class="fn-small-link" id="char-cancel" style="cursor:pointer;">Cancel</span>' +
        '<div style="height:8px;"></div>' +
        '<span class="fn-small-link" id="char-delete-link" style="cursor:pointer; color:var(--danger); display:none;">Delete this character</span>' +
      '</div>';
    document.getElementById('app').appendChild(wrap);

    document.getElementById('char-mode-row').addEventListener('click', function(e){
      var btn = e.target.closest('.char-mode-btn');
      if(btn) setCharSubMode(btn.dataset.charMode);
    });
    document.getElementById('char-photo-pick-btn').addEventListener('click', function(){
      document.getElementById('char-photo-input').click();
    });
    document.getElementById('char-photo-input').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!file) return;
      document.getElementById('char-error').textContent = '';
      // resizeImageFile is a real multi-step async chain (FileReader ->
      // Image decode -> canvas draw), easily slow enough to race a Cancel-
      // then-reopen of this sheet -- including reopening for a DIFFERENT
      // character than the one being edited when the photo was picked.
      // Captured now and re-checked once it resolves -- without this, a
      // stale resize from a cancelled instance can resolve after reopen and
      // silently overwrite charPendingPhotoDataUrl/the preview with an
      // abandoned photo the user never confirmed for this instance.
      var tokenAtPick = charSheetToken;
      resizeImageFile(file, 768, 0.82).then(function(dataUrl){
        if(tokenAtPick !== charSheetToken) return;
        charPendingPhotoDataUrl = dataUrl;
        renderCharPhotoPreview();

  // ===================================================================

  // caption + which (if any) character id should ride along on the real
  // generation request. See js/wizard-chips.js for the algorithm itself.
  // ===================================================================
  var assembled = null; // { caption, characterIdsForGeneration }

  /**
   * Same chip-selection fields assembleCaption below takes, minus camera/
   * POV/character-description/style — shared with buildDeterministicStory,
   * which has no use for those (see js/wizard-chips.js's own doc comment).
   *
   * Builds WizardChips' new `subjects` array (see that module's own doc

   * (staged.subjectCharacterIds, multi-select) plus at most one active
   * "other" chip (subjectOtherKind, still single-select among just those

    var subjects = staged.subjectCharacterIds.map(function(id){

  // ===================================================================
  // storyText (tracker item for-product-split-prompttext-storytext-
  // f-yt5kc7) — wizard.html's own chip-based pre-signup flow gets the
  // exact same treatment as create.html's "Build it" (see that file's own
  // header comment): assembled.caption above is promptText (generation-
  // only, camera-direction/style-modifier language), never shown to the
  // user again. currentStoryText is what the signup wall's recap card
  // actually shows, and what the real submission payload/draftPatch below
  // carry — always whatever's CURRENTLY displayed, never a stale snapshot,
  // same discipline as style.html's own version of this. See
  // computeStoryText's own doc comment for the two-path logic (verbatim
  // free text vs. a deterministic-then-opportunistically-LLM-upgraded chip
  // sentence).
  // ===================================================================
  var currentStoryText = '';
  var storyRewriteToken = 0; // bumped every recompute -- an in-flight fetch from a PRIOR chip-state (e.g. the user went back and changed something) must never clobber a newer one's result.

  /**
   * Recomputes currentStoryText for whatever's currently staged, fires the
   * opportunistic LLM rewrite if needed, and re-renders the wall's recap
   * card (only relevant while the wall is the visible screen — renderStoryRecap
   * itself no-ops harmlessly if its elements aren't in the DOM, e.g. an
   * earlier step is showing).
   */
  function computeStoryText(){
    var myToken = ++storyRewriteToken;
    var hasFreeText = !!(freeText && freeText.trim());
    currentStoryText = hasFreeText ? freeText.trim() : WizardChips.buildDeterministicStory(currentChipFields());
    renderStoryRecap();
    if(hasFreeText) return;
    fetch('/.netlify/functions/rewrite-dream-story', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ promptText: assembled ? assembled.caption : '' })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(myToken !== storyRewriteToken) return; // stale -- a newer recompute has since superseded this
      if(!result.ok || !result.data || !result.data.storyText) return;
      currentStoryText = result.data.storyText;
      renderStoryRecap();
    }).catch(function(){ /* best-effort -- deterministic template already shown */ });
  }

    var card = document.getElementById('fn-story-recap-card');
    var textEl = document.getElementById('fn-story-recap-text');
    if(!card || !textEl) return; // the wall isn't the current screen -- see computeStoryText's own comment
    textEl.textContent = currentStoryText;
    card.style.display = currentStoryText ? 'block' : 'none';
  }

  // see start-pending-generation.js/dream-webhook.js). Email is required
  // by that endpoint (its E4 gate — email is the token-economy identity
  // generate-video.js's E112 gate keys on too), so the real, billed
  // generation fires the moment the signup wall's email submit passes
  // the deliverability check — BEFORE any account exists — exactly the
  // ordering start.html's screen 13 uses. WhatsApp stays PARKED (founder
  // decision 2026-07-28, tracker item
  // for-product-hide-the-whatsapp-field-in-w-clu9ju — no code path can
  // deliver to it today), so the payload always sends whatsapp: null;
