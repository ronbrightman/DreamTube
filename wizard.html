<!--
  Dream-builder wizard — chip-first, one-question-per-screen dream builder
  that replaces the old free-text "describe your dream" box for brand-new
  (pre-signup) visitors. See dreamtube-growth/WIZARD_SPEC.md for the full
  spec this implements (steps/copy/chips, prompt-assembly logic, the
  confirmed "build the dream first, sign up after" seam) and tracker items
  for-product-build-the-dream-builder-wiza-28did1 /
  for-product-generate-during-signup-aband-73jyud.

  SEAM/ROUTING JUDGMENT CALL (flagged, not silently decided): the spec's
  own tracker item left "confirm the funnel -> app seam" open. This file
  is a brand-new, self-contained pre-signup entry point in THIS repo,
  reachable from index.html's "Get Started" (changed to point here instead
  of the external dreamtube-growth funnel) — it does NOT touch or replace
  start.html, which keeps serving the existing external-growth-funnel
  ?resume=1 handoff completely unchanged (that funnel's own hook/quiz/
  dream-capture/style-picker screens live in the separate dreamtube-growth
  repo, out of scope for this build). See this branch's PR description /
  the build report for the full reasoning.

  FLOW (steps, one screen each, chip-first / zero required typing).
  Since 2026-08-07 every screen wears the founder-approved Layout-B
  ("Flo pattern") skin — pill option rows with leading emoji chips,
  progress dots, auto-advancing single-select steps, per-row optional
  Me/Someone detail inputs, an editable wall recap — with the STEP LIST,
  step numbering (wizard_step_viewed), logic, and data flow all
  unchanged. See the in-body <style> header + each renderer's own
  comments for the redesign's provenance and per-step specifics.
    0 Subject   ("Who was in the dream?")     — reuses the character sheet
    1 Setting   ("Where did it happen?")      — reuses+widens scenery chips
    2 Action    ("What was happening?")       — required, no skip
    3 Mood      ("How did the dream feel?")
    4 Style     ("Pick your dream's style")   — pill rows (was style.html's cards)
    5 Free text (optional escape hatch)       — the demoted old textarea
    6 Signup wall (renderSignupWall) — ONE hybrid screen, at parity with
      start.html's screen 13 (founder order, tracker item
      for-product-wizard-signup-wall-is-the-ol-lt1l9j): the forming-veil
      "your dream is already forming" indicator on top, then a single
      EMAIL field — passwordless-first, exactly the live screen-13 wall,
      NOT the old username+password form. Submitting fires start-pending-generation.js
      (the real, billed generation — BEFORE any account exists) in
      parallel with DreamStore.signupPasswordless(email); a brand-new
      email is signed straight in, an already-registered one swaps to the
      same enter-the-code step screen 13 uses. Success claims the pending
      job (claim-pending-generation.js), adopts it
      (DreamStore.adoptPendingGeneration) and hands off straight to
      home.html, which resumes polling it with ZERO changes needed
      there (it already checks DreamStore.getPendingJob() on load).
      This wall REPLACED the former two-step tail (renderContact's
      email-only capture + renderSignup's username+password form) — see
      git history for those; the founder's explicit intent was that the
      organic path ends the same way the paid funnel does.

  Camera chips are deliberately NOT a step here (see WIZARD_SPEC.md:
  "demoted to inferred-not-asked") — js/wizard-chips.js infers camera +
  lighting from the Action/Mood/POV selections and bakes them directly
  into the assembled caption text (see that file's own doc comment for why
  this does NOT also pass characterIds through the description-bearing
  path, to avoid a doubled-up character description in the final prompt).
-->
</head>
<body>

<div id="app" class="funnel-app">
  <div class="fn-topbar">
    <button class="fn-back" id="fnBack" aria-label="Back" type="button"></button>
    <div class="fn-progress" id="fnProgress"></div>
    <div class="fn-topbar-spacer"></div>
  </div>
  <div class="fn-screen" id="fnScreen"></div>
</div>

<style>
  /* Layout-B ("Flo pattern") shell — the founder-picked wizard redesign
     (tracker item for-product-founder-picked-layout-b-flo--lks7mj,
     seven founder mock rounds on mock-wizard-b-x7q4.html, "go live"
     2026-08-07; the mock itself was deleted on the branch that built
     this, per its own DELETE-when-merged header). Visual grammar, all
     from the approved mock: soft purple gradient backdrop, progress
     DOTS (active = elongated pink pill), a circled back chevron, every
     option a full-width true-pill row with a leading 38px circular
     emoji chip, pink selected state, pink→purple gradient CTA.
     SKIN ONLY: every step's logic, data flow, and analytics
     (wizard_step_viewed step numbers included — SCREEN_RENDERERS is
     unchanged) are byte-identical to the pre-redesign wizard; the one
     founder-directed interaction change is documented per-step below
     (single-select steps auto-advance; the Subject step's per-row
     optional detail inputs per his 08-04 ruling).

     This intentionally replaces the previous "night" shell (tracker
     item for-product-realign-index-html-organic-w-lzbmfu) as this
     file's single permanent theme — still hardcoded, still no phase
     machinery. start.html's ad funnel keeps its own night look for
     now; growth is adopting this same Layout-B language funnel-side
     (tracker item for-growth-heads-up-ask-founder-picked-t-9m06u7), so
     the cross-page continuity the night shell existed for re-converges
     on THIS look, not that one. */
  #app.funnel-app{
    --fn-ink:#F2EEFC; --fn-ink-soft:#B7AEDE; --fn-ink-faint:#8F88B3;
    --fn-card:rgba(255,255,255,0.07); --fn-line:rgba(255,255,255,0.14);
    /* Mock accent pair: pink #FF8BB3 (selection, active dot), purple
       #B783FF (CTA gradient tail). --fn-accent-grad/-solid keep their
       pre-redesign ROLES (selected chips, switch track, focus rings,
       spinner) so every consumer below recolors in one place. */
    --lb-pink:#FF8BB3; --lb-purple:#B783FF;
    --lb-pink-tint:rgba(255,139,179,0.16);
    --fn-accent-grad:linear-gradient(90deg,#FF8BB3,#B783FF);
    --fn-accent-solid:#FF8BB3;
    --fn-font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    background:linear-gradient(180deg,#2A2150,#1B1438 55%,#141028);
    font-family:var(--fn-font-body);
    /* #app's own base rule (css/styles.css) only sets min-height:100dvh
       -- a floor, not a cap. .sheet-overlay is position:absolute;inset:0
       against #app (its nearest positioning ancestor), so on a real
       Subject-step character sheet with a lot of characters, #app could
       grow taller than one viewport and the sheet would anchor to the
       bottom of THAT oversized box instead of the visible screen --
       reproducing the exact "sheet unreachable" bug this whole fix
       exists to close, via a different mechanism (tracker item
       for-product-sheet-dismissal-app-wide-fix-rlay70, review round 1).
       height:100dvh matches the same real cap result.html/profile.html
       already rely on via their own .fill/.scroll-shell classes --
       .fn-screen below already has the matching overflow-y:auto;
       min-height:0 internal-scroll half of that pattern, just missing
       this outer half until now. */
    height:100dvh;
  }

  .fn-topbar{ display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 4px; flex:none;}
  .fn-back{ width:38px; height:38px; border-radius:50%; flex:none; cursor:pointer; background:rgba(255,255,255,.08); border:none; color:var(--fn-ink); display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent;}
  .fn-back .icon, .fn-back svg{ width:15px; height:15px;}
  .fn-topbar-spacer{ width:38px; flex:none;}
  /* Progress DOTS (mock grammar): 8px circles; the active step is an
     elongated 22px pink pill; completed steps go purple. Same i.done/
     i.now element structure renderProgress always produced — this is a
     pure restyle of the old flex bars. */
  .fn-progress{ flex:1; display:flex; gap:6px; justify-content:center;}
  .fn-progress i{ width:8px; height:8px; flex:none; border-radius:99px; background:#463D78; display:block; transition:all .2s;}
  .fn-progress i.done{ background:#8F7BDC;}
  .fn-progress i.now{ background:var(--lb-pink); width:22px;}

  .fn-screen{ flex:1; display:flex; flex-direction:column; padding:18px 24px calc(24px + env(safe-area-inset-bottom,0px)); position:relative; overflow-y:auto; min-height:0; color:var(--fn-ink);}

  /* Centered bold sans headline + centered sub, per the mock (the old
     shell's serif/left-aligned pairing retired with it). text-wrap:
     balance kept — it reads even better centered. */
  .fn-headline{ font-family:var(--fn-font-body); font-size:23px; font-weight:800; letter-spacing:-0.005em; line-height:1.25; text-wrap:balance; text-align:center; margin:6px 0 4px; color:#fff;}
  .fn-body-copy{ font-size:13.5px; color:var(--fn-ink-soft); line-height:1.55; text-align:center; margin:0 0 18px;}
  .fn-mini-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--fn-ink-faint); margin:14px 0 8px;}
  .fn-mini-label:first-child{ margin-top:0;}
  .fn-spacer{ flex:1;}

  /* Option rows (mock grammar): every option is a full-width TRUE-PILL
     row — border-radius:999px, leading 38px circular emoji chip
     (.lb-chip), stacked single-column. Selected = pink border + tinted
     fill (NOT the old gradient fill — the mock's .opt.sel). The class
     names (.fn-chip/.sel) and every data-* attribute are unchanged from
     the old wrap-chips so all existing wiring and tests keep meaning the
     same thing. */
  .fn-chip-row{ display:block; margin-bottom:18px;}
  .fn-chip{ display:flex; align-items:center; gap:14px; width:100%; box-sizing:border-box; padding:12px 16px; border-radius:999px; background:var(--fn-card); border:1.5px solid var(--fn-line); font-size:16px; font-weight:600; color:var(--fn-ink); cursor:pointer; margin-bottom:11px; transition:all .12s; -webkit-tap-highlight-color:transparent;}
  .fn-chip.sel{ border-color:var(--lb-pink); background:var(--lb-pink-tint); color:var(--fn-ink);}
  .lb-chip{ width:38px; height:38px; border-radius:99px; background:var(--lb-pink-tint); display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;}
  /* "+ Something else" rows keep the mock's ✨ ghost treatment. */
  .fn-chip.lb-ghost{ opacity:.75; font-weight:500;}
  /* Day/Night (Setting) — an auxiliary pair the mock doesn't have; kept
     as two HALF-width pills side by side so the seven place rows below
     stay the screen's main body. Same pill grammar, just not full-width. */
  .fn-chip-row.lb-half-row{ display:flex; gap:10px;}
  .lb-half-row .fn-chip{ width:auto; flex:1; margin-bottom:0;}

  /* "+N more" / "Show less" expander (Action step curation — tracker
     item for-product-wizard-step-3-has-too-many-c-lrg1ct). Same
     disclosure-not-option dashed treatment as before, widened to a full
     pill row to sit in the new stacked column. */
  .fn-chip-more{ display:block; width:100%; box-sizing:border-box; text-align:center; padding:12px 16px; border-radius:999px; background:transparent; border:1.5px dashed var(--fn-line); font-size:14px; font-weight:700; color:var(--fn-ink-soft); cursor:pointer; margin-bottom:11px; -webkit-tap-highlight-color:transparent;}
  .fn-chip-more:hover{ border-color:var(--fn-accent-solid); color:var(--fn-ink);}

  /* Character rows (Subject step) — the same .char-chip/.chip-check/
     .chip-edit-area/.char-chip-add structure create.html/start.html's
     character machinery always used, restyled into the Layout-B pill
     rows: .chip-check IS the leading 38px circle (it now carries the
     row's emoji instead of a checkmark — selection reads off the row's
     pink border/fill, matching every other option row on this page),
     .chip-edit-area keeps the name + pencil. The base .char-chip rules
     in css/styles.css still apply on other pages untouched. */
  #app.funnel-app .char-chip{ display:flex; align-items:center; gap:14px; width:100%; box-sizing:border-box; padding:12px 16px; border-radius:999px; background:var(--fn-card); border:1.5px solid var(--fn-line); color:var(--fn-ink); font-size:16px; font-weight:600; margin-bottom:11px; cursor:pointer; transition:all .12s;}
  #app.funnel-app .char-chip .chip-check{ width:38px; height:38px; border-radius:99px; border:none; background:var(--lb-pink-tint); display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;}
  #app.funnel-app .char-chip .chip-check .icon{ display:none;}
  #app.funnel-app .char-chip.selected{ border-color:var(--lb-pink); background:var(--lb-pink-tint); color:var(--fn-ink);}
  #app.funnel-app .char-chip .chip-edit-area{ display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
  #app.funnel-app .char-chip .chip-edit{ color:var(--fn-ink-faint); margin-left:auto;}
  #app.funnel-app .char-chip.selected .chip-edit{ color:var(--fn-ink-soft);}
  #app.funnel-app .char-chip-add{ display:flex; align-items:center; gap:14px; width:100%; box-sizing:border-box; padding:12px 16px; border-radius:999px; background:transparent; border:1.5px dashed var(--fn-line); color:var(--fn-ink-soft); font-size:16px; font-weight:500; margin-bottom:11px; cursor:pointer;}
  #app.funnel-app .char-chip-add:hover{ border-color:var(--fn-accent-solid); color:var(--fn-ink);}

  /* The per-row OPTIONAL detail input revealed directly below a selected
     Me/"Someone I know" row (founder mock rounds 6-7 + his 08-04 ruling —
     see renderSubjectChips below). Pill-shaped, pink-edged like the
     mock's .custom-in. */
  .lb-detail{ width:100%; box-sizing:border-box; margin:-4px 0 11px;}
  .lb-detail input{ width:100%; box-sizing:border-box; background:var(--fn-card); border:1.5px solid var(--lb-pink); border-radius:999px; color:#fff; font-size:15px; font-family:var(--fn-font-body); padding:12px 18px; outline:none;}
  .lb-detail input::placeholder{ color:var(--fn-ink-faint);}
  /* .sheet/.sheet-handle/.sheet-title are DELIBERATELY not overridden here
     anymore (unlike the old light "dawn" theme, which needed a light
     override) -- css/styles.css's own base .sheet rules already resolve
     dark (var(--bg-app), var(--border-strong), inherited white text) —
     exactly this shell's own night look, with no override needed. */
  #app.funnel-app .char-mode-row .char-mode-btn{ background:rgba(255,255,255,.05); border-color:var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-mode-row .char-mode-btn.active{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-photo-preview{ background:rgba(255,255,255,.05); border-color:var(--fn-line);}
  #app.funnel-app .char-photo-empty{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-photo-hint{ color:var(--fn-ink-soft);}
  #app.funnel-app .btn-secondary{ background:transparent; border:1px solid var(--fn-line); color:var(--fn-ink);}
  #app.funnel-app .btn-secondary:hover{ background:rgba(255,255,255,.05); border-color:var(--fn-ink-faint);}

  /* Style step (Step 5) — pill rows like every other step (founder mock
     round 4: the style pick auto-advances and looks like the rest of the
     wizard). This replaced style.html's .style-card grid ON THIS WIZARD
     ONLY — style.html itself (the logged-in flow's style picker) is
     untouched and still uses its cards. #style-grid keeps its id and the
     rows keep data-style, so all existing wiring/tests address the same
     things. */

  /* Pill-shaped single-line inputs (email, character name, write-ins) per
     the mock; textareas stay soft-rectangles (22px — a 999px radius on a
     multi-line box clips its own first line). */
  textarea.fn-field, input.fn-field{ background:var(--fn-card); border:1.5px solid var(--fn-line); border-radius:999px; padding:13px 18px; font-family:var(--fn-font-body); color:var(--fn-ink); font-size:16px; width:100%; box-sizing:border-box; margin-bottom:12px; display:block;}
  textarea.fn-field{ resize:none; line-height:1.5; border-radius:22px; padding:16px 18px;}
  textarea.fn-field::placeholder, input.fn-field::placeholder{ color:var(--fn-ink-faint);}
  textarea.fn-field:focus, input.fn-field:focus{ outline:2px solid var(--fn-accent-solid); border-color:transparent;}

  .fn-err-text{ font-size:12.5px; color:#C4485B; min-height:16px; margin:2px 0 8px;}

  /* Pink→purple gradient CTA pill (the mock's .cta), replacing the old
     night shell's flat white button. .lb-cta (the per-step Continue
     buttons only — NOT the character sheet's Save, which must scroll
     with its sheet) additionally sticks to the bottom of the scrolling
     .fn-screen so it reads as the mock's fixed bottom pill; sticky
     (not fixed) keeps each step's button inside its own render tree
     with zero layout-engine changes. */
  .fn-btn-primary{ background:linear-gradient(90deg,var(--lb-pink),var(--lb-purple)); color:#fff; font-weight:800; font-size:17px; border:none; border-radius:999px; padding:16px; text-align:center; width:100%; box-shadow:0 12px 30px -8px rgba(255,139,179,.45); cursor:pointer; font-family:var(--fn-font-body); -webkit-tap-highlight-color:transparent;}
  .fn-btn-primary:disabled{ opacity:.42; cursor:not-allowed; box-shadow:none;}
  .fn-btn-primary.lb-cta{ position:sticky; bottom:0;}
  .fn-small-link{ background:none; border:none; color:var(--fn-ink-soft); font-size:12.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; text-align:center; width:100%; padding:10px 0 0; cursor:pointer;}

  /* The recap STEP's editable dream text (renderRecap — founder round 8:
     "Here's your dream — make it yours", its own screen before the wall,
     and OBVIOUSLY editable: real input chrome — a visible border that
     brightens on focus — plus a small pencil affordance floating in the
     box's corner, not a flat card that reads as static text. The pencil
     is decoration over the textarea (pointer-events:none) — tapping it
     lands in the textarea itself, which is the actual edit surface. */
  .lb-recap-wrap{ position:relative;}
  .lb-recap-wrap .lb-recap-text{ min-height:150px; padding-right:44px; border-color:rgba(255,255,255,.28);}
  .lb-recap-wrap .lb-recap-pencil{ position:absolute; top:14px; right:16px; width:16px; height:16px; color:var(--fn-ink-soft); pointer-events:none;}
  .lb-recap-wrap .lb-recap-pencil svg{ width:16px; height:16px;}

  /* "+ Something else" progressive-disclosure reveal (per the spec: a
     collapsed tap that reveals a small text input, not an always-visible
     box) — shared across every step that has one. */
  .fn-other-reveal{ margin:-6px 0 14px;}
  .fn-other-reveal input{ margin-bottom:0;}

  /* POV toggle (Action step) — a plain accessible checkbox styled as a
     switch, off by default per the spec. */
  .fn-toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:14px; background:var(--fn-card); border:1px solid var(--fn-line); margin-bottom:18px;}
  .fn-toggle-row span{ font-size:13.5px; font-weight:700; color:var(--fn-ink);}
  .fn-switch{ position:relative; width:42px; height:24px; flex:none;}
  .fn-switch input{ opacity:0; width:0; height:0;}
  .fn-switch .fn-switch-track{ position:absolute; inset:0; background:var(--fn-line); border-radius:100px; transition:.15s; cursor:pointer;}
  .fn-switch .fn-switch-track:before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .fn-switch input:checked + .fn-switch-track{ background:var(--fn-accent-grad);}
  .fn-switch input:checked + .fn-switch-track:before{ transform:translateX(18px);}

  .fn-microcopy{ font-size:12.5px; color:var(--fn-ink-faint); margin:-8px 0 16px; line-height:1.5;}

  .fn-spin{ width:44px; height:44px; border-radius:50%; border:3px solid var(--fn-line); border-top-color:var(--fn-accent-solid); margin:0 auto 20px; animation:fnspin 1s linear infinite;}

  /* ===== Signup wall (screen-13 parity — tracker item
     for-product-wizard-signup-wall-is-the-ol-lt1l9j). Every rule below is
     ported from start.html's own proven screen-13 implementation (see that
     file's <style> block for each rule's original doc comment and the

  .fn-forming-frame{

  .fn-forming-frame .fn-form-nebula{

    background:

  @media (prefers-reduced-motion: reduce){ .fn-forming-frame .fn-form-sweep, .fn-forming-frame .fn-form-arc, .fn-forming-frame .fn-form-nebula{ animation:none !important;} }

  /* ── Question-first screen 1 ("What was your dream about?") ──────────────
     The wizard's new first screen (replacing the round-8 build/write/speak
     mode chooser): a promise line, a STATIC portrait-triptych store-image
     hero (webview-safe, zero video), and a six-tile grid whose tap SEEDS
     the wizard (see QUESTION_TILES). Matches the growth funnel's finalized
     screen-1 hero EXACTLY so the two funnels look identical: three full
     portrait stills (desert / ocean / forest), each in a ~400/711 cell so
     the composition reads FULL and uncropped (the store assets are 400x711,
     so object-fit:cover shows each whole, no cropped slivers). Every cell
     and the hero itself carry a dark-gradient first-paint fallback that
     shows before/if an image fails to load. Uses the same Layout-B palette/
     type as every other step; only the triptych + tile-grid geometry is
     new here. */
  .fn-q-collage{ position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:2px 0 16px; border-radius:16px; background:linear-gradient(180deg,#241a44,#130d28); box-shadow:0 16px 40px -18px rgba(20,10,40,.7);}
  .fn-q-cell{ position:relative; aspect-ratio:400/711; border-radius:12px; overflow:hidden; border:1px solid var(--fn-line); background:linear-gradient(180deg,#241a44,#130d28);}
  .fn-q-cell img{ width:100%; height:100%; object-fit:cover; display:block;}
  .fn-q-collage::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:42%; border-radius:0 0 16px 16px; background:linear-gradient(180deg,rgba(19,13,40,0),rgba(19,13,40,.72)); pointer-events:none;}
  .fn-q-collage .fn-q-cap{ position:absolute; left:14px; bottom:11px; z-index:1; font-size:12.5px; font-weight:700; color:#fff; letter-spacing:.01em; text-shadow:0 1px 6px rgba(0,0,0,.55);}
  .fn-q-promise{ font-size:15px; font-weight:800; color:#fff; text-align:center; line-height:1.35; text-wrap:balance; margin:0 0 4px;}
  .fn-q-promise .u{ background:linear-gradient(90deg,var(--lb-pink),var(--lb-purple)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .fn-q-label{ font-size:13.5px; font-weight:700; color:var(--fn-ink-soft); text-align:center; margin:0 0 14px;}
  .fn-q-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:14px;}
  .fn-q-tile{ display:flex; align-items:center; gap:11px; width:100%; box-sizing:border-box; padding:14px 13px; border-radius:16px; background:var(--fn-card); border:1.5px solid var(--fn-line); font-size:14.5px; font-weight:700; color:var(--fn-ink); cursor:pointer; text-align:left; font-family:var(--fn-font-body); transition:all .12s; -webkit-tap-highlight-color:transparent;}
  .fn-q-tile:active,.fn-q-tile.sel{ border-color:var(--fn-accent-solid); background:var(--lb-pink-tint);}
  .fn-q-tile .fn-q-emoji{ width:34px; height:34px; border-radius:99px; background:var(--lb-pink-tint); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/pwa.js"></script>
<script src="js/sheet-dismiss.js"></script>
<script src="js/wizard-chips.js"></script>
<script src="js/paywall-moment.js"></script>
<script src="js/funnel-character-stash.js"></script>
<script>
(function(){
  'use strict';

  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{ posthog.capture(name, props || {}); }catch(e){ /* analytics must never break the wizard */ }
    }
  }
  function esc(str){ var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  // ===================================================================
  // Layout-B option-row furniture (tracker item
  // for-product-founder-picked-layout-b-flo--lks7mj — see the shell
  // <style> header above for the full redesign provenance).
  //
  // LB_EMOJI: the leading 38px chip's emoji per option. Where the
  // founder's approved mock covered an option, its emoji is used
  // verbatim; options the mock didn't have (the mock's Action list was
  // shorter than the real ACTION_CHIPS, and it had no Day/Night pair)
  // get a sensible match chosen here, marked (*). Keys mirror
  // js/wizard-chips.js's own chip keys — an unknown key falls back to ✨
  // rather than rendering an empty circle.
  // ===================================================================
  var LB_EMOJI = {
    subject: { me: '🙋', someone: '👥', stranger: '🕶️', animal: '🐺', none: '🏞️', other: '✨' },
    place: { urban: '🏙️', nature: '🌲', house: '🏠', water: '🌊', sky: '🌌', unreal: '🌀', other: '✨' },
    action: { flying: '🕊️', running: '🏃', magical: '🪄', meeting: '🫂', exploring: '🗺️', calm: '🧘', other: '✨',
      falling: '🪂', exam: '📝', late: '⏰', trying: '🔁', newroom: '🚪', child: '🧸' /* (*) mock's Action list was shorter */ },
    mood: { peaceful: '🕊️', joyful: '😊', dreamy: '🌫️', mysterious: '🔮', tense: '😨', epic: '🏔️', other: '✨' /* (*) */ },
    style: { Cartoon: '🎨', Cinematic: '🎬', Anime: '🌸', Realistic: '📷' },
    time: { Day: '☀️', Night: '🌙' /* (*) no Day/Night in the mock */ }
  };
  function lbChip(group, key){
    return '<span class="lb-chip">' + ((LB_EMOJI[group] && LB_EMOJI[group][key]) || '✨') + '</span>';
  }

  // ===================================================================
  // Auto-advance (mock behavior, founder round 4 extended it to Style):
  // on a single-select step with NO secondary field — Mood and Style —
  // tapping an option row advances ~260ms later — long enough for the
  // pink selected state to visibly register, short enough to feel
  // instant. Explicitly NOT wired to: multi-select Subject rows (Continue
  // advances, per founder round 3); any "+ Something else" row (the user
  // is about to type — mock round 2); and — since founder 08-08 —
  // Setting and Action, because each carries a SECOND choice on the same
  // screen (Setting has Day/Night, Action has the POV toggle) that a tap-
  // to-advance would skip past before the visitor could reach it, so those
  // two now require Continue like Subject. Day/Night, the POV switch, and
  // the "+N more" expander were never advance triggers.
  //
  // The timer is single-flight and step-scoped: a second tap re-arms it
  // (still exactly one advance), and BOTH manual navigation paths cancel
  // it first — next() (so a Continue tap inside the window can't
  // double-advance) and the Back handler (so an advance armed on a step
  // the user just left can never fire into the wrong screen). The
  // stepAtArm re-check inside the callback is belt-and-suspenders for
  // any navigation path that bypassed those two cancels.
  //
  // Analytics-neutral by construction: it calls the SAME next() a
  // Continue tap always called — wizard_step_viewed still fires once per
  // render with the same step numbers.
  // ===================================================================
  var autoAdvanceTimer = null;
  function cancelAutoAdvance(){
    if(autoAdvanceTimer !== null){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  }
  function scheduleAutoAdvance(){
    cancelAutoAdvance();
    var stepAtArm = cur;
    autoAdvanceTimer = setTimeout(function(){
      autoAdvanceTimer = null;
      if(cur !== stepAtArm) return; // navigated away meanwhile — see doc comment
      next();
    }, 260);
  }

  // Already-signed-in visitors have no business in a PRE-signup wizard —
  // send them to the normal logged-in "New Dream" flow instead (create.html's
  // own chip wizard retrofit covers the same chip-first experience there).
  if(DreamStore.getCurrentUser()){
    // EXCEPT a funnel handoff carrying a built dream (?resume=1 + caption):
    // that visitor already has an account, so skip the signup wall and
    // GENERATE the carried dream directly (home.html?generate=1, the
    // signed-in generate path), persisting the same caption+style draft the
    // logged-out funnel arrival persists — instead of bouncing to
    // create.html's fresh builder and LOSING the dream (founder repro,
    // tracker item for-product-life-origin-generate-handoff-founder-repro-
    // 8yc4wm follow-up). Any other signed-in visitor still goes to the
    // normal logged-in New Dream flow (create.html) as before.
    var signedInFunnelCaption = (getParam('resume') === '1') ? (getParam('caption') || '') : '';
    if(signedInFunnelCaption.trim()){
      DreamStore.clearDraft();
      DreamStore.setDraft({ caption: signedInFunnelCaption, style: getParam('style') || null, sourceDreamId: null });
      location.href = 'home.html?generate=1';
      return;
    }
    location.href = 'create.html';
    return;
  }

  // Returning-but-currently-logged-out entry guard (tracker item
  // for-product-life-origin-generate-handoff-founder-repro-8yc4wm, founder
  // repro on dreamtube.life: logging out then "revisiting the site" landed
  // straight on this wizard's first question, "Who's the dream about?",
  // with no welcome/choice screen shown first — against docs/
  // JOURNEY_MANIFEST.md's own Journey 2, where index.html's welcome
  // screen always comes first). This wizard is purpose-built for a
  // GENUINELY brand-new visitor (docs/JOURNEY_MANIFEST.md: "organic/
  // direct visitors ... go straight into the pre-signup wizard.html
  // dream-builder") — it has no concept of "resume" at all (`cur` above
  // always starts at 0, DreamStore.clearDraft() below wipes any leftover
  // draft unconditionally), so it was never vulnerable to resuming
  // MID-funnel. The actual gap: DreamStore.hasLocalAccountHistory() (see
  // that function's own doc comment) can be true here even while nobody
  // is currently signed in — state.accounts survives logout() by design,
  // so this exact browser/origin may already hold a real account from
  // earlier in this same session (signed up, used the app, then logged
  // out — precisely dreamtube.life's first-ever-on-this-origin scenario).
  // Landing THAT visitor in a flow built to sign up a stranger, with no
  // link back to logging into their real account anywhere on it, is a
  // real, lossy entry-routing bug regardless of how they physically got
  // here (a bookmark, browser history/autocomplete, or an old Add-to-
  // Home-Screen shortcut from before they had an account all reach this
  // same URL) — bounced back to index.html instead, whose "Already have
  // an account? Log in" link is the correct next step for them.
  //
  // ROUND 2 FIX (tracker item for-product-urgent-founder-repro-index-g-
  // c6boa9, founder repro: on dreamtube1.netlify.app, a returning-logged-
  // out visitor's own explicit "Get Started" click on index.html bounced
  // straight back to index.html again — reading as a broken loop). The
  // guard above was unconditional, so it fired even when the visitor had
  // JUST seen index.html's own "Already have an account? Log in" link and
  // deliberately chose Get Started anyway (maybe they want a fresh
  // account on a shared device, maybe they don't remember the old
  // password and would rather not deal with it right now) — that's an
  // informed choice this guard has no business overriding a second time.
  // index.html's Get Started link now marks itself with ?entry=index; the
  // guard only fires on its ABSENCE — i.e. still catches a direct/
  // bookmarked/history hit straight to this URL (no marker), but an
  // explicit click-through from index.html always proceeds. A genuinely
  // first-time visitor (hasLocalAccountHistory() false) is unaffected
  // either way, exactly as docs/JOURNEY_MANIFEST.md documents.
  var cameFromIndexGetStarted = new URLSearchParams(location.search).get('entry') === 'index';
  // Funnel-arrival exemption (wall routing, 2026-08-08): a ?resume=1
  // arrival CARRYING A BUILT DREAM (caption param) is the growth funnel's
  // handoff — the flo arm routes here now instead of start.html's old
  // screen 13 (founder: funnel arrivals must land on THIS approved
  // Layout-B wall). Like ?entry=index, it's an explicit, informed journey
  // — bouncing it to index.html would throw away a fully built dream
  // (start.html's own resume leg never had this guard either). Same
  // reasoning exempts it from the local-account-history bounce below.
  var isFunnelHandoffArrival = getParam('resume') === '1' && !!getParam('caption');
  if(!cameFromIndexGetStarted && !isFunnelHandoffArrival && DreamStore.hasLocalAccountHistory()){ location.href = 'index.html'; return; }
  if(cameFromIndexGetStarted){
    var __cleanParams = new URLSearchParams(location.search);
    __cleanParams.delete('entry');
    var __cleanQs = __cleanParams.toString();
    history.replaceState(null, '', location.pathname + (__cleanQs ? '?' + __cleanQs : ''));
  }

  DreamStore.clearDraft();

  // ===================================================================
  // Character staging — identical pattern to start.html's own pre-signup
  // character staging (see that file's head-of-file comment for the full
  // rationale: DreamStore.saveCharacter requires a logged-in user, but
  // signup doesn't happen until Step 7 here). Characters are staged
  // locally and flushed into real DreamStore characters the moment signup
  // succeeds, via flushStagedCharactersToStore below.
  // ===================================================================
  var staged = { characters: [], subjectCharacterIds: [] };
  var charEditingId = null;
  var charSubMode = 'describe';
  var charPendingPhotoDataUrl = null;
  // Bumped on every open AND every close (see openCharSheet/closeCharSheet
  // below) so a pending resizeImageFile call started by one sheet
  // "instance" can tell, once it resolves, whether it's still talking
  // about the instance that's still on screen. Same pattern as create.html/
  // profile.html's charSheetToken/identitySheetToken — see the photo-input
  // change handler (inside renderSubject below), the only reader of this
  // token.
  var charSheetToken = 0;

  // Non-character subject state ("A stranger" / "An animal or creature" /
  // "No people" / "+ Something else"). Multi-select model (see this file's
  // own design note below renderSubject) -- staged.subjectCharacterIds
  // (any number of staged characters) and subjectOtherKind (at most ONE of
  // these four, still single-select among themselves) compose TOGETHER,
  // resolved into WizardChips.assembleCaption's `subjects` array input at
  // hand-off time (see currentChipFields below).
  var subjectOtherKind = null; // 'stranger' | 'animal' | 'none' | 'other' | null -- single-select among these four only
  var subjectOtherText = '';

  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function localSaveCharacter(patch){
    var name = (patch.name || '').trim();
    var description = (patch.description || '').trim();
    var isSelf = !!patch.isSelf;
    var photoDataUrl = (isSelf && patch.photoDataUrl) ? patch.photoDataUrl : null;
    if(!isSelf && !name) return { ok:false, error:'Give this character a name.' };
    if(!description && !photoDataUrl) return { ok:false, error: isSelf ? 'Add a description or a photo.' : 'Add a short description.' };
    var existing = patch.id ? staged.characters.filter(function(c){ return c.id === patch.id; })[0] : null;
    if(!existing && isSelf) existing = staged.characters.filter(function(c){ return c.isSelf; })[0] || null;
    if(existing){
      existing.name = name;
      existing.description = description;
      if(isSelf) existing.photoDataUrl = photoDataUrl; else delete existing.photoDataUrl;
      return { ok:true, character: existing };
    }
    var character = { id: 'local' + Math.random().toString(36).slice(2, 9), name: name, isSelf: isSelf, description: description };
    if(isSelf && photoDataUrl) character.photoDataUrl = photoDataUrl;
    staged.characters.push(character);
    return { ok:true, character: character };
  }
  function localDeleteCharacter(id){
    staged.characters = staged.characters.filter(function(c){ return c.id !== id; });
    var idx = staged.subjectCharacterIds.indexOf(id);
    if(idx !== -1) staged.subjectCharacterIds.splice(idx, 1);
  }

  /**
   * Toggles a single character's selection independently of every other
   * currently-selected character or the separate subjectOtherKind chip --
   * tapping an already-selected chip deselects just that one; tapping an
   * unselected one adds it. See this file's own design note below
   * renderSubject for why this replaced the old single-active-subject model.
   */
  function toggleSubjectCharacter(id){
    var idx = staged.subjectCharacterIds.indexOf(id);
    if(idx === -1) staged.subjectCharacterIds.push(id); else staged.subjectCharacterIds.splice(idx, 1);
  }

  /**
   * Called once, right after a real signup or login succeeds (from
   * completeSignupAndAdvance, the wall's one shared continuation — see
   * that function below) — turns staged local characters into real
   * DreamStore characters and remaps every id in
   * staged.subjectCharacterIds (potentially more than one) onto its real
   * id. Returns the id map itself so the caller can also remap the
   * already-computed local ids it separately holds
   * (assembled.characterIdsForGeneration was computed before this flush
   * and still holds local ids until re-mapped with this).
   */
  function flushStagedCharactersToStore(){
    var idMap = {};
    staged.characters.forEach(function(c){
      // A detail-less inline "Me" (the Layout-B subject row can stage a
      // self character with no description and no photo — see
      // ensureStagedSelfCharacter's doc comment) has nothing for the
      // store to hold: DreamStore.saveCharacter would reject it anyway
      // ("Add a description or a photo."), and nothing downstream needs
      // it — its id never rides characterIdsForGeneration (only photo
      // characters do) and its caption phrase ('me') was already baked
      // in at assembly time. Skipped explicitly rather than fired-and-
      // failed. Every sheet-created character always has a description
      // or photo (the sheet's own validation), so this can only ever
      // skip that one inline shape.
      if(!(c.description || '').trim() && !c.photoDataUrl) return;
      var result = DreamStore.saveCharacter({ isSelf: c.isSelf, name: c.name, description: c.description, photoDataUrl: c.photoDataUrl || null });
      if(result.ok) idMap[c.id] = result.character.id;
    });
    staged.subjectCharacterIds = staged.subjectCharacterIds.map(function(id){ return idMap[id] || id; });
    return idMap;
  }

  function openCharSheet(mode, existing){
    charSheetToken++;
    charEditingId = existing ? existing.id : null;
    document.getElementById('char-sheet-title').textContent = mode === 'self'
      ? (existing ? 'Edit yourself' : 'Add yourself')
      : (existing ? 'Edit character' : 'Add a character');
    var nameInput = document.getElementById('char-name-input');
    nameInput.style.display = mode === 'self' ? 'none' : 'block';
    nameInput.value = existing ? existing.name : '';
    document.getElementById('char-desc-input').value = existing ? (existing.description || '') : '';
    document.getElementById('char-desc-input').dataset.mode = mode;
    // Self mode speaks to the person themselves ("you"), not about a
    // third party — round 8 put this sheet directly behind the Me row,
    // so the mismatched pronoun became founder-visible. Same copy
    // profile.html's own identity sheet uses.
    document.getElementById('char-desc-input').placeholder = mode === 'self' ? 'Describe how you look...' : 'Describe how they look...';
    document.getElementById('char-error').textContent = '';
    document.getElementById('char-delete-link').style.display = existing ? 'block' : 'none';
    document.getElementById('char-mode-row').style.display = mode === 'self' ? 'flex' : 'none';
    charPendingPhotoDataUrl = (mode === 'self' && existing && existing.photoDataUrl) ? existing.photoDataUrl : null;
    setCharSubMode(mode === 'self' && charPendingPhotoDataUrl ? 'photo' : 'describe');
    document.getElementById('sheet-character-overlay').classList.add('open');
  }
  function closeCharSheet(){
    charSheetToken++;
    document.getElementById('sheet-character-overlay').classList.remove('open');
  }
  function renderCharPhotoPreview(){
    var preview = document.getElementById('char-photo-preview');
    var removeLink = document.getElementById('char-photo-remove');
    if(charPendingPhotoDataUrl){
      preview.innerHTML = '<img src="' + charPendingPhotoDataUrl + '" alt="">';
      removeLink.style.display = 'block';
    } else {
      preview.innerHTML = '<div class="char-photo-empty">No photo yet</div>';
      removeLink.style.display = 'none';
    }
  }
  function setCharSubMode(mode){
    charSubMode = mode;
    Array.prototype.forEach.call(document.querySelectorAll('#char-mode-row .char-mode-btn'), function(b){
      b.classList.toggle('active', b.dataset.charMode === mode);
    });
    document.getElementById('char-desc-input').style.display = mode === 'describe' ? 'block' : 'none';
    document.getElementById('char-photo-area').style.display = mode === 'photo' ? 'block' : 'none';
    renderCharPhotoPreview();
  }

  // ===================================================================
  // Step 1 — Subject ("Who's the dream about?")
  //
  // DESIGN NOTE, round 2 (superseding the single-active-subject model
  // below) — tracker item for-product-wizard-characters-step-is-si-paxp07,
  // founder repro 2026-08-02: "in the wizard, choosing Me and then adding
  // another character (e.g. a stranger) UNCHECKS Me -- the step behaves as
  // one-choice when a dream can contain multiple characters (Me AND
  // someone known AND a stranger). Founder intent = multi-select." This is
  // an explicit, dated override of the judgment call made below when this
  // step first shipped — that call turned out to directly contradict how
  // the founder actually wants to use his own product, confirmed by a live
  // repro, not a hypothetical. The single-active-subject reasoning is left
  // in place (not deleted) immediately below for the historical record —
  // this codebase's own convention for a design that changed, per this
  // task's instructions — but it no longer describes current behavior.
  //
  // NEW MODEL: every staged character chip (Me + each "Someone I know")
  // toggles INDEPENDENTLY — tapping a selected chip deselects only that
  // one; any number can be selected at once (staged.subjectCharacterIds).
  // The four "other" chips (stranger/animal/none/other, #subject-other-row)
  // stay a SEPARATE single-select group among THEMSELVES (subjectOtherKind,
  // unchanged type/shape) — picking one still only ever has at most one of
  // those four active — but that group now COMPOSES with the multi-select
  // characters rather than being mutually exclusive with them. This exact
  // shape was chosen (not the alternative of also multi-selecting the
  // "other" row itself) because it's what the founder's own worked example
  // literally describes: "Me AND someone known AND a stranger" is TWO
  // staged characters (Me + someone known) selected together, PLUS "a
  // stranger" — itself one of the four "other" chips — picked ALONGSIDE
  // them as a third, additional element, not a fully-independent multi-
  // select applied to the other-chips row too (nothing in the founder's
  // wording implies wanting e.g. "a stranger" AND "an animal" AND "no
  // people" all active together, which still has no coherent combined
  // meaning — the same problem the superseded reasoning below correctly
  // identified, just scoped now to only that one row instead of the whole
  // step). See currentChipFields below for how this composes into
  // WizardChips.assembleCaption's new `subjects` array input, and that
  // module's own doc comment for why the array shape (vs. touching
  // assembleCaption's existing singular contract, still used unchanged by
  // create.html's own separate single-select "Build it" subject step) was
  // the less invasive of the two options this task flagged.
  //
  // ── Superseded reasoning (kept for the record, no longer current) ──
  // the spec calls this row "multi-select," but "A stranger" / "An animal
  // or creature" / "No people — just a place/thing" are semantically
  // mutually exclusive with each other AND with picking a real character
  // — there's no sound rule for combining, say, "No people" with a
  // selected character. This implements a single-active-subject model
  // instead: exactly one of {a selected character} or {one of the other
  // four chips} drives the assembled prompt's subject at a time. Tapping
  // "Someone I know" can still be used repeatedly to build up a reusable
  // roster of several saved characters (exactly like create.html today);
  // only ONE of them is picked as the active chip at a time, same
  // single-select semantics as the standalone chips.
  // ===================================================================
  function charChipDisplayName(c){ return c.name || (c.isSelf ? 'Me' : ''); }

  /**
   * The staged SELF character behind the "Me" row, created ON FIRST TAP
   * of that row with NO details at all — deliberately bypassing
   * localSaveCharacter's "add a description or a photo" validation.
   * That validation is the character SHEET's contract (its Save button
   * is an explicit "I'm done describing" act) and still guards every
   * sheet path unchanged; this inline path implements the founder's
   * 08-04 ruling (tracker items for-growth-founder-ruling-08-04-me-
   * someo-w8k8xr / for-product-paired-with-growth-funnel-pr-22o77k,
   * mock rounds 6-7): picking Me/Someone must never demand details —
   * the per-row detail input below is OPTIONAL and never blocks
   * Continue. A detail-less self character is handled everywhere
   * downstream: caption phrase resolves to plain 'me'
   * (subjectPhraseAndCharacterId), no id ever rides
   * characterIdsForGeneration (only photo characters do), and
   * flushStagedCharactersToStore skips it (see there).
   */
  function ensureStagedSelfCharacter(){
    var existing = staged.characters.filter(function(c){ return c.isSelf; })[0];
    if(existing) return existing;
    var character = { id: 'local' + Math.random().toString(36).slice(2, 9), name: '', isSelf: true, description: '' };
    staged.characters.push(character);
    return character;
  }

  // Layout-B character row — same .char-chip/.chip-check/.chip-edit-area
  // structure as always (see the shell <style>'s character-row comment),
  // with the row's emoji living inside .chip-check (the leading circle).
  // The hidden Icons.check stays in the DOM so nothing that addresses
  // .chip-check's internals ever finds it emptied.
  function charChipHTML(c, selected){
    return '<div class="char-chip' + (selected ? ' selected' : '') + '" data-char-select="' + c.id + '">' +
      '<span class="chip-check">' + (c.isSelf ? LB_EMOJI.subject.me : LB_EMOJI.subject.someone) + '<span class="icon">' + Icons.check + '</span></span>' +
      '<span class="chip-edit-area" data-char-edit="' + c.id + '">' +
        '<span>' + esc(charChipDisplayName(c)) + '</span>' +
        '<span class="chip-edit icon">' + Icons.pencil + '</span>' +
      '</span>' +
    '</div>';
  }

  /**
   * The OPTIONAL per-row detail input, rendered DIRECTLY below a
   * selected "Someone I know" row (founder mock round 7 — one input per
   * detail-worthy row, never pooled at the bottom of the list). NON-SELF
   * rows only since founder round 8: "Me" gets the full character SHEET
   * on selection instead (description + photo upload — see the subject
   * click handler below), so an inline Me input here would be dead,
   * duplicated UI. Wired straight to the staged character's
   * `description` — the exact field the character sheet edits and
   * flushStagedCharactersToStore persists into the real DreamStore
   * character at signup, so a detail typed here prefills Characters and
   * is NEVER re-asked later (the 08-04 ruling's other half, tracker item
   * for-product-paired-with-growth-funnel-pr-22o77k). The value is
   * populated programmatically after innerHTML (renderSubjectChips
   * below), not baked into a value="" attribute — esc() escapes markup,
   * not attribute quotes.
   */
  function charDetailRowHTML(c){
    return '<div class="lb-detail">' +
      '<input data-char-detail="' + c.id + '" placeholder="Optional: a few words about how they look — helps the video match" dir="auto">' +
    '</div>';
  }

  function renderSubjectChips(){
    var row = document.getElementById('subject-chip-row');
    if(!row) return;
    var hasSelf = staged.characters.some(function(c){ return c.isSelf; });
    var html = staged.characters.map(function(c){
      var selected = staged.subjectCharacterIds.indexOf(c.id) !== -1;
      // Selecting a "Someone I know" row reveals its own detail input
      // right under it; deselecting hides it again (the typed
      // description itself survives on the staged character either way).
      // Me rows get NO inline input — founder round 8, the sheet opens
      // for Me instead (see charDetailRowHTML's doc comment).
      return charChipHTML(c, selected) + (selected && !c.isSelf ? charDetailRowHTML(c) : '');
    }).join('');
    // The "Me" row, pre-staging: a NORMAL option row (not a dashed add
    // tile). Tapping it stages + selects the self character AND opens
    // the character sheet in self mode — founder round 8 ("opens nicely
    // for Someone i know but not for Me and it should including the
    // option to upload image"); see the click handler below. Adding a
    // "Someone I know" still goes through the character sheet (dashed
    // add row): unlike Me, a non-self character NEEDS a name (store
    // validation, caption assembly, the never-ask-twice prefill all key
    // on it), and the sheet is the machinery that collects one.
    if(!hasSelf) html += '<div class="char-chip" id="subj-me-row"><span class="chip-check">' + LB_EMOJI.subject.me + '<span class="icon">' + Icons.check + '</span></span><span>Me</span></div>';
    html += '<div class="char-chip-add" id="subj-add-other"><span class="lb-chip">' + LB_EMOJI.subject.someone + '</span> + Someone I know</div>';
    row.innerHTML = html;
    // Populate detail values quote-safely, post-innerHTML.
    Array.prototype.forEach.call(row.querySelectorAll('input[data-char-detail]'), function(inp){
      var c = staged.characters.filter(function(x){ return x.id === inp.dataset.charDetail; })[0];
      if(c) inp.value = c.description || '';
    });
    var meRow = document.getElementById('subj-me-row');
    if(meRow) meRow.addEventListener('click', function(){
      // Selection is immediate and UNCONDITIONAL (multi-select semantics
      // unchanged); the sheet opens ON TOP of it as the optional
      // describe/photo ask. Cancel just closes — Me stays selected with
      // no details, per the 08-04 "details optional, never block"
      // ruling; the sheet's own Save-side desc-or-photo validation is
      // untouched (Save is an explicit "I'm done describing" act).
      // Passed existing:null deliberately — this is an ADD ("Add
      // yourself" title, empty fields); localSaveCharacter's own
      // isSelf-fallback lookup updates the staged record on Save.
      var self = ensureStagedSelfCharacter();
      if(staged.subjectCharacterIds.indexOf(self.id) === -1) staged.subjectCharacterIds.push(self.id);
      renderSubjectChips();
      openCharSheet('self', null);
    });
    document.getElementById('subj-add-other').addEventListener('click', function(){ openCharSheet('other', null); });

    Array.prototype.forEach.call(document.querySelectorAll('#subject-other-row .fn-chip'), function(chipEl){
      chipEl.classList.toggle('sel', chipEl.dataset.subjOther === subjectOtherKind);
    });
    var otherReveal = document.getElementById('subject-other-reveal');
    if(otherReveal) otherReveal.style.display = subjectOtherKind === 'other' ? 'block' : 'none';
  }

  /** Focuses the given character's just-revealed detail input, if present (mock round 6's "opens the more-info option" beat — focus is a courtesy, never load-bearing). */
  function focusCharDetailInput(id){
    var inp = document.querySelector('#subject-chip-row input[data-char-detail="' + id + '"]');
    if(inp) inp.focus();
  }

  // Mounted ONCE, as a direct child of #app -- NOT rebuilt inside
  // renderSubject's own el.innerHTML (which used to embed this sheet's
  // markup directly inside #fnScreen, the funnel's own scrollable
  // internal region). That nesting was the real root cause behind a
  // review finding on tracker item
  // for-product-sheet-dismissal-app-wide-fix-rlay70 (round 1): a
  // position:absolute descendant of a scrolling, position:relative
  // ancestor (#fnScreen -- see its own .fn-screen{...position:relative;
  // overflow-y:auto...} rule) is positioned against THAT ancestor's own
  // scrollable content box, not the real viewport or even #app's own
  // (now correctly capped, see #app.funnel-app's height:100dvh above)
  // box -- so if #fnScreen ever scrolls for ANY reason (a real user
  // scroll, or the browser's own scroll-anchoring compensating for a
  // layout shift elsewhere on a long Subject screen), the sheet's
  // rendered position moves with it, independent of anything this
  // fix's own #app height cap can address. Confirmed via a real
  // Playwright repro: inflating #fnScreen's content and opening the
  // sheet left it rendered entirely off-screen (negative y), with
  // tap-outside unable to reach it at all.
  //
  // The fix matches how every other sheet in the app is structured
  // (result.html/profile.html/create.html/start.html/js/purchase-
  // sheet.js): always a direct child of #app itself, never nested
  // inside an inner scrolling sub-region. ensureCharSheetMounted()
  // below is the one-time mount + wire, matching js/purchase-sheet.js's
  // own ensureMounted() convention -- idempotent (checked via
  // charSheetMounted) since renderSubject (and so this call) can run
  // again on a later revisit to the Subject step (goToStep(0) via Back).
  var charSheetMounted = false;
  function ensureCharSheetMounted(){
    if(charSheetMounted) return;
    charSheetMounted = true;

    var wrap = document.createElement('div');
    wrap.className = 'sheet-overlay';
    wrap.id = 'sheet-character-overlay';
    wrap.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-title" id="char-sheet-title">Add a character</div>' +
        '<input class="fn-field" id="char-name-input" placeholder="Name (e.g. Mom, my friend Alex)" dir="auto">' +
        '<div class="char-mode-row" id="char-mode-row" style="display:none;">' +
          '<div class="char-mode-btn" data-char-mode="describe">Describe</div>' +
          '<div class="char-mode-btn" data-char-mode="photo">Upload photo</div>' +
        '</div>' +
        '<textarea class="fn-field" id="char-desc-input" placeholder="Describe how they look..." dir="auto" style="min-height:90px;"></textarea>' +
        '<div class="char-photo-area" id="char-photo-area" style="display:none;">' +
          '<div class="char-photo-preview" id="char-photo-preview"><div class="char-photo-empty">No photo yet</div></div>' +
          '<div class="char-photo-hint">' + "A photo of a child or teen can't be used for video generation — use Describe instead for them." + '</div>' +
          '<input type="file" accept="image/*" id="char-photo-input" style="display:none;">' +
          '<button type="button" class="btn btn-secondary btn-block" id="char-photo-pick-btn">Choose photo</button>' +
          '<span class="char-photo-remove" id="char-photo-remove" style="display:none;">Remove photo</span>' +
        '</div>' +
        '<div class="err-text" id="char-error"></div>' +
        '<button class="fn-btn-primary" id="char-save-btn" type="button">Save</button>' +
        '<div style="height:10px;"></div>' +
        '<span class="fn-small-link" id="char-cancel" style="cursor:pointer;">Cancel</span>' +
        '<div style="height:8px;"></div>' +
        '<span class="fn-small-link" id="char-delete-link" style="cursor:pointer; color:var(--danger); display:none;">Delete this character</span>' +
      '</div>';
    document.getElementById('app').appendChild(wrap);

    document.getElementById('char-mode-row').addEventListener('click', function(e){
      var btn = e.target.closest('.char-mode-btn');
      if(btn) setCharSubMode(btn.dataset.charMode);
    });
    document.getElementById('char-photo-pick-btn').addEventListener('click', function(){
      document.getElementById('char-photo-input').click();
    });
    document.getElementById('char-photo-input').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!file) return;
      document.getElementById('char-error').textContent = '';
      // resizeImageFile is a real multi-step async chain (FileReader ->
      // Image decode -> canvas draw), easily slow enough to race a Cancel-
      // then-reopen of this sheet -- including reopening for a DIFFERENT
      // character than the one being edited when the photo was picked.
      // Captured now and re-checked once it resolves -- without this, a
      // stale resize from a cancelled instance can resolve after reopen and
      // silently overwrite charPendingPhotoDataUrl/the preview with an
      // abandoned photo the user never confirmed for this instance.
      var tokenAtPick = charSheetToken;
      resizeImageFile(file, 768, 0.82).then(function(dataUrl){
        if(tokenAtPick !== charSheetToken) return;
        charPendingPhotoDataUrl = dataUrl;
        renderCharPhotoPreview();
      }).catch(function(){
        if(tokenAtPick !== charSheetToken) return;
        document.getElementById('char-error').textContent = "Couldn't read that photo — try a different image.";
      });
    });
    document.getElementById('char-photo-remove').addEventListener('click', function(){
      charPendingPhotoDataUrl = null;
      renderCharPhotoPreview();
    });
    document.getElementById('char-cancel').addEventListener('click', closeCharSheet);
    SheetDismiss.wire(document.getElementById('sheet-character-overlay'), closeCharSheet);
    document.getElementById('char-save-btn').addEventListener('click', function(){
      var mode = document.getElementById('char-desc-input').dataset.mode;
      var usingPhoto = mode === 'self' && charSubMode === 'photo';
      var result = localSaveCharacter({
        id: charEditingId,
        isSelf: mode === 'self',
        name: document.getElementById('char-name-input').value,
        description: usingPhoto ? '' : document.getElementById('char-desc-input').value,
        photoDataUrl: usingPhoto ? charPendingPhotoDataUrl : null
      });
      if(!result.ok){
        document.getElementById('char-error').textContent = result.error;
        return;
      }
      // Saving (whether adding a brand-new character or editing an
      // existing one) ensures that character ends up selected -- ADDING to
      // the multi-select set (never clearing subjectOtherKind or any other
      // already-selected character) rather than replacing whatever else
      // was selected, matching the new toggle model above.
      if(staged.subjectCharacterIds.indexOf(result.character.id) === -1) staged.subjectCharacterIds.push(result.character.id);
      closeCharSheet();
      renderSubjectChips();
    });
    document.getElementById('char-delete-link').addEventListener('click', function(){
      if(!charEditingId) return;
      if(!confirm('Delete this character?')) return;
      localDeleteCharacter(charEditingId);
      closeCharSheet();
      renderSubjectChips();
    });
  }

  function renderSubject(el){
    // Headline/sub: the founder's own mock copy for this step (round 3's
    // multi-select ask made the "more than one is fine" sub load-bearing
    // guidance, not decoration). Chip LABELS below stay WizardChips' real
    // ones — shared data with create.html's Build-it, not page copy.
    el.innerHTML =
      '<div class="fn-headline">Who was in the dream?</div>' +
      '<div class="fn-body-copy">Pick everyone who was there — more than one is fine.</div>' +
      '<div class="char-chip-row" id="subject-chip-row"></div>' +
      '<div class="fn-chip-row" id="subject-other-row">' +
        '<span class="fn-chip" data-subj-other="stranger">' + lbChip('subject', 'stranger') + 'A stranger</span>' +
        '<span class="fn-chip" data-subj-other="animal">' + lbChip('subject', 'animal') + 'An animal or creature</span>' +
        '<span class="fn-chip" data-subj-other="none">' + lbChip('subject', 'none') + 'No people — just a place/thing</span>' +
        '<span class="fn-chip lb-ghost" data-subj-other="other">' + lbChip('subject', 'other') + '+ Something else</span>' +
      '</div>' +
      '<div class="fn-other-reveal" id="subject-other-reveal" style="display:none;">' +
        '<input class="fn-field" id="subject-other-input" placeholder="Who (or what) is this dream about?" dir="auto">' +
      '</div>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary lb-cta" id="fn-subject-continue" type="button">Continue</button>' +
      '<span class="fn-small-link" id="fn-subject-skip" style="cursor:pointer;">Skip</span>';

    ensureCharSheetMounted();

    document.getElementById('subject-chip-row').addEventListener('click', function(e){
      var editTarget = e.target.closest('[data-char-edit]');
      if(editTarget){
        var c = staged.characters.filter(function(x){ return x.id === editTarget.dataset.charEdit; })[0];
        if(c) openCharSheet(c.isSelf ? 'self' : 'other', c);
        return;
      }
      var chip = e.target.closest('[data-char-select]');
      if(!chip) return;
      var id = chip.dataset.charSelect;
      var wasSelected = staged.subjectCharacterIds.indexOf(id) !== -1;
      toggleSubjectCharacter(id);
      renderSubjectChips();
      if(!wasSelected){
        var c = staged.characters.filter(function(x){ return x.id === id; })[0];
        if(c && c.isSelf && !(c.description || '').trim() && !c.photoDataUrl){
          // Re-selecting a Me that still has no details re-offers the
          // sheet (founder round 8) — same optional ask as the first
          // tap; a Me that already has a description/photo just toggles,
          // details are edited via the pencil.
          openCharSheet('self', null);
        } else if(c && !c.isSelf){
          // Freshly selecting a Someone row reveals its detail input —
          // hand it focus (mock round 6).
          focusCharDetailInput(id);
        }
      }
    });
    // The per-row detail inputs live inside the re-rendered chip row, so
    // their typing is captured via ONE delegated listener here (attached
    // once per step render, surviving every renderSubjectChips rebuild)
    // rather than per-input handlers. Writes go straight onto the staged
    // character's description — no re-render on keystroke, or the input
    // would lose focus mid-word.
    document.getElementById('subject-chip-row').addEventListener('input', function(e){
      var inp = e.target.closest('input[data-char-detail]');
      if(!inp) return;
      var c = staged.characters.filter(function(x){ return x.id === inp.dataset.charDetail; })[0];
      if(c) c.description = inp.value;
    });
    document.getElementById('subject-other-row').addEventListener('click', function(e){
      var chip = e.target.closest('.fn-chip');
      if(!chip) return;
      // Single-select among these four ONLY -- deliberately does NOT touch
      // staged.subjectCharacterIds, so any already-selected character chips
      // stay selected (composes with them, see this file's design note
      // above renderSubject).
      subjectOtherKind = subjectOtherKind === chip.dataset.subjOther ? null : chip.dataset.subjOther;
      renderSubjectChips();
      if(subjectOtherKind === 'other') document.getElementById('subject-other-input').focus();
    });
    document.getElementById('subject-other-input').addEventListener('input', function(e){
      subjectOtherText = e.target.value;
    });
    if(subjectOtherText) document.getElementById('subject-other-input').value = subjectOtherText;

    renderSubjectChips();
    document.getElementById('fn-subject-continue').addEventListener('click', next);
    document.getElementById('fn-subject-skip').addEventListener('click', next);
  }

  // ===================================================================
  // Setting ("Where") — REMOVED as a question by the question-first trim
  // (mirrors the growth funnel). The place is now INFERRED per action
  // (WizardChips.inferFallbackPlaceKey) and baked into the caption by
  // assembleCaption, exactly as a skipped Setting step always fell back.
  // These two vars are KEPT because the state they hold still flows
  // through: the generation payload's sceneryPlace (honestly null — the
  // visitor never chose a scenery place) and currentChipFields' inference
  // input. settingPlaceKey stays null and
  // settingOtherText stays '' now that no UI writes them; the caption's
  // scene comes entirely from the per-action inference below.
  // ===================================================================
  var settingPlaceKey = null;
  var settingOtherText = '';

  // ===================================================================
  // Step 3 — Action ("What's happening?") — required, no skip. Default
  // pre-highlighted to "Flying/floating" per the spec.
  // ===================================================================
  var actionKey = WizardChips.DEFAULT_ACTION;
  var actionOtherText = '';
  var povOn = false;
  // Persists across re-renders of this step (back/forward through the
  // wizard) once the visitor has tapped "+N more" -- see tracker item
  // for-product-wizard-step-3-has-too-many-c-lrg1ct. Starts collapsed.
  var actionExpanded = false;

  function renderAction(el){
    var defaultKeys = WizardChips.ACTION_DEFAULT_VISIBLE_KEYS;
    var defaultChips = WizardChips.ACTION_CHIPS.filter(function(c){ return defaultKeys.indexOf(c.key) !== -1; });
    var moreChips = WizardChips.ACTION_CHIPS.filter(function(c){ return defaultKeys.indexOf(c.key) === -1; });
    // If the currently-selected chip lives behind the expander (can only
    // happen via back-navigation after picking one pre-expand), force it
    // open so the active selection is never hidden from view.
    var expanded = actionExpanded || moreChips.some(function(c){ return c.key === actionKey; });

    function chipHtml(c){
      return '<span class="fn-chip' + (c.key === 'other' ? ' lb-ghost' : '') + '" data-action="' + c.key + '">' + lbChip('action', c.key) + esc(c.label) + '</span>';
    }
    var chipsHtml = defaultChips.map(chipHtml).join('');
    if(moreChips.length){
      chipsHtml += expanded
        ? moreChips.map(chipHtml).join('') +
          '<span class="fn-chip-more" id="action-more-toggle" role="button" tabindex="0" aria-expanded="true">Show less</span>'
        : '<span class="fn-chip-more" id="action-more-toggle" role="button" tabindex="0" aria-expanded="false">+' + moreChips.length + ' more</span>';
    }
    el.innerHTML =
      '<div class="fn-headline">What was happening?</div>' +
      '<div style="height:8px"></div>' +
      '<div class="fn-chip-row" id="action-row">' + chipsHtml + '</div>' +
      '<div class="fn-other-reveal" id="action-other-reveal" style="display:none;">' +
        '<input class="fn-field" id="action-other-input" placeholder="What happens?" dir="auto">' +
      '</div>' +
      // POV is a SECONDARY choice on this screen, not one of the action
      // pills. Its own labeled "Point of view" section + on/off switch set
      // it clearly apart (founder 08-08: "not clear this is a separate
      // field — have a toggle for on/off"). Layout/interaction only — the
      // povOn state and how it feeds generation are unchanged.
      '<div class="fn-mini-label" id="pov-label" style="margin-top:16px;">Point of view</div>' +
      '<label class="fn-toggle-row" id="pov-row">' +
        '<span>See it through their eyes (POV)</span>' +
        '<span class="fn-switch"><input type="checkbox" id="pov-toggle"><span class="fn-switch-track"></span></span>' +
      '</label>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary lb-cta" id="fn-action-continue" type="button">Continue</button>';

    function renderChips(){
      Array.prototype.forEach.call(document.querySelectorAll('#action-row .fn-chip'), function(chipEl){
        chipEl.classList.toggle('sel', chipEl.dataset.action === actionKey);
      });
      document.getElementById('action-other-reveal').style.display = actionKey === 'other' ? 'block' : 'none';
    }
    document.getElementById('action-row').addEventListener('click', function(e){
      var chip = e.target.closest('.fn-chip');
      if(!chip) return;
      actionKey = chip.dataset.action; // single-select, required -- no deselect-to-null
      renderChips();
      // This step carries a SECOND choice on the same screen — the POV
      // toggle below — so an action tap must NOT auto-advance (founder
      // 08-08 hit the same skip problem as the setting step). An action
      // tap only SELECTS; Continue is the only way forward.
      if(actionKey === 'other'){
        document.getElementById('action-other-input').focus();
      }
    });
    document.getElementById('action-other-input').addEventListener('input', function(e){ actionOtherText = e.target.value; });
    if(actionOtherText) document.getElementById('action-other-input').value = actionOtherText;

    var moreToggle = document.getElementById('action-more-toggle');
    if(moreToggle){
      moreToggle.addEventListener('click', function(){
        actionExpanded = !expanded;
        renderAction(el);
      });
      moreToggle.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); moreToggle.click(); }
      });
    }

    var povInput = document.getElementById('pov-toggle');
    povInput.checked = povOn;
    povInput.addEventListener('change', function(){
      povOn = povInput.checked;
    });

    renderChips();
    document.getElementById('fn-action-continue').addEventListener('click', next);
  }

  // ===================================================================
  // Mood ("How did the dream feel?") — REMOVED as a question by the
  // question-first trim (mirrors the growth funnel). The mood is now
  // INFERRED: moodKey stays at DEFAULT_MOOD ('dreamy'), so assembleCaption
  // bakes the default dreamy mood + hazy-ethereal lighting into the caption
  // exactly as before, and the deterministic story reads "…feeling dreamy
  // and surreal." No UI writes these vars now, so moodOtherText stays ''.
  //
  // moodSkipped defaults to TRUE: the visitor never CHOSE a mood, so — for
  // music-bed purposes only — currentMoodForDream() persists null (the
  // visual-style bed applies), the same honest answer a tapped Skip always
  // produced. This is STORAGE only; prompt/story assembly reads raw moodKey
  // and is unchanged. These vars are kept for the payload and
  // currentChipFields' inference input.
  // ===================================================================
  var moodKey = WizardChips.DEFAULT_MOOD;
  var moodOtherText = '';
  var moodSkipped = true; // inferred, never chosen → persist null mood (visual-style music bed)

  /**
   * The value to persist as this dream's `mood` — read LIVE at the moment
   * it's needed (see WizardChips.persistedMood). With the Mood step gone
   * this always returns null (moodSkipped is true), matching create.html's
   * buildMoodSkipped contract for a declined mood.
   */
  function currentMoodForDream(){
    return WizardChips.persistedMood(moodKey, moodSkipped);
  }

  // ===================================================================
  // Step 5 — Style ("Pick your dream's style") — Layout-B pill rows,
  // auto-advancing on pick like every other single-select step (founder
  // mock round 4). This REPLACED the embedded style.html .style-card
  // grid ON THIS WIZARD ONLY — style.html itself still uses its cards
  // for the logged-in flow, untouched. The rows render in the mock's own
  // order (Cartoon/Cinematic/Anime/Realistic) as pure presentation;
  // WizardChips.STYLE_CHIPS (shared data, other consumers) is unchanged
  // and chosenStyle still defaults to Cinematic exactly as before, so a
  // Skip yields the same style it always did. #style-grid keeps its id
  // and the rows keep data-style, so existing wiring/tests address the
  // same elements.
  // ===================================================================
  var chosenStyle = WizardChips.DEFAULT_STYLE;
  var LB_STYLE_ORDER = ['Cartoon', 'Cinematic', 'Anime', 'Realistic']; // mock presentation order — every entry must exist in STYLE_CHIPS

  function renderStyleStep(el){
    var rows = LB_STYLE_ORDER.map(function(name){
      return '<span class="fn-chip" data-style="' + name + '">' + lbChip('style', name) + name + '</span>';
    }).join('');
    el.innerHTML =
      '<div class="fn-headline">Pick your dream’s style</div>' +
      '<div style="height:8px"></div>' +
      '<div class="fn-chip-row" id="style-grid">' + rows + '</div>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary lb-cta" id="fn-style-continue" type="button">Continue</button>' +
      '<span class="fn-small-link" id="fn-style-skip" style="cursor:pointer;">Skip</span>';

    function renderSelection(){
      Array.prototype.forEach.call(document.querySelectorAll('#style-grid .fn-chip'), function(row){
        row.classList.toggle('sel', row.dataset.style === chosenStyle);
      });
    }
    document.getElementById('style-grid').addEventListener('click', function(e){
      var row = e.target.closest('.fn-chip');
      if(!row) return;
      chosenStyle = row.dataset.style;
      renderSelection();
      scheduleAutoAdvance();
    });
    renderSelection();
    document.getElementById('fn-style-continue').addEventListener('click', next);
    document.getElementById('fn-style-skip').addEventListener('click', next);
  }

  // ===================================================================
  // Step 6 (optional) — the demoted free-text escape hatch.
  // ===================================================================
  var freeText = '';
  function renderFreeText(el){
    el.innerHTML =
      '<div class="fn-headline">Anything to add?</div>' +
      '<div class="fn-body-copy">A few extra words — totally optional.</div>' +
      '<textarea class="fn-field" id="free-text-input" placeholder="Anything else about your dream..." dir="auto" style="min-height:110px;"></textarea>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary lb-cta" id="fn-freetext-continue" type="button">Looks good →</button>' +
      '<span class="fn-small-link" id="fn-freetext-skip" style="cursor:pointer;">Skip</span>';
    var input = document.getElementById('free-text-input');
    input.value = freeText;
    input.addEventListener('input', function(){ freeText = input.value; });
    document.getElementById('fn-freetext-continue').addEventListener('click', next);
    document.getElementById('fn-freetext-skip').addEventListener('click', next);
  }

  // ===================================================================
  // Recap — its OWN step before the wall (founder round 8, overruling
  // the earlier fold-onto-the-wall deviation: "No edit button and it was
  // supposed to be editable in a previous page"). The approved mock's
  // structure restored: "Here's your dream — make it yours", an
  // OBVIOUSLY-editable dream textarea (visible input styling + a pencil
  // affordance), "Edit anything before we bring it to life.", and a
  // "Looks good →" CTA into the wall. The data path is unchanged from
  // the folded-in version: computeStoryText populates currentStoryText
  // (deterministic first, opportunistic LLM upgrade after), typing pins
  // the visitor's own words (storyEditedByUser — hand-edits beat the
  // late rewrite, ride payload.storyText/draftPatch/
  // adoptPendingGeneration, and — round 9 — surviving ANY navigation
  // whose dream content is unchanged; the pin releases only when the
  // content signature differs, see storyContentSignature's release rule).
  //
  // ANALYTICS (kept byte-stable, per the same rule that shaped the
  // original fold-in): this step fires the new, sanctioned
  // wizard_recap_viewed {} instead of a wizard_step_viewed — see
  // STEP_ANALYTICS below for how every pre-existing step keeps its exact
  // historical step number (the wall stays step:7).
  // ===================================================================
  function renderRecap(el){
    assembleFromState(); // the rewrite call inside computeStoryText reads assembled.caption
    el.innerHTML =
      '<div class="fn-headline">Here’s your dream — make it yours</div>' +
      '<div class="fn-body-copy">Edit anything before we bring it to life.</div>' +
      // ph-no-capture: same session-replay exclusion create.html's
      // #dream-text carries — people edit genuinely personal dream
      // content here (maskAllInputs already masks it; this is the
      // explicit belt half of that).
      '<div class="lb-recap-wrap">' +
        '<textarea class="fn-field lb-recap-text ph-no-capture" id="fn-story-recap-text" dir="auto" aria-label="Your dream, editable"></textarea>' +
        '<span class="lb-recap-pencil icon" aria-hidden="true">' + Icons.pencil + '</span>' +
      '</div>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary lb-cta" id="fn-recap-continue" type="button">Looks good →</button>';

    // Editable-recap wiring: typing pins the visitor's own words as
