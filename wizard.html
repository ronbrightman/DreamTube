<!--
  Dream-builder wizard — chip-first, one-question-per-screen dream builder
  that replaces the old free-text "describe your dream" box for brand-new
  (pre-signup) visitors. See dreamtube-growth/WIZARD_SPEC.md for the full
  spec this implements (steps/copy/chips, prompt-assembly logic, the
  confirmed "build the dream first, sign up after" seam) and tracker items
  for-product-build-the-dream-builder-wiza-28did1 /
  for-product-generate-during-signup-aband-73jyud.

  SEAM/ROUTING JUDGMENT CALL (flagged, not silently decided): the spec's
  own tracker item left "confirm the funnel -> app seam" open. This file
  is a brand-new, self-contained pre-signup entry point in THIS repo,
  reachable from index.html's "Get Started" (changed to point here instead
  of the external dreamtube-growth funnel) — it does NOT touch or replace
  start.html, which keeps serving the existing external-growth-funnel
  ?resume=1 handoff completely unchanged (that funnel's own hook/quiz/
  dream-capture/style-picker screens live in the separate dreamtube-growth
  repo, out of scope for this build). See this branch's PR description /
  the build report for the full reasoning.

  FLOW (steps, one screen each, chip-first / zero required typing):
    0 Subject   ("Who's the dream about?")   — reuses the character sheet
    1 Setting   ("Where does it take place?") — reuses+widens scenery chips
    2 Action    ("What's happening?")         — NEW, required, no skip
    3 Mood      ("What's the mood?")          — NEW
    4 Style     ("Pick a look")               — reuses style.html's cards
    5 Free text (optional escape hatch)       — the demoted old textarea
    6 Contact capture (email + optional WhatsApp) — the retention pivot:
      "we'll email/message you your dream the moment it's ready," fired
      BEFORE the full signup gate. Kicks off generation in parallel
      (start-pending-generation.js) the instant this step completes.
    7 Signup    (username + password; email locked to what was captured)
      -> on success, adopts the already-running generation job
      (DreamStore.adoptPendingGeneration) and hands off straight to
      processing.html, which resumes polling it with ZERO changes needed
      there (it already checks DreamStore.getPendingJob() on load).

  Camera chips are deliberately NOT a step here (see WIZARD_SPEC.md:
  "demoted to inferred-not-asked") — js/wizard-chips.js infers camera +
  lighting from the Action/Mood/POV selections and bakes them directly
  into the assembled caption text (see that file's own doc comment for why
  this does NOT also pass characterIds through the description-bearing
  path, to avoid a doubled-up character description in the final prompt).
-->
</head>
<body>

<div id="app" class="funnel-app">
  <div class="fn-topbar">
    <button class="fn-back" id="fnBack" aria-label="Back" type="button"></button>
    <div class="fn-progress" id="fnProgress"></div>
    <div class="fn-topbar-spacer"></div>
  </div>
  <div class="fn-screen" id="fnScreen"></div>
</div>

<style>
  /* Same "dawn" light funnel shell as start.html, copied verbatim (see
     that file's own header comment for the full rationale) so this new
     pre-signup flow looks and feels like one continuous piece of product
     with the screens it hands off to, not a bolted-on new visual system. */
  #app.funnel-app{
    --dawn-1:#FBEFEA; --dawn-2:#E9EAF5; --dawn-3:#E3E9F7;
    --fn-ink:#3A3350; --fn-ink-soft:#6E6480; --fn-ink-faint:#9C93AC;
    --fn-card:#FFFFFF; --fn-line:rgba(58,51,80,0.10);
    --fn-accent-grad:linear-gradient(135deg,#B0A8DC,#9FC6E8 55%,#F3C08C);
    --fn-accent-solid:#7C82C4;
    --fn-font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    --fn-font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    background:linear-gradient(160deg,var(--dawn-1),var(--dawn-2) 55%,var(--dawn-3));
    font-family:var(--fn-font-body);
  }

  .fn-topbar{ display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 4px; flex:none;}
  .fn-back{ width:34px; height:34px; border-radius:50%; flex:none; cursor:pointer; background:var(--fn-card); border:1px solid var(--fn-line); color:var(--fn-ink); display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent;}
  .fn-back .icon, .fn-back svg{ width:15px; height:15px;}
  .fn-topbar-spacer{ width:34px; flex:none;}
  .fn-progress{ flex:1; display:flex; gap:4px;}
  .fn-progress i{ flex:1; height:3px; border-radius:3px; background:var(--fn-line); display:block;}
  .fn-progress i.done{ background:var(--fn-ink); opacity:.55;}
  .fn-progress i.now{ background:var(--fn-ink);}

  .fn-screen{ flex:1; display:flex; flex-direction:column; padding:18px 24px calc(24px + env(safe-area-inset-bottom,0px)); position:relative; overflow-y:auto; min-height:0; color:var(--fn-ink);}

  .fn-eyebrow{ font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--fn-ink-faint); margin-bottom:10px;}
  .fn-headline{ font-family:var(--fn-font-display); font-size:25px; font-weight:600; letter-spacing:-0.005em; line-height:1.25; text-wrap:balance; margin-bottom:10px; color:var(--fn-ink);}
  .fn-body-copy{ font-size:14.5px; color:var(--fn-ink-soft); line-height:1.55; margin-bottom:18px;}
  .fn-mini-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--fn-ink-faint); margin:14px 0 8px;}
  .fn-mini-label:first-child{ margin-top:0;}
  .fn-spacer{ flex:1;}

  .fn-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .fn-chip{ padding:9px 15px; border-radius:100px; background:var(--fn-card); border:1px solid var(--fn-line); font-size:13px; font-weight:700; color:#2C2846; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .fn-chip.sel{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}

  /* Character chips (Subject step) reuse create.html/start.html's exact
     .char-chip/.char-chip-add classes, light-themed to match this shell —
     see start.html's own identical override block for the same reasoning. */
  #app.funnel-app .char-chip{ background:var(--fn-card); border-color:var(--fn-line); color:#2C2846;}
  #app.funnel-app .char-chip .chip-check{ border-color:var(--fn-ink-faint);}
  #app.funnel-app .char-chip.selected{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-chip.selected .chip-check{ background:#fff; border-color:#fff;}
  #app.funnel-app .char-chip.selected .chip-check .icon{ opacity:1; color:var(--fn-accent-solid);}
  #app.funnel-app .char-chip .chip-edit{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-chip.selected .chip-edit{ color:#fff; opacity:.75;}
  #app.funnel-app .char-chip-add{ background:transparent; border:1px dashed var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-chip-add:hover{ border-color:var(--fn-accent-solid); color:var(--fn-ink);}
  #app.funnel-app .sheet{ background:var(--fn-card); color:#2C2846; border-top-color:var(--fn-line); box-shadow:0 -20px 50px rgba(58,51,80,.18);}
  #app.funnel-app .sheet-handle{ background:var(--fn-line);}
  #app.funnel-app .sheet-title{ color:#2C2846;}
  #app.funnel-app .char-mode-row .char-mode-btn{ background:#F3F1FA; border-color:var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-mode-row .char-mode-btn.active{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-photo-preview{ background:#F3F1FA; border-color:var(--fn-line);}
  #app.funnel-app .char-photo-empty{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-photo-hint{ color:var(--fn-ink-soft);}
  #app.funnel-app .btn-secondary{ background:transparent; border:1px solid var(--fn-line); color:var(--fn-ink);}
  #app.funnel-app .btn-secondary:hover{ background:#F3F1FA; border-color:var(--fn-ink-faint);}

  /* Style step (Step 5) reuses style.html's real .style-card/.sc-* classes
     from css/styles.css verbatim — same grid, same preview images. */
  #app.funnel-app .style-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}

  textarea.fn-field, input.fn-field{ background:var(--fn-card); border:1px solid var(--fn-line); border-radius:16px; padding:14px 15px; font-family:var(--fn-font-body); color:#2C2846; font-size:15px; width:100%; margin-bottom:12px; display:block;}
  textarea.fn-field{ resize:none; line-height:1.5;}
  textarea.fn-field::placeholder, input.fn-field::placeholder{ color:var(--fn-ink-faint);}
  textarea.fn-field:focus, input.fn-field:focus{ outline:2px solid var(--fn-accent-solid); border-color:transparent;}

  .fn-field-pw-wrap{ position:relative; margin-bottom:12px;}
  .fn-field-pw-wrap .fn-field{ margin-bottom:0; padding-right:46px;}
  .fn-field-pw-toggle{ position:absolute; right:4px; top:0; bottom:0; width:38px; background:none; border:none; color:var(--fn-ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fn-field-pw-toggle svg, .fn-field-pw-toggle .icon{ width:18px; height:18px;}

  .fn-err-text{ font-size:12.5px; color:#C4485B; min-height:16px; margin:2px 0 8px;}

  .fn-btn-primary{ background:var(--fn-accent-grad); color:#fff; font-weight:800; font-size:15.5px; border:none; border-radius:100px; padding:15px; text-align:center; width:100%; box-shadow:0 12px 26px -10px rgba(141,111,184,.5); cursor:pointer; font-family:var(--fn-font-body); -webkit-tap-highlight-color:transparent;}
  .fn-btn-primary:disabled{ opacity:.42; cursor:not-allowed; box-shadow:none;}
  .fn-small-link{ background:none; border:none; color:var(--fn-ink-soft); font-size:12.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; text-align:center; width:100%; padding:10px 0 0; cursor:pointer;}

  .fn-price-note{ font-size:12px; color:#6E6480; text-align:center; margin:2px 0 0;}

  /* "+ Something else" progressive-disclosure reveal (per the spec: a
     collapsed tap that reveals a small text input, not an always-visible
     box) — shared across every step that has one. */
  .fn-other-reveal{ margin:-6px 0 14px;}
  .fn-other-reveal input{ margin-bottom:0;}

  /* POV toggle (Action step) — a plain accessible checkbox styled as a
     switch, off by default per the spec. */
  .fn-toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:14px; background:var(--fn-card); border:1px solid var(--fn-line); margin-bottom:18px;}
  .fn-toggle-row span{ font-size:13.5px; font-weight:700; color:#2C2846;}
  .fn-switch{ position:relative; width:42px; height:24px; flex:none;}
  .fn-switch input{ opacity:0; width:0; height:0;}
  .fn-switch .fn-switch-track{ position:absolute; inset:0; background:var(--fn-line); border-radius:100px; transition:.15s; cursor:pointer;}
  .fn-switch .fn-switch-track:before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .fn-switch input:checked + .fn-switch-track{ background:var(--fn-accent-grad);}
  .fn-switch input:checked + .fn-switch-track:before{ transform:translateX(18px);}

  .fn-microcopy{ font-size:12.5px; color:var(--fn-ink-faint); margin:-8px 0 16px; line-height:1.5;}

  .fn-spin{ width:44px; height:44px; border-radius:50%; border:3px solid var(--fn-line); border-top-color:var(--fn-accent-solid); margin:0 auto 20px; animation:fnspin 1s linear infinite;}
  @keyframes fnspin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .fn-spin{ animation:none;} }
</style>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/wizard-chips.js"></script>
<script>
(function(){
  'use strict';

  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{ posthog.capture(name, props || {}); }catch(e){ /* analytics must never break the wizard */ }
    }
  }
  function esc(str){ var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  // Already-signed-in visitors have no business in a PRE-signup wizard —
  // send them to the normal logged-in "New Dream" flow instead (create.html's
  // own chip wizard retrofit covers the same chip-first experience there).
  if(DreamStore.getCurrentUser()){ location.href = 'create.html'; return; }

  DreamStore.clearDraft();

  // ===================================================================
  // Character staging — identical pattern to start.html's own pre-signup
  // character staging (see that file's head-of-file comment for the full
  // rationale: DreamStore.saveCharacter requires a logged-in user, but
  // signup doesn't happen until Step 7 here). Characters are staged
  // locally and flushed into real DreamStore characters the moment signup
  // succeeds, via flushStagedCharactersToStore below.
  // ===================================================================
  var staged = { characters: [], subjectCharacterId: null };
  var charEditingId = null;
  var charSubMode = 'describe';
  var charPendingPhotoDataUrl = null;
  // Bumped on every open AND every close (see openCharSheet/closeCharSheet
  // below) so a pending resizeImageFile call started by one sheet
  // "instance" can tell, once it resolves, whether it's still talking
  // about the instance that's still on screen. Same pattern as create.html/
  // profile.html's charSheetToken/identitySheetToken — see the photo-input
  // change handler (inside renderSubject below), the only reader of this
  // token.
  var charSheetToken = 0;

  // Non-character subject state ("A stranger" / "An animal or creature" /
  // "No people" / "+ Something else"). Single-active-subject model (see
  // this file's own design note below renderSubject) -- exactly ONE of
  // {a staged+selected character} OR {one of these} is "the" subject at a
  // time, resolved into WizardChips.assembleCaption's subjectKey/character/
  // subjectOtherText inputs at hand-off time.
  var subjectOtherKind = null; // 'stranger' | 'animal' | 'none' | 'other' | null
  var subjectOtherText = '';

  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function localSaveCharacter(patch){
    var name = (patch.name || '').trim();
    var description = (patch.description || '').trim();
    var isSelf = !!patch.isSelf;
    var photoDataUrl = (isSelf && patch.photoDataUrl) ? patch.photoDataUrl : null;
    if(!isSelf && !name) return { ok:false, error:'Give this character a name.' };
    if(!description && !photoDataUrl) return { ok:false, error: isSelf ? 'Add a description or a photo.' : 'Add a short description.' };
    var existing = patch.id ? staged.characters.filter(function(c){ return c.id === patch.id; })[0] : null;
    if(!existing && isSelf) existing = staged.characters.filter(function(c){ return c.isSelf; })[0] || null;
    if(existing){
      existing.name = name;
      existing.description = description;
      if(isSelf) existing.photoDataUrl = photoDataUrl; else delete existing.photoDataUrl;
      return { ok:true, character: existing };
    }
    var character = { id: 'local' + Math.random().toString(36).slice(2, 9), name: name, isSelf: isSelf, description: description };
    if(isSelf && photoDataUrl) character.photoDataUrl = photoDataUrl;
    staged.characters.push(character);
    return { ok:true, character: character };
  }
  function localDeleteCharacter(id){
    staged.characters = staged.characters.filter(function(c){ return c.id !== id; });
    if(staged.subjectCharacterId === id) staged.subjectCharacterId = null;
  }

  /** Called once, right after real signup succeeds — turns staged local characters into real DreamStore characters and remaps the chosen subject character onto its real id. */
  function flushStagedCharactersToStore(){
    var idMap = {};
    staged.characters.forEach(function(c){
      var result = DreamStore.saveCharacter({ isSelf: c.isSelf, name: c.name, description: c.description, photoDataUrl: c.photoDataUrl || null });
      if(result.ok) idMap[c.id] = result.character.id;
    });
    if(staged.subjectCharacterId && idMap[staged.subjectCharacterId]){
      staged.subjectCharacterId = idMap[staged.subjectCharacterId];
    }
  }

  function openCharSheet(mode, existing){
    charSheetToken++;
    charEditingId = existing ? existing.id : null;
    document.getElementById('char-sheet-title').textContent = mode === 'self'
      ? (existing ? 'Edit yourself' : 'Add yourself')
      : (existing ? 'Edit character' : 'Add a character');
    var nameInput = document.getElementById('char-name-input');
    nameInput.style.display = mode === 'self' ? 'none' : 'block';
    nameInput.value = existing ? existing.name : '';
    document.getElementById('char-desc-input').value = existing ? (existing.description || '') : '';
    document.getElementById('char-desc-input').dataset.mode = mode;
    document.getElementById('char-error').textContent = '';
    document.getElementById('char-delete-link').style.display = existing ? 'block' : 'none';
    document.getElementById('char-mode-row').style.display = mode === 'self' ? 'flex' : 'none';
    charPendingPhotoDataUrl = (mode === 'self' && existing && existing.photoDataUrl) ? existing.photoDataUrl : null;
    setCharSubMode(mode === 'self' && charPendingPhotoDataUrl ? 'photo' : 'describe');
    document.getElementById('sheet-character-overlay').classList.add('open');
  }
  function closeCharSheet(){
    charSheetToken++;
    document.getElementById('sheet-character-overlay').classList.remove('open');
  }
  function renderCharPhotoPreview(){
    var preview = document.getElementById('char-photo-preview');
    var removeLink = document.getElementById('char-photo-remove');
    if(charPendingPhotoDataUrl){
      preview.innerHTML = '<img src="' + charPendingPhotoDataUrl + '" alt="">';
      removeLink.style.display = 'block';
    } else {
      preview.innerHTML = '<div class="char-photo-empty">No photo yet</div>';
      removeLink.style.display = 'none';
    }
  }
  function setCharSubMode(mode){
    charSubMode = mode;
    Array.prototype.forEach.call(document.querySelectorAll('#char-mode-row .char-mode-btn'), function(b){
      b.classList.toggle('active', b.dataset.charMode === mode);
    });
    document.getElementById('char-desc-input').style.display = mode === 'describe' ? 'block' : 'none';
    document.getElementById('char-photo-area').style.display = mode === 'photo' ? 'block' : 'none';
    renderCharPhotoPreview();
  }

  // ===================================================================
  // Step 1 — Subject ("Who's the dream about?")
  //
  // DESIGN NOTE (judgment call, flagged per this task's own instruction):
  // the spec calls this row "multi-select," but "A stranger" / "An animal
  // or creature" / "No people — just a place/thing" are semantically
  // mutually exclusive with each other AND with picking a real character
  // — there's no sound rule for combining, say, "No people" with a
  // selected character. This implements a single-active-subject model
  // instead: exactly one of {a selected character} or {one of the other
  // four chips} drives the assembled prompt's subject at a time. Tapping
  // "Someone I know" can still be used repeatedly to build up a reusable
  // roster of several saved characters (exactly like create.html today);
  // only ONE of them is picked as the active chip at a time, same
  // single-select semantics as the standalone chips.
  // ===================================================================
  function charChipDisplayName(c){ return c.name || (c.isSelf ? 'Me' : ''); }
  function charChipHTML(c, selected){
    return '<div class="char-chip' + (selected ? ' selected' : '') + '" data-char-select="' + c.id + '">' +
      '<span class="chip-check"><span class="icon">' + Icons.check + '</span></span>' +

  // ===================================================================
  // Prompt assembly — resolves the current wizard state into a final
  // caption + which (if any) character id should ride along on the real
  // generation request. See js/wizard-chips.js for the algorithm itself.
  // ===================================================================
  var assembled = null; // { caption, characterIdsForGeneration }
  function assembleFromState(){
    var subjectKey = 'none';
    var character = null;
    if(staged.subjectCharacterId){
      character = staged.characters.filter(function(c){ return c.id === staged.subjectCharacterId; })[0] || null;

  // ===================================================================
  // Step 7 — Contact capture (the retention pivot). Email is required
  // (it's also the token-economy identity generate-video.js's E112 gate
  // keys on — see start-pending-generation.js); WhatsApp is optional.
  // Kicks off generation the moment this completes ("generate during
  // signup" — see start-pending-generation.js/dream-webhook.js).
  // ===================================================================
  var contactEmail = '';
  var contactWhatsapp = '';
  var pendingId = null;
  var pendingOperationName = null;
  var pendingStartedAt = null;
  var pendingStartFailed = false;
  // Snapshot (JSON, email-normalized) of the payload behind the last
  // successful start-pending-generation call, so Back-to-here + Continue
  // with nothing changed can skip re-POSTing instead of creating a
  // second real fal.ai charge + token spend and orphaning the first
  // pending record. Only ever written alongside pendingId on success —
  // see the Continue handler below for why that invariant is what makes
  // comparing against it (alone, without pendingStartFailed) safe.
  // See tracker item wizard-html-no-guard-against-resubmittin-n5b5k2.
  var lastPendingSubmissionKey = null;
  // Per-attempt token — same "an async callback's side effects aren't
  // scoped to the attempt that started them" pattern as start.html's own
  // pendingGenerationToken (see that file's doc comment, ~start.html:954).
  // Bumped on EVERY Continue click here, not just when a fresh POST
  // fires (unlike start.html's version): reverting to already-succeeded
  // content takes the synchronous skip path below with no new POST at
  // all, but it's still a newer attempt that must invalidate whatever's
  // still in flight from an abandoned edit in between. Guards
  // startPendingGeneration()'s WRITE to the pending* vars below — never
  // gates navigation (see pendingGenerationPromise's own comment for why
  // navigation is handled entirely separately now).
  var pendingGenerationToken = 0;
  // Review round 4: the topbar Back button (backBtn, ~line 1150) is
  // never disabled, including mid-fetch. The previous structure called
  // next() from INSIDE the fetch's .then()/.catch() -- so a user could
  // click Continue (fires the POST), then immediately click Back before
  // it landed, all without ever re-clicking Continue on Contact (no
  // token bump, since the token only bumps on a Continue click). The
  // settling response's next() = goToStep(cur + 1) then read `cur` LIVE
  // at settlement time, not the value from when the request fired --
  // silently force-navigating the user forward again from wherever
  // they'd since moved to, and DreamStore.setDraft(...) writing
  // whatever assembled.caption/chosenStyle happened to be NOW, which
  // might not even match what was actually POSTed. Same underlying
  // failure mode as the round 2/3 races (a stale async callback acting
  // on live shared state), reached via a path neither prior fix's token
  // check touched, because neither guarded navigation itself.
  //
  // Structural fix (matches start.html's own startPendingGeneration/
  // getOrStartPendingGeneration precedent, ~start.html:944-1026) rather
  // than another patch: startPendingGeneration()'s settlement below
  // ONLY ever writes pendingId/pendingOperationName/pendingStartedAt/
  // pendingStartFailed/lastPendingSubmissionKey (still token-guarded,
  // unchanged) -- it NEVER calls next() or DreamStore.setDraft(). The
  // Continue handler calls both of those ITSELF, synchronously, right
  // after firing the request (or right after the skip-guard's
  // synchronous branch) -- never waiting on the fetch. This removes the
  // whole "settlement drives navigation off live shared state" hazard
  // by construction: there is no longer any window where an in-flight
  // request's eventual settlement can navigate anyone anywhere, because
  // settlement never navigates, period. pendingGenerationPromise tracks
  // the latest fire so the Signup step (the only other place that reads
  // pendingId/pendingOperationName) can wait for it to settle before
  // reading them, exactly mirroring how start.html's own Signup screen
  // (screen 13, ~start.html:1159) awaits pendingPromise before its own
  // claim/adopt/next() -- see renderSignup below.
  var pendingGenerationPromise = Promise.resolve();

  function resolveCharactersForGeneration(){
    if(!assembled || !assembled.characterIdsForGeneration.length) return [];
    var id = assembled.characterIdsForGeneration[0];
    var c = staged.characters.filter(function(x){ return x.id === id; })[0];
    if(!c) return [];
    var resolved = { name: c.name, description: c.description, isSelf: !!c.isSelf };
    if(c.isSelf && c.photoDataUrl) resolved.photoDataUrl = c.photoDataUrl;
    return [resolved];
  }

  /**
   * Fires start-pending-generation.js and updates the pending* vars on
   * settlement -- but ONLY if `token` still matches pendingGenerationToken
   * (see that var's own comment); a mismatch means a newer attempt has
   * since become current, so this stale response is discarded rather
   * than clobbering it. Always resolves (never rejects) -- a failure
   * just leaves pendingStartFailed true. Deliberately does NOT navigate
   * or touch the draft -- see the Continue handler below, which
   * advances synchronously right after calling this, without waiting
   * for it to settle. Same shape as start.html's own
   * startPendingGeneration (~start.html:968).
   */
  function startPendingGeneration(submissionKey, comparisonKey, token){
    var startedAt = Date.now();
    return fetch('/.netlify/functions/start-pending-generation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: submissionKey
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(token !== pendingGenerationToken) return; // stale -- a newer attempt has since started, discard
      if(result.ok && result.data && result.data.pendingId){
        pendingId = result.data.pendingId;
        pendingOperationName = result.data.operationName;
        pendingStartedAt = startedAt;
        pendingStartFailed = false;
        lastPendingSubmissionKey = comparisonKey;
      } else {
        // Resilient fallback: generation just won't have a head start —
        // the normal fresh-generation path at processing.html (draft
        // caption/style are set synchronously by the caller regardless)
        // still works.
        pendingStartFailed = true;
      }
    }).catch(function(){
      if(token !== pendingGenerationToken) return;
      pendingStartFailed = true;
    });
  }

  function renderContact(el){
    assembleFromState();
    el.innerHTML =
      '<div class="fn-headline">Where should we send your dream?</div>' +
      '<div class="fn-microcopy">We’ll email you your dream the moment it’s ready — even if you don’t finish signing up.</div>' +
      '<input class="fn-field" id="contact-email" type="email" placeholder="you@email.com" autocomplete="email" dir="auto">' +
      '<span class="fn-small-link" id="contact-whatsapp-toggle" style="cursor:pointer; text-align:left; padding:0 0 10px;">+ Also send on WhatsApp</span>' +
      '<div id="contact-whatsapp-reveal" style="display:none;">' +
        '<input class="fn-field" id="contact-whatsapp" type="tel" placeholder="WhatsApp number (with country code)" autocomplete="tel" dir="auto">' +
      '</div>' +
      '<div class="fn-err-text" id="contact-error"></div>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary" id="fn-contact-continue" type="button">Continue</button>';

    document.getElementById('contact-email').value = contactEmail;
    document.getElementById('contact-whatsapp').value = contactWhatsapp;
    document.getElementById('contact-whatsapp-toggle').addEventListener('click', function(){
      var reveal = document.getElementById('contact-whatsapp-reveal');
      reveal.style.display = reveal.style.display === 'none' ? 'block' : 'none';
      if(reveal.style.display === 'block') document.getElementById('contact-whatsapp').focus();
    });

    var continueBtn = document.getElementById('fn-contact-continue');
    var errEl = document.getElementById('contact-error');
    continueBtn.addEventListener('click', function(){
      contactEmail = document.getElementById('contact-email').value.trim();
      contactWhatsapp = document.getElementById('contact-whatsapp').value.trim();
      errEl.textContent = '';
      if(!contactEmail || contactEmail.indexOf('@') === -1){ errEl.textContent = 'Enter a valid email address.'; return; }

      var characters = resolveCharactersForGeneration();
      var payload = {
        email: contactEmail, whatsapp: contactWhatsapp || null,
        caption: assembled.caption, style: chosenStyle,
        characters: characters, characterIdsForGeneration: assembled.characterIdsForGeneration,
        sceneryTime: DreamStore.getDraft().sceneryTime, sceneryPlace: settingPlaceKey
      };
      var submissionKey = JSON.stringify(payload);
      // Comparison-only key: normalizes email casing (mirrors the
      // server's entitlements.normalizeEmail) so retyping the same
      // address with different case isn't treated as a changed
      // submission and forced through an unnecessary resubmit. The
      // actual POST body above keeps the as-typed casing.
      var comparisonKey = JSON.stringify(Object.assign({}, payload, { email: contactEmail.toLowerCase() }));

      var draftPatch = { caption: assembled.caption, style: chosenStyle, characterIds: assembled.characterIdsForGeneration, sceneryTime: DreamStore.getDraft().sceneryTime, sceneryPlace: settingPlaceKey };

      // Marks this click as the new current attempt -- see
      // pendingGenerationToken's own comment above for why this is
      // bumped here, before either path below, rather than only when a
      // fresh POST actually fires.
      pendingGenerationToken++;
      var myToken = pendingGenerationToken;

      // Already have a successful in-flight generation for these exact
      // inputs — e.g. the user went forward to Signup and back to this
      // step, then hit Continue again without changing anything. Don't
      // re-POST: that would create a second real fal.ai charge + token
      // spend against the same email and orphan the first pending
      // record. Only resubmit if something the payload depends on
      // (email/whatsapp/dream details) actually changed.
      //
      // Deliberately NOT gated on pendingStartFailed: that flag only
      // reflects the outcome of the MOST RECENT POST, not whether THIS
      // content's submission succeeded. Example: content A succeeds
      // (pendingId=X, lastPendingSubmissionKey=A) -> user edits to B,
      // which fails transiently (pendingStartFailed=true, pendingId/
      // lastPendingSubmissionKey untouched, still X/A) -> user reverts
      // to A. comparisonKey now matches lastPendingSubmissionKey again
      // and pendingId (X) is still a valid, unclaimed job for it --
      // gating on the stale pendingStartFailed would force a needless
      // real re-POST/charge here. lastPendingSubmissionKey is ONLY ever
      // written alongside pendingId on a successful POST (see below), so
      // the equality check alone already proves pendingId is valid for
      // this exact content.
      if(pendingId && comparisonKey === lastPendingSubmissionKey){
        // Nothing new to wait for -- pendingId is already correct and
        // settled from an earlier completed attempt.
        pendingGenerationPromise = Promise.resolve();
        DreamStore.setDraft(draftPatch);
        next();
        return;
      }

      continueBtn.disabled = true;
      continueBtn.textContent = 'Starting your dream…';
      track('wizard_contact_captured', { has_whatsapp: !!contactWhatsapp });

      pendingGenerationPromise = startPendingGeneration(submissionKey, comparisonKey, myToken);

      // Advance immediately -- settlement (above, in startPendingGeneration)
      // only ever WRITES state, it never navigates. See
      // pendingGenerationPromise's own comment for the full "why": Back
      // is never disabled here, so waiting for this fetch before
      // advancing left a window where a since-abandoned attempt's async
      // callback could force-navigate the user off of live shared `cur`
      // state read at settlement time rather than fire time. Signup
      // (renderSignup below) is what actually needs pendingId/
      // pendingOperationName once they're ready -- it awaits
      // pendingGenerationPromise itself before reading them.
      DreamStore.setDraft(draftPatch);
      next();
    });
  }

  // ===================================================================
  // Step 8 — Signup (username + password; email locked to Step 7's
  // capture). On success: flush staged characters, adopt the in-flight
  // generation job (if the pre-signup start succeeded), best-effort mark
  // it claimed server-side, then hand off straight to processing.html.
  // ===================================================================
  // Per-attempt token — same unscoped-async-callback pattern as
  // pendingGenerationToken above, and start.html's own signupAttemptToken
  // (see that file's doc comment). attemptSignup() is a real
  // register-account.js network round trip (see js/store.js's
  // DreamStore.signup); its callback used to unconditionally act on
  // whatever it found once it settled -- write state AND navigate to
  // processing.html -- with no check that this was still the current
  // attempt. Repro (tracker item
  // wizard-html-start-html-signup-step-force-8wtk8h): click Signup
  // Continue (fires the real signup call), immediately click Back before
  // it resolves, edit Contact, resubmit, reach a SECOND, fresh Signup
  // screen -- the first, abandoned call's callback, once it finally
  // settles, would force-navigate the user away from wherever they
  // actually are and could adopt/claim the wrong pending job (reading
  // live pendingId/pendingOperationName/contactEmail/assembled at
  // settlement time instead of a fire-time snapshot).
  //
  // Unlike pendingGenerationToken (which only guards the WRITE, since
  // Contact-step navigation was restructured to never wait on that
  // fetch at all), this token gates the ENTIRE callback body -- both the
  // writes AND the navigation, INCLUDING the nested
  // pendingGenerationPromise.then(...) continuation below (which has its
  // own re-check, right at its top, since it settles asynchronously
  // AFTER this outer check already ran and could go stale in that gap).
  // Signup has no "safe to advance without waiting" skip case the way a
  // reused/already-succeeded Contact submission does: there is no real
  // account, and nothing safe to hand off to processing.html, until
  // DreamStore.signup itself actually resolves ok -- so navigation can
  // never be decoupled from this particular settlement the way
  // Contact's was.
  //
  // Bumped on TWO separate triggers, not just one: (1) every Signup
  // Continue click (below), so a genuinely new, competing attempt always
  // supersedes an older one still in flight; AND (2) every Back click
  // (see the navigation engine's backBtn listener, further down this
  // file), so simply navigating away from Signup -- without necessarily
  // starting a new attempt at all -- also invalidates whatever's still
  // in flight. Both triggers are required: an early version of this fix
  // only bumped on (1) and a regression test caught the gap -- sit on a
  // second, fresh Signup screen without resubmitting, and an abandoned
  // first attempt's late settlement would still force-navigate, because
  // nothing had bumped the token since attempt #1 fired it. Also paired
  // with disabling both continueBtn AND backBtn (defense-in-depth -- see
  // the click handler below) for the duration of the call, so in normal
  // (non-test) usage there is no UI path to trigger either case while an
  // attempt is still in flight in the first place.
  var signupAttemptToken = 0;
  function deriveUsernameBase(email){
    var local = (email.split('@')[0] || '').toLowerCase();
    var sanitized = local.replace(/[^a-z0-9]/g, '');
    if(sanitized.length < 3) sanitized = (sanitized + 'dreamer').slice(0, Math.max(3, sanitized.length + 4));
    return sanitized.slice(0, 20) || 'dreamer';
  }
  function attemptSignup(email, password, cb){
    var base = deriveUsernameBase(email);
    var attempts = 0;
    var MAX_ATTEMPTS = 8;
    function tryUsername(username){
      DreamStore.signup(username, password, email).then(function(result){
        if(result.ok){
          // Fired here, not in the caller's (possibly-later-stale)
          // signupAttemptToken-gated callback -- a real account genuinely
          // was created the moment result.ok is true, regardless of
          // whether THIS particular UI attempt later becomes superseded
          // by a Back+resubmit. Matches start.html's own tryUsername,
          // which fires its equivalent call at this same point for the
          // same reason (review round-2 non-blocking finding).
          fireMetaConversion('CompleteRegistration', { email: email });
          cb(true, null, false); return;
        }
        if(result.error === 'That username is already taken.' && attempts < MAX_ATTEMPTS){
          attempts++;
          tryUsername(base + Math.floor(1000 + Math.random() * 9000));
          return;
        }
        // result.superseded (js/store.js's own call-sequence guard --
        // see signupCallSeq's doc comment there) means THIS call was
        // never even the most-recently-STARTED signup() call by the time
        // its response landed, so js/store.js itself already declined to
        // touch state.user/state.accounts for it. Passed through to cb
        // as defense-in-depth alongside mySignupToken below -- in normal
        // (non-bypassed) usage this UI-level token already catches every
        // case the store-level guard would, but the store-level guard is
        // now the one actually protecting state.user regardless of
        // caller, per tracker item dreamstore-signup-commits-state-user-
        // unc-vv6rio.
        cb(false, result.error, !!result.superseded);
      });
    }
    tryUsername(base);
  }

  function renderSignup(el){
    el.innerHTML =
      '<div class="fn-headline">Create your account</div>' +
      // 290 mirrors lib/entitlements.js's real INITIAL_GRANT (retuned
      // 2026-07-24 alongside DAILY_GRANT_AMOUNT 100->10 — see
      // docs/IMAGE_GENERATION_SPEC.md §2b-revised). Hardcoded, not fetched
      // live: this screen renders before a real account exists, so there's
      // no logged-in DreamStore.getTokenStatus() call to make here (that
      // method needs state.user to be set at all — see js/store.js), and
      // INITIAL_GRANT itself is a private constant in entitlements.js,
      // never exposed via get-token-status.js's response shape
      // ({balance, nextGrantAt, dailyGrantAmount} only, no separate
      // "signup grant" field). If this constant changes again, this line
      // must be updated by hand, same as before this comment existed.
      '<div class="fn-body-copy">Free to start — 290 tokens on signup, no card needed.</div>' +
      '<input class="fn-field" id="fn-signup-email" type="email" value="' + esc(contactEmail) + '" disabled style="opacity:.7;">' +
      '<input class="fn-field" id="fn-username" placeholder="Choose a username" autocomplete="username" dir="auto">' +
      '<div class="fn-field-pw-wrap">' +
        '<input class="fn-field" id="fn-password" type="password" placeholder="Create a password" autocomplete="new-password">' +
        '<button type="button" class="fn-field-pw-toggle" id="fn-pw-toggle" tabindex="-1" aria-label="Show password"></button>' +
      '</div>' +
      '<div class="fn-err-text" id="fn-signup-error"></div>' +
      '<button class="fn-btn-primary" id="fn-signup-continue" type="button" style="margin-bottom:12px;">Continue</button>' +
      '<div class="fn-spacer"></div>';

    var pwToggle = document.getElementById('fn-pw-toggle');
    var pwInput = document.getElementById('fn-password');
    pwToggle.innerHTML = Icons.eye;
    pwToggle.addEventListener('click', function(){
      var showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      pwToggle.innerHTML = showing ? Icons.eye : Icons.eyeOff;
    });

    var continueBtn = document.getElementById('fn-signup-continue');
    var errEl = document.getElementById('fn-signup-error');
    continueBtn.addEventListener('click', function(){
      var username = document.getElementById('fn-username').value.trim();
      var password = pwInput.value;
      errEl.textContent = '';
      if(username.length < 3){ errEl.textContent = 'Username must be at least 3 characters.'; return; }
      if(!password){ errEl.textContent = 'Enter a password.'; return; }

      // Marks this click as the new current attempt -- see
      // signupAttemptToken's own comment above. Captured now, before the
      // real network call fires, so the callback below can tell whether
      // it's still the current attempt once it finally settles.
      signupAttemptToken++;
      var mySignupToken = signupAttemptToken;

      continueBtn.disabled = true;
      continueBtn.textContent = 'Creating your account…';
      // Defense-in-depth alongside the token check below: with Back
      // blocked for the duration of this call, there is no UI path to
      // reach a second, fresh Signup attempt while this one is still in
      // flight in the first place. See signupAttemptToken's own comment
      // for why the token check still matters even so.
      backBtn.disabled = true;
      setTimeout(function(){
        attemptSignup(contactEmail, password, function(ok, err, superseded){
          // Stale -- a newer Signup attempt has since started (or this
          // one was superseded some other way). Discard everything,
          // including navigation: touching continueBtn/errEl here would
          // reach into a detached, already-replaced screen, and
          // pendingId/pendingOperationName/contactEmail/assembled may
          // since belong to a completely different attempt. `superseded`
          // is js/store.js's OWN call-sequence guard saying it already
          // declined to commit this result -- checked here too (not just
          // mySignupToken) so this callback stays correct even if this
          // token's own bookkeeping were ever wrong; see attemptSignup's
          // comment on result.superseded above.
          if(mySignupToken !== signupAttemptToken || superseded) return;
          if(!ok){
            continueBtn.disabled = false;
            continueBtn.textContent = 'Continue';
            backBtn.disabled = false;
            errEl.textContent = err;
            return;
          }
          flushStagedCharactersToStore();
          // Update the draft's characterIds to the now-real (flushed) id,
          // in case the earlier pre-signup generation call already baked
          // a "local..." staged id into what it sent server-side -- the
          // server call itself only ever sent resolved character fields
          // (name/description/photo), never the id, so this is purely for
          // any LOCAL dream metadata display, not a correctness issue for
          // the in-flight generation itself.
          if(assembled && assembled.characterIdsForGeneration.length && staged.subjectCharacterId){
            DreamStore.setDraft({ characterIds: [staged.subjectCharacterId] });
          }
          // Waits for the (already in-flight, possibly already settled)
          // pending-generation call to settle before reading pendingId/
          // pendingOperationName -- same shape as start.html's own
          // screen 13 (~start.html:1159, `pendingPromise.then(...)`).
          // Contact-capture's Continue handler no longer waits on this
          // fetch before advancing here (see pendingGenerationPromise's
          // own comment on why), so without this wait a fast typer could
          // reach Signup and submit it before the contact-step's POST
          // had settled, reading pendingId/pendingOperationName while
          // they were still both null. Always resolves (win or lose),
          // so this can never hang the funnel.
          // pendingGenerationPromise itself is a live-read shared module
          // var (unlike start.html's local `pendingPromise`, captured
          // once per attempt) -- in the exact devtools-bypass race this
          // token guard targets, an abandoned attempt's .then() below
          // could technically end up chained off whichever promise this
          // variable holds AT THAT MOMENT, not necessarily the one that
          // was current when this attempt started. That's fine, not a
          // correctness gap: the re-check inside the callback discards
          // the result regardless of which promise it's attached to --
          // just don't mistake this line for a per-attempt snapshot if
          // this code is ever refactored to remove that re-check.
          pendingGenerationPromise.then(function(){
            // Re-check -- this attempt can still go stale WHILE this
            // inner promise is unsettled, even though the outer check
            // (above) already passed. In normal (non-bypassed) usage
            // continueBtn/backBtn stay disabled through this whole span
            // in both files, so nothing can bump signupAttemptToken
            // during this specific window today -- but that's an
            // incidental property of the current UI, not something this
            // guard should rely on. Without this re-check, a future
            // change that re-enables either button slightly earlier
            // would silently reopen exactly the same hazard the outer
            // check exists to close, and nothing here would catch it.
            if(mySignupToken !== signupAttemptToken) return;
            if(pendingId && !pendingStartFailed){
              // email is required now (see claim-pending-generation.js's
              // ownership check, review finding) -- contactEmail is the
              // exact same email start-pending-generation.js created this
              // pending record under, so this always matches.
              fetch('/.netlify/functions/claim-pending-generation', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pendingId: pendingId, email: contactEmail })
              }).catch(function(){ /* best-effort -- see claim-pending-generation.js's own doc comment */ });
            }
            if(pendingOperationName && !pendingStartFailed){
              DreamStore.adoptPendingGeneration(pendingOperationName, pendingStartedAt, assembled.caption, chosenStyle);
            }
            track('wizard_completed', { style: chosenStyle, had_pending_generation: !!(pendingOperationName && !pendingStartFailed) });
            location.href = 'processing.html';
          });
        });
      }, 0);
    });
  }

  // ===================================================================
  // Navigation engine — same shape as start.html's own goToStep/next/prev.
  // ===================================================================
  var SCREEN_RENDERERS = [renderSubject, renderSetting, renderAction, renderMood, renderStyleStep, renderFreeText, renderContact, renderSignup];
  var cur = 0;
  var screenEl = document.getElementById('fnScreen');
  var progressEl = document.getElementById('fnProgress');
  var backBtn = document.getElementById('fnBack');
  backBtn.innerHTML = Icons.back;

  function renderProgress(){
    // Progress dots only cover the 5 core + optional steps (0-5) — the
    // contact-capture/signup steps are their own distinct phase, same as
    // start.html not counting its own signup/pricing/confirm screens
    // against the earlier Advanced dots.
    var coreCount = 6;
    var dots = '';
    for(var i = 0; i < coreCount; i++){
      dots += '<i class="' + (i < cur ? 'done' : i === cur ? 'now' : '') + '"></i>';
    }
    progressEl.innerHTML = cur < coreCount ? dots : '';
  }
  function render(){
    SCREEN_RENDERERS[cur](screenEl);
    renderProgress();
    screenEl.scrollTop = 0;
    window.scrollTo(0, 0);
    track('wizard_step_viewed', { step: cur + 1 });
  }
  function goToStep(n){
    if(n < 0 || n >= SCREEN_RENDERERS.length) return;
    cur = n;
    render();
  }
  function next(){ goToStep(cur + 1); }
  backBtn.addEventListener('click', function(){
    // Invalidates any in-flight (or not-yet-acted-on) Signup attempt the
    // moment the user navigates away via Back -- see signupAttemptToken's
    // own comment above. Bumping only on Signup's own Continue click
    // would miss this: a visitor can navigate away from Signup and just
    // sit somewhere else without ever starting a competing second
    // attempt, and the abandoned first attempt's callback must still be
    // discarded once it settles late, per that var's own doc comment
    // ("a newer Signup attempt has since started OR the user has
    // navigated away from Signup"). Harmless to bump unconditionally on
    // every Back click, including ones that have nothing to do with
    // Signup -- there's simply nothing in flight for it to invalidate.
    signupAttemptToken++;
    if(cur > 0){ goToStep(cur - 1); return; }
    location.href = 'index.html';
  });

  render();
})();
</script>
</body>
</html>
