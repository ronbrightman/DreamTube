  // so every historical funnel/dashboard keyed on those numbers reads
  // on. The recap screen maps to null here and fires the new, sanctioned
  // wizard_recap_viewed {} instead (see render below); the entry chooser
  // is a pre-step outside this array entirely and fires only
  // wizard_entry_mode_chosen. This table is positional against
  // SCREEN_RENDERERS — a new screen gets null + its own event, never a
  // renumbering.
  var STEP_ANALYTICS = [1, 2, 3, 4, 5, 6, null, 7];
  // Same dynamic-lookup reasoning as start.html's SIGNUP_STEP — these
  // indexes shift if a screen is ever added in front of them, so nothing
  // below hardcodes them.
  var WALL_STEP = SCREEN_RENDERERS.indexOf(renderSignupWall);
  var RECAP_STEP = SCREEN_RENDERERS.indexOf(renderRecap);
  var FREETEXT_STEP = SCREEN_RENDERERS.indexOf(renderFreeText);
  var cur = 0;
  var screenEl = document.getElementById('fnScreen');
  var progressEl = document.getElementById('fnProgress');
  var backBtn = document.getElementById('fnBack');
  backBtn.innerHTML = Icons.back;

  function renderProgress(){
    // Progress dots cover the entry chooser (when this session was
    // offered one — the mock counts it as the first dot), the six core
    // steps, and the recap. The signup wall stays its own dot-less
    // phase, same as start.html not counting its own signup/pricing/
    // confirm screens against the earlier Advanced dots.
    var dots = '';
    if(chooserOffered) dots += '<i class="' + (chooserActive ? 'now' : 'done') + '"></i>';
    for(var i = 0; i < WALL_STEP; i++){
      dots += '<i class="' + (chooserActive ? '' : (i < cur ? 'done' : i === cur ? 'now' : '')) + '"></i>';
    }
    progressEl.innerHTML = (chooserActive || cur < WALL_STEP) ? dots : '';
  }
  function render(){
    chooserActive = false;
    SCREEN_RENDERERS[cur](screenEl);
    renderProgress();
    screenEl.scrollTop = 0;
    window.scrollTo(0, 0);
    // Byte-stable step analytics — see STEP_ANALYTICS's own comment.
    var stepNo = STEP_ANALYTICS[cur];
    if(stepNo !== null) track('wizard_step_viewed', { step: stepNo });
    else track('wizard_recap_viewed', {});
  }
  function goToStep(n){
    if(n < 0 || n >= SCREEN_RENDERERS.length) return;
    cur = n;
    render();
  }
  function next(){
    // Manual and automatic advancement share this one path — cancelling
    // here is what makes a Continue tap inside the auto-advance window
    // advance exactly once (see scheduleAutoAdvance's own comment).
    cancelAutoAdvance();
    goToStep(cur + 1);
  }
  backBtn.addEventListener('click', function(){
    // An auto-advance armed on the step being left must never fire into
    // the screen Back is about to show.
    cancelAutoAdvance();
    // On the chooser itself, Back leaves the wizard for the welcome
    // screen — same exit the first step used to own.
    if(chooserActive){ location.href = 'index.html'; return; }
    // (Round 9: Back deliberately does NOT touch the story pin anymore.
    // Round 8 cleared it whenever the recap was left backwards, which
    // wiped a hand-edit on an accidental Back→Forward with nothing
    // changed — bug-hunt finding #2. The pin now releases itself inside
    // computeStoryText the moment the dream's content signature actually
    // differs; see storyContentSignature/the release rule comment.)
    // Invalidates any in-flight (or not-yet-acted-on) wall attempt the
    // moment the user navigates away via Back -- see signupAttemptToken's
    // own comment above. Bumping only on the wall's own submit click
    // would miss this: a visitor can navigate away from the wall and just
    // sit somewhere else without ever starting a competing second
    // attempt, and the abandoned first attempt's callback must still be
    // discarded once it settles late. Harmless to bump unconditionally on
    // every Back click, including ones that have nothing to do with the
    // wall -- there's simply nothing in flight for it to invalidate.
    signupAttemptToken++;
    // Also invalidates any in-flight DreamStore.signupPasswordless()/
    // login call at the STORE layer, not just this file's own UI-level
    // token above -- the UI token alone only stops THIS page's callback
    // from reacting to a stale response; it can't stop js/store.js's own
    // commit helpers from silently writing state.user/state.accounts in
    // the background, since that write happens INSIDE the store call,
    // before this callback (or its token check) ever runs. See
    // DreamStore.invalidatePendingSignup's own doc comment (js/store.js)
    // and tracker item js-store-js-signupcallseq-only-invalidat-ijwpht.
    DreamStore.invalidatePendingSignup();
    // Same reasoning for the pre-account generation call (tracker item
    // for-product-money-leak-blocked-signups-e-v2g1vi): a since-abandoned
    // submit's belated settlement must not write pending state for an
    // attempt the user already walked away from. The comparison-key reset
    // goes with it — the abandoned promise's write was just invalidated,
    // so it must not be reusable as if it were still going to produce a
    // pendingId (a later identical resubmit fires fresh instead, exactly
    // the pre-wall behavior).
    pendingGenerationToken++;
    pendingGenerationComparisonKey = null;
    // Chooser-aware Back: the first screen this visitor actually SAW
    // comes back — Subject's Back returns to the chooser when one was
    // offered (else index.html, as always), and a write-mode visitor's
    // Back from the free-text step returns to the chooser too (they
    // never saw Subject..Style, so stepping into those would be a screen
    // they don't recognize; picking Build from the chooser afterwards
    // walks them forward normally).
    if(chooserOffered && (cur === 0 || (entryMode === 'write' && cur === FREETEXT_STEP))){ showChooser(); return; }
    // Funnel arrivals land DIRECTLY on the wall — the steps behind it
    // belong to the funnel (its own recap is one browser-Back away), not
    // to this page's empty chip flow, so Back leaves the way they came
    // instead of stepping into a wizard they never walked.
    if(funnelArrival && cur === WALL_STEP){ history.back(); return; }
    if(cur > 0){ goToStep(cur - 1); return; }
    location.href = 'index.html';
  });

  // ===================================================================
  // Boot — normal arrival, or the Facebook Login return leg (same
  // structure as start.html's own boot(); see that function's doc
  // comment for why the ?bt= branch paints a loading state first and
  // defers the synchronous-XHR consume call by one tick).
  // ===================================================================
  function boot(){
    if(!resumedFromFacebook){
      // Hygiene: a snapshot left behind by an abandoned Facebook round
      // trip must never survive into an unrelated later run of this
      // wizard (restoreWizardFromFacebookRedirect also has its own
      // savedAt age check — this is the cheaper, more direct half of the
      // same guarantee).
      clearPersistedWizardState();
      // Fresh entries (Get Started / direct) meet the entry chooser
      // first — founder round 8. A ?resume=1 arrival (funnel-style
      // handoff) skips it: funnel users already chose their mode
      // funnel-side.
      if(getParam('resume') !== '1'){
        chooserOffered = true;
        showChooser();
        return;
      }
      // ===== FUNNEL-ARRIVAL WALL LEG (wall routing, 2026-08-08) =====
      // The growth funnel's flo arm hands off HERE now instead of
      // start.html — founder test result: funnel arrivals were landing
      // on start.html's leftover screen 13 (email-only, no forming veil,
      // old styling) instead of this page's approved Layout-B wall. A
      // resume arrival CARRYING A BUILT DREAM (caption param — the same
      // param name start.html's resume leg reads) lands DIRECTLY on the
      // wall: dream already built and recapped funnel-side, so the only
      // thing left is the veil + Facebook/email wall. Everything below
      // mirrors start.html's own arrival leg 1:1 (cross-referenced
      // there), so routing flo arrivals here loses nothing:
      //   - character stash adoption (js/funnel-character-stash.js, the
      //     shared consuming helper) into THIS page's staged roster +
      //     selection, so a stashed self photo/description rides the
      //     wall's start-pending-generation call;
      //   - PostHog identity stitch (distinct_id param ->
      //     linkPreSignupIdentity);
      //   - Meta attribution cookie persistence (fbc/fbp/fbclid params);
      //   - the funnel_resumed_from_marketing event, same props.
      // A bare ?resume=1 WITHOUT a caption keeps the pre-existing
      // defensive behavior (chooser-free step flow) unchanged.
      if(isFunnelHandoffArrival){
        // Same cross-app PostHog identity stitch as start.html's arrival
        // leg (see that file's handoffDistinctId block for the full
        // rationale) — identify BEFORE any of this page's own events fire.
        var handoffDistinctId = getParam('distinct_id');
        if(handoffDistinctId && window.DreamStore && typeof DreamStore.linkPreSignupIdentity === 'function'){
          try{ DreamStore.linkPreSignupIdentity(handoffDistinctId); }catch(e){ /* analytics must never break the app */ }
        }
        // Same Meta click-attribution cookie handoff as start.html's
        // persistMetaAttributionCookies (see that block for the full
        // rationale; fbclid->fbc construction per Meta's documented
        // format, subdomain-index 1 per growth's handoff contract).
        (function persistMetaAttributionCookies(){
          try{
            var setFirstPartyCookie = function(name, value){
              try{ document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + (90 * 24 * 60 * 60) + '; SameSite=Lax; Secure'; }catch(e){ /* analytics must never break the app */ }
            };
            var handoffFbc = getParam('fbc');
            var handoffFbp = getParam('fbp');
            var handoffFbclid = getParam('fbclid');
            if(handoffFbc) setFirstPartyCookie('_fbc', handoffFbc);
            if(handoffFbp) setFirstPartyCookie('_fbp', handoffFbp);
            if(handoffFbclid && !handoffFbc && !getMetaCookies().fbc){
              setFirstPartyCookie('_fbc', 'fb.1.' + Date.now() + '.' + handoffFbclid);
            }
          }catch(e){ /* analytics must never break the app */ }
        })();
        // Character stash adoption — the shared one-shot consume
        // (validation floor, 30-min bound; see the helper's own header),
        // staged + selected exactly like sheet-entered characters, so
        // resolveCharactersForGeneration/flushStagedCharactersToStore
        // treat them identically.
        if(window.FunnelCharacterStash){
          FunnelCharacterStash.consume().forEach(function(character){
            staged.characters.push(character);
            staged.subjectCharacterIds.push(character.id);
          });
        }
        // Same event + props start.html's arrival leg fires, so the
        // funnel-arrival marker is page-agnostic in every dashboard.
        track('funnel_resumed_from_marketing', {
          recall: getParam('recall') || null,
          dream_types: (getParam('types') || '').split(',').filter(Boolean),
          motivations: (getParam('motivations') || '').split(',').filter(Boolean),
          style: getParam('style') || null
        });
        funnelArrival = true;
        funnelCaption = getParam('caption');
        if(getParam('style')) chosenStyle = getParam('style');
        assembleFromState(); // funnel branch — set eagerly so the FB snapshot always carries a real assembled dream
        cur = WALL_STEP;
        render();
        return;
      }
      render();
      return;
    }

    // Every Facebook leg restores (and thereby consumes) the snapshot:
    // the fb_error leg needs the built dream back to re-render an
    // editable wall around the inline error, and the ?bt= leg needs it to
    // actually submit the dream. The fb_needs_email leg's own success
    // path re-persists before its ?bt= re-entry (see
    // renderFacebookEmailStep).
    var restored = restoreWizardFromFacebookRedirect();

    if(!fbTransferPresent){
      // A failed round trip (?fb_error=) or the needs-email half-step
      // (?fb_needs_email=). No token to consume — land straight on the
      // wall, where the visitor actually was when they left.
      cur = WALL_STEP;
      render();
      return;
    }

    cur = WALL_STEP;
    renderProgress();
    screenEl.innerHTML =
      '<div class="fn-spacer"></div>' +
      '<div class="fn-spin"></div>' +
      '<div class="fn-loading-line">Signing you in…</div>' +
      '<div class="fn-spacer"></div>';

    setTimeout(function(){
      try{ DreamStore.consumeSessionTransferTokenFromUrlSync(); }catch(e){ /* silent no-op contract -- see that function's own doc comment */ }

      var user = DreamStore.getCurrentUser();
      if(!user){
        // The token didn't resolve (expired, already consumed, a network
        // failure). Fail closed to the ordinary wall with an inline
        // explanation — the email path is unaffected and remains the
        // fallback.
        pendingFacebookErrorSlug = pendingFacebookErrorSlug || 'signin_failed';
        render();
        return;
      }

      // getAccountEmail() reads the email commitTransferredSession just
      // wrote from the server-verified token, never anything
      // client-supplied.
      var email = DreamStore.getAccountEmail() || '';
      var fbOutcome = getParam('fb');
      track('signup_facebook_completed', { variant: 'wizard', outcome: fbOutcome || null });
      // Gated on fb=signup — the callback sets fb:'login' for an
      // existing-email match, which is a login, not a new signup (same
      // no-double-count rule as start.html's boot; see that copy's long
      // comment on both the pixel fire and the PostHog 'signed_up' gap).
      if(email && fbOutcome === 'signup'){
        fireMetaConversion('CompleteRegistration', { email: email, custom_data: { signup_method: 'facebook' } });
        track('signed_up', { signup_method: 'facebook' });
      }

      if(!restored || !assembled || !assembled.caption){
        // The snapshot didn't survive the round trip (most realistically
        // the FB/IG in-app webview wiping localStorage between the two
        // page loads). The visitor IS signed in — that half succeeded and
        // must not be thrown away — there's just no built dream left to
        // submit for them, so land on home.html without ?generate=1
        // (nothing in the draft to submit) and let them build from there.
        // Tracked so it's visible if this turns out to be common.
        track('wizard_facebook_return_snapshot_missing', {});
        location.href = 'home.html';
        return;
      }

      // The dream survived — fire the real generation for the confirmed
      // account email now (it could never start pre-redirect: the email
      // wasn't known until Facebook vouched for it, the same accepted
      // tradeoff start.html's Facebook path documents), then run the one
      // shared continuation.
      contactEmail = email;
      var characters = resolveCharactersForGeneration();
      var payload = {
        email: email, whatsapp: null,
        caption: assembled.caption, style: chosenStyle,
        characters: characters, characterIdsForGeneration: assembled.characterIdsForGeneration,
        sceneryTime: DreamStore.getDraft().sceneryTime, sceneryPlace: settingPlaceKey,
        storyText: currentStoryText
      };
      var submissionKey = JSON.stringify(payload);
      var comparisonPayload = Object.assign({}, payload, { email: email.toLowerCase() });
      delete comparisonPayload.storyText;
      var comparisonKey = JSON.stringify(comparisonPayload);
      DreamStore.setDraft({ caption: assembled.caption, storyText: currentStoryText, style: chosenStyle, characterIds: assembled.characterIdsForGeneration, sceneryTime: DreamStore.getDraft().sceneryTime, sceneryPlace: settingPlaceKey });
      completeSignupAndAdvance(email, {
        pendingPromise: getOrStartPendingGeneration(submissionKey, comparisonKey)
      });
    }, 0);
  }

  // ===================================================================
  // Signup-wall subtext A/B test (wall-subtext) -- LIVE 50/50
  // Tests whether the wall's reassurance line ("Free to start, no card
  // needed — we'll email you your dream the moment it's ready, that's the
  // only reason we ask.") helps or hurts signup conversion. Two arms:
  //   'shown'  -- the line renders (today's behavior).
  //   'hidden' -- the line is dropped; the wall is otherwise identical.
  //
  // WHY here, in wizard.html: the signup wall (renderWallEmailStep) lives
  // ON THIS PAGE for EVERY arrival — direct app visitors AND funnel
  // arrivals, which the flo-arm wall routing lands on this same wizard.
  // So this is the one shared spot where the wall renders, and the arm is
  // decided here, once, before boot() paints anything. Persisted in
  // localStorage (app-origin-scoped, exactly where the wall renders) so
  // it's STABLE per visitor/browser across re-renders and repeat visits —
  // no reassignment, no flicker.
  //
  // Mirrors the funnel's funnel-lb-skin machinery exactly (dreamtube-
  // growth/index.html assignSkinArm): a founder/QA override (?wallsubtext=
  // shown|hidden), else a persisted deterministic 50/50 seeded from the
  // PostHog distinct_id when it's resolved synchronously, else a random
  // 50/50 — either way persisted, so the seed source never changes the arm
  // after first assignment. Recorded the SAME way: a PostHog super property
  // (wall_subtext_arm) registered BEFORE render so it rides EVERY
  // subsequent event (the wall's wizard_step_viewed {step:7} and the
  // eventual signed_up), plus one experiment_exposure event. NO other
  // event or param changes.
  //
  // METRIC / QUERY: signup-wall -> signed_up conversion, split by arm.
  //   Denominator: wizard_step_viewed where step = 7 (the wall reached).
  //   Numerator:   signed_up (either signup_method).
  //   Break down both by the super property `wall_subtext_arm`
  //   ('shown' vs 'hidden'); or read the exposure directly
  //   (experiment='wall-subtext', variant='shown'|'hidden'). Decision
  //   point ~2 days out, once each arm has enough wall views.
  // ===================================================================
  var WALL_SUBTEXT_ARM_KEY = 'dt_wall_subtext_arm';
  function wsHashStr(s){ var h = 0; for(var i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return h; }
  function assignWallSubtextArm(){
    // Founder/QA preview override (?wallsubtext=shown|hidden): forces the
    // arm and persists it so the whole session stays consistent. Real
    // visitors never carry this param; founder traffic is already excluded
    // from arm analysis by the IL/alias filters — so its exposure can't
    // pollute the read.
    try{
      var forced = new URLSearchParams(location.search).get('wallsubtext');
      if(forced === 'shown' || forced === 'hidden'){
        try{ localStorage.setItem(WALL_SUBTEXT_ARM_KEY, forced); }catch(e){}
        return forced;
      }
    }catch(e){ /* URLSearchParams unavailable — fall through to normal assignment */ }
    var arm = null;
    try{ arm = localStorage.getItem(WALL_SUBTEXT_ARM_KEY); }catch(e){ /* storage blocked (private mode) */ }
    if(arm !== 'shown' && arm !== 'hidden'){
      var did = null;
      try{ if(window.posthog && typeof posthog.get_distinct_id === 'function') did = posthog.get_distinct_id(); }catch(e){}
      var bucket = (typeof did === 'string' && did) ? (Math.abs(wsHashStr(did)) % 2) : (Math.random() < 0.5 ? 0 : 1);
      arm = bucket === 0 ? 'hidden' : 'shown';
      try{ localStorage.setItem(WALL_SUBTEXT_ARM_KEY, arm); }catch(e){ /* not persisted this load; still stable within it */ }
    }
    return arm;
  }
  var wallSubtextArm = assignWallSubtextArm();
  // Attach the arm to every event (rides the deferred wall wizard_step_viewed
  // + signed_up) + fire the matching exposure, BEFORE boot() renders.
  try{ if(window.posthog && typeof posthog.register === 'function') posthog.register({ wall_subtext_arm: wallSubtextArm }); }catch(e){ /* analytics must never break the wizard */ }
  track('experiment_exposure', { experiment: 'wall-subtext', variant: wallSubtextArm });

  boot();
})();
</script>
</body>
</html>
