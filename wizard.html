    // currentStoryText — every downstream reader (payload, draftPatch,
    // adoptPendingGeneration) already reads that var live, so there is
    // deliberately NO other write site. See storyEditedByUser's comment.
    document.getElementById('fn-story-recap-text').addEventListener('input', function(e){
      currentStoryText = e.target.value;
      storyEditedByUser = true;
      // A hand-edit settles the story for the CURRENT inputs (round-9
      // release rule): it survives any navigation that doesn't change
      // the dream's content, and releases only when the signature does.
      storySettledSignature = storyContentSignature();
    });
    computeStoryText();
    document.getElementById('fn-recap-continue').addEventListener('click', next);
  }

  // ===================================================================
  // Prompt assembly — resolves the current wizard state into a final
  // caption + which (if any) character id should ride along on the real
  // generation request. See js/wizard-chips.js for the algorithm itself.
  // ===================================================================
  var assembled = null; // { caption, characterIdsForGeneration }

  // Funnel-arrival wall state (wall routing, 2026-08-08): a growth-funnel
  // handoff (?resume=1&caption=...) lands DIRECTLY on the signup wall —
  // the dream was fully built funnel-side, so its caption param is the
  // FINAL prompt, used verbatim (same authoritative-words contract as
  // write mode below), never re-assembled from this page's (empty) chip
  // state. characterIdsForGeneration comes from the adopted funnel
  // character stash (see boot()'s funnel-arrival leg), so a stashed self
  // photo/description rides the wall's start-pending-generation exactly
  // like a wizard-entered character.
  var funnelArrival = false;
  var funnelCaption = '';

  /**
   * Same chip-selection fields assembleCaption below takes, minus camera/
   * POV/character-description/style — shared with buildDeterministicStory,
   * which has no use for those (see js/wizard-chips.js's own doc comment).
   *
   * Builds WizardChips' new `subjects` array (see that module's own doc
   * comment) from every currently-selected character
   * (staged.subjectCharacterIds, multi-select) plus at most one active
   * "other" chip (subjectOtherKind, still single-select among just those
   * four) — see this file's design note above renderSubject for why these
   * two compose rather than staying mutually exclusive. The singular
   * subjectKey/character/subjectOtherText fields are also still supplied
   * (subjectKey:'none') purely as assembleCaption/buildDeterministicStory's
   * own documented fallback for the case where `subjects` ends up empty
   * (nothing selected at all, e.g. the step was skipped) — ignored
   * entirely whenever `subjects` is non-empty.
   */
  function currentChipFields(){
    var subjects = staged.subjectCharacterIds.map(function(id){
      var c = staged.characters.filter(function(x){ return x.id === id; })[0];
      return c ? { subjectKey: c.isSelf ? 'me' : 'someone', character: c, subjectOtherText: '' } : null;
    }).filter(Boolean);
    if(subjectOtherKind) subjects.push({ subjectKey: subjectOtherKind, character: null, subjectOtherText: subjectOtherText });
    // Setting was removed as a question — the place is inferred per action
    // (WizardChips.inferFallbackPlaceKey), so the caption still reads with a
    // scene (e.g. flying → "an open sky") exactly like the growth trim. An
    // explicit settingPlaceKey still wins if somehow present.
    var placeKey = settingPlaceKey || WizardChips.inferFallbackPlaceKey(actionKey);
    return {
      subjects: subjects,
      subjectKey: 'none', character: null, subjectOtherText: subjectOtherText,
      placeKey: placeKey, placeOtherText: settingOtherText, sceneryTime: DreamStore.getDraft().sceneryTime,
      actionKey: actionKey, actionOtherText: actionOtherText, pov: povOn,
      moodKey: moodKey, moodOtherText: moodOtherText
    };
  }

  function assembleFromState(){
    // FUNNEL-ARRIVAL caption contract (wall routing, 2026-08-08 — see
    // funnelArrival's declaration above): the funnel-built caption is
    // final and verbatim; the selected adopted characters ride along.
    if(funnelArrival && funnelCaption){
      assembled = { caption: funnelCaption, characterIdsForGeneration: staged.subjectCharacterIds.slice() };
      return assembled;
    }
    // WRITE-mode caption contract (entry chooser, founder round 8): a
    // visitor who chose "Write it in your own words" never saw the
    // Subject..Mood steps, so chip assembly would bake pure DEFAULTS
    // into their prompt — most damagingly the required Action's
    // 'flying' — around a dream they typed themselves. Their words go
    // through VERBATIM as the caption instead: exactly the contract
    // create.html's own Write-it path sets (caption = the typed text,
    // style rides separately on the payload/draft), reused rather than
    // invented. No characters can be staged on this path, so
    // characterIdsForGeneration is honestly empty. If they typed
    // nothing (skipped the box), chip assembly with defaults applies —
    // identical to a build-mode visitor skipping everything. Note a
    // write-mode visitor who Back-navigates into the chip steps and
    // picks chips still gets their TYPED text as the caption while the
    // text exists — in write mode the written dream is authoritative.
    if(entryMode === 'write' && freeText && freeText.trim()){
      assembled = { caption: freeText.trim(), characterIdsForGeneration: [] };
      return assembled;
    }
    var chipFields = currentChipFields();
    assembled = WizardChips.assembleCaption(Object.assign({}, chipFields, { style: chosenStyle, freeText: freeText }));
    return assembled;
  }

  // ===================================================================
  // storyText (tracker item for-product-split-prompttext-storytext-
  // f-yt5kc7) — wizard.html's own chip-based pre-signup flow gets the
  // exact same treatment as create.html's "Build it" (see that file's own
  // header comment): assembled.caption above is promptText (generation-
  // only, camera-direction/style-modifier language), never shown to the
  // user again. currentStoryText is what the signup wall's recap card
  // actually shows, and what the real submission payload/draftPatch below
  // carry — always whatever's CURRENTLY displayed, never a stale snapshot,
  // same discipline as style.html's own version of this. See
  // computeStoryText's own doc comment for the two-path logic (verbatim
  // free text vs. a deterministic-then-opportunistically-LLM-upgraded chip
  // sentence).
  // ===================================================================
  var currentStoryText = '';
  var storyRewriteToken = 0; // bumped every recompute -- an in-flight fetch from a PRIOR chip-state (e.g. the user went back and changed something) must never clobber a newer one's result.
  // Layout-B: the recap is an EDITABLE textarea on its own step
  // (renderRecap — founder mock round 2 / round 8: "Here's your dream —
  // make it yours"). Once the visitor has typed into it, their words are
  // authoritative: the opportunistic LLM rewrite must not clobber them
  // when it lands, and a re-render must not recompute over them.
  //
  // RELEASE RULE (round 9, replacing round 8's blunt "leaving the recap
  // backwards clears the pin"): a settled story — hand-edited OR
  // LLM-upgraded — sticks for as long as its INPUTS are unchanged, and
  // is released only when the content signature (storyContentSignature
  // below) actually differs on the next recompute. Round 8's rule wiped
  // a hand-edit on an accidental Back→Forward with nothing changed, and
  // separately let the recap visibly DEGRADE on wall→Back (the nice LLM
  // story flashed back to the raw template, then a duplicate rewrite
  // call re-upgraded it seconds later — double LLM spend per revisit).
  // Both were founder-reported in the 08-07 live-main bug hunt.
  //
  // What the edit CHANGES is storyText only — the dream's stored,
  // displayed, emailed story (payload.storyText / draftPatch.storyText /
  // adoptPendingGeneration already all read currentStoryText live, so
  // the edited text rides every one of those paths with no further
  // wiring) — never the generation prompt (assembled.caption), and it's
  // deliberately excluded from the resubmission comparisonKey exactly
  // like the LLM rewrite always was (see the payload comment in
  // trySubmit). This is also why the mock's "This exact text drives
  // your video." sub-line was NOT carried over: under the real
  // promptText/storyText split (tracker item for-product-split-
  // prompttext-storytext-f-yt5kc7) that claim would be false — the
  // rendered sub-line uses the mock's other, accurate line instead.
  var storyEditedByUser = false;
  // The content signature currentStoryText last SETTLED against — set
  // when a hand-edit happens or an LLM rewrite lands, null while only
  // the raw template is showing. computeStoryText compares against it.
  var storySettledSignature = null;

  /**
   * A compact, deterministic signature of every input the recap's story
   * derives from: the chip picks (characters projected to their
   * story-relevant fields — name/description/has-photo, never the raw
   * photo data URL, which is huge and story-irrelevant), the free text,
   * the chosen style + POV (they shape the rewrite's promptText via
   * assembled.caption even though the deterministic template ignores
   * them), and entryMode (the write-mode verbatim contract). Two equal
   * signatures mean "recomputing would start from exactly the same
   * dream", which is what lets a settled story stand — see the release
   * rule above.
   */
  function storyContentSignature(){
    var fields = currentChipFields();
    return JSON.stringify({
      subjects: (fields.subjects || []).map(function(s){
        return [s.subjectKey, s.character ? [s.character.name || '', s.character.description || '', !!s.character.photoDataUrl] : null, s.subjectOtherText || ''];
      }),
      place: [fields.placeKey, fields.placeOtherText || '', fields.sceneryTime || null],
      action: [fields.actionKey, fields.actionOtherText || '', !!fields.pov],
      mood: [fields.moodKey, fields.moodOtherText || ''],
      style: chosenStyle,
      freeText: (freeText || '').trim(),
      entryMode: entryMode
    });
  }

  /**
   * Recomputes currentStoryText for whatever's currently staged, fires the
   * opportunistic LLM rewrite if needed, and re-renders the recap step's
   * textarea (renderStoryRecap itself no-ops harmlessly if it isn't the
   * current screen). A story that already SETTLED for these exact inputs
   * — hand-edited or LLM-upgraded, per storyContentSignature — is
   * repainted as-is: no template flash, no duplicate rewrite call.
   */
  function computeStoryText(){
    var sig = storyContentSignature();
    if(storySettledSignature === sig){
      renderStoryRecap();
      return;
    }
    // Inputs genuinely changed since the story last settled — any pin
    // (including a hand-edit) is now about a DIFFERENT dream; release it
    // and recompute fresh. This is the round-9 release rule's other half.
    storyEditedByUser = false;
    storySettledSignature = null;
    var myToken = ++storyRewriteToken;
    var hasFreeText = !!(freeText && freeText.trim());
    // Write mode: the typed dream IS the story, verbatim — their words win,
    // no template and no LLM rewrite (mirrors the entryMode==='write'
    // assembled-caption contract above). Verbatim text is final, so it
    // settles immediately. Build mode: free text is an ADDITION on top of
    // the chip picks, never a replacement — the founder hit exactly that
    // (typed "Anything to add?" text erased the whole assembled story
    // from the recap, 08-07). The chip story stays, the extra words join
    // as a real sentence (joinStorySentences), and the rewrite below
    // (whose promptText via assembled.caption already carries freeText)
    // blends them properly.
    if(entryMode === 'write' && hasFreeText){
      currentStoryText = freeText.trim();
      storySettledSignature = sig;
      renderStoryRecap();
      return;
    }
    var template = WizardChips.buildDeterministicStory(currentChipFields());
    // Sentence-cased join (round 9) — shared with create.html's Build-it,
    // see WizardChips.joinStorySentences' own doc comment.
    currentStoryText = hasFreeText ? WizardChips.joinStorySentences(template, freeText) : template;
    renderStoryRecap();
    fetch('/.netlify/functions/rewrite-dream-story', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ promptText: assembled ? assembled.caption : '' })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(myToken !== storyRewriteToken) return; // stale -- a newer recompute has since superseded this
      if(storyEditedByUser) return; // the visitor edited while this was in flight -- their words win
      if(!result.ok || !result.data || !result.data.storyText) return;
      currentStoryText = result.data.storyText;
      // The upgraded story is now the settled one for these inputs — a
      // wall→Back revisit repaints it instead of re-flashing the template
      // and re-billing a rewrite (round 9, bug-hunt finding #1). `sig`
      // was captured at compute time, before the fetch — exactly the
      // inputs this rewrite was derived from.
      storySettledSignature = sig;
      renderStoryRecap();
    }).catch(function(){ /* best-effort -- deterministic template already shown */ });
  }

  function renderStoryRecap(){
    var textEl = document.getElementById('fn-story-recap-text');
    if(!textEl) return; // the recap step isn't the current screen -- see computeStoryText's own comment
    // The recap is an editable textarea — .value, not textContent.
    // Skipped while it's the active element: a repaint mid-typing (the
    // LLM upgrade landing) would move the caret even when the text
    // itself is protected above.
    if(document.activeElement !== textEl) textEl.value = currentStoryText;
  }

  // ===================================================================
  // Pre-account generation state (the "generate during signup" seam —
  // see start-pending-generation.js/dream-webhook.js). Email is required
  // by that endpoint (its E4 gate — email is the token-economy identity
  // generate-video.js's E112 gate keys on too), so the real, billed
  // generation fires the moment the signup wall's email submit passes
  // the deliverability check — BEFORE any account exists — exactly the
  // ordering start.html's screen 13 uses. WhatsApp stays PARKED (founder
  // decision 2026-07-28, tracker item
  // for-product-hide-the-whatsapp-field-in-w-clu9ju — no code path can
  // deliver to it today), so the payload always sends whatsapp: null;
  // re-enable is tracked by for-ron-reminder-complete-the-whatsapp-c-9mz857.
  // ===================================================================
  var contactEmail = '';
  var pendingId = null;
  var pendingOperationName = null;
  var pendingStartedAt = null;
  var pendingStartFailed = false;
  // Snapshot (JSON, email-normalized) of the payload behind the last
  // successful start-pending-generation call, so Back-to-here + Continue
  // with nothing changed can skip re-POSTing instead of creating a
  // second real fal.ai charge + token spend and orphaning the first
  // pending record. Only ever written alongside pendingId on success —
  // see getOrStartPendingGeneration below for why that invariant is what
  // makes comparing against it (alone, without pendingStartFailed) safe.
  // See tracker item wizard-html-no-guard-against-resubmittin-n5b5k2.
  var lastPendingSubmissionKey = null;
  // Per-attempt token — same "an async callback's side effects aren't
  // scoped to the attempt that started them" pattern as start.html's own
  // pendingGenerationToken (see that file's doc comment). Guards
  // startPendingGeneration()'s WRITE to the pending* vars below — never
  // navigation (settlement never navigates in this file, only
  // completeSignupAndAdvance does, and that is signupAttemptToken-gated).
  // Bumped only when a genuinely NEW call fires
  // (getOrStartPendingGeneration's fresh branch) and on Back navigation
  // (the topbar handler below) — never on a reused in-flight call, which
  // must still be able to write once it eventually settles, exactly
  // start.html's own bump discipline.
  var pendingGenerationToken = 0;
  // The latest fired (or reused) start-pending-generation promise — what
  // the wall's post-signup continuation (completeSignupAndAdvance) awaits
  // before reading pendingId/pendingOperationName, mirroring start.html's
  // own pendingPromise handling on screen 13. Always resolves (win or
  // lose), so it can never hang the wall.
  var pendingGenerationPromise = Promise.resolve();
  // Reuse bookkeeping for getOrStartPendingGeneration below — the
  // comparison key of the CURRENT (in-flight or settled) call, plus
  // whether it has settled yet. Same shape as start.html's own
  // pendingGenerationEmail/pendingGenerationSettled pair, except keyed on
  // the wizard's full content-comparison key (this page's dream content
  // can change between attempts via Back-editing; start.html's is fixed
  // from URL params, so an email key alone is enough there).
  var pendingGenerationComparisonKey = null;
  var pendingGenerationSettled = false;

  /**
   * Resolves EVERY id in assembled.characterIdsForGeneration (now
   * potentially more than one, since Subject went multi-select — tracker
   * item for-product-wizard-characters-step-is-si-paxp07) into the
   * resolved-character shape generate-video.js's buildPrompt expects.
   * Previously only ever read characterIdsForGeneration[0] — harmless
   * while at most one id could ever exist, but would have silently
   * dropped every character past the first the moment multi-select shipped
   * if left unchanged.
   */
  function resolveCharactersForGeneration(){
    if(!assembled || !assembled.characterIdsForGeneration.length) return [];
    return assembled.characterIdsForGeneration.map(function(id){
      var c = staged.characters.filter(function(x){ return x.id === id; })[0];
      if(!c) return null;
      var resolved = { name: c.name, description: c.description, isSelf: !!c.isSelf };
      if(c.isSelf && c.photoDataUrl) resolved.photoDataUrl = c.photoDataUrl;
      return resolved;
    }).filter(Boolean);
  }

  /**
   * Fires start-pending-generation.js and updates the pending* vars on
   * settlement -- but ONLY if `token` still matches pendingGenerationToken
   * (see that var's own comment); a mismatch means a newer attempt has
   * since become current, so this stale response is discarded rather
   * than clobbering it. Always resolves (never rejects) -- a failure
   * just leaves pendingStartFailed true. Deliberately does NOT navigate
   * or touch the draft -- navigation belongs to completeSignupAndAdvance
   * alone (which awaits this promise before reading the pending* vars).
   * Not called directly by the wall -- see getOrStartPendingGeneration
   * below, which adds the reuse/resubmission guards and the token. Same
   * shape as start.html's own startPendingGeneration.
   */
  function startPendingGeneration(submissionKey, comparisonKey, token){
    var startedAt = Date.now();
    return fetch('/.netlify/functions/start-pending-generation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: submissionKey
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(token !== pendingGenerationToken) return; // stale -- a newer attempt has since started, discard
      if(result.ok && result.data && result.data.pendingId){
        pendingId = result.data.pendingId;
        pendingOperationName = result.data.operationName;
        pendingStartedAt = startedAt;
        pendingStartFailed = false;
        lastPendingSubmissionKey = comparisonKey;
      } else {
        // Resilient fallback: generation just won't have a head start —
        // the normal fresh-generation path at home.html (draft
        // caption/style are set synchronously by the caller regardless)
        // still works.
        pendingStartFailed = true;
      }
    }).catch(function(){
      if(token !== pendingGenerationToken) return;
      pendingStartFailed = true;
    });
  }

  /**
   * Retry-safe wrapper around startPendingGeneration() — what the signup
   * wall actually calls (same role as start.html's own
   * getOrStartPendingGeneration, see that function's doc comment). Three
   * tiers, cheapest first:
   *   1. This exact content already SUCCEEDED (pendingId is set and
   *      comparisonKey matches lastPendingSubmissionKey, which is only
   *      ever written together with pendingId on success) — nothing to
   *      do or wait for at all. This is the old Contact-step resubmission
   *      guard (tracker item wizard-html-no-guard-against-resubmittin-
   *      n5b5k2), preserved: re-POSTing would create a second real
   *      fal.ai charge + token spend and orphan the first pending record.
   *      Deliberately NOT gated on pendingStartFailed — that flag only
   *      reflects the MOST RECENT attempt, not whether THIS content's
   *      call succeeded (an unrelated failed attempt in between must not
   *      force a needless re-POST of already-bought content).
   *   2. The SAME content's call is still in flight (or settled ok) —
   *      reuse its promise rather than racing a duplicate request in
   *      (reachable via the code step's "Use a different email" →
   *      resubmit round trip, where the first submit's slow fal call can
   *      easily still be outstanding).
   *   3. Genuinely new/changed content, or a prior definitive failure
   *      for it — fire fresh (nothing was spent on a failed attempt, see
   *      start-pending-generation.js: tokens are only spent after a
   *      successful fal submission, so retrying a failure is correct,
   *      not a double-spend risk).
   */
  function getOrStartPendingGeneration(submissionKey, comparisonKey){
    if(pendingId && comparisonKey === lastPendingSubmissionKey) return Promise.resolve();
    var reusable = pendingGenerationComparisonKey === comparisonKey && pendingGenerationPromise &&
      (!pendingGenerationSettled || !pendingStartFailed);
    if(reusable) return pendingGenerationPromise;
    pendingGenerationComparisonKey = comparisonKey;
    pendingGenerationSettled = false;
    pendingGenerationToken++;
    var myToken = pendingGenerationToken;
    pendingGenerationPromise = startPendingGeneration(submissionKey, comparisonKey, myToken).then(function(){
      // Same staleness guard as startPendingGeneration's own writes — an
      // abandoned call's belated settlement must not flip this flag for
      // whatever the CURRENT attempt is.
      if(myToken === pendingGenerationToken) pendingGenerationSettled = true;
    });
    return pendingGenerationPromise;
  }

  /**
   * check-email.js availability + deliverability check (tracker items
   * for-product-money-leak-blocked-signups-e-v2g1vi and
   * for-product-signup-email-micro-step-foun-ns8uve) — fired BEFORE
   * startPendingGeneration, so an obviously mistyped domain is caught
   * inline before an account gets created around it or the real, billed
   * generation fires. Under the passwordless wall only `deliverable`
   * gates anything — `available` no longer stops the flow (an
   * already-registered email resolves via the code step, matching
   * screen 13's live wall; see renderWallEmailStep). Resolves to
   * { available, deliverable }, never rejects. Resilient fallback on any
   * failure of THIS check — fail OPEN to the existing behavior (both
   * true) rather than newly blocking a real user's funnel over an
   * ancillary check's own infrastructure hiccup, same philosophy as
   * startPendingGeneration's own resilient-fallback comment above (and
   * check-email.js's own header comment on the same tradeoff). This
   * endpoint is an additional, early UX nicety — register-account.js's
   * own E8 check downstream is still the authoritative one regardless of
   * what this reports. `deliverable` is treated as true unless the server
   * EXPLICITLY says false — an older/mocked response with no
   * `deliverable` key at all is "unknown," not "bad," same resilient
   * posture.
   */
  function checkEmailAvailable(email){
    return fetch('/.netlify/functions/check-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(result.ok && result.data && result.data.ok !== false && typeof result.data.available === 'boolean'){
        return { available: result.data.available, deliverable: result.data.deliverable !== false };
      }
      return { available: true, deliverable: true }; // resilient fallback -- see this function's own doc comment
    }).catch(function(){
      return { available: true, deliverable: true }; // resilient fallback -- see this function's own doc comment
    });
  }

  // ===================================================================

  var signupAttemptToken = 0;

  /**
   * Wraps the wall's content into the .fn-signup-stage layout — see that
   * class's own CSS comment above. `groups` is an ordered array of HTML
   * strings, one per visual beat; a falsy/empty entry is dropped entirely,
   * so no orphan spacer ever appears around a group that rendered nothing.
   * Same as start.html's fnStageHtml.
   */
  function fnStageHtml(groups){
    var real = groups.filter(function(g){ return !!g; });
    var out = '<div class="fn-signup-stage">';
    for(var i = 0; i < real.length; i++){

  var FORMING_TINT_STYLES = { cartoon: 1, cinematic: 1, anime: 1, realistic: 1 };

   * nothing for the overwhelming majority of visitors (a real Veo
   * generation takes minutes; this wall is passed in seconds) and the
   * anticipation-only veil is what they see — see start.html's original
   * doc comment for the full "why one-shot" reasoning.

  function tryShowFormingPreview(){
    if(!pendingOperationName) return;
    if(!document.getElementById('fn-forming-still')) return;
    var controller = (typeof AbortController === 'function') ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, 3000) : null;
    fetch('/.netlify/functions/video-status?name=' + encodeURIComponent(pendingOperationName), controller ? { signal: controller.signal } : {})
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(timeoutId) clearTimeout(timeoutId);
        if(!data || !data.done || !data.videoUrl) return;
        var videoEl = document.getElementById('fn-forming-still'); // re-read -- the screen may have re-rendered since the fetch started
        if(!videoEl) return;

  /**
   * The ONE post-signup continuation for the email/code path (start.html's
   * completeSignupAndAdvance, adapted): flush staged characters into the
   * now-real account, re-point draft.characterIds at the flushed real ids
   * (draftPatch was computed
   * BEFORE the flush, so it still holds "local..." staged ids — and
   * home.html's fallback fresh-generation path reads draft.characterIds
   * directly, so this is not a display-only fixup), then wait for the
   * pending-generation call to settle, claim + adopt it, and land on
   * home.html. `?generate=1` covers the pendingStartFailed case: home.html
   * finds no pendingJob and falls back to submitting the intact draft
   * fresh (see that file's "Fresh in-app generation submission" block);
   * when adoption succeeded, its pendingJob-first check resumes the
   * adopted job and ignores the param entirely.
   */
  function completeSignupAndAdvance(email, opts){
    opts = opts || {};
    var idMap = flushStagedCharactersToStore();
    if(assembled && assembled.characterIdsForGeneration.length){
      DreamStore.setDraft({ characterIds: assembled.characterIdsForGeneration.map(function(id){ return idMap[id] || id; }) });
    }
    var pendingPromise = opts.pendingPromise || Promise.resolve();
    return pendingPromise.then(function(){
      // Re-check — this attempt can go stale WHILE the pending promise is
      // unsettled, even though the caller's own check already passed.
      if(typeof opts.isStale === 'function' && opts.isStale()) return;
      if(pendingId && !pendingStartFailed){
        // email is required by claim-pending-generation.js's ownership
        // check — this is the exact email start-pending-generation.js
        // created the pending record under, so it always matches.
        fetch('/.netlify/functions/claim-pending-generation', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pendingId: pendingId, email: email })
        }).catch(function(){ /* best-effort -- see claim-pending-generation.js's own doc comment */ });
      }
      if(pendingOperationName && !pendingStartFailed){
        // mediaType omitted (undefined) — this wall always adopts a
        // video, see adoptPendingGeneration's own doc comment. mood rides
        // along (merge of the mood-music branch onto the unified wall):
        // the adopted dream must carry dream.mood so its bed is
        // mood-keyed — same threading as every other adopt site.
        DreamStore.adoptPendingGeneration(pendingOperationName, pendingStartedAt, assembled.caption, chosenStyle, undefined, currentStoryText, currentMoodForDream());
      }
      track('wizard_completed', { style: chosenStyle, had_pending_generation: !!(pendingOperationName && !pendingStartFailed) });
      // ── Post-signup monetization moment (ONE screen, shown here, right
      //    before the home.html handoff) ──
      // Only for a GENUINELY fresh signup completed on THIS wall
      // (opts.freshSignup — set true only on the email-path result.created;
      // returning-user code-step logins pass it falsy and skip straight
      // through). Also NEVER for a
      // Founder decision 2026-08-11: SHOW the in-app Dreamer Pass paywall to
      // funnel-handoff arrivals too. Previously it was skipped for them (they'd
      // "already passed the growth funnel"), but that meant ~all paid traffic
      // never saw the in-app paywall — so ~0 of real users were ever asked to
      // pay in-app. Now every fresh signup gets it. The pending generation is
      // already adopted/claimed above, so DISMISS goes straight to home (navUrl)
      // and the dream resumes; the CTA redirects to Dodo checkout instead.
      var navUrl = 'home.html?generate=1';
      if(opts.freshSignup){
        // ROBUSTNESS: never let a paywall failure strand a signed-up user.
        // We are PAST adopt/claim here — if showMonetizationMoment throws
        // (js/paywall-moment.js failed to load so window.PaywallMoment is
        // undefined, the overlay build throws, a deploy hiccup, anything), the
        // returned promise would otherwise reject unhandled with NO navigation,
        // leaving the user stuck on wizard.html after their account already
        // exists. On ANY failure, fall through to the normal home handoff.
        try {
          showMonetizationMoment(email, navUrl);
          return; // overlay shown; it owns navigation from here (dismiss/CTA)
        } catch(e) {
          try { track('paywall_moment_error', { message: (e && e.message) || 'error' }); } catch(_e) {}
          // fall through to location.href = navUrl below
        }
      }
      location.href = navUrl;
    });

  // ===================================================================
  // FUNNEL-ARRIVAL REE INSTRUMENTATION (tracking regression fix,
  // 2026-08-11). When the growth funnel pinned its flo arm to 100% of
  // traffic (2026-08-10), every caption-carrying (Build/Write) paid
  // handoff started landing on THIS wall instead of start.html's screen
  // 13 (see the funnel's own redirectToApp wall-routing, and
  // isFunnelHandoffArrival above). start.html's screen 13 fired the ad
  // funnel's own funnel_step_viewed(email_capture) / ReachedEmailEntry /
  // signup_email_entered / signup_email_first_variant_shown on the way
  // through; this wall never did (it was built when it only ever served
  // ORGANIC traffic — see the big "deliberately does NOT fire" comment
  // near boot). So on the first full day at 100% flo those four metrics
  // read ZERO even though real signups kept landing (signed_up fires from
  // js/store.js's commitLocalSignup regardless of which page drove it).
  //
  // Fix: fire the SAME events, with the SAME names and property shapes
  // start.html used, but ONLY for genuine funnel arrivals
  // (isFunnelHandoffArrival) — organic wizard traffic still fires none of
  // them, so the "don't pollute the paid REE metric with organic traffic"
  // intent of the original comment is preserved. variant:'wizard' marks
  // the wall these came from and cleanly marks the cutover in the data,
  // without inventing any new event name. Fired from render() at
  // WALL_STEP (the arrival hook, same place wizard_step_viewed fires) so
  // it re-fires once per fresh arrival and never on the wall's internal
  // email<->code sub-swaps — 1:1 with start.html's own per-arrival
  // semantics.
  var funnelEmailEnteredTracked = false;
  function maybeTrackFunnelEmailEntered(email){
    if(!isFunnelHandoffArrival) return;
    if(funnelEmailEnteredTracked) return;
    if(!email) return;
    funnelEmailEnteredTracked = true;
    track('signup_email_entered', { variant: 'wizard' });
  }
  function fireFunnelWallReachedEvents(){
    if(!isFunnelHandoffArrival) return;
    // Reset per fresh arrival at the wall — NOT on the internal
    // email->code DOM swap (which never re-enters render()), matching
    // start.html's emailEnteredTracked reset placement.
    funnelEmailEnteredTracked = false;
    if(window.posthog && typeof window.posthog.register === 'function'){
      try{ posthog.register({ signup_email_first_variant: 'wizard' }); }catch(e){ /* analytics must never break the funnel */ }
    }
    track('signup_email_first_variant_shown', { variant: 'wizard' });
    // REE (Reached-Email-Entry) — the metric this whole fix restores.
    // step:1/screen:'email_capture' is byte-identical to start.html's own
    // emission so any dashboard keyed on funnel_step_viewed
    // screen='email_capture' reads straight across the page cutover.
    track('funnel_step_viewed', { step: 1, screen: 'email_capture' });
    // Meta CAPI mid-funnel optimization target, same call start.html made
    // (custom event, event_id/CAPI-paired). fbc/fbp were already
    // reconstructed from the handoff URL params in the funnel-arrival wall
    // leg above, so this reaches Meta attributed to the ad.
    fireMetaConversion('ReachedEmailEntry', {}, true);
  }

        formingFrameHtml('Your dream is forming…', chosenStyle),
      // (The editable story recap that briefly lived on this wall is its
      // OWN step now — renderRecap, the screen right before this one —
      // founder round 8: "it was supposed to be editable in a previous
      // page". currentStoryText arrives here already computed/edited.)
      // Screen 13 passwordless's own reassurance copy, verbatim — now A/B
      // tested (wall_subtext_arm='shown'|'hidden', assigned once before
      // boot below). 'hidden' drops the whole line: fnStageHtml filters
      // falsy groups, so the wall renders byte-identically to never having
      // had it (no empty group, no spacer). Nothing else on the wall
      // changes. See the wall_subtext_arm block near boot() for the metric.
      wallSubtextArm === 'shown'
        ? '<div class="fn-microcopy" style="margin:0;">Free to start, no card needed — we’ll email you your dream the moment it’s ready, that’s the only reason we ask.</div>'
        : '',
      '<input class="fn-field" id="contact-email" type="email" placeholder="you@email.com" autocomplete="email" dir="auto">' +

      '<div class="fn-body-copy" style="font-size:11.5px; opacity:.7; text-align:center; margin:8px 0 0;">By signing up, you agree to our <a href="terms.html" style="color:inherit;">Terms</a> and <a href="privacy.html" style="color:inherit;">Privacy Policy</a>.</div>'
    ]);

    tryShowFormingPreview();

    var emailInput = document.getElementById('contact-email');
    var errEl = document.getElementById('contact-error');
    var continueBtn = document.getElementById('fn-contact-continue');
    emailInput.value = contactEmail;

    function trySubmit(){
      contactEmail = emailInput.value.trim();
      // "Entered email" micro-step — fired on the first non-empty submit
      // attempt (paired with the blur handler below), funnel arrivals
      // only. See maybeTrackFunnelEmailEntered / fireFunnelWallReachedEvents.
      maybeTrackFunnelEmailEntered(contactEmail);
      errEl.textContent = '';
      if(!contactEmail || contactEmail.indexOf('@') === -1){
        errEl.textContent = 'Enter a valid email address.';
        track('signup_error_shown', { reason: 'invalid_email' });
        return;
      }

      // Same event the former Contact step fired at this exact moment —
      // kept for dashboard continuity. WhatsApp stays parked, so the
      // property is now always false.
      track('wizard_contact_captured', { has_whatsapp: false });

      var characters = resolveCharactersForGeneration();
      var payload = {
        email: contactEmail, whatsapp: null,
        caption: assembled.caption, style: chosenStyle,
        characters: characters, characterIdsForGeneration: assembled.characterIdsForGeneration,
        sceneryTime: DreamStore.getDraft().sceneryTime, sceneryPlace: settingPlaceKey,
        // storyText — whatever the recap card is showing RIGHT NOW.
        // Deliberately excluded from comparisonKey below: it can
        // legitimately differ across two attempts for otherwise-identical
        // chip content (a non-deterministic LLM rewrite landing between
        // them) and must never, by itself, make an unchanged submission
        // look "changed" and trigger a real duplicate fal.ai charge.
        storyText: currentStoryText
      };
      var submissionKey = JSON.stringify(payload);
      // Comparison-only key: normalizes email casing (mirrors the
      // server's entitlements.normalizeEmail) and strips storyText — see
      // payload's own comment above. The actual POST body keeps both.
      var comparisonPayload = Object.assign({}, payload, { email: contactEmail.toLowerCase() });
      delete comparisonPayload.storyText;
      var comparisonKey = JSON.stringify(comparisonPayload);

      // mood (tracker item for-product-founder-08-04-evening-music--jfjco0)
      // — the Mood step's answer, previously consumed only by
      // assembleCaption/buildDeterministicStory (prompt + story text) and
      // then dropped, so it never reached the finished dream record. Now
      // persisted so js/music-bed.js can key the ambient bed off it. Note
      // this flows to the finished dream by TWO separate routes, and both
      // are wired: the draft (for anything that later regenerates from it)
      // AND, on the actual pre-signup path, the adopted pending job below —
      // that path never calls generateVideo at all, so the draft alone
      // would not have been enough. See WizardChips.persistedMood for what
      // null means here.
      var moodForDream = currentMoodForDream();
      var draftPatch = { caption: assembled.caption, storyText: currentStoryText, style: chosenStyle, characterIds: assembled.characterIdsForGeneration, sceneryTime: DreamStore.getDraft().sceneryTime, sceneryPlace: settingPlaceKey, mood: moodForDream };

      continueBtn.disabled = true;
      backBtn.disabled = true;
      continueBtn.textContent = 'Checking…';
      signupAttemptToken++;
      var myToken = signupAttemptToken;

      checkEmailAvailable(contactEmail).then(function(checkResult){
        if(myToken !== signupAttemptToken) return; // stale -- navigated away while this was in flight
        // Only `deliverable` gates here (an obviously mistyped domain is
        // still caught before an account is created around it, and
        // before the real, billed generation fires) — `available` no
        // longer stops anything, matching screen 13's live passwordless
        // wall: an already-registered email resolves through the code
        // step below instead of dead-ending.
        if(!checkResult.deliverable){
          continueBtn.disabled = false;
          backBtn.disabled = false;
          continueBtn.textContent = 'Send me my dream';
          errEl.textContent = 'That email address doesn’t look right — check for a typo.';
          track('signup_error_shown', { reason: 'email_undeliverable' });
          return;
        }

        // The draft must be intact BEFORE anything can navigate away —
        // home.html's fallback fresh-generation path reads it directly.
        DreamStore.setDraft(draftPatch);
        var pendingPromise = getOrStartPendingGeneration(submissionKey, comparisonKey);
        continueBtn.textContent = 'Sending…';

        DreamStore.signupPasswordless(contactEmail).then(function(result){
          if(myToken !== signupAttemptToken) return; // stale -- see above
          if(!result.ok){
            continueBtn.disabled = false;
            backBtn.disabled = false;
            continueBtn.textContent = 'Send me my dream';
            errEl.textContent = result.error || "Couldn’t sign you in — try again.";
            track('signup_error_shown', { reason: 'signup_failed' });
            return;
          }
          if(result.pendingVerification){
            // An already-registered email — no session was established
            // (see signupPasswordless's SECURITY FIX doc comment); swap
            // to the code-entry step instead of advancing anywhere.
            track('signup_error_shown', { reason: 'already_registered_needs_code' });
            renderCodeStep(el, contactEmail, pendingPromise);
            return;
          }
          if(result.created){
            // signup_method: 'passwordless_code' — same value screen 13's
            // live passwordless wall reports (see attemptSignup's
            // original comment in start.html for the custom_data/CAPI
            // pass-through convention).
            fireMetaConversion('CompleteRegistration', { email: contactEmail, custom_data: { signup_method: 'passwordless_code' } });
          }
          // Suppress the deferred email-verify sheet on the first landing
          // — same first-session-reveal protection as screen 13 (see
          // js/email-verify-sheet.js's own header comment).
          try { sessionStorage.setItem('dreamtube_email_verify_sheet_shown', '1'); } catch(e) { /* private mode etc — worst case the sheet offers on this landing too, a minor UX rough edge */ }
          completeSignupAndAdvance(contactEmail, {
            pendingPromise: pendingPromise,
            isStale: function(){ return myToken !== signupAttemptToken; },
            // A brand-new account was just created here (result.created) — the
            // only path that earns the post-signup monetization moment. An
            // already-registered email resolves through renderCodeStep above
            // (a LOGIN, not a signup) and never reaches this call.
            freshSignup: !!result.created
          });
        });
      });
    }

    continueBtn.addEventListener('click', trySubmit);
    emailInput.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); trySubmit(); } });
    // "Entered email" micro-step — first non-empty blur (funnel arrivals
    // only; no-op otherwise). Paired with the submit-time fire in
    // trySubmit; whichever comes first wins. Mirrors start.html's screen
    // 13 blur wiring exactly.
    emailInput.addEventListener('blur', function(){ maybeTrackFunnelEmailEntered(emailInput.value.trim()); });
    // Round 9, fix #6 (founder iPhone screenshot): NO auto-focus here.
    // Focusing the email field on render made iOS open the keyboard +
    // AutoFill bar immediately and scroll the "Your dream is forming…"
    // veil — the top of this wall, the screen's whole persuasion — out
    // of view. The field focuses only when the user themselves taps it
    // (or explicitly asks to retype — see the code step's "Use a
    // different email" handler, which DOES focus after re-rendering).
  }

  /**
   * The code-entry step for an already-registered email (ported from
   * renderScreen13Passwordless's renderCodeStep — see that function's
   * doc comment in start.html). `outerPendingPromise` is the SAME
   * getOrStartPendingGeneration promise already kicked off by the email
   * submit (keyed on this same email + content, so it's still valid to
   * hand to completeSignupAndAdvance once login succeeds here).
   */
  function renderCodeStep(el, email, outerPendingPromise){
    backBtn.disabled = false;
    el.innerHTML = fnStageHtml([
      '<div class="fn-headline">Check your email</div>' +
      '<div class="fn-microcopy" style="margin:6px 0 0;">We found an account for <b>' + esc(email) + '</b> — enter the code we just sent, or tap the link in that email.</div>',
      '<input class="fn-field" id="fn-login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="text-align:center; letter-spacing:6px; font-size:20px;">' +
      '<div class="fn-err-text" id="contact-error"></div>',
      '<button class="fn-btn-primary" id="fn-code-continue" type="button">Continue</button>' +
      '<button type="button" class="fn-small-link" id="fn-resend-code" style="margin:10px 0 0;">Resend code</button>' +
      '<button type="button" class="fn-small-link" id="fn-change-email" style="margin:0;">Use a different email</button>'
    ]);

    var codeInput = document.getElementById('fn-login-code');
    var errEl = document.getElementById('contact-error');
    var continueBtn = document.getElementById('fn-code-continue');
    var resendLink = document.getElementById('fn-resend-code');

    document.getElementById('fn-change-email').addEventListener('click', function(){
      // Same invalidation discipline as every other Change-email handler
      // in this codebase — an in-flight call must never act on a screen
      // the visitor already navigated away from.
      signupAttemptToken++;
      DreamStore.invalidatePendingSignup();
      backBtn.disabled = false;
      renderWallEmailStep(el);
      // "Use a different email" is the user explicitly asking to type —
      // the one place focusing the field IS the right response (fix #6
      // removed the wall's render-time auto-focus; this is the sanctioned
      // exception, per the same user-gesture rule every other focus()
      // in this file follows).
      var retypeEmail = document.getElementById('contact-email');
      if(retypeEmail) retypeEmail.focus();
    });

    resendLink.addEventListener('click', function(){
      resendLink.disabled = true;
      var originalLabel = resendLink.textContent;
      resendLink.textContent = 'Sending…';
      // Re-submitting to signupPasswordless is the resend mechanism —
      // register-account-passwordless.js's resolve branch always mails a
      // FRESH code on every call. Harmless to let land late (worst case a
      // second real code is also valid), unlike an actual login attempt.
      DreamStore.signupPasswordless(email).then(function(){
        resendLink.disabled = false;
        resendLink.textContent = 'Sent — check your email';
        setTimeout(function(){ resendLink.textContent = originalLabel; }, 4000);
      });
    });

    function trySubmitCode(){
      var code = codeInput.value.trim();
      errEl.textContent = '';
      if(!/^[0-9]{6}$/.test(code)){ errEl.textContent = 'Enter the 6-digit code from your email.'; return; }

      continueBtn.disabled = true;
      backBtn.disabled = true;
      continueBtn.textContent = 'Checking…';
      signupAttemptToken++;
      var myToken = signupAttemptToken;

      DreamStore.loginWithEmailCode(email, code).then(function(result){
        if(myToken !== signupAttemptToken) return; // stale -- navigated away while this was in flight
        if(!result.ok){
          continueBtn.disabled = false;
          backBtn.disabled = false;
          continueBtn.textContent = 'Continue';
          errEl.textContent = result.error || "Couldn’t sign you in — try again.";
          track('signup_error_shown', { reason: 'login_code_failed' });
          return;
        }
        // CompleteRegistration is deliberately NOT fired here — this is a
        // LOGIN to an existing account, not a new signup (same rule every
        // other login branch in this codebase follows).
        track('returning_user_login_succeeded', { method: 'email_code' });
        completeSignupAndAdvance(email, {
          pendingPromise: outerPendingPromise || undefined,
          isStale: function(){ return myToken !== signupAttemptToken; }
        });
      });
    }
    continueBtn.addEventListener('click', trySubmitCode);
    codeInput.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); trySubmitCode(); } });
    codeInput.focus();
  }

  // ===================================================================
  // Question-first screen 1 — "What was your dream about?" as a six-tile
  // grid, wizard.html's FIRST screen. This REPLACED the round-8 build/
  // write/speak mode chooser: mirroring the growth funnel's finalized
  // question-first entry (dreamtube-growth/index.html — screen1-static-
  // hero-trim), the six tiles ARE the mode choice, and each tile SEEDS the
  // wizard (mode + starting chip state) and jumps to the first follow-up
  // it hasn't already answered, so nothing is re-asked. Shown to FRESH
  // entries only — never a funnel-style ?resume=1 arrival (those already
  // chose funnel-side), exactly like the chooser it replaced.
  //
  // Static, webview-SAFE hero: a 2x2 collage of local store images (no
  // video, no autoplay, zero extra network beyond four same-origin webp
  // thumbnails), per the finalized growth shape (which dropped the
  // tap-to-play hero, the "surprise me" escape hatch, and the beta
  // footnote — none are carried here).
  //
  // Still a PRE-step outside SCREEN_RENDERERS: it fires only
  // wizard_entry_mode_chosen { mode, surface:'wizard', tile } (the same
  // sanctioned event the chooser fired, plus which tile committed) — no
  // wizard_step_viewed, so every retained step number stays byte-stable
  // (see STEP_ANALYTICS).
  //
  // Tile → seed/route (mirrors the growth funnel's QUESTION_TILES):
  //   Flying / Being chased / A place / Something surreal → build mode,
  //     each SEEDS the Action ("the one beat") and marks it answered
  //     (actionSeededByTile) so the Action step is skipped — the visitor
  //     lands on Who → Style → …, never re-asked what they just told us.
  //   Someone specific → build mode, routes into the Subject/who-detail
  //     path (opens the character sheet on the Subject step); the Action
  //     is NOT seeded, so it IS asked (Who → What → Style → …).
  //   I'll describe it → write mode, straight to the free-text step, then
  //     recap → wall — identical to the chooser's old write routing.
  //
  // Speak-it is preserved as a secondary link below the grid (NOT one of
  // the six tiles), routing to create.html's existing record flow via its
  // login gate (create.html?record=1) exactly as the chooser's record
  // option did, and hidden entirely in FB/IG in-app webviews (media-
  // constrained — same detectInAppHost guard). Dropping it from the entry
  // point would orphan the pre-signup speak path; create.html keeps its
  // own record entry regardless.
  // ===================================================================
  var chooserOffered = false; // did THIS session show the question-first screen? (drives the extra first progress dot)
  var chooserActive = false;  // is the question-first screen the one on display right now?
  var entryMode = null;       // null | 'build' | 'write' | 'record' — the committed tile pick
  var actionSeededByTile = false; // a scenario tile already answered the Action step → skip it (see next()/Back)

  function detectInAppHost(){
    var ua = navigator.userAgent || '';
    if (/FBAN|FBAV/.test(ua)) return 'Facebook';
    if (/Instagram/.test(ua)) return 'Instagram';
    return null;
  }

  // The six question tiles. `seed()` mutates the wizard's starting state
  // (mode + chips); `someone`/`write` mark the two tiles with special
  // routing (see the click handler). Order/labels mirror the growth
  // funnel's finalized QUESTION_TILES exactly. Action keys are this app's
  // WizardChips.ACTION_CHIPS keys ('running' is the app's key for the
  // growth funnel's 'chased').
  var QUESTION_TILES = [
    { emoji:'🕊️', label:'Flying',           seed:function(){ entryMode='build'; actionKey='flying';    actionSeededByTile=true; } },
    { emoji:'🏃', label:'Being chased',      seed:function(){ entryMode='build'; actionKey='running';   actionSeededByTile=true; } },
    { emoji:'👤', label:'Someone specific',  someone:true, seed:function(){ entryMode='build'; } },
    { emoji:'🏞️', label:'A place',           seed:function(){ entryMode='build'; actionKey='exploring'; actionSeededByTile=true; } },
    { emoji:'🌀', label:'Something surreal',  seed:function(){ entryMode='build'; actionKey='magical';   actionSeededByTile=true; } },
    { emoji:'✍️', label:"I'll describe it",  write:true,   seed:function(){ entryMode='write'; } }
  ];

  function showQuestionFirst(){
    chooserActive = true;
    cancelAutoAdvance();
    renderProgress();
    var tilesHtml = QUESTION_TILES.map(function(t, i){
      return '<button class="fn-q-tile" type="button" data-tile="' + i + '">' +
        '<span class="fn-q-emoji" aria-hidden="true">' + t.emoji + '</span>' +
        '<span>' + esc(t.label) + '</span>' +
      '</button>';
    }).join('');
    // Static portrait triptych — three full store-image stills (local,
    // same-origin), no video. Intrinsic width/height are the real 400x711
    // asset dimensions: a webview that hasn't applied the CSS aspect-ratio
    // yet still lays the cells out portrait, not as a flash of squares.
    var collage =
      '<div class="fn-q-collage" aria-hidden="true">' +
        '<div class="fn-q-cell"><img src="/assets/store/dream-desert.webp" width="400" height="711" alt=""></div>' +
        '<div class="fn-q-cell"><img src="/assets/store/dream-ocean.webp" width="400" height="711" alt=""></div>' +
        '<div class="fn-q-cell"><img src="/assets/store/dream-forest.webp" width="400" height="711" alt=""></div>' +
        '<span class="fn-q-cap">Real dreams, brought to life</span>' +
      '</div>';
    // Speak-it secondary link — preserved from the old chooser's record
    // option, hidden in media-constrained webviews (same rule as before).
    var speakLink = detectInAppHost()
      ? ''
      : '<span class="fn-small-link" id="fn-q-speak" style="cursor:pointer;">🎙️ Prefer to talk it through? Speak it instead</span>';
    screenEl.innerHTML =
      collage +
      '<div class="fn-q-promise">Turn your dream into a <span class="u">video</span> in about a minute</div>' +
      '<div class="fn-q-label">What was your dream about?</div>' +
      '<div class="fn-q-grid" id="fn-q-grid">' + tilesHtml + '</div>' +
      speakLink;
    screenEl.scrollTop = 0;
    window.scrollTo(0, 0);

    var commitTimer = null; // single-flight, re-armed per tap — a quick second tap means the LAST pick wins, exactly once
    document.getElementById('fn-q-grid').addEventListener('click', function(e){
      var btn = e.target.closest('[data-tile]');
      if(!btn) return;
      var tile = QUESTION_TILES[+btn.dataset.tile];
      if(!tile) return;
      Array.prototype.forEach.call(document.querySelectorAll('#fn-q-grid .fn-q-tile'), function(x){ x.classList.remove('sel'); });
      btn.classList.add('sel');
      if(tile.seed) tile.seed();
      // Same sanctioned event the chooser fired (entryMode is the resolved
      // mode), plus which tile committed — additive, no renumbering.
      track('wizard_entry_mode_chosen', { mode: entryMode, surface: 'wizard', tile: tile.label });
      if(commitTimer) clearTimeout(commitTimer);
      commitTimer = setTimeout(function(){
        commitTimer = null;
        chooserActive = false;
        if(tile.write){ goToStep(FREETEXT_STEP); return; }
        // Build tiles land on the Subject (Who) step. "Someone specific"
        // additionally opens the character sheet there, routing straight
        // into the who-detail path (mirrors the growth funnel's openWho).
        goToStep(0);
        if(tile.someone && typeof openCharSheet === 'function'){ openCharSheet('other', null); }
      }, 260);
    });

    var speakEl = document.getElementById('fn-q-speak');
    if(speakEl) speakEl.addEventListener('click', function(){
      entryMode = 'record';
      track('wizard_entry_mode_chosen', { mode: 'record', surface: 'wizard', tile: null });
      location.href = 'create.html?record=1';
    });
  }

  // ===================================================================
  // Navigation engine — same shape as start.html's own goToStep/next/prev.
  // ===================================================================
  // Question-first trim (mirrors the growth funnel): the standalone
  // Setting ("Where") and Mood ("How did it feel") steps were REMOVED as
  // questions — both are now inferred into the caption (a per-action
  // fallback place via WizardChips.inferFallbackPlaceKey, plus the default
  // dreamy mood/hazy-ethereal lighting assembleCaption already infers).
  // The flow is now Who → What → Style → (free text) → recap → wall, and a
  // scenario tile that pre-seeded the Action skips the What step too (see
  // next()/Back's actionSeededByTile handling).
  var SCREEN_RENDERERS = [renderSubject, renderAction, renderStyleStep, renderFreeText, renderRecap, renderSignupWall];
  // ANALYTICS STABILITY: every RETAINED screen keeps the exact
  // wizard_step_viewed step value it has always reported, so historical
  // funnels/dashboards keyed on those numbers read on across the trim —
  // Subject stays 1, Action stays 3, Style stays 5, FreeText stays 6, the
  // wall stays 7. The removed Setting (2) and Mood (4) numbers simply no
  // longer fire; the recap maps to null and fires wizard_recap_viewed {}
  // instead (see render below); the question-first screen is a pre-step
  // outside this array entirely and fires only wizard_entry_mode_chosen.
  // This table is positional against SCREEN_RENDERERS.
  var STEP_ANALYTICS = [1, 3, 5, 6, null, 7];
  // Same dynamic-lookup reasoning as start.html's SIGNUP_STEP — these
  // indexes shift if a screen is ever added in front of them, so nothing
  // below hardcodes them.
  var WALL_STEP = SCREEN_RENDERERS.indexOf(renderSignupWall);
  var RECAP_STEP = SCREEN_RENDERERS.indexOf(renderRecap);
  var FREETEXT_STEP = SCREEN_RENDERERS.indexOf(renderFreeText);
  var ACTION_STEP = SCREEN_RENDERERS.indexOf(renderAction);
  var cur = 0;

  // A step the sequential next()/Back walk should step OVER (never a
  // directly-targeted goToStep). The Action ("What") step is skipped when a
  // question-first scenario tile already answered it (actionSeededByTile) —
  // the growth funnel achieves the same by omitting build_what from that
  // tile's tail. Nothing else is ever skipped.
  function stepShouldSkip(i){
    return i === ACTION_STEP && actionSeededByTile;
  }
  var screenEl = document.getElementById('fnScreen');
  var progressEl = document.getElementById('fnProgress');
  var backBtn = document.getElementById('fnBack');
  backBtn.innerHTML = Icons.back;

  function renderProgress(){
    // Progress dots cover the entry chooser (when this session was
    // offered one — the mock counts it as the first dot), the six core
    // steps, and the recap. The signup wall stays its own dot-less
    // phase, same as start.html not counting its own signup/pricing/
    // confirm screens against the earlier Advanced dots.
    var dots = '';
    if(chooserOffered) dots += '<i class="' + (chooserActive ? 'now' : 'done') + '"></i>';
    for(var i = 0; i < WALL_STEP; i++){
      if(stepShouldSkip(i)) continue; // a tile-seeded Action step is never visited — don't render a dot for it
      dots += '<i class="' + (chooserActive ? '' : (i < cur ? 'done' : i === cur ? 'now' : '')) + '"></i>';
    }
    progressEl.innerHTML = (chooserActive || cur < WALL_STEP) ? dots : '';
  }
  function render(){
    chooserActive = false;
    SCREEN_RENDERERS[cur](screenEl);
    renderProgress();
    screenEl.scrollTop = 0;
    window.scrollTo(0, 0);
    // Byte-stable step analytics — see STEP_ANALYTICS's own comment.
    var stepNo = STEP_ANALYTICS[cur];
    if(stepNo !== null) track('wizard_step_viewed', { step: stepNo });
    else track('wizard_recap_viewed', {});
    // Ad-funnel REE instrumentation for paid arrivals landing on this wall
    // (the flo-arm handoff, 2026-08-10). No-op for organic traffic and for
    // every non-wall step — see fireFunnelWallReachedEvents' own comment.
    if(cur === WALL_STEP) fireFunnelWallReachedEvents();
  }
  function goToStep(n){
    if(n < 0 || n >= SCREEN_RENDERERS.length) return;
    cur = n;
    render();
  }
  function next(){
    // Manual and automatic advancement share this one path — cancelling
    // here is what makes a Continue tap inside the auto-advance window
    // advance exactly once (see scheduleAutoAdvance's own comment).
    cancelAutoAdvance();
    var n = cur + 1;
    while(n < SCREEN_RENDERERS.length && stepShouldSkip(n)) n++; // step over a tile-seeded Action
    goToStep(n);
  }
  backBtn.addEventListener('click', function(){
    // An auto-advance armed on the step being left must never fire into
    // the screen Back is about to show.
    cancelAutoAdvance();
    // On the chooser itself, Back leaves the wizard for the welcome
    // screen — same exit the first step used to own.
    if(chooserActive){ location.href = 'index.html'; return; }
    // (Round 9: Back deliberately does NOT touch the story pin anymore.
    // Round 8 cleared it whenever the recap was left backwards, which
    // wiped a hand-edit on an accidental Back→Forward with nothing
    // changed — bug-hunt finding #2. The pin now releases itself inside
    // computeStoryText the moment the dream's content signature actually
    // differs; see storyContentSignature/the release rule comment.)
    // Invalidates any in-flight (or not-yet-acted-on) wall attempt the
    // moment the user navigates away via Back -- see signupAttemptToken's
    // own comment above. Bumping only on the wall's own submit click
    // would miss this: a visitor can navigate away from the wall and just
    // sit somewhere else without ever starting a competing second
    // attempt, and the abandoned first attempt's callback must still be
    // discarded once it settles late. Harmless to bump unconditionally on
    // every Back click, including ones that have nothing to do with the
    // wall -- there's simply nothing in flight for it to invalidate.
    signupAttemptToken++;
    // Also invalidates any in-flight DreamStore.signupPasswordless()/
    // login call at the STORE layer, not just this file's own UI-level
    // token above -- the UI token alone only stops THIS page's callback
    // from reacting to a stale response; it can't stop js/store.js's own
    // commit helpers from silently writing state.user/state.accounts in
    // the background, since that write happens INSIDE the store call,
    // before this callback (or its token check) ever runs. See
    // DreamStore.invalidatePendingSignup's own doc comment (js/store.js)
    // and tracker item js-store-js-signupcallseq-only-invalidat-ijwpht.
    DreamStore.invalidatePendingSignup();
    // Same reasoning for the pre-account generation call (tracker item
    // for-product-money-leak-blocked-signups-e-v2g1vi): a since-abandoned
    // submit's belated settlement must not write pending state for an
    // attempt the user already walked away from. The comparison-key reset
    // goes with it — the abandoned promise's write was just invalidated,
    // so it must not be reusable as if it were still going to produce a
    // pendingId (a later identical resubmit fires fresh instead, exactly
    // the pre-wall behavior).
    pendingGenerationToken++;
    pendingGenerationComparisonKey = null;
    // Chooser-aware Back: the first screen this visitor actually SAW
    // comes back — Subject's Back returns to the question-first screen when
    // one was offered (else index.html, as always), and a write-mode
    // visitor's Back from the free-text step returns to it too (they never
    // saw Subject..Style, so stepping into those would be a screen they
    // don't recognize; tapping a build tile there walks them forward
    // normally). A scenario tile re-seeds cleanly on the next pick, so
    // reset its Action-skip marker on the way back to the tiles.
    if(chooserOffered && (cur === 0 || (entryMode === 'write' && cur === FREETEXT_STEP))){ actionSeededByTile = false; showQuestionFirst(); return; }
    // Funnel arrivals land DIRECTLY on the wall — the steps behind it
    // belong to the funnel (its own recap is one browser-Back away), not
    // to this page's empty chip flow, so Back leaves the way they came
    // instead of stepping into a wizard they never walked.
    if(funnelArrival && cur === WALL_STEP){ history.back(); return; }
    if(cur > 0){
      var p = cur - 1;
      while(p > 0 && stepShouldSkip(p)) p--; // step back over a tile-seeded Action
      goToStep(p);
      return;
    }
    location.href = 'index.html';
  });

  // ===================================================================
  // Boot — render the entry screen for this arrival (question-first for
  // fresh/direct visitors, the signup wall for a funnel handoff).
  // ===================================================================
  function boot(){
      // Fresh entries (Get Started / direct) meet the question-first
      // screen 1 first. A ?resume=1 arrival (funnel-style handoff) skips
      // it: funnel users already chose their scenario funnel-side.
      if(getParam('resume') !== '1'){
        chooserOffered = true;
        showQuestionFirst();
        return;
      }
      // ===== FUNNEL-ARRIVAL WALL LEG (wall routing, 2026-08-08) =====
      // The growth funnel's flo arm hands off HERE now instead of
      // start.html — founder test result: funnel arrivals were landing
      // on start.html's leftover screen 13 (email-only, no forming veil,
      // old styling) instead of this page's approved Layout-B wall. A
      // resume arrival CARRYING A BUILT DREAM (caption param — the same
      // param name start.html's resume leg reads) lands DIRECTLY on the
      // wall: dream already built and recapped funnel-side, so the only
      // thing left is the veil + email wall. Everything below
      // mirrors start.html's own arrival leg 1:1 (cross-referenced
      // there), so routing flo arrivals here loses nothing:
      //   - character stash adoption (js/funnel-character-stash.js, the
      //     shared consuming helper) into THIS page's staged roster +
      //     selection, so a stashed self photo/description rides the
      //     wall's start-pending-generation call;
      //   - PostHog identity stitch (distinct_id param ->
      //     linkPreSignupIdentity);
      //   - Meta attribution cookie persistence (fbc/fbp/fbclid params);
      //   - the funnel_resumed_from_marketing event, same props.
      // A bare ?resume=1 WITHOUT a caption keeps the pre-existing
      // defensive behavior (chooser-free step flow) unchanged.
      if(isFunnelHandoffArrival){
        // Same cross-app PostHog identity stitch as start.html's arrival
        // leg (see that file's handoffDistinctId block for the full
        // rationale) — identify BEFORE any of this page's own events fire.
        var handoffDistinctId = getParam('distinct_id');
        if(handoffDistinctId && window.DreamStore && typeof DreamStore.linkPreSignupIdentity === 'function'){
          try{ DreamStore.linkPreSignupIdentity(handoffDistinctId); }catch(e){ /* analytics must never break the app */ }
        }
        // Same Meta click-attribution cookie handoff as start.html's
        // persistMetaAttributionCookies (see that block for the full
        // rationale; fbclid->fbc construction per Meta's documented
        // format, subdomain-index 1 per growth's handoff contract).
        (function persistMetaAttributionCookies(){
          try{
            var setFirstPartyCookie = function(name, value){
              try{ document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + (90 * 24 * 60 * 60) + '; SameSite=Lax; Secure'; }catch(e){ /* analytics must never break the app */ }
            };
            var handoffFbc = getParam('fbc');
            var handoffFbp = getParam('fbp');
            var handoffFbclid = getParam('fbclid');
            if(handoffFbc) setFirstPartyCookie('_fbc', handoffFbc);
            if(handoffFbp) setFirstPartyCookie('_fbp', handoffFbp);
            if(handoffFbclid && !handoffFbc && !getMetaCookies().fbc){
              setFirstPartyCookie('_fbc', 'fb.1.' + Date.now() + '.' + handoffFbclid);
            }
          }catch(e){ /* analytics must never break the app */ }
        })();
        // Character stash adoption — the shared one-shot consume
        // (validation floor, 30-min bound; see the helper's own header),
        // staged + selected exactly like sheet-entered characters, so
        // resolveCharactersForGeneration/flushStagedCharactersToStore
        // treat them identically.
        if(window.FunnelCharacterStash){
          FunnelCharacterStash.consume().forEach(function(character){
            staged.characters.push(character);
            staged.subjectCharacterIds.push(character.id);
          });
        }
        // Same event + props start.html's arrival leg fires, so the
        // funnel-arrival marker is page-agnostic in every dashboard.
        track('funnel_resumed_from_marketing', {
          recall: getParam('recall') || null,
          dream_types: (getParam('types') || '').split(',').filter(Boolean),
          motivations: (getParam('motivations') || '').split(',').filter(Boolean),
          style: getParam('style') || null
        });
        funnelArrival = true;
        funnelCaption = getParam('caption');
        if(getParam('style')) chosenStyle = getParam('style');
        assembleFromState(); // funnel branch — set eagerly so the wall always renders a real assembled dream
        cur = WALL_STEP;
        render();
        return;
      }
      render();
  }

  // ===================================================================
  // Signup-wall subtext A/B test (wall-subtext) -- LIVE 50/50
  // Tests whether the wall's reassurance line ("Free to start, no card
  // needed — we'll email you your dream the moment it's ready, that's the
  // only reason we ask.") helps or hurts signup conversion. Two arms:
  //   'shown'  -- the line renders (today's behavior).
  //   'hidden' -- the line is dropped; the wall is otherwise identical.
  //
  // WHY here, in wizard.html: the signup wall (renderWallEmailStep) lives
  // ON THIS PAGE for EVERY arrival — direct app visitors AND funnel
  // arrivals, which the flo-arm wall routing lands on this same wizard.
  // So this is the one shared spot where the wall renders, and the arm is
  // decided here, once, before boot() paints anything. Persisted in
  // localStorage (app-origin-scoped, exactly where the wall renders) so
  // it's STABLE per visitor/browser across re-renders and repeat visits —
  // no reassignment, no flicker.
  //
  // Mirrors the funnel's funnel-lb-skin machinery exactly (dreamtube-
  // growth/index.html assignSkinArm): a founder/QA override (?wallsubtext=
  // shown|hidden), else a persisted deterministic 50/50 seeded from the
  // PostHog distinct_id when it's resolved synchronously, else a random
  // 50/50 — either way persisted, so the seed source never changes the arm
  // after first assignment. Recorded the SAME way: a PostHog super property
  // (wall_subtext_arm) registered BEFORE render so it rides EVERY
  // subsequent event (the wall's wizard_step_viewed {step:7} and the
  // eventual signed_up), plus one experiment_exposure event. NO other
  // event or param changes.
  //
  // METRIC / QUERY: signup-wall -> signed_up conversion, split by arm.
  //   Denominator: wizard_step_viewed where step = 7 (the wall reached).
  //   Numerator:   signed_up (either signup_method).
  //   Break down both by the super property `wall_subtext_arm`
  //   ('shown' vs 'hidden'); or read the exposure directly
  //   (experiment='wall-subtext', variant='shown'|'hidden'). Decision
  //   point ~2 days out, once each arm has enough wall views.
  // ===================================================================
  var WALL_SUBTEXT_ARM_KEY = 'dt_wall_subtext_arm';
  function wsHashStr(s){ var h = 0; for(var i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return h; }
  function assignWallSubtextArm(){
    // Founder/QA preview override (?wallsubtext=shown|hidden): forces the
    // arm and persists it so the whole session stays consistent. Real
    // visitors never carry this param; founder traffic is already excluded
    // from arm analysis by the IL/alias filters — so its exposure can't
    // pollute the read.
    try{
      var forced = new URLSearchParams(location.search).get('wallsubtext');
      if(forced === 'shown' || forced === 'hidden'){
        try{ localStorage.setItem(WALL_SUBTEXT_ARM_KEY, forced); }catch(e){}
        return forced;
      }
    }catch(e){ /* URLSearchParams unavailable — fall through to normal assignment */ }
    // A/B concluded on 'shown' (founder 2026-08-11): the reassurance line
    // always shows now — with Facebook login gone, the 'hidden' arm left the
    // wall looking empty. The ?wallsubtext override above still forces a value
    // for testing; default is always 'shown'.
    return 'shown';
  }
  var wallSubtextArm = assignWallSubtextArm();
  // Attach the arm to every event (rides the deferred wall wizard_step_viewed
  // + signed_up) + fire the matching exposure, BEFORE boot() renders.
  try{ if(window.posthog && typeof posthog.register === 'function') posthog.register({ wall_subtext_arm: wallSubtextArm }); }catch(e){ /* analytics must never break the wizard */ }
  track('experiment_exposure', { experiment: 'wall-subtext', variant: wallSubtextArm });

  boot();
})();
</script>
