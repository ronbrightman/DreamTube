<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>הספירה של בן</title>
<!-- The founder's family agreement with his son over when Instagram may be
     installed. Two people use this page from two phones: the son ticks two
     boxes a day (kept to his screen-time limit / read), the founder watches
     the same numbers move. It lives here, on an obscure URL like the rest of
     this repo's -x7q4 pages, for one reason: the son has no account
     anywhere, and every account-based way to share a live page would have
     made him sign into something first.

     THE AGREEMENT: 2027-03-24 (his 13th birthday) is the base date. Every
     day he keeps to the screen-time limit brings it one day closer; every
     day he reads brings it one more. So a day with both ticked advances the
     countdown by three -- the day that elapsed anyway, plus the two earned.
     A missed day simply earns nothing; there are no penalties and the date
     never moves back.

     All of that arithmetic lives HERE, in this page. The server
     (netlify/functions/ben-agreement.js) only records which boxes are
     ticked on which day, because that is the only part that cannot be
     recomputed. If the agreement's terms ever change, this file is the one
     to edit.

     No auth, deliberately -- see ben-agreement.js's own header comment for
     what bounds that (server-side date limits, a per-IP write budget, and
     a record holding nothing but two booleans per day). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Suez+One&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F8FA;
  --ink:#141D24; --muted:#5C6E78; --line:#D6DEE4;
  --teal:#0C8079; --teal-soft:#D2E9E6; --teal-ink:#08514D;
  --amber:#B87708; --amber-soft:#F6E7C8; --amber-ink:#7A4E04;
  --ring:0 0 0 3px rgba(12,128,121,.35);
  --shadow:0 1px 2px rgba(20,29,36,.06), 0 10px 26px -14px rgba(20,29,36,.28);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1418; --surface:#151E23; --surface-2:#1B262C;
    --ink:#E7EEF1; --muted:#93A6AE; --line:#26343B;
    --teal:#35C2B6; --teal-soft:#123330; --teal-ink:#7FDDD4;
    --amber:#EDB34A; --amber-soft:#332811; --amber-ink:#F5CE87;
    --ring:0 0 0 3px rgba(53,194,182,.4);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%}
#app{max-width:560px; margin:0 auto; padding:20px 16px 56px; display:flex; flex-direction:column; gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow)}
.eyebrow{font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}

.hero{padding:22px 20px 20px; display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center}
.bignum{font-family:"Suez One","Assistant",Georgia,serif; font-weight:400;
  font-size:clamp(80px,27vw,150px); line-height:.92; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; color:var(--ink); margin:2px 0 0}
.bignum.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
.bigword{font-size:19px; font-weight:800; color:var(--muted)}
.unlock{font-size:15px; color:var(--muted)}
.unlock b{color:var(--ink); font-weight:800}
.bar{width:100%; height:10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin-top:14px}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--amber)); transition:width .5s ease}
.barlabels{width:100%; display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums}

.editor{padding:16px}
.editor-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px}
.editor-date{font-size:17px; font-weight:800}
.editor-date small{display:block; font-weight:400; font-size:13px; color:var(--muted)}
.today-btn{background:none; border:1px solid var(--line); color:var(--muted); border-radius:99px; padding:5px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer}
.today-btn:hover{color:var(--ink); border-color:var(--muted)}
.toggles{display:flex; flex-direction:column; gap:10px}
.tg{display:flex; align-items:center; gap:12px; width:100%; text-align:start;
  padding:14px 16px; border-radius:14px; cursor:pointer;
  background:var(--surface-2); border:1.5px solid var(--line); color:var(--ink);
  font:inherit; font-weight:700; font-size:16px; transition:background .15s,border-color .15s,transform .08s}
.tg:active{transform:scale(.985)}
.tg .box{width:26px; height:26px; flex:0 0 26px; border-radius:8px; border:2px solid var(--line);
  background:var(--surface); display:grid; place-items:center; transition:inherit}
.tg .box svg{width:16px; height:16px; opacity:0; transform:scale(.5); transition:opacity .15s, transform .2s cubic-bezier(.2,1.5,.4,1)}
.tg .box svg path{stroke:#fff}
.tg .sub{display:block; font-weight:400; font-size:13px; color:var(--muted)}
.tg[aria-pressed="true"] .box svg{opacity:1; transform:scale(1)}
.tg[data-k="s"][aria-pressed="true"]{background:var(--teal-soft); border-color:var(--teal)}
.tg[data-k="s"][aria-pressed="true"] .box{background:var(--teal); border-color:var(--teal)}
.tg[data-k="s"][aria-pressed="true"] .sub{color:var(--teal-ink)}
.tg[data-k="r"][aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber)}
.tg[data-k="r"][aria-pressed="true"] .box{background:var(--amber); border-color:var(--amber)}
.tg[data-k="r"][aria-pressed="true"] .sub{color:var(--amber-ink)}
.tg:focus-visible,.today-btn:focus-visible,.nav:focus-visible,.cell:focus-visible{outline:none; box-shadow:var(--ring)}
.tg[disabled]{opacity:.45; cursor:not-allowed}
.daysum{margin-top:12px; font-size:13.5px; color:var(--muted); text-align:center; min-height:20px}
.daysum b{color:var(--ink)}

.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.stat{padding:13px 14px; display:flex; flex-direction:column; gap:2px}
.stat .v{font-family:"Suez One","Assistant",serif; font-size:27px; line-height:1.1; font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px; color:var(--muted); font-weight:600}
.stat.s .v{color:var(--teal)} .stat.r .v{color:var(--amber)}
.stat .v.small{font-size:19px; font-family:"Assistant",sans-serif; font-weight:800; padding-top:6px}

.cal{padding:14px 12px 16px}
.calhead{display:flex; align-items:center; justify-content:space-between; padding:0 4px 10px}
.calhead .m{font-weight:800; font-size:16px}
.nav{background:none; border:1px solid var(--line); color:var(--ink); width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:15px; line-height:1; display:grid; place-items:center}
.nav[disabled]{opacity:.3; cursor:default}
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.wd{text-align:center; font-size:11.5px; font-weight:700; color:var(--muted); padding-bottom:4px}
.cell{aspect-ratio:1/1; border-radius:11px; border:1px solid transparent; background:var(--surface-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font:inherit; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; padding:0;
  font-variant-numeric:tabular-nums}
.cell.blank{background:none; cursor:default}
.cell.out{color:var(--muted); opacity:.4; cursor:not-allowed; background:none}
.cell.today{border-color:var(--muted)}
.cell.sel{border-color:var(--teal); box-shadow:var(--ring)}
.cell.goal{background:linear-gradient(135deg,var(--teal-soft),var(--amber-soft)); border-color:var(--amber)}
.dots{display:flex; gap:3px; height:6px}
.dots i{width:6px; height:6px; border-radius:99px; background:var(--line)}
.dots i.on-s{background:var(--teal)} .dots i.on-r{background:var(--amber)}

.rules{padding:16px 18px}
.rules h2{font-family:"Suez One",serif; font-weight:400; font-size:17px; margin:0 0 10px}
.rules ul{margin:0; padding-inline-start:18px; display:flex; flex-direction:column; gap:7px; font-size:14.5px; color:var(--muted)}
.rules b{color:var(--ink)}
.notice{padding:11px 14px; border-radius:12px; font-size:13.5px; font-weight:600; background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber)}
.notice[hidden]{display:none}
.saving{position:fixed; inset-block-end:14px; inset-inline-start:50%; transform:translateX(50%);
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:700; padding:7px 15px; border-radius:99px;
  opacity:0; transition:opacity .2s; pointer-events:none}
.saving.on{opacity:.92}
#app.loading .hero,#app.loading .editor,#app.loading .stats,#app.loading .cal{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<div id="app" class="loading"></div>
<script>
(function(){
'use strict';
var API='/.netlify/functions/ben-agreement';
var TARGET='2027-03-24', START='2026-08-17';
var POLL_MS=30000;
var MON=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
var WD=['א','ב','ג','ד','ה','ו','ש'];
var DOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function pad(n){return n<10?'0'+n:''+n;}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseK(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function diffD(a,b){return Math.round((b-a)/864e5);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function fmt(d){return d.getDate()+' ב'+MON[d.getMonth()]+' '+d.getFullYear();}

var days={};
var TOTAL=diffD(parseK(START),parseK(TARGET));
var sel=key(today()); if(sel<START) sel=START;
var view=parseK(sel); view=new Date(view.getFullYear(),view.getMonth(),1);
var loaded=false, inFlight=0;

/* ---------- the agreement's arithmetic ---------- */
function credits(){
  var t=key(today()), c=0;
  for(var k in days){
    if(k<START||k>t) continue;
    var v=days[k]; if(!v) continue;
    if(v.s) c++; if(v.r) c++;
  }
  return c;
}
function unlockDate(){return addD(parseK(TARGET),-credits());}
function remaining(){return diffD(today(),unlockDate());}
function streak(f){
  var d=today(), n=0, v=days[key(d)];
  if(!v||!f(v)) d=addD(d,-1);
  while(key(d)>=START){
    var x=days[key(d)];
    if(x&&f(x)){n++; d=addD(d,-1);} else break;
  }
  return n;
}
/* Projection off the last fortnight's REAL pace, not an optimistic one:
   nothing ticked means the rate is 0 and this simply reports the original
   birthday, which is the honest answer. */
function forecast(){
  var rem=remaining(); if(rem<=0) return null;
  var t=today(), win=Math.min(14,diffD(parseK(START),t)+1); if(win<1) win=1;
  var c=0;
  for(var i=0;i<win;i++){var v=days[key(addD(t,-i))]; if(v){if(v.s)c++; if(v.r)c++;}}
  return addD(t,Math.ceil(rem/(1+c/win)));
}

/* ---------- shell ---------- */
var CHK='<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.2 5.2L20 7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SHELL=''
+'<div class="notice card" id="notice" hidden></div>'
+'<section class="card hero">'
  +'<div class="eyebrow">עד שאפשר להתקין אינסטגרם</div>'
  +'<div class="bignum" id="num">—</div>'
  +'<div class="bigword" id="word">ימים</div>'
  +'<div class="unlock" id="unlock"></div>'
  +'<div class="bar"><i id="fill" style="width:0%"></i></div>'
  +'<div class="barlabels"><span id="lbl-start"></span><span id="lbl-goal"></span></div>'
+'</section>'
+'<section class="card editor">'
  +'<div class="editor-head">'
    +'<div class="editor-date" id="ed-date"></div>'
    +'<button class="today-btn" id="btn-today" type="button">קפוץ להיום</button>'
  +'</div>'
  +'<div class="toggles">'
    +'<button class="tg" type="button" data-k="s" aria-pressed="false"><span class="box">'+CHK+'</span><span>עמדתי בסקרינזן<span class="sub">עד חצי שעה בטלפון — מוריד יום</span></span></button>'
    +'<button class="tg" type="button" data-k="r" aria-pressed="false"><span class="box">'+CHK+'</span><span>קראתי היום<span class="sub">קריאה בספר — מוריד עוד יום</span></span></button>'
  +'</div>'
  +'<div class="daysum" id="daysum"></div>'
+'</section>'
+'<section class="stats">'
  +'<div class="card stat"><span class="v" id="st-c">0</span><span class="k">ימים שהורדת בסך הכל</span></div>'
  +'<div class="card stat"><span class="v small" id="st-f">—</span><span class="k">בקצב של השבועיים האחרונים</span></div>'
  +'<div class="card stat s"><span class="v" id="st-s">0</span><span class="k">רצף ימי סקרינזן</span></div>'
  +'<div class="card stat r"><span class="v" id="st-r">0</span><span class="k">רצף ימי קריאה</span></div>'
+'</section>'
+'<section class="card cal">'
  +'<div class="calhead">'
    +'<button class="nav" id="nav-prev" type="button" aria-label="חודש קודם">›</button>'
    +'<span class="m" id="cal-m"></span>'
    +'<button class="nav" id="nav-next" type="button" aria-label="חודש הבא">‹</button>'
  +'</div>'
  +'<div class="grid" id="cal-grid"></div>'
+'</section>'
+'<section class="card rules">'
  +'<h2>ההסכם</h2>'
  +'<ul>'
    +'<li>יום ההולדת ה-13 של בן — <b>24.3.2027</b> — הוא התאריך המקורי.</li>'
    +'<li>כל יום שבן <b>עמד בסקרינזן</b> (עד חצי שעה בטלפון) מקדים את התאריך ב<b>יום אחד</b>.</li>'
    +'<li>כל יום שבן <b>קרא</b> מקדים אותו ב<b>יום נוסף</b>.</li>'
    +'<li>יום מושלם = <b>3 ימים פחות</b> בספירה: היום שעבר ממילא, ועוד שניים שהרווחת.</li>'
    +'<li>יום שלא עמדת בו פשוט לא מזכה — <b>אין קנסות ואף פעם לא חוזרים אחורה</b>.</li>'
  +'</ul>'
+'</section>'
+'<div class="saving" id="saving">שומר…</div>';

var app=document.getElementById('app');
app.innerHTML=SHELL;
function $(id){return document.getElementById(id);}

/* ---------- render ---------- */
var shownNum=null;
function render(){
  var rem=remaining(), done=Math.max(0,Math.min(TOTAL,TOTAL-rem));
  if(rem<=0){
    $('num').textContent='0'; shownNum=0;
    $('word').textContent='אפשר להתקין! 🎉';
    $('unlock').innerHTML='הגעת ליעד ב־<b>'+fmt(today())+'</b>';
  }else{
    animate(rem);
    $('word').textContent=(rem===1?'יום':'ימים');
    $('unlock').innerHTML='התאריך הנוכחי: <b>'+fmt(unlockDate())+'</b>';
  }
  $('fill').style.width=(TOTAL?done/TOTAL*100:0)+'%';
  $('lbl-start').textContent=TOTAL+' ימים בהתחלה';
  $('lbl-goal').textContent='אינסטגרם';

  $('st-c').textContent=credits();
  var f=forecast();
  $('st-f').textContent=f?fmt(f):'הגעת!';
  $('st-s').textContent=streak(function(v){return v.s;});
  $('st-r').textContent=streak(function(v){return v.r;});

  var d=parseK(sel), isToday=(sel===key(today()));
  $('ed-date').innerHTML=(isToday?'היום':'יום '+DOW[d.getDay()])+'<small>'+fmt(d)+'</small>';
  $('btn-today').hidden=isToday;
  var v=days[sel]||{};
  var editable=(sel>=START && sel<=key(today()) && loaded);
  var tgs=app.querySelectorAll('.tg');
  for(var i=0;i<tgs.length;i++){
    var k=tgs[i].getAttribute('data-k');
    tgs[i].setAttribute('aria-pressed', v[k]?'true':'false');
    tgs[i].disabled=!editable;
  }
  var got=(v.s?1:0)+(v.r?1:0);
  $('daysum').innerHTML = !loaded ? 'טוען…'
    : (sel<START||sel>key(today())) ? 'אפשר לסמן רק ימים שכבר עברו.'
    : got===2 ? 'יום מושלם — <b>הורדת 2 ימים</b> 💪'
    : got===1 ? 'הורדת <b>יום אחד</b>. עוד סימון אחד ליום מושלם.'
    : 'עוד לא סימנת את היום הזה.';

  drawCal();
}
function animate(target){
  var el=$('num');
  if(shownNum===null||shownNum===target){shownNum=target; el.textContent=target; return;}
  var from=shownNum, t0=null, dur=420;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(target-from)*e);
    if(p<1) requestAnimationFrame(step); else shownNum=target;
  }
  requestAnimationFrame(step);
}
function drawCal(){
  var y=view.getFullYear(), m=view.getMonth();
  $('cal-m').textContent=MON[m]+' '+y;
  var minM=parseK(START), maxM=unlockDate();
  $('nav-prev').disabled=(y===minM.getFullYear()&&m===minM.getMonth());
  $('nav-next').disabled=(y>maxM.getFullYear()||(y===maxM.getFullYear()&&m>=maxM.getMonth()));

  var h='';
  for(var w=0;w<7;w++) h+='<div class="wd">'+WD[w]+'</div>';
  var lead=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
  for(var i=0;i<lead;i++) h+='<div class="cell blank"></div>';
  var tk=key(today()), gk=key(unlockDate());
  for(var d=1;d<=last;d++){
    var k=key(new Date(y,m,d)), v=days[k]||{};
    var cls='cell', dis='';
    if(k<START||k>tk){cls+=' out'; dis=' disabled';}
    if(k===tk) cls+=' today';
    if(k===sel) cls+=' sel';
    if(k===gk) cls+=' goal';
    var dots=dis?'<span class="dots"></span>'
      :'<span class="dots"><i class="'+(v.s?'on-s':'')+'"></i><i class="'+(v.r?'on-r':'')+'"></i></span>';
    h+='<button type="button" class="'+cls+'" data-d="'+k+'"'+dis+'><span>'+d+'</span>'+dots+'</button>';
  }
  $('cal-grid').innerHTML=h;
}

/* ---------- talking to the server ---------- */
function notice(msg){var n=$('notice'); if(msg){n.textContent=msg; n.hidden=false;} else n.hidden=true;}
function flash(on){$('saving').classList.toggle('on',!!on);}

function adopt(payload){
  if(payload && payload.ok && payload.days && typeof payload.days==='object'){
    days=payload.days;
    loaded=true;
    app.classList.remove('loading');
    notice('');
    render();
    return true;
  }
  return false;
}

function load(){
  return fetch(API,{headers:{'accept':'application/json'}})
    .then(function(res){return res.json();})
    .then(function(payload){
      if(!adopt(payload)) throw new Error('bad payload');
    })
    .catch(function(){
      if(!loaded) notice('לא הצלחנו לטעון את הסימונים. בדקו את החיבור — הדף ינסה שוב לבד.');
    });
}

/* A tick shows immediately and is sent straight after. One failed attempt
   is retried once; if that fails too the tick is ROLLED BACK rather than
   left on screen, so the page never shows a day as earned when the server
   never recorded it. */
function sendFlag(date,field,value,isRetry){
  inFlight++;
  flash(true);
  return fetch(API,{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({date:date, field:field, value:value})
  })
  .then(function(res){return res.json();})
  .then(function(payload){
    if(!adopt(payload)) throw new Error(payload && payload.error ? payload.error : 'bad payload');
  })
  .catch(function(err){
    if(!isRetry){
      return new Promise(function(resolve){setTimeout(resolve,2000);})
        .then(function(){return sendFlag(date,field,value,true);});
    }
    var day=days[date];
    var reverted=Object.assign({s:false,r:false},day);
    reverted[field]=!value;
    if(!reverted.s&&!reverted.r) delete days[date]; else days[date]=reverted;
    render();
    notice('הסימון לא נשמר, אז ביטלנו אותו. בדקו את החיבור ונסו שוב.');
  })
  .then(function(){
    inFlight--;
    if(inFlight<=0){inFlight=0; flash(false);}
  });
}

function toggle(field){
  if(!loaded) return;
  var v=Object.assign({s:false,r:false},days[sel]);
  var next=!v[field];
  v[field]=next;
  if(!v.s&&!v.r) delete days[sel]; else days[sel]=v;
  render();
  sendFlag(sel,field,next,false);
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var tg=e.target.closest?e.target.closest('.tg'):null;
  if(tg&&!tg.disabled){toggle(tg.getAttribute('data-k')); return;}
  var cell=e.target.closest?e.target.closest('.cell[data-d]'):null;
  if(cell&&!cell.disabled){sel=cell.getAttribute('data-d'); render(); return;}
  if(e.target.id==='btn-today'){
    sel=key(today());
    view=new Date(today().getFullYear(),today().getMonth(),1);
    render(); return;
  }
  if(e.target.id==='nav-prev'){view=new Date(view.getFullYear(),view.getMonth()-1,1); drawCal(); return;}
  if(e.target.id==='nav-next'){view=new Date(view.getFullYear(),view.getMonth()+1,1); drawCal(); return;}
});

/* Whoever is watching sees the other's ticks land without touching
   anything: poll on a timer, and again the moment the page comes back to
   the foreground (the common case -- a phone waking up in a pocket). A
   poll is skipped while a write is still in flight, so a slow response
   cannot overwrite a tick that has not been acknowledged yet. */
function poll(){ if(!inFlight && !document.hidden) load(); }
setInterval(poll, POLL_MS);
document.addEventListener('visibilitychange', poll);
window.addEventListener('focus', poll);
window.addEventListener('online', poll);

render();
load();
})();
</script>
</body></html>
