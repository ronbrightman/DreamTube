<!--
  DreamTube onboarding funnel — originally 15 screens in one page, JS-driven
  step navigation, ported from the approved mockup at
  scratchpad/funnel-mockup.html (v3.1) — see that file and
  scratchpad/research/onboarding-funnel.md for the full original design
  rationale. Do not reorder or redesign the remaining screens here; this is
  an implementation of an already-approved spec, not a place to make new
  design calls.

  ARCHITECTURE SPLIT (see the dreamtube-growth repo's AGENT_POLICY.md for
  the full story): the ad-facing, iterate-often screens — hook carousel,
  the 3-question quiz, reassurance, social proof, dream-text capture, style
  picker, and the Dream Profile recap (formerly screens 1-8, 10, 12 in
  this file) have moved entirely to the separate dreamtube-growth
  marketing repo (https://dreamtubeapp.netlify.app/), with their own
  PostHog/Pixel/CAPI tracking and A/B testing. This file now only covers
  what structurally has to run in DreamTube's own origin: Advanced
  (characters/camera/scenery — formerly one screen 9, now split into three
  separate funnel screens, one per section — see below), the "coming
  together" transition (screen 11), signup, pricing, and confirmation
  (screens 13-15). Two reasons those couldn't move:
   1. Signup DOES make a network call now — DreamStore.signup() checks/
      creates the account server-side first (register-account.js, the
      authoritative cross-device uniqueness check), then mirrors it into
      this origin's own localStorage on success (falling back to a
      local-only write if the server can't be reached at all — see that
      function's own comment). The account still has to be created from
      THIS origin either way, since the local mirror it writes only exists
      here.
   2. Character photos are staged in-memory as base64 data URLs (the
      `staged` object below) until signup — arbitrarily large, and every
      other Advanced field (camera/scenery chips) writes directly into
      DreamStore.setDraft(), which only exists in this origin.

  Every visitor now arrives here from the marketing funnel, via
  ?resume=1 plus recall/types/motivations/style/caption as URL params —
  landing directly on Advanced, with those values hydrated into
  `quiz`/`chosenStyle`/the real draft first. A bare visit with no
  ?resume=1 (stale bookmark, old link) redirects straight back to the
  funnel — see the "Entry guard" block below. There is no organic
  in-app entry point into this file anymore; index.html's "Get Started"
  now routes organic/direct visitors to wizard.html instead (see that
  file), and only the paid growth-funnel handoff still lands here.

  Real-integration notes still relevant to what's left here:
   - Advanced (characters/camera/scenery) is a real functional port of
     create.html's Advanced section, split into three separate funnel
     screens — one per section (renderScreenAdvChars/AdvCamera/AdvScenery)
     — instead of the one crowded screen 9 used to be. As of a 2026-07-24
     founder decision (tracker item
     for-product-two-post-handoff-app-pages-p-atr0r7), only
     renderScreenAdvChars is still live — renderScreenAdvCamera/
     renderScreenAdvScenery are PARKED (intentionally kept, not deleted,
     but omitted from SCREEN_RENDERERS so they never render) because the
     marketing funnel that hands off here already assembles camera/scenery
     info into captionText, making those two screens redundant for every
     real visitor. See the SCREEN_RENDERERS/TAGS/PHASE_BY_STEP
     construction below for the parked-screens comment and the "PARKED"
     comment on each function itself. Continue on the characters screen
     advances one step; Skip jumps straight to the transition screen
     (goToStep(PREPARING_STEP)) — "skip" means "stop customizing". As of
     the 2026-07-24 mobile-test fixes, renderScreenAdvChars itself may not
     even be in SCREEN_RENDERERS at all — see captionSuggestsPeople() and
     the SCREEN_RENDERERS/TAGS/PHASE_BY_STEP construction below — so
     PREPARING_STEP is looked up dynamically rather than hardcoded, since
     its index shifts depending on whether that screen is present. The
     parked camera/scenery screens' chips still call DreamStore.setDraft
     directly (login-independent) in their own dead code, unchanged.
     Characters are the
     one exception: DreamStore.saveCharacter() requires a logged-in user,
     but signup doesn't happen until screen 13 — by design, per the
     approved funnel order (dream input + Advanced moved early, paywall
     late). So characters are staged locally (the `staged` object) with the
     same validation rules as DreamStore.saveCharacter, and flushed into
     real DreamStore characters via flushStagedCharactersToStore() the
     moment signup succeeds on screen 13, before the funnel continues.
   - Screen 13 derives a username from the email's local part automatically
     (per the task spec — visitor never picks a username) and calls the
     real DreamStore.signup(username, password, email). As of the
     2026-07-24 mobile-test fixes, it ALSO fires start-pending-generation.js
     the moment Continue is clicked, in parallel with the signup call
     itself (not after it) — the same "generate during signup" mechanism
     wizard.html's renderContact/renderSignup steps use, ported here since
     start.html has no separate contact-only step to hang the kickoff off
     of. See startPendingGeneration()'s own comment for the full flow.
   - Screen 14 (pricing) has a deliberate, clearly-marked payment bypass —
     see the big comment above proceedPastPricing() below. There is no
     payment provider integrated yet; do not "finish" this without a human
     vendor decision (see AGENT_POLICY.md escalation policy).
   - Screen 15 hands off to the real, unmodified processing.html. Most of
     the time by this point generation is already RUNNING, not starting —
     screen 13 already adopted it as this browser's pendingJob (see
     DreamStore.adoptPendingGeneration), and processing.html already knows
     how to resume a pendingJob on load with zero changes needed there. If
     the pre-signup kickoff failed or never got a head start, this falls
     back to processing.html's normal fresh-generation path exactly as
     before — see startPendingGeneration()'s own comment.
-->
</head>

<div id="app" class="funnel-app">
  <div class="fn-topbar">

<style>
  /* ===================================================================
     Funnel-specific styles. Every class here is prefixed "fn-", except
     the Advanced screens' character chips/add-tiles and character sheet
     (.char-chip/.char-chip-add/.sheet-overlay/.sheet/.char-mode-row/
     .char-mode-btn/.char-photo-*), which deliberately reuse create.html's
     real classes from css/styles.css verbatim (same markup, same click
     handlers, zero JS duplicated) rather than being reimplemented under
     fn- names. Since those classes are shared with create.html's own
     (dark-themed) Advanced accordion, every light-theme override for them
     below is scoped under "#app.funnel-app ..." so it can never reach
     create.html's plain "#app" — see each override for why.
     Colors/values ported from scratchpad/funnel-mockup.html. */

  #app.funnel-app{
    --dawn-1:#FBEFEA; --dawn-2:#E9EAF5; --dawn-3:#E3E9F7;
    --fn-ink:#3A3350; --fn-ink-soft:#6E6480; --fn-ink-faint:#9C93AC;
    --fn-card:#FFFFFF; --fn-line:rgba(58,51,80,0.10);
    --fn-accent-grad:linear-gradient(135deg,#B0A8DC,#9FC6E8 55%,#F3C08C);
    --fn-accent-solid:#7C82C4;
    --fn-font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    --fn-font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    background:linear-gradient(160deg,var(--dawn-1),var(--dawn-2) 55%,var(--dawn-3));
    font-family:var(--fn-font-body);
    transition:background .4s ease;
  }
  #app.funnel-app.fn-phase-night .fn-btn-primary{ background:#fff; color:#221d2c; box-shadow:none;}

  .fn-topbar{ display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 4px; flex:none;}
  .fn-back{
    width:34px; height:34px; border-radius:50%; flex:none; cursor:pointer;
    background:var(--phase-card, var(--fn-card)); border:1px solid var(--phase-line, var(--fn-line));
    color:var(--phase-ink, var(--fn-ink)); display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .fn-back .icon, .fn-back svg{ width:15px; height:15px;}
  .fn-topbar-spacer{ width:34px; flex:none;}
  .fn-progress{ flex:1; display:flex; gap:4px;}
  .fn-progress i{ flex:1; height:3px; border-radius:3px; background:var(--phase-line, var(--fn-line)); display:block;}
  .fn-progress i.done{ background:var(--phase-ink, var(--fn-ink)); opacity:.55;}
  .fn-progress i.now{ background:var(--phase-ink, var(--fn-ink));}

  .fn-screen{ flex:1; display:flex; flex-direction:column; padding:18px 24px calc(24px + env(safe-area-inset-bottom,0px)); position:relative; overflow-y:auto; min-height:0; color:var(--phase-ink, var(--fn-ink));}

  .fn-eyebrow{ font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--phase-faint, var(--fn-ink-faint)); margin-bottom:10px;}
  .fn-headline{ font-family:var(--fn-font-display); font-size:25px; font-weight:600; letter-spacing:-0.005em; line-height:1.25; text-wrap:balance; margin-bottom:10px; color:var(--phase-ink, var(--fn-ink));}
  .fn-body-copy{ font-size:14.5px; color:var(--phase-soft, var(--fn-ink-soft)); line-height:1.55; margin-bottom:18px;}
  .fn-mini-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--phase-faint, var(--fn-ink-faint)); margin:14px 0 8px;}
  .fn-mini-label:first-child{ margin-top:0;}
  .fn-spacer{ flex:1;}

  .fn-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .fn-chip{ padding:9px 15px; border-radius:100px; background:var(--phase-card, var(--fn-card)); border:1px solid var(--phase-line, var(--fn-line)); font-size:13px; font-weight:700; color:#2C2846; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .fn-chip.sel{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}

  /* ----- Advanced/characters: shared create.html classes, light-themed
     overrides scoped to the funnel only (see the file-level comment
     above this <style> block for why these aren't fn- classes). ----- */
  #app.funnel-app .char-chip{ background:var(--phase-card, var(--fn-card)); border-color:var(--phase-line, var(--fn-line)); color:#2C2846;}
  #app.funnel-app .char-chip .chip-check{ border-color:var(--phase-faint, var(--fn-ink-faint));}
  #app.funnel-app .char-chip.selected{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-chip.selected .chip-check{ background:#fff; border-color:#fff;}
  #app.funnel-app .char-chip.selected .chip-check .icon{ opacity:1; color:var(--fn-accent-solid);}
  #app.funnel-app .char-chip .chip-edit{ color:var(--phase-faint, var(--fn-ink-faint));}
  #app.funnel-app .char-chip.selected .chip-edit{ color:#fff; opacity:.75;}
  #app.funnel-app .char-chip-add{ background:transparent; border:1px dashed var(--phase-line, var(--fn-line)); color:var(--phase-soft, var(--fn-ink-soft));}
  #app.funnel-app .char-chip-add:hover{ border-color:var(--fn-accent-solid); color:var(--phase-ink, var(--fn-ink));}

  /* Character add/edit sheet — light card over the now-light Advanced
     screens, instead of create.html's dark bottom sheet. */
  #app.funnel-app .sheet{ background:var(--fn-card); color:#2C2846; border-top-color:var(--fn-line); box-shadow:0 -20px 50px rgba(58,51,80,.18);}
  #app.funnel-app .sheet-handle{ background:var(--fn-line);}
  #app.funnel-app .sheet-title{ color:#2C2846;}
  #app.funnel-app .char-mode-row .char-mode-btn{ background:#F3F1FA; border-color:var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-mode-row .char-mode-btn.active{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-photo-preview{ background:#F3F1FA; border-color:var(--fn-line);}
  #app.funnel-app .char-photo-empty{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-photo-hint{ color:var(--fn-ink-soft);}
  #app.funnel-app .btn-secondary{ background:transparent; border:1px solid var(--fn-line); color:var(--fn-ink);}
  #app.funnel-app .btn-secondary:hover{ background:#F3F1FA; border-color:var(--fn-ink-faint);}

  textarea.fn-field, input.fn-field{ background:var(--phase-card, var(--fn-card)); border:1px solid var(--phase-line, var(--fn-line)); border-radius:16px; padding:14px 15px; font-family:var(--fn-font-body); color:#2C2846; font-size:15px; width:100%; margin-bottom:12px; display:block;}
  textarea.fn-field{ resize:none; line-height:1.5;}
  textarea.fn-field::placeholder, input.fn-field::placeholder{ color:var(--fn-ink-faint);}
  textarea.fn-field:focus, input.fn-field:focus{ outline:2px solid var(--fn-accent-solid); border-color:transparent;}

  .fn-field-pw-wrap{ position:relative; margin-bottom:12px;}
  .fn-field-pw-wrap .fn-field{ margin-bottom:0; padding-right:46px;}
  .fn-field-pw-toggle{ position:absolute; right:4px; top:0; bottom:0; width:38px; background:none; border:none; color:var(--fn-ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fn-field-pw-toggle svg, .fn-field-pw-toggle .icon{ width:18px; height:18px;}

  .fn-err-text{ font-size:12.5px; color:#C4485B; min-height:16px; margin:2px 0 8px;}

  .fn-btn-primary{ background:var(--fn-accent-grad); color:#fff; font-weight:800; font-size:15.5px; border:none; border-radius:100px; padding:15px; text-align:center; width:100%; box-shadow:0 12px 26px -10px rgba(141,111,184,.5); cursor:pointer; font-family:var(--fn-font-body); -webkit-tap-highlight-color:transparent;}
  .fn-btn-primary:disabled{ opacity:.42; cursor:not-allowed; box-shadow:none;}
  .fn-small-link{ background:none; border:none; color:var(--phase-soft, var(--fn-ink-soft)); font-size:12.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; text-align:center; width:100%; padding:10px 0 0; cursor:pointer;}

  .fn-proof-strip{ display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:100px; background:#fff; border:1px solid rgba(58,51,80,0.1); margin-bottom:16px;}
  .fn-proof-strip .avatars{ display:flex;}
  .fn-proof-strip .avatars i{ width:23px; height:23px; border-radius:50%; background:var(--fn-accent-grad); border:2px solid #fff; margin-left:-9px; display:block;}
  .fn-proof-strip .avatars i:first-child{ margin-left:0;}
  .fn-proof-strip span{ font-size:11.5px; font-weight:700; color:#6E6480;}

  /* Bumped from 12px/--fn-ink-soft (#6E6480) to a larger size + the
     darkest ink token — founder feedback on a real mobile test called
     this "small faint helper text" that needed to read clearly, not as
     fine print, especially on screen 13 where it's the funnel's only
     reassurance for handing over an email. */
  .fn-price-note{ font-size:14px; font-weight:600; color:var(--phase-ink, var(--fn-ink)); text-align:center; margin:2px 0 0; line-height:1.45;}

  /* Screen 14's free-signup-grant message card (class name/styling
     predates the store-launch copy sweep that dropped its old "beta"
     copy — kept as-is, it already reads as a calm, considered callout).
     Used to hold a dense token-math/pack-pricing wall of text
     (Yearly/Monthly-card-style value props, a free-token breakdown, and
     two "coming soon" token-pack price tiles) — a real mobile test found
     it read as "too much text" and "scary" right before signup. See
     renderScreen14 below for the markup this styles and its own comment
     for the copy's more recent history. */
  .fn-token-free-card{ background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; border:1.5px solid var(--fn-accent-solid); text-align:center;}
  .fn-token-free-card .title{ font-weight:800; font-size:15px; color:var(--fn-ink); margin-bottom:6px;}
  .fn-token-free-card .body{ font-size:13.5px; color:var(--fn-ink-soft); line-height:1.55;}
  .fn-token-free-card .body b{ color:var(--fn-ink); font-weight:700;}

  .fn-check-badge{ width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,.12); border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 18px; color:#fff;}

  .fn-spin{ width:48px; height:48px; border-radius:50%; border:3px solid var(--phase-line, var(--fn-line)); border-top-color:var(--fn-accent-solid); margin:0 auto 20px; animation:fnspin 1s linear infinite;}
  @keyframes fnspin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .fn-spin{ animation:none;} }
  .fn-loading-line{ font-size:13px; color:var(--phase-soft, var(--fn-ink-soft)); text-align:center; margin-bottom:6px;}
</style>

<script>
(function(){
  'use strict';

  // ===== Analytics helper — guarded the same way every other page in this
  // app checks for a real PostHog key (see js/analytics-config.js). =====
  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{ posthog.capture(name, props || {}); }catch(e){ /* analytics must never break the funnel */ }
    }
  }

  function esc(str){ var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  // ===== Real social-proof count for screen 14 (pricing) =====
  // Replaces a hardcoded "12,400+ dreams brought to life this month" with
  // an actual count, computed client-side from the same real shared feed
  // Explore uses (DreamStore.getSharedFeed -> get-feed.js -> Blobs), since
  // there's no dedicated "dreams this month" endpoint. Kicked off here, at
  // script load, rather than when screen 14 first renders, so the fetch has
  // the whole rest of the funnel (screens 9, 11, 13) to resolve before
  // anyone actually reaches pricing. Stays null (and the proof strip is
  // omitted entirely, never a fake number) if the fetch hasn't resolved in
  // time or fails outright.
  var dreamsThisMonthCount = null;
  DreamStore.getSharedFeed().then(function(feed){
    var now = new Date();
    var y = now.getUTCFullYear(), m = now.getUTCMonth();
    dreamsThisMonthCount = feed.filter(function(d){
      if(!d.publishedAt) return false;
      var pd = new Date(d.publishedAt);
      return pd.getUTCFullYear() === y && pd.getUTCMonth() === m;
    }).length;
  }).catch(function(){ /* leave dreamsThisMonthCount null -> proof strip omitted */ });

  /**
   * Downscales/recompresses a picked photo to a JPEG data URL — copied
   * verbatim from create.html's identical helper (same reasons apply: an
   * unmodified phone photo can blow both localStorage's quota and the
   * generate-video request body cap).
   */
  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // anonymous sessions today — every post-handoff pageview here starts a
  // brand-new distinct_id, so growth can't see one joined funnel from
  // welcome through signup/video. Fix: if the funnel's redirectToApp()
  // appends its own posthog.get_distinct_id() as a `distinct_id` URL
  // param, call posthog.identify() with it here so this browser's events
  // on THIS app merge into the SAME PostHog person the funnel side
  // already created, instead of starting a second, disconnected one.
  // Deliberately a no-op (nothing to identify, funnel and app sessions
  // just stay separate as they do today) if the param is absent — the

  // functional gate. Fires once, right after the resume guard passes, so

  var handoffDistinctId = getParam('distinct_id');

  // for-product-high-read-meta-fbc-fbp-fbcli-agr639): the ad click lands
  // on the FUNNEL domain (dreamtubeapp.netlify.app), so Meta's own _fbc/
  // _fbp cookies never exist on THIS domain — js/analytics-config.js's
  // getMetaCookies() only ever reads document.cookie, so every mid-funnel
  // CAPI conversion fired from this file (ReachedEmailEntry,
  // CompleteRegistration, and later FirstVideoCreated on result.html)
  // was landing at Meta with no fbc/fbp match keys at all, unattributable
  // to any ad. Growth's redirectToApp() now appends fbc/fbp/fbclid (from
  // its OWN _fbc/_fbp cookies, set on the funnel domain where the ad
  // click actually landed) to this handoff URL — persist them here, as
  // real first-party cookies on THIS domain, before anything below can
  // fire a conversion, so getMetaCookies() picks them up for every one
  // of them. fbclid alone (no fbc — e.g. an ad-network variant that only
  // ever set _fbp) is turned into fbc using Meta's own documented
  // creation format (fb.<subdomain-index>.<creation-time-ms>.<fbclid>);
  // subdomain-index is always 1 here per growth's own contract for this
  // handoff, not computed from the actual hostname. An explicit fbc/fbp
  // param always overwrites whatever's already on this browser (correct
  // last-click-attribution behavior for a fresh ad click); only the
  // fbclid-constructed fallback checks for and skips an existing _fbc
  // first, since it's a synthesized value standing in for a real one
  // that might already be there. Same as the distinct_id block above, a
  // completely absent param set means zero behavior change from before
  // this fix.
  function setFirstPartyCookie(name, value){
    try { document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + (90 * 24 * 60 * 60) + '; SameSite=Lax; Secure'; } catch(e) { /* analytics must never break the app */ }
  }
  (function persistMetaAttributionCookies(){
    try {
      var handoffFbc = getParam('fbc');
      var handoffFbp = getParam('fbp');
      var handoffFbclid = getParam('fbclid');
      if(handoffFbc) setFirstPartyCookie('_fbc', handoffFbc);
      if(handoffFbp) setFirstPartyCookie('_fbp', handoffFbp);
      if(handoffFbclid && !handoffFbc && !getMetaCookies().fbc){
        setFirstPartyCookie('_fbc', 'fb.1.' + Date.now() + '.' + handoffFbclid);
      }
    } catch(e) { /* analytics must never break the app */ }

  /** Mirrors DreamStore.saveCharacter's validation/upsert rules exactly, against the local staging array instead of the real store. */
  function localSaveCharacter(patch){
    var name = (patch.name || '').trim();
    var description = (patch.description || '').trim();
    var isSelf = !!patch.isSelf;
    var photoDataUrl = (isSelf && patch.photoDataUrl) ? patch.photoDataUrl : null;
    if(!isSelf && !name) return { ok:false, error:'Give this character a name.' };
    if(!description && !photoDataUrl) return { ok:false, error: isSelf ? 'Add a description or a photo.' : 'Add a short description.' };
    var existing = patch.id ? staged.characters.filter(function(c){ return c.id === patch.id; })[0] : null;
    if(!existing && isSelf) existing = staged.characters.filter(function(c){ return c.isSelf; })[0] || null;
    if(existing){
      existing.name = name;
      existing.description = description;
      if(isSelf) existing.photoDataUrl = photoDataUrl; else delete existing.photoDataUrl;
      return { ok:true, character: existing };
    }
    var character = { id: 'local' + Math.random().toString(36).slice(2, 9), name: name, isSelf: isSelf, description: description };
    if(isSelf && photoDataUrl) character.photoDataUrl = photoDataUrl;
    staged.characters.push(character);
    return { ok:true, character: character };
  }
  function localDeleteCharacter(id){
    var before = staged.characters.length;
    staged.characters = staged.characters.filter(function(c){ return c.id !== id; });
    staged.selectedIds = staged.selectedIds.filter(function(x){ return x !== id; });
    return staged.characters.length !== before;
  }

      if(result.ok) idMap[c.id] = result.character.id;
    });
    var realSelected = staged.selectedIds.map(function(localId){ return idMap[localId]; }).filter(Boolean);
    if(realSelected.length) DreamStore.setDraft({ characterIds: realSelected });
  }

  // ===================================================================
  // Generate-during-signup — ported from wizard.html's renderContact/
  // renderSignup (its own contact-capture step fires start-pending-
  // generation.js, and its later signup step adopts the result via
  // DreamStore.adoptPendingGeneration once signup succeeds). start.html
  // has no separate contact-only step — email and password are one screen
  // (13) — so here both the pending-generation submission and the real
  // signup call fire in PARALLEL from the same Continue click, instead of
  // sequentially one after the other. Whichever finishes first, we wait
  // for both to settle before advancing past screen 13, so pendingId/
  // pendingOperationName are always known (one way or the other) before
  // the visitor can reach screen 15. Purely a resilient head start: if the
  // pending-generation call fails for any reason, pendingStartFailed stays
  // true and processing.html's normal fresh-generation path (unchanged)
  // just runs as it always did — nothing about this can block or break
  // the funnel, only speed it up when it works.
  // ===================================================================
  var pendingId = null;
  var pendingOperationName = null;
  var pendingStartedAt = null;
  var pendingStartFailed = false;

  // Guards against re-firing a real, billed start-pending-generation call
  // on a signup RETRY (review finding, 2026-07-24) — "email already taken",
  // a wrong-password-style rejection, or a transient network error are all
  // normal things that happen on a live signup screen, and without this
  // guard every Continue click unconditionally called startPendingGeneration
  // again (see the click handler below), each one a real fal.ai submission
  // + a real 100-token spend + a new pending-dreams record — with the
  // PRIOR attempt's job never claimed and pending-dreams.js having no TTL/
  // cleanup, so every retry silently orphaned and permanently wrote off the
  // one before it. wizard.html never had this problem because its
  // pending-generation call lives on a separate screen a signup-only retry
  // never re-touches; start.html's parallel adaptation (email+password on
  // ONE screen) traded that isolation away, so the guard is reconstructed
  // here instead. Tracks the email the current pendingId/pendingOperationName
  // (if any) actually belongs to — reusing across a DIFFERENT email would
  // silently fail claim-pending-generation.js's ownership check (it
  // requires an exact email match) and adopt a job tied to the wrong
  // address, so a genuine email change still gets its own fresh call.
  var pendingGenerationEmail = null;
  var pendingGenerationPromise = null;
  var pendingGenerationSettled = false;
  // Per-attempt token (review finding round 2, 2026-07-24) — same pattern
  // already used elsewhere in this codebase for "an async callback's side
  // effects aren't scoped to the instance/attempt that started them" (see
  // profile.html's identitySheetToken / create.html's charSheetToken).
  // Without this, startPendingGeneration's .then()/.catch() wrote straight
  // to the shared pending* vars unconditionally: if a visitor typed email
  // A (real fal.ai submission starts, can take seconds), got rejected
  // quickly ("email already taken"), corrected to email B BEFORE A's call
  // resolved (firing a fresh call for B, correctly, per
  // pendingGenerationEmail above) — A's abandoned response could still
  // land AFTER B's, silently overwriting pendingId/pendingOperationName
  // back to A's stale job right as B's own signup-success handler was
  // about to read them, orphaning B's real, billed generation via a
  // different-email race instead of the original same-email one. Bumped
  // only when a genuinely NEW call is fired (getOrStartPendingGeneration's
  // "fire fresh" branch) — never on a reused call, which must still be
  // able to write once it eventually settles.
  var pendingGenerationToken = 0;

  /** Mirrors js/store.js's own resolveCharacters(ids), just resolving against the local `staged` characters instead of DreamStore's real ones — same {name, description, isSelf, photoDataUrl?} shape start-pending-generation.js/generate-video.js expect, and (unlike wizard.html's single-subject version) resolves every selected staged character, matching start.html's own multi-select character screen. */
  function resolveStagedCharactersForGeneration(){
    return staged.selectedIds.map(function(id){
      return staged.characters.filter(function(c){ return c.id === id; })[0];
    }).filter(Boolean).map(function(c){
      var resolved = { name: c.name, description: c.description, isSelf: !!c.isSelf };
      if(c.isSelf && c.photoDataUrl) resolved.photoDataUrl = c.photoDataUrl;
      return resolved;
    });
  }

  /** Fires start-pending-generation.js (see that file's own doc comment for the guardrails/error codes) and updates the pending* vars above on settlement — but ONLY if `token` (captured by the caller at fire time, see getOrStartPendingGeneration) still matches pendingGenerationToken; a mismatch means a newer attempt has since started, so this stale response's data is discarded rather than clobbering the current attempt's state. Always resolves (never rejects) — a failure just leaves pendingStartFailed true, same fallback shape as wizard.html's own version. Not called directly from the click handler — see getOrStartPendingGeneration() below, which adds both the retry guard and the token. */
  function startPendingGeneration(email, token){
    var draft = DreamStore.getDraft();
    var startedAt = Date.now();
    return fetch('/.netlify/functions/start-pending-generation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        caption: draft.caption, style: chosenStyle,
        characters: resolveStagedCharactersForGeneration(), characterIdsForGeneration: staged.selectedIds,
        cameraView: draft.cameraView, sceneryTime: draft.sceneryTime, sceneryPlace: draft.sceneryPlace
      })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(token !== pendingGenerationToken) return; // stale -- a newer attempt has since started, discard
      if(result.ok && result.data && result.data.pendingId){
        pendingId = result.data.pendingId;
        pendingOperationName = result.data.operationName;
        pendingStartedAt = startedAt;
        pendingStartFailed = false;
      } else {
        pendingStartFailed = true;
      }
    }).catch(function(){
      if(token !== pendingGenerationToken) return;
      pendingStartFailed = true;
    });
  }

  /**
   * Retry-safe wrapper around startPendingGeneration() — this is what the
   * click handler actually calls. Reuses the existing in-flight-or-
   * succeeded call when it's for the SAME email (covers both "still
   * in-flight, a second rapid click shouldn't race a duplicate request in"
   * and "already succeeded, a signup retry shouldn't re-submit"). Only
   * fires a fresh call when the email has genuinely changed, or the prior
   * attempt for this exact email definitively failed (nothing was spent on
   * a failed attempt — see start-pending-generation.js's own handler,
   * tokens are only spent after a successful fal submission — so retrying
   * a failure is safe/correct, not a double-spend risk).
   */
  function getOrStartPendingGeneration(email){
    var reusable = pendingGenerationEmail === email && pendingGenerationPromise &&
      (!pendingGenerationSettled || !pendingStartFailed);
    if(reusable) return pendingGenerationPromise;
    pendingGenerationEmail = email;
    pendingGenerationSettled = false;
    pendingGenerationToken++;
    var myToken = pendingGenerationToken;
    pendingGenerationPromise = startPendingGeneration(email, myToken).then(function(){
      // Same staleness guard as startPendingGeneration's own writes above —
      // an abandoned call's belated settlement must not flip this flag for
      // whatever the CURRENT attempt is, or a later retry's reuse check
      // could wrongly treat a still-in-flight current attempt as settled.
      if(myToken === pendingGenerationToken) pendingGenerationSettled = true;
    });
    return pendingGenerationPromise;
  }

  // ===================================================================
  // Screen 13 — Email capture. Username is derived automatically from the
  // email's local part (never asked of the visitor) per the task spec.
  // ===================================================================
  // Per-attempt token — same unscoped-async-callback pattern as
  // pendingGenerationToken above, and wizard.html's own signupAttemptToken
  // (see that file's doc comment, ~wizard.html:993). attemptSignup() below
  // is a real register-account.js network round trip (see js/store.js's
  // DreamStore.signup); its callback used to unconditionally act on
  // whatever it found once it settled -- write to shared pending*/staged
  // state AND advance to the next screen -- with no check that this was
  // still the current attempt. Repro (tracker item
  // wizard-html-start-html-signup-step-force-8wtk8h): tap Continue here
  // (fires the real signup call), immediately tap Back before it
  // resolves, edit the email, resubmit, reach this same screen fresh a
  // second time -- the first, abandoned call's callback, once it finally
  // settles, would force-navigate the visitor forward from wherever they
  // actually are and could adopt/claim the wrong pending job (reading
  // live pendingId/pendingOperationName/pendingPromise at settlement
  // time instead of a fire-time snapshot).
  //
  // Gates the ENTIRE callback body -- both the writes AND the
  // navigation, INCLUDING the nested pendingPromise.then(...)
  // continuation below (which has its own re-check, right at its top,
  // since it settles asynchronously AFTER this outer check already ran
  // and could go stale in that gap) -- unlike pendingGenerationToken
  // above (which only guards that fetch's write, since nothing here
  // waits on it before advancing). Signup has no "safe to advance
  // without waiting" skip case: there is no real account, and nothing
  // safe to hand off to the next screen, until DreamStore.signup itself
  // actually resolves ok.
  //
  // Bumped on TWO separate triggers, not just one: (1) every Continue
  // click on this screen (below), so a genuinely new, competing attempt
  // always supersedes an older one still in flight; AND (2) every Back
  // click (see the navigation engine's backBtn listener, further down
  // this file), so simply navigating away from this screen -- without
  // necessarily starting a new attempt at all -- also invalidates
  // whatever's still in flight. Both triggers are required: an early
  // version of this fix only bumped on (1) and a regression test caught
  // the gap -- sit on a second, fresh screen 13 without resubmitting,
  // and an abandoned first attempt's late settlement would still
  // force-navigate, because nothing had bumped the token since attempt
  // #1 fired it. Also paired with disabling both continueBtn AND
  // backBtn (defense-in-depth -- see the click handler below) for the
  // duration of the call, so in normal (non-test) usage there is no UI
  // path to trigger either case while an attempt is still in flight in
  // the first place.
  var signupAttemptToken = 0;
  function deriveUsernameBase(email){
    var local = (email.split('@')[0] || '').toLowerCase();
    var sanitized = local.replace(/[^a-z0-9]/g, '');
    if(sanitized.length < 3) sanitized = (sanitized + 'dreamer').slice(0, Math.max(3, sanitized.length + 4));
    return sanitized.slice(0, 20) || 'dreamer';
  }
  function attemptSignup(email, password, cb){
    var base = deriveUsernameBase(email);
    var attempts = 0;
    var MAX_ATTEMPTS = 8;
    // DreamStore.signup is now a real network round trip (server-side
    // account check, see js/store.js) — this loop is unchanged in shape,
    // just chained through the returned Promise instead of a synchronous
    // return, so a "username taken" collision (now possibly discovered on
    // the SERVER, from a signup on a different device, not just this
    // browser's local storage) still retries with a new suffix exactly as
    // before.
    function tryUsername(username){
      DreamStore.signup(username, password, email).then(function(result){
        if(result.ok){
          // Shared event_id pairs this with the Pixel's own
          // CompleteRegistration call — see js/analytics-config.js's
          // fireMetaConversion for why. login.html's own ?mode=signup path
          // fires the equivalent call for its own signup case.
          fireMetaConversion('CompleteRegistration', { email: email });
          cb(true, null, false); return;
        }
        if(result.error === 'That username is already taken.' && attempts < MAX_ATTEMPTS){
          attempts++;
          var suffix = Math.floor(1000 + Math.random() * 9000);
          tryUsername(base + suffix);
          return;
        }
        // result.superseded (js/store.js's own call-sequence guard --
        // see signupCallSeq's doc comment there) means THIS call was
        // never even the most-recently-STARTED signup() call by the time
        // its response landed, so js/store.js itself already declined to
        // touch state.user/state.accounts for it. Passed through to cb
        // as defense-in-depth alongside mySignupToken below -- in normal
        // (non-bypassed) usage this UI-level token already catches every
        // case the store-level guard would, but the store-level guard is
        // now the one actually protecting state.user regardless of
        // caller, per tracker item dreamstore-signup-commits-state-user-
        // unc-vv6rio.
        cb(false, result.error, !!result.superseded);
      });
    }
    tryUsername(base);
  }
  function renderScreen13(el){

    // (see completeFunnel's isRecordMode branch below) -- so record
    // mode's copy says so instead of implying a dream is already in
    // progress.
    var headline = isRecordMode ? 'Almost set — where should we send you?' : 'Where should we send your first dream?';
    var reassurance = isRecordMode

      // Reassurance microcopy directly under the email field — a real user's

      // (previously unused) .fn-price-note treatment left-aligned instead of

      // alongside a separate "200 tokens on signup" body-copy line above the

      // the funnel most needs a single, clear reason to hand over an email.
      // That line is gone; this is now the ONLY message here, and still

      '<div class="fn-field-pw-wrap">' +
        '<input class="fn-field" id="fn-password" type="password" placeholder="Create a password" autocomplete="new-password">' +

      // signupAttemptToken's own comment above. Captured now, before the

            // Re-check -- this attempt can still go stale WHILE this
            // inner promise is unsettled, even though the outer check
            // (above) already passed. In normal (non-bypassed) usage
            // continueBtn/backBtn stay disabled through this whole span,
            // so nothing can bump signupAttemptToken during this
            // specific window today -- but that's an incidental
            // property of the current UI, not something this guard
            // should rely on. Without this re-check, a future change
            // that re-enables either button slightly earlier would
            // silently reopen exactly the same hazard the outer check
            // exists to close. Discarding here also means NOT touching
            // backBtn/next() -- same reasoning as the outer check's own
            // stale-discard above: this may be a detached/superseded
            // attempt, and a newer one already owns backBtn's state.
            if(mySignupToken !== signupAttemptToken) return;
            if(pendingId && !pendingStartFailed){
              // Best-effort — see claim-pending-generation.js's own doc
              // comment. email is required by its ownership check; this is
              // the exact same email start-pending-generation.js created
              // the pending record under, so it always matches.
              fetch('/.netlify/functions/claim-pending-generation', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pendingId: pendingId, email: email })
              }).catch(function(){ /* best-effort — see that file's own doc comment */ });
            }
            if(pendingOperationName && !pendingStartFailed){
              DreamStore.adoptPendingGeneration(pendingOperationName, pendingStartedAt, captionText, chosenStyle);
            }
            backBtn.disabled = false;
            next();
          });
        });
      }, 0);
    });
  }

  // ===================================================================
  // Screen 14 — Token intro (formerly Pricing / paywall)
  // ===================================================================
  // DreamTube's launch monetization model is consumption-based tokens, not
  // subscriptions — see netlify/functions/lib/entitlements.js's big doc
  // block for the full model. There is no plan to choose here anymore (no
  // Yearly/Monthly cards, no MOTIVATION_PLAN recommendation, no
  // "Continue to payment") — every visitor gets the same free starting
  // balance (220 tokens on signup, +20 every 24h automatically, see
  // getTokenStatus), so this screen is now a plain, honest acknowledgment/
  // continue step, not a paywall to get past. shop.html (linked from
  // profile.html once signed in) is where token packs will eventually be
  // purchased for real.
  //
  // Per a real mobile-test founder pass, the earlier version of this
  // screen (value-prop checklist + a token-math card + two "coming soon"
  // token-pack price tiles) read as "too much text" and "scary" right
  // before signup — replaced with one short, honest statement instead.
  // This is deliberately NOT wired to real purchasing — this screen is
  // mid-funnel, pre-signup; shop.html (post-signup) is where token packs
  // are actually sold now that Dodo Payments is live.
  //
  // Store-launch copy sweep (tracker item
  // for-product-store-launch-copy-sweep-purc-m6xhkx): the card used to say
  // "Still in beta" / "Free to try and enjoy right now — no card needed",
  // matching the same "Free during beta" framing shop.html/style.html's
  // out-of-tokens messaging used to have — a real, live contradiction once
  // Dodo Payments checkout actually went live (founder launched the store
  // 2026-07-27). Fixed to state the real signup grant instead (220 tokens,
  // matching wizard.html's own renderSignup screen and
  // lib/entitlements.js's real INITIAL_GRANT — see that screen's comment
  // for why this can't be fetched live pre-signup and must be hand-kept in
  // sync). "No card needed" itself is still accurate and kept — signing up
  // genuinely doesn't require a card, unlike the dropped "beta" framing,
  // which implied a temporary state that would eventually start charging.
  var MOTIVATION_HEADLINES = {
    'Capture dreams before they fade': 'Never lose a dream again.',
    'Turn them into videos': 'See your dreams, not just remember them.',
    'Process a recurring dream': 'Finally make sense of the dream that keeps coming back.',
    'Keep them forever': 'Every dream, kept forever.',
    'Watch dreams of other people': "Yours — and everyone else's — waiting to be seen.",
    'Share with friends': 'Dreams worth sharing.'
  };
  function renderScreen14(el){
    var primaryMotivation = quiz.motivations[0] || null;
    var headline = (primaryMotivation && MOTIVATION_HEADLINES[primaryMotivation]) || 'Never lose a dream again.';

    el.innerHTML =
      '<div class="fn-eyebrow">Built around: ' + esc(primaryMotivation || 'your dreams') + '</div>' +
      '<div class="fn-headline" style="font-size:21px;">' + esc(headline) + '</div>' +
      (dreamsThisMonthCount !== null ?
        '<div class="fn-proof-strip"><span class="avatars"><i></i><i></i><i></i></span><span>' + dreamsThisMonthCount.toLocaleString() + (dreamsThisMonthCount === 1 ? ' dream' : ' dreams') + ' brought to life this month</span></div>' :
        '') +
      '<div class="fn-token-free-card">' +
        '<div class="title">Free to start</div>' +
        '<div class="body">220 tokens on signup, no card needed — enough for a couple of free videos.</div>' +
      '</div>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary" id="fn-s14-continue" type="button">Continue</button>';

    document.getElementById('fn-s14-continue').addEventListener('click', proceedPastPricing);
  }

  // This screen used to be a real (if bypassed) paywall — see this file's
  // git history for the old proceedPastPricing() doc comment. There is
  // nothing left to bypass now: every token a visitor can spend today is
  // free-earned (see the doc block above renderScreen14), so this is just
  // the screen's "acknowledge and continue" action, kept as its own named
  // function (rather than inlined into the click listener) purely so the
  // tracking call below has one obvious home.
  function proceedPastPricing(){
    // Renamed from the old funnel_pricing_bypassed (there's no plan to
    // record anymore, and "bypassed" implied skipping a real paywall,
    // which this screen no longer is).
    track('funnel_token_intro_continued', { step: 14 });
    next();
  }

  // ===================================================================
  // Screen 15 — Confirmation, then real handoff to processing.html
  // (or, in Record mode, to create.html's Record UI -- see
  // completeFunnel below). Record-mode-aware (bug fix, tracker item
  // for-product-bug-founder-high-record-it-f-8ng0nf): the default copy
  // ("Building your first dream now") is honest for Build/Write
  // visitors, whose real generation is already in flight (see
  // getOrStartPendingGeneration above) -- but false for Record-it
  // visitors, for whom nothing has been recorded or built yet at this
  // point; that's the very next step, on create.html. Record mode's
  // copy points at recording instead of claiming a dream is already
  // being made.
  // ===================================================================
  function renderScreen15(el){
    var headline = isRecordMode ? "You're in. Let’s record your dream." : "You're in. Building your first dream now.";
    var body = isRecordMode ? 'Next: tap record and tell us about it — DreamTube will bring it to life.' : 'This is DreamTube — quiet and dark, like the room you just woke up in.';
    var btnLabel = isRecordMode ? 'Start recording' : 'Watch it happen';
    el.innerHTML =
      '<div class="fn-spacer"></div>' +
      '<div class="fn-check-badge">&#10003;</div>' +
      '<div class="fn-headline" style="text-align:center; color:#fff; font-size:23px;">' + headline + '</div>' +
      '<div class="fn-body-copy" style="text-align:center; color:rgba(255,255,255,.7);">' + body + '</div>' +
      '<div class="fn-spacer"></div>' +
      '<button class="fn-btn-primary" id="fn-s15-continue" type="button">' + btnLabel + '</button>';
    document.getElementById('fn-s15-continue').addEventListener('click', completeFunnel);
  }
  function completeFunnel(){
    track('funnel_completed', {
      style: chosenStyle,
      recall: quiz.recall,
      dream_types: quiz.dreamTypes,
      motivations: quiz.motivations,
      mode: isRecordMode ? 'record' : null
    });
    // Record-it (isRecordMode): there's no generation in flight — the
    // generate-during-signup call was deliberately skipped above (no real
    // caption to submit) — so processing.html (which assumes an adopted
    // generation to poll for) would be wrong here. Send the visitor straight
    // into create.html's Record UI instead, via a param create.html checks
    // on load to auto-open the mic-record flow (skipping the Build/Write/
    // Record choice screen — the account already exists from screen 13's
    // signup, so create.html's own auth guard passes).
    if(isRecordMode){
      location.href = 'create.html?record=1';
      return;
    }
    location.href = 'processing.html';
  }

  // ===================================================================
  // Navigation / phase engine
  // ===================================================================
  // SCREEN_RENDERERS/TAGS/PHASE_BY_STEP are built together, entry-for-entry
  // in lock step, so cur/goToStep/renderProgress/applyPhase all index into
  // the same set of screens no matter which set actually got built. The
  // "characters" screen (renderScreenAdvChars) is included only when
  // captionSuggestsPeople(captionText) finds first-person/people-indicating
  // language in the dream text — see that function's own comment. This is
  // a best-effort UX heuristic, not a correctness gate: showing the screen
  // unnecessarily (a false positive) is completely fine, the only thing
  // that matters is not asking someone to define characters for a dream
  // that obviously has none (e.g. "Standing on a mountain watching the
  // sunset").
  //
  // renderScreenAdvCamera/renderScreenAdvScenery are deliberately PARKED,
  // not deleted — founder decision 2026-07-24 (tracker item
  // for-product-two-post-handoff-app-pages-p-atr0r7): every real visitor
  // reaching this file's funnel tail arrives via ?resume=1 (see the Entry
  // guard above — a bare visit redirects away before ever reaching these
  // arrays), so skipping the two screens unconditionally here *is*
  // "skip them for funnel-resumed users," with no separate gate needed.
  // The marketing funnel already assembles camera/scenery info into
  // captionText before handoff, so these two screens were pure
  // redundant clicks for every live visitor. Their function bodies,
  // markup, and DreamStore.setDraft(cameraView/sceneryTime/sceneryPlace)
  // wiring are left fully intact below (see the "PARKED" comments on
  // each) for when they get folded into the wizard proper later — just
  // omitted from the arrays that actually drive navigation.
  var showCharsScreen = captionSuggestsPeople(captionText);
  var SCREEN_RENDERERS = showCharsScreen
    ? [renderScreenAdvChars, renderScreen11, renderScreen13, renderScreen14, renderScreen15]
    : [renderScreen11, renderScreen13, renderScreen14, renderScreen15];
  var TAGS = showCharsScreen
    ? ['advanced_characters', 'preparing', 'email_capture', 'pricing', 'confirmation']
    : ['preparing', 'email_capture', 'pricing', 'confirmation'];
  var PHASE_BY_STEP = showCharsScreen
    ? ['dawn', 'transition', 'dusk', 'dusk-deep', 'night']
    : ['transition', 'dusk', 'dusk-deep', 'night'];
  // Skip handler on the (now sole, when shown) Advanced screen jumps
  // straight to the "preparing" transition screen (renderScreen11) —
  // looked up dynamically here instead of a hardcoded index, since that
  // index shifts by one depending on whether the characters screen above
  // is present.
  var PREPARING_STEP = SCREEN_RENDERERS.indexOf(renderScreen11);

  function renderProgress(){
    var dots = '';
    for(var i = 0; i < SCREEN_RENDERERS.length; i++){
      dots += '<i class="' + (i < cur ? 'done' : i === cur ? 'now' : '') + '"></i>';
    }
    progressEl.innerHTML = dots;
  }

  function applyPhase(stepIndex){
    var key = PHASE_BY_STEP[stepIndex];
    appEl.classList.toggle('fn-phase-night', key === 'night');
    var p = PHASES[key];
    appEl.style.background = p.grad;
    appEl.style.setProperty('--phase-ink', p.ink);
    appEl.style.setProperty('--phase-soft', p.soft);
    appEl.style.setProperty('--phase-faint', p.faint);
    appEl.style.setProperty('--phase-card', p.card);
    appEl.style.setProperty('--phase-line', p.line);
  }

  function render(){
    SCREEN_RENDERERS[cur](screenEl);
    applyPhase(cur);
    renderProgress();
    screenEl.scrollTop = 0;
    window.scrollTo(0, 0);
    track('funnel_step_viewed', { step: cur + 1, screen: TAGS[cur] });
    // Higher-volume mid-funnel signal than CompleteRegistration (fires on
    // reaching the ask, not just on completing it) — Growth wants this as
    // an optimization target with more volume. Custom event (not a
    // standard Pixel event), same event_id/CAPI pairing as
    // CompleteRegistration above (see fireMetaConversion).
    if(TAGS[cur] === 'email_capture'){
      fireMetaConversion('ReachedEmailEntry', {}, true);
    }
  }

  function goToStep(n){
    if(n < 0 || n >= SCREEN_RENDERERS.length) return;
    cur = n;
    render();
  }
  function next(){ goToStep(cur + 1); }
  function prev(){
    if(cur > 0){ goToStep(cur - 1); return; }
    // The first screen here has nothing before it in this origin to step
    // back to — the visitor always arrives from the marketing funnel now,
    // so "back" should return them there. document.referrer confirms
    // that's genuinely where they came from before trusting history.back()
    // with it (same pattern as result.html's back button); falls back to
    // the funnel's URL directly if there's no referrer to check.
    if(document.referrer){ history.back(); return; }
    location.href = 'https://dreamtubeapp.netlify.app/';
  }
  backBtn.addEventListener('click', function(){
    // Invalidates any in-flight (or not-yet-acted-on) Signup attempt the
    // moment the user navigates away via Back -- see signupAttemptToken's
    // own comment above. Bumping only on screen 13's own Continue click
    // would miss this: a visitor can navigate away from screen 13 and
    // just sit somewhere else without ever starting a competing second
    // attempt, and the abandoned first attempt's callback must still be
    // discarded once it settles late. Harmless to bump unconditionally
    // on every Back click, including ones that have nothing to do with
    // Signup -- there's simply nothing in flight for it to invalidate.
    signupAttemptToken++;
    prev();
  });

  // Make sure no stale draft from a previous/abandoned session leaks into
  // this one (mirrors create.html's own clean-slate behavior for
  // non-restore visits) — must run BEFORE the hydration below, not after,
  // otherwise it would wipe out the caption/style the visitor already
  // gave the marketing funnel.
  DreamStore.clearDraft();
  // The marketing funnel's screens 8 (dream capture) and 9 (style) used
  // to call DreamStore.setDraft() directly when they lived in this file
  // — now that they run in a different origin with no DreamStore at all,
  // the funnel carries their answers here as URL params instead, and
  // this is where they finally land in the real draft.
  DreamStore.setDraft({ caption: captionText, style: chosenStyle, sourceDreamId: null });
  render();
})();
</script>
</body>
