  var SCREEN_RENDERERS = [renderScreen13, renderScreen14];
  var TAGS = ['email_capture', 'pricing_confirmation'];
  var PHASE_BY_STEP = ['night', 'night'];
  // Same dynamic-lookup reasoning as before this fix — screen 13's index
  // could shift depending on which screens preceded it, so the
  // Facebook-return path must never hardcode it. Currently always 0, but
  // looked up rather than hardcoded so this keeps working unchanged if a
  // screen is ever added back in front of it.
  var SIGNUP_STEP = SCREEN_RENDERERS.indexOf(renderScreen13);

  function renderProgress(){
    var dots = '';
    for(var i = 0; i < SCREEN_RENDERERS.length; i++){
      dots += '<i class="' + (i < cur ? 'done' : i === cur ? 'now' : '') + '"></i>';
    }
    progressEl.innerHTML = dots;
  }

  function applyPhase(stepIndex){
    var key = PHASE_BY_STEP[stepIndex];
    appEl.classList.toggle('fn-phase-night', key === 'night');
    var p = PHASES[key];
    appEl.style.background = p.grad;
    appEl.style.setProperty('--phase-ink', p.ink);
    appEl.style.setProperty('--phase-soft', p.soft);
    appEl.style.setProperty('--phase-faint', p.faint);
    appEl.style.setProperty('--phase-card', p.card);
    appEl.style.setProperty('--phase-line', p.line);
  }

  function render(){
    SCREEN_RENDERERS[cur](screenEl);
    applyPhase(cur);
    renderProgress();
    screenEl.scrollTop = 0;
    window.scrollTo(0, 0);
    track('funnel_step_viewed', { step: cur + 1, screen: TAGS[cur] });
    // Higher-volume mid-funnel signal than CompleteRegistration (fires on
    // reaching the ask, not just on completing it) — Growth wants this as
    // an optimization target with more volume. Custom event (not a
    // standard Pixel event), same event_id/CAPI pairing as
    // CompleteRegistration above (see fireMetaConversion).
    if(TAGS[cur] === 'email_capture'){
      fireMetaConversion('ReachedEmailEntry', {}, true);
    }
  }

  function goToStep(n){
    if(n < 0 || n >= SCREEN_RENDERERS.length) return;
    cur = n;
    render();
  }
  function next(){ goToStep(cur + 1); }
  function prev(){
    if(cur > 0){ goToStep(cur - 1); return; }
    // The first screen here has nothing before it in this origin to step
    // back to — the visitor always arrives from the marketing funnel now,
    // so "back" should return them there. document.referrer confirms
    // that's genuinely where they came from before trusting history.back()
    // with it (same pattern as result.html's back button); falls back to
    // the funnel's URL directly if there's no referrer to check.
    if(document.referrer){ history.back(); return; }
    location.href = 'https://dreamtubeapp.netlify.app/';
  }
  backBtn.addEventListener('click', function(){
    // Invalidates any in-flight (or not-yet-acted-on) Signup attempt the
    // moment the user navigates away via Back -- see signupAttemptToken's
    // own comment above. Bumping only on screen 13's own Continue click
    // would miss this: a visitor can navigate away from screen 13 and
    // just sit somewhere else without ever starting a competing second
    // attempt, and the abandoned first attempt's callback must still be
    // discarded once it settles late. Harmless to bump unconditionally
    // on every Back click, including ones that have nothing to do with
    // Signup -- there's simply nothing in flight for it to invalidate.
    signupAttemptToken++;
    // Also invalidates any in-flight DreamStore.signup() call at the
    // STORE layer, not just this file's own UI-level token above -- see
    // the Change-email handler's own copy of this comment further up
    // this file, DreamStore.invalidatePendingSignup's own doc comment
    // (js/store.js), and tracker item
    // js-store-js-signupcallseq-only-invalidat-ijwpht.
    DreamStore.invalidatePendingSignup();
    prev();
  });

  // Make sure no stale draft from a previous/abandoned session leaks into
  // this one (mirrors create.html's own clean-slate behavior for
  // non-restore visits) — must run BEFORE the hydration below, not after,
  // otherwise it would wipe out the caption/style the visitor already
  // gave the marketing funnel.
  DreamStore.clearDraft();
  // The marketing funnel's screens 8 (dream capture) and 9 (style) used
  // to call DreamStore.setDraft() directly when they lived in this file
  // — now that they run in a different origin with no DreamStore at all,
  // the funnel carries their answers here as URL params instead, and
  // this is where they finally land in the real draft.
  DreamStore.setDraft({ caption: captionText, style: chosenStyle, sourceDreamId: null });

  // ===================================================================
  // Boot — normal arrival, or the Facebook Login return leg
  // ===================================================================
  /**
   * Handles the ?bt= return leg (spec §2.1 steps 6-8), then hands off to
   * the ordinary render(). Structured as "paint a loading state, then do
   * the work on the next tick" for one concrete reason:
   * DreamStore.consumeSessionTransferTokenFromUrlSync() is a deliberately
   * SYNCHRONOUS XMLHttpRequest (see its own doc comment in js/store.js
   * for why — every caller's very next line assumes state.user is already
   * settled). A synchronous XHR blocks the main thread, so a spinner
   * rendered on the same tick would never actually paint. Deferring by
   * one tick gives the browser a frame to show "Signing you in…" before
   * the blocking call starts.
   *
   * A normal (non-Facebook) load takes the early branch and behaves
   * EXACTLY as it did before this feature existed — same single render()
   * call, on the same tick, with no added latency.
   */
  function boot(){
    if(!resumedFromFacebook){
      // Hygiene: a snapshot left behind by an abandoned Facebook round
      // trip must never survive into an unrelated later run of this
      // funnel. (restoreStagedFromFacebookRedirect also has its own
      // savedAt age check — this is the cheaper, more direct half of the
      // same guarantee.)
      clearPersistedStaged();
      render();
      return;
    }

    if(!fbTransferPresent){
      // A failed round trip (?fb_error=) or the needs-email half-step
      // (?fb_needs_email=). No token to consume, so nothing to wait on —
      // but land straight back on screen 13, where the visitor actually
      // was when they left, rather than replaying any earlier screen at
      // them again.
      cur = SIGNUP_STEP;
      render();
      return;
    }

    cur = SIGNUP_STEP;
    applyPhase(cur);
    renderProgress();
    screenEl.innerHTML =
      '<div class="fn-spacer"></div>' +
      '<div class="fn-spin"></div>' +
      '<div class="fn-loading-line">Signing you in…</div>' +
      '<div class="fn-spacer"></div>';

    setTimeout(function(){
      // New call site for an existing function — see js/store.js's own
      // doc comment. Silent no-op on a missing/expired/already-consumed
      // token, which simply falls through to the signed-out path below.
      try{ DreamStore.consumeSessionTransferTokenFromUrlSync(); }catch(e){ /* see that function's own silent-no-op contract */ }
      restoreStagedFromFacebookRedirect();

      var user = DreamStore.getCurrentUser();
      if(!user){
        // The token didn't resolve (expired, already consumed, a second
        // tab racing the same URL, a network failure). Fail closed to the
        // ordinary signup screen with an inline explanation — the manual
        // email/password path is completely unaffected and remains the
        // fallback, per spec §2.4.
        pendingFacebookErrorSlug = pendingFacebookErrorSlug || 'signin_failed';
        render();
        return;
      }

      // Skip screen 13 entirely (spec §2.1 step 8) — there is nothing
      // left to ask this visitor for. getAccountEmail() reads the email
      // commitTransferredSession just wrote from the server-verified
      // token, never anything client-supplied.
      var email = DreamStore.getAccountEmail() || '';
      var fbOutcome = getParam('fb');
      track('signup_facebook_completed', { variant: signupVariant, outcome: fbOutcome || null });
      // Shared event_id pairs this with the Pixel's own
      // CompleteRegistration call — the exact same fireMetaConversion
      // convention attemptSignup uses for the manual path (see
      // js/analytics-config.js). Fired here rather than inside
      // completeSignupAndAdvance so the manual path's own long-standing
      // call site (inside attemptSignup, at the moment the account
      // genuinely exists) stays exactly where it is. Gated on fb=signup
      // specifically — facebook-oauth-callback.js sets fb:'login' for an
      // existing-email match (docs/SIGNUP_FACEBOOK_LOGIN_SPEC.md §2.2:
      // "Counted as a login for funnel-conversion measurement, not a new
      // signup"), and firing this unconditionally would double-count
      // every returning Facebook user as a fresh signup conversion.
      if(email && fbOutcome === 'signup') fireMetaConversion('CompleteRegistration', { email: email });
      completeSignupAndAdvance(email, {
        advance: function(){ goToStep(SIGNUP_STEP + 1); }
      });
    }, 0);
  }

  boot();
})();
</script>
</body>
</html>
