   * not shared, per this codebase's page-local-script convention (no
   * bundler/ES modules, see CLAUDE.md).
   */
  function checkEmailAvailable(email){
    return fetch('/.netlify/functions/check-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(result.ok && result.data && result.data.ok !== false && typeof result.data.available === 'boolean'){
        return { available: result.data.available, deliverable: result.data.deliverable !== false };
      }
      return { available: true, deliverable: true }; // resilient fallback -- see this function's own doc comment
    }).catch(function(){
      return { available: true, deliverable: true }; // resilient fallback -- see this function's own doc comment
    });
  }

  // ===================================================================
  // Screen 13 — Email capture. Username is derived automatically from the
  // email's local part (never asked of the visitor) per the task spec.
  // ===================================================================
  // Per-attempt token — same unscoped-async-callback pattern as
  // pendingGenerationToken above, and wizard.html's own signupAttemptToken
  // (see that file's doc comment, ~wizard.html:993). attemptSignup() below
  // is a real register-account.js network round trip (see js/store.js's
  // DreamStore.signup); its callback used to unconditionally act on
  // whatever it found once it settled -- write to shared pending*/staged
  // state AND advance to the next screen -- with no check that this was
  // still the current attempt. Repro (tracker item
  // wizard-html-start-html-signup-step-force-8wtk8h): tap Continue here
  // (fires the real signup call), immediately tap Back before it
  // resolves, edit the email, resubmit, reach this same screen fresh a
  // second time -- the first, abandoned call's callback, once it finally
  // settles, would force-navigate the visitor forward from wherever they
  // actually are and could adopt/claim the wrong pending job (reading
  // live pendingId/pendingOperationName/pendingPromise at settlement
  // time instead of a fire-time snapshot).
  //
  // Gates the ENTIRE callback body -- both the writes AND the
  // navigation, INCLUDING the nested pendingPromise.then(...)
  // continuation below (which has its own re-check, right at its top,
  // since it settles asynchronously AFTER this outer check already ran
  // and could go stale in that gap) -- unlike pendingGenerationToken
  // above (which only guards that fetch's write, since nothing here
  // waits on it before advancing). Signup has no "safe to advance
  // without waiting" skip case: there is no real account, and nothing
  // safe to hand off to the next screen, until DreamStore.signup itself
  // actually resolves ok.
  //
  // Bumped on THREE separate triggers, not just one: (1) every Continue
  // click on this screen (below), so a genuinely new, competing attempt
  // always supersedes an older one still in flight; (2) every Back
  // click (see the navigation engine's backBtn listener, further down
  // this file); and (3) the password step's own "Change email" link (see
  // renderPasswordStep's own click handler above, tracker item
  // start-html-variant-b-s-change-email-link-1kc3vs) -- simply
  // navigating away from this screen by any of these three paths,
  // without necessarily starting a new attempt at all, invalidates
  // whatever's still in flight. All three triggers are required: an
  // early version of this fix only bumped on (1) and a regression test
  // caught the gap -- sit on a second, fresh screen 13 without
  // resubmitting, and an abandoned first attempt's late settlement
  // would still force-navigate, because nothing had bumped the token
  // since attempt #1 fired it. Continue/Back are ALSO disabled for the
  // duration of the call (defense-in-depth -- see the click handler
  // below), so in normal usage there is no way to re-trigger either of
  // those two while an attempt is in flight -- but the Change-email
  // link is deliberately NOT disabled (a user must be able to correct a
  // typo'd email mid-flight), so it's the one trigger where the token
  // bump is the only thing standing between a stale settlement and a
  // silently-adopted stale account.
  var signupAttemptToken = 0;
  // "Entered email" micro-step (tracker item
  // for-product-instrument-entered-email-mic-k1fux1): between
  // ReachedEmailEntry (fires at render, above) and signed_up there was no
  // signal for "actually typed/submitted an email" at all -- this is the
  // one event that decides whether the 98->36 signup leak's story is
  // trust-at-first-glance (nobody types anything) or the password field
  // (people type an email fine, then bail once password is asked for).
  // Fires at most ONCE per real arrival at screen 13 (reset in
  // renderScreen13 below, NOT on the screen's own internal email->password
  // DOM swap, which is the same visit, not a fresh one) -- on whichever
  // comes first, blur-with-content or a submit attempt, matching the
  // item's own "first non-empty email field blur or submit attempt"
  // wording. A blur with an empty field never fires this; that's the
  // "never engaged at all" case this event exists to distinguish from.
  var emailEnteredTracked = false;
  function maybeTrackEmailEntered(email){
    if(emailEnteredTracked) return;
    if(!email) return;
    emailEnteredTracked = true;
    track('signup_email_entered', { variant: signupVariant });
  }
  function deriveUsernameBase(email){
    var local = (email.split('@')[0] || '').toLowerCase();
    var sanitized = local.replace(/[^a-z0-9]/g, '');
    if(sanitized.length < 3) sanitized = (sanitized + 'dreamer').slice(0, Math.max(3, sanitized.length + 4));
    return sanitized.slice(0, 20) || 'dreamer';
  }
  function attemptSignup(email, password, cb){
    var base = deriveUsernameBase(email);
    var attempts = 0;
    var MAX_ATTEMPTS = 8;
    // DreamStore.signup is now a real network round trip (server-side
    // account check, see js/store.js) — this loop is unchanged in shape,
    // just chained through the returned Promise instead of a synchronous
    // return, so a "username taken" collision (now possibly discovered on
    // the SERVER, from a signup on a different device, not just this
    // browser's local storage) still retries with a new suffix exactly as
    // before.
    function tryUsername(username){
      DreamStore.signup(username, password, email).then(function(result){
        if(result.ok){
          // Shared event_id pairs this with the Pixel's own
          // CompleteRegistration call — see js/analytics-config.js's
          // fireMetaConversion for why. login.html's own ?mode=signup path
          // fires the equivalent call for its own signup case.
          fireMetaConversion('CompleteRegistration', { email: email });
          cb(true, null, false); return;
        }
        if(result.error === 'That username is already taken.' && attempts < MAX_ATTEMPTS){
          attempts++;
          var suffix = Math.floor(1000 + Math.random() * 9000);
          tryUsername(base + suffix);
          return;
        }
        // result.superseded (js/store.js's own call-sequence guard --
        // see signupCallSeq's doc comment there) means THIS call was
        // never even the most-recently-STARTED signup() call by the time
        // its response landed, so js/store.js itself already declined to
        // touch state.user/state.accounts for it. Passed through to cb
        // as defense-in-depth alongside mySignupToken below -- in normal
        // (non-bypassed) usage this UI-level token already catches every
        // case the store-level guard would, but the store-level guard is
        // now the one actually protecting state.user regardless of
        // caller, per tracker item dreamstore-signup-commits-state-user-
        // unc-vv6rio.
        cb(false, result.error, !!result.superseded);
      });
    }
    tryUsername(base);
  }

  /**
   * The ONE post-signup continuation, shared by the manual email/password
   * path and the Facebook-return path (spec §2.5's explicit instruction:
   * "factor a shared completeSignupAndAdvance(email) continuation both
   * ... call, rather than duplicating the flush-characters /
   * kick-off-generation / fire-CompleteRegistration / advance-to-14
   * sequence a second time").
   *
   * Everything here used to live inline inside wireScreen13Fields'
   * attemptSignup callback and is behaviourally unchanged for that
   * caller — same order, same guards, same calls. The two callers differ
   * only in the three things passed as options:
   *
   *   pendingPromise — the manual path fires
   *     getOrStartPendingGeneration IN PARALLEL with attemptSignup (a
   *     deliberate head start, see that call site) and hands the
   *     already-in-flight promise in. The Facebook path CAN'T: the email
   *     isn't known until the round trip returns, so it lets this
   *     function start the call itself. That's the accepted tradeoff the
   *     spec's §5 already calls out.
   *   isStale — the manual path's signupAttemptToken re-check, which must
   *     still gate the async continuation below (see signupAttemptToken's
   *     own long comment). The Facebook path has no competing in-flight
   *     attempt to go stale against — it bumped the token itself before
   *     leaving for facebook.com, and this runs on a freshly-loaded page.
   *   advance — the manual path is standing on screen 13 and steps
   *     forward with next(); the Facebook path skipped screen 13 entirely
   *     and jumps straight to screen 14.
   */
  function completeSignupAndAdvance(email, opts){
    opts = opts || {};
    flushStagedCharactersToStore();
    // `!email` can only happen on the Facebook path, and only if the
    // server-verified session somehow carried no email at all. Treated
    // exactly like isRecordMode: never fire a real, billed generation
    // whose delivery address is unknown — the funnel still completes, the
    // generation just starts later, on home.html, as it did before
    // generate-during-signup existed.
    var pendingPromise = opts.pendingPromise ||
      ((isRecordMode || !email) ? Promise.resolve() : getOrStartPendingGeneration(email));
    return pendingPromise.then(function(){
      if(typeof opts.isStale === 'function' && opts.isStale()) return;
      if(pendingId && !pendingStartFailed){
        // Best-effort — see claim-pending-generation.js's own doc
        // comment. email is required by its ownership check; this is
        // the exact same email start-pending-generation.js created
        // the pending record under, so it always matches.
        fetch('/.netlify/functions/claim-pending-generation', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pendingId: pendingId, email: email })
        }).catch(function(){ /* best-effort — see that file's own doc comment */ });
      }
      if(pendingOperationName && !pendingStartFailed){
        DreamStore.adoptPendingGeneration(pendingOperationName, pendingStartedAt, captionText, chosenStyle);
      }
      backBtn.disabled = false;
      if(typeof opts.advance === 'function') opts.advance(); else next();
    });
  }

  /**
   * Seamless already-registered handoff (tracker item
   * for-product-urgent-forensic-find-the-pro-fzgghg, item 1).
   *
   * Forensic finding: check-email.js reporting an entered email as already
   * registered used to be a hard dead end on this screen — an inline
   * "sign in instead" link that required leaving this screen (and this
   * funnel visit's own in-progress state: staged characters, the quiz
   * answers, whatever pending-generation head start had already fired) for
   * a completely separate login.html page. Of the only two genuine
   * returning users this product has ever had, both re-entered through
   * this exact funnel and hit this exact error; one survived by manually
   * finding /login themselves afterwards (proving the underlying
   * claim-then-create mechanism works fine once someone actually gets
   * inside); the other never found it and got stuck rageclicking a
   * DIFFERENT trap instead (see wireScreen13Fields' own missing_password
   * fix, right next to this one).
   *
   * Replaces the dead end with a lightweight, IN-PLACE login prompt on
   * this exact screen: the email stays prefilled/read-only (it's already
   * confirmed), only a password is asked, and a successful login runs
   * through the exact same completeSignupAndAdvance() continuation a fresh
   * signup uses — same claim-pending-generation call, same
   * DreamStore.adoptPendingGeneration, same default next() advance to
   * screen 14 — so a returning visitor lands exactly where a fresh signup
   * would (this funnel's home.html landing, once they clear screen 14,
   * per funnel-ending-v2). completeSignupAndAdvance's own default
   * pendingPromise (getOrStartPendingGeneration, since this call
   * deliberately passes none in) is exactly right here too: nothing was
   * safe to bill before we knew this was really their account, and now
   * that a real password check just confirmed it, kicking off their new
   * dream on THIS confirmed account is the correct next step — the same
   * "logged in, claimed the pending job, created a second video" sequence
   * the one surviving forensic returner's own session already proved
   * works, just without the "go find /login yourself" step in between.
   *
   * Two callers: the email step's own tryAdvance (the common case — this
   * is caught before the password-CREATE field is ever shown at all) and
   * wireScreen13Fields' own defense-in-depth re-check at submission (the
   * narrow race where the email became registered in the gap between the
   * two checks — see that function's own doc comment). `goBackToEmailStep`
   * is the caller's own closure over renderEmailStep(email) — this
   * function has no navigation state of its own and both callers already
   * have exactly the right one on hand.
   */
  function renderInPlaceLoginStep(email, goBackToEmailStep){
    // Re-enable Back unconditionally — reachable either from the email
    // step (Back was never disabled there) or from wireScreen13Fields'
    // submit handler (which DOES disable Back for the duration of its own
    // async call) — same defensive reset renderPasswordStep's own
    // Change-email handler already applies for the identical reason:
    // backBtn lives outside `screenEl`, so it survives this in-screen swap
    // untouched otherwise.
    backBtn.disabled = false;
    track('returning_user_login_shown', { variant: signupVariant });

    screenEl.innerHTML =
      '<div class="fn-headline">Welcome back</div>' +
      '<div class="fn-price-note" style="text-align:left; margin:-6px 0 14px;">Looks like you already have a DreamTube account with this email — log in to keep going.</div>' +
      '<input class="fn-field" id="fn-email" type="email" value="' + esc(email) + '" readonly style="color:var(--phase-soft, var(--fn-ink-soft)); cursor:default;">' +
      '<button type="button" class="fn-small-link" id="fn-s13-change-email" style="margin:-6px 0 12px;">Not you? Change email</button>' +
      '<div class="fn-field-pw-wrap">' +
        '<input class="fn-field" id="fn-login-password" type="password" placeholder="Your password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<button type="button" class="fn-field-pw-toggle" id="fn-pw-toggle" tabindex="-1" aria-label="Show password"></button>' +
      '</div>' +
      '<div class="fn-err-text" id="fn-signup-error"></div>' +
      '<button class="fn-btn-primary" id="fn-s13-continue" type="button" style="margin-bottom:12px;">Log in</button>' +
      // Escape hatch — a wrong-password/forgotten-password visitor must
      // never be trapped here either; login.html's own "Forgot password?"
      // link is the real reset flow, not reimplemented on this screen.
      '<div class="fn-body-copy" style="font-size:11.5px; opacity:.7; text-align:center; margin-top:-4px;"><a href="login.html" style="color:inherit;">Forgot your password, or need help signing in?</a></div>' +
      '<div class="fn-spacer"></div>';

    var pwToggle = document.getElementById('fn-pw-toggle');
    var pwInput = document.getElementById('fn-login-password');
    var continueBtn = document.getElementById('fn-s13-continue');
    var errEl = document.getElementById('fn-signup-error');
    pwToggle.innerHTML = Icons.eye;
    pwToggle.addEventListener('click', function(){
      var showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      pwToggle.innerHTML = showing ? Icons.eye : Icons.eyeOff;
      pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    document.getElementById('fn-s13-change-email').addEventListener('click', function(){
      // Same invalidation discipline as the signup password step's own
      // Change-email handler (renderPasswordStep, above) and for the same
      // reason: an in-flight DreamStore.login() call must never silently
      // establish a session for a screen the visitor already navigated
      // away from.
      signupAttemptToken++;
      DreamStore.invalidatePendingSignup();
      backBtn.disabled = false;
      goBackToEmailStep();
    });

    pwInput.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); continueBtn.click(); } });
    continueBtn.addEventListener('click', function(){
      var password = pwInput.value;
      errEl.textContent = '';
      if(!password){
        errEl.textContent = 'Enter your password.';
        track('returning_user_login_failed', { reason: 'missing_password', variant: signupVariant });
        // Same fix, same reasoning, as wireScreen13Fields' own
        // missing_password branch — see that function's doc comment on the
        // mobile-webview keyboard-focus hazard this closes. Refocus
        // SYNCHRONOUSLY, inside this real click's own user gesture.
        pwInput.focus();
        return;
      }

      signupAttemptToken++;
      var myLoginToken = signupAttemptToken;
      continueBtn.disabled = true;
      continueBtn.textContent = 'Logging in…';
      backBtn.disabled = true;

      DreamStore.login(email, password).then(function(result){
        if(myLoginToken !== signupAttemptToken) return; // stale -- navigated away (Back/Change email) while this was in flight
        if(!result.ok){
          continueBtn.disabled = false;
          continueBtn.textContent = 'Log in';
          backBtn.disabled = false;
          errEl.textContent = result.error || 'Couldn’t log you in — try again.';
          track('returning_user_login_failed', { reason: 'server_rejected', variant: signupVariant });
          pwInput.focus();
          return;
        }
        track('returning_user_login_succeeded', { variant: signupVariant });
        // CompleteRegistration is deliberately NOT fired here — that Pixel
        // event means a genuinely NEW account (attemptSignup's own tryUsername
        // and the Facebook path both only fire it on a real registration);
        // this is an existing account logging back in, not a new signup.
        completeSignupAndAdvance(email, {
          isStale: function(){ return myLoginToken !== signupAttemptToken; }
        });
      });
    });

    pwInput.focus();
  }

  // ===================================================================
  // Facebook Login — the client half (docs/SIGNUP_FACEBOOK_LOGIN_SPEC.md)
  // ===================================================================
  // LAYOUT NOTE (read before restyling): the founder has NOT yet picked
  // between the spec's Direction X (Facebook-primary, email demoted under
  // a divider) and Direction Y (Facebook purely additive, nothing else
  // restructured). This build deliberately implements Direction Y's
  // minimal placement — ONE button inserted above the existing email
  // field, no divider, no "or" separator, no change to anything else on
  // the screen — as the safe interim default.
  //
  // Everything below is written so that switching to Direction X later is
  // a CSS/markup-only follow-up: the button's DOM position, its visual
  // treatment (all of which lives in js/facebook-config.js's
  // facebookButtonHtml), its click handler, and every piece of backend
  // logic are fully decoupled. Moving the button, adding a divider, or
  // demoting the email form does not require touching one line of the
  // flow below.
  //
  // The button's own styling is Meta-brand-compliant (#1877F2, the "f"
  // mark, "Continue with Facebook" verbatim) and therefore deliberately
  // does NOT take this funnel's pastel-gradient .fn-btn-primary pill —
  // Meta's brand policy is a hard constraint, not a preference (spec §1).

  /** Markup for the additive Facebook button, or '' when the feature flag is still a placeholder — in which case NOTHING is written into the DOM (the button is absent, not hidden; spec §2.4's "Flag OFF" row). */
  function facebookSignupButtonHtml(){
    if(typeof isFacebookLoginConfigured !== 'function' || !isFacebookLoginConfigured()) return '';
    return '<div style="margin:0 0 14px;">' + facebookButtonHtml('fn-fb-continue') + '</div>';
  }

  /** Wires the button rendered by facebookSignupButtonHtml, if it's there. Safe no-op when the flag is off (no such element exists). */
  function wireFacebookSignupButton(){
    var btn = document.getElementById('fn-fb-continue');
    if(!btn) return;
    btn.addEventListener('click', function(){ startFacebookLogin(btn); });
  }

  /**
   * Leaves for Facebook's OAuth dialog as a FULL-PAGE navigation (never a
   * popup — see the spec's §1: popups are unreliable/blocked in the exact
   * FB/IG in-app webview this feature exists for).
   *
   * The invalidation pair at the top is the same discipline the password
   * step's "Change email" link already applies, and for the same reason: this
   * button is NOT disabled while a manual attempt is in flight (a user
   * must be able to change their mind mid-signup), so without it, an
   * abandoned attemptSignup could still settle and silently create the
   * account / adopt a pending job the user just walked away from. The
   * token bump stops THIS page's callbacks; invalidatePendingSignup stops
   * js/store.js's own commitLocalSignupIfCurrent from writing
   * state.user/state.accounts in the background (see that function's doc
   * comment and tracker item js-store-js-signupcallseq-only-invalidat-ijwpht).
   */
  function startFacebookLogin(btn){
    signupAttemptToken++;
    DreamStore.invalidatePendingSignup();
    // Also re-enable Back, exactly like the Change-email link does and
    // for the same reason: backBtn lives outside `el` (the topbar), so if
    // an abandoned attempt had already disabled it, it would otherwise
    // stay stuck disabled — which matters here specifically because the
    // navigation below is not guaranteed to actually leave the page (a
    // slow/failed reach for facebook.com from inside an in-app webview
    // leaves the visitor sitting right here).
    backBtn.disabled = false;
    track('signup_facebook_started', { variant: signupVariant });

    // Must happen BEFORE navigating — see persistStagedForFacebookRedirect
    // and the spec's §2.5. A failure here is logged, never fatal.
    persistStagedForFacebookRedirect();

    var nonce = facebookRandomNonce();
    setFacebookStateCookie(nonce);
    var state = buildFacebookState(nonce, location.search);
    if(btn){ btn.disabled = true; }
    location.href = buildFacebookOAuthUrl(state);
  }

  // Rendered into #fn-signup-error the next time screen 13 draws, then
  // cleared — so a failed Facebook round trip surfaces exactly once,
  // inline, with the email/password fields beside it fully usable as the
  // fallback the spec's §2.4 requires.
  var pendingFacebookErrorSlug = facebookErrorSlug;

  function facebookErrorMessage(slug){
    if(slug === 'denied') return 'Facebook sign-in was cancelled — you can continue with email below.';
    if(slug === 'rate_limited') return 'Too many sign-in attempts from your network today — please continue with email below.';
    if(slug === 'account_conflict') return "We couldn't match that Facebook account to an account here — please continue with email below.";
    return 'Something went wrong signing in with Facebook — try again, or continue with email below.';
  }

  /** Paints (once) whatever Facebook error this load arrived with into the just-rendered screen-13 error slot. Called at the end of both the email step's and the password step's render. */
  function applyPendingFacebookError(){
    if(!pendingFacebookErrorSlug) return;
    var errEl = document.getElementById('fn-signup-error');
    if(!errEl) return;
    errEl.textContent = facebookErrorMessage(pendingFacebookErrorSlug);
    track('signup_facebook_error_shown', { reason: pendingFacebookErrorSlug, variant: signupVariant });
    pendingFacebookErrorSlug = null;
  }

  function renderScreen13(el){
    // Facebook confirmed who this visitor is but gave us no email (spec
    // §2.4 / §3 step 3) — ask for exactly one field instead of the normal
    // signup form. Deliberately a separate renderer: it shares none of the
    // email-first flow's own password/validation logic.
    if(facebookNeedsEmailToken){
      renderScreen13FacebookEmail(el);
      return;
    }
    // Reset per fresh arrival at this screen (goToStep/render calling in
    // here) -- NOT reset by renderScreen13EmailFirst's own internal
    // email->password DOM swap, which never re-enters this function; see
    // emailEnteredTracked's own doc comment above.
    emailEnteredTracked = false;
    // Record-mode-aware (bug fix, tracker item
    // for-product-bug-founder-high-record-it-f-8ng0nf): the default
    // headline/reassurance assume a dream already exists and is just
    // waiting to be delivered -- true for Build/Write visitors (real
    // caption text already handed off from the funnel), but false for
    // Record-it visitors, who haven't recorded anything yet. Recording
    // happens app-side, right after this signup step, on create.html
    // (see completeFunnel's isRecordMode branch below) -- so record
    // mode's copy says so instead of implying a dream is already in
    // progress.
    var headline = isRecordMode ? 'Almost set — where should we send you?' : 'Where should we send your first dream?';

    // Fired once per actual arrival at this screen: renderScreen13 runs
    // exactly once per navigation here (see render()/goToStep() below),
    // even though renderScreen13EmailFirst then does its own internal,
    // non-navigating DOM swap from the email step to the password step --
    // that swap must NOT re-fire this. signupVariant is now a fixed
    // 'unified' value (see its own doc comment above), kept on this event
    // so existing PostHog dashboards/queries built on this property keep
    // working, and so the next real A/B challenger has a stable 'variant'
    // property to extend rather than a schema change to make.
    if(window.posthog && typeof window.posthog.register === 'function'){
      try{ posthog.register({ signup_email_first_variant: signupVariant }); }catch(e){ /* analytics must never break the funnel */ }
    }
    track('signup_email_first_variant_shown', { variant: signupVariant });

    renderScreen13EmailFirst(el, headline);
  }

  /**
   * Shared submit wiring for screen 13's password step. Extracted so the
   * token-guard-protected submission logic (signupAttemptToken bump,
   * backBtn/continueBtn disable, attemptSignup call, both layers of the
   * pendingPromise staleness re-check) exists in exactly ONE place.
   * Assumes the DOM currently in `el` already contains #fn-pw-toggle,
   * #fn-password (inside .fn-field-pw-wrap), #fn-email, #fn-signup-error,
   * and #fn-s13-continue -- exactly what renderScreen13EmailFirst's
   * password-step markup below renders.
   *
   * `goBackToEmailStep` -- renderPasswordStep's own way to swap back to the
   * email step, in place, without a real navigation (see that function's
   * call site). Passed through unchanged to renderInPlaceLoginStep's own
   * "Change email" link if this screen's defense-in-depth check-email
   * re-check (below) discovers the email became registered in the gap
   * since the email step's own check already passed it through -- see that
   * function's own doc comment for why it needs this at all.
   */
  function wireScreen13Fields(goBackToEmailStep){
    var pwToggle = document.getElementById('fn-pw-toggle');
    var pwInput = document.getElementById('fn-password');
    pwToggle.innerHTML = Icons.eye;
    pwToggle.addEventListener('click', function(){
      var showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      pwToggle.innerHTML = showing ? Icons.eye : Icons.eyeOff;
      pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    var continueBtn = document.getElementById('fn-s13-continue');
    var errEl = document.getElementById('fn-signup-error');
    var emailFieldEl = document.getElementById('fn-email');
    // Blur trigger for signup_email_entered (see that flag's own doc
    // comment above) -- catches a visitor who types an email then
    // abandons WITHOUT ever tapping Continue, which the submit-attempt
    // trigger below can't see on its own. Harmless no-op on variant b's
    // password step re-render of this same field (it's read-only there,
    // already tracked from the earlier email step, and the flag is
    // already set by then anyway).
    emailFieldEl.addEventListener('blur', function(){ maybeTrackEmailEntered(emailFieldEl.value.trim()); });
    // The email step trains "Enter advances" (see renderScreen13EmailFirst's
    // own emailInput keydown handler above) — matching that here keeps the
    // expectation consistent across both of this screen's steps.
    pwInput.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); continueBtn.click(); } });
    continueBtn.addEventListener('click', function(){
      var email = document.getElementById('fn-email').value.trim();
      var password = pwInput.value;
      errEl.textContent = '';
      maybeTrackEmailEntered(email);
      // Format check (not just presence) — matches wizard.html's own
      // renderContact check on the equivalent field. Without this, a
      // malformed email used to reach both attemptSignup AND
      // startPendingGeneration before either could reject it server-side.
      if(!email || email.indexOf('@') === -1){ errEl.textContent = 'Enter a valid email address.'; track('signup_error_shown', { reason: 'invalid_email', variant: signupVariant }); return; }
      // missing_password trap fix (tracker item
      // for-product-urgent-forensic-find-the-pro-fzgghg, item 2). Forensic
      // finding: one real returning user hit exactly this error 17 times in
      // a row, with visible rageclicks, across two separate days, and never
      // got past it -- a motivated, real user permanently locked out.
      // Root-cause investigation (systematic-debugging): reproduced this
      // screen end-to-end, including real character-by-character keystroke
      // typing and the eye-icon type-toggle, in a real browser -- there is
      // no stale-DOM-reference bug and nothing here traps a genuinely
      // non-empty field; pwInput.value is always read fresh, at click time,
      // straight off the live element. The one real, mechanically-sound
      // explanation left, consistent with this screen's own existing
      // "WEBVIEW PASSWORD MITIGATION" comment (renderPasswordStep below)
      // and with this traffic overwhelmingly landing in the FB/IG in-app
      // browser: renderPasswordStep's own pwInput.focus() call fires from
      // INSIDE an async Promise .then() callback (after a real
      // checkEmailAvailable network round trip), not synchronously inside a
      // user gesture -- and WebKit/mobile browsers commonly refuse to raise
      // the on-screen keyboard for a focus() call that isn't directly
      // inside a user-gesture call stack. The field can end up genuinely,
      // silently un-typable (DOM-focused but no keyboard visible) the
      // moment the password step first appears, and a user who doesn't
      // realize they need to tap the field a second time will rageclick
      // Continue on a field that was never able to receive their taps.
      // Fix: this click handler IS a fresh, real user gesture -- refocusing
      // pwInput synchronously, right here, is the one thing virtually
      // guaranteed to reliably raise the keyboard across platforms,
      // deterministically breaking the loop on the very next attempt
      // regardless of why the keyboard failed to appear the first time.
      // See test/signup-screen-behavioral.test.js's regression coverage.
      if(!password){ errEl.textContent = 'Enter a password.'; track('signup_error_shown', { reason: 'missing_password', variant: signupVariant }); pwInput.focus(); return; }

      // Marks this click as the new current attempt -- see
      // signupAttemptToken's own comment above. Captured now, before the
      // real network call fires, so the callback below can tell whether
      // it's still the current attempt once it finally settles.
      signupAttemptToken++;
      var mySignupToken = signupAttemptToken;

      continueBtn.disabled = true;
      continueBtn.textContent = 'Creating your account…';
      // Defense-in-depth alongside the token check below: with Back
      // blocked for the duration of this call, there is no UI path to
      // reach this screen fresh a second time while this attempt is
      // still in flight in the first place. See signupAttemptToken's own
      // comment for why the token check still matters even so.
      backBtn.disabled = true;
      // Yields to a frame so the disabled/label state above actually paints
      // before attemptSignup kicks off its real network round trip (see
      // that function's own comment — signup is no longer instant/
      // local-only) — same 0ms-defer trick as login.html's own signup path,
      // used here instead of login.html's setTimeout(...,450) since there's
      // no artificial minimum-delay to simulate on top of the real network
      // latency this now already has.
      setTimeout(function(){
        // check-email.js AGAIN (tracker items
        // for-product-money-leak-blocked-signups-e-v2g1vi and
        // for-product-signup-email-micro-step-foun-ns8uve) -- gates BOTH
        // getOrStartPendingGeneration (the real, billed fal.ai call) AND
        // attemptSignup (which is cheap, but there's no point firing a
        // signup we already know will be rejected, and firing it anyway
        // would surface a second, redundant "already taken" message).
        //
        // This is now a SECOND check, not the first: renderEmailStep's own
        // tryAdvance (above) already ran this exact check before ever
        // revealing this password step, and already fired
        // getOrStartPendingGeneration for this email at that point (the
        // capture-before-password-reveal this screen exists for — see that
        // function's own doc comment). Kept here too as defense-in-depth,
        // same posture as this screen's duplicated email-format check
        // (renderEmailStep's tryAdvance vs. this handler) — costs nothing
        // (getOrStartPendingGeneration's own reuse guard means this
        // doesn't re-fire a second real generation for an unchanged email)
        // and still protects the narrow edge case where the email became
        // taken in the gap between the two checks.
        //
        // Reuses the EXISTING signupAttemptToken/mySignupToken guard
        // below rather than introducing a second token -- screen 13 is
        // already ONE combined Contact+Signup step/attempt here (unlike
        // wizard.html's separate Contact/Signup steps, which needed a
        // dedicated pendingGenerationToken of their own), so the guard
        // that already protects attemptSignup's callback is exactly the
        // right one to protect this new async gate too: continueBtn/
        // backBtn are already disabled for the duration (see above), and
        // Back's own click handler already bumps signupAttemptToken (see
        // the navigation engine's backBtn listener further down this
        // file) -- both already cover the "user navigates away before
        // this resolves" case with no changes needed there.
        checkEmailAvailable(email).then(function(checkResult){
          if(mySignupToken !== signupAttemptToken) return; // stale -- same guard as attemptSignup's own callback below
          if(!checkResult.deliverable){
            continueBtn.disabled = false;
            continueBtn.textContent = 'Continue';
            backBtn.disabled = false;
            errEl.textContent = 'That email address doesn’t look right — check for a typo.';
            track('signup_error_shown', { reason: 'email_undeliverable', variant: signupVariant });
            return;
          }
          if(!checkResult.available){
            // Seamless handoff (tracker item
            // for-product-urgent-forensic-find-the-pro-fzgghg, item 1) --
            // see renderInPlaceLoginStep's own doc comment. This branch is
            // the narrow race the email step's own identical check already
            // mostly closes (the email became registered in the gap
            // between the two checks) — same treatment either way, so a
            // returning visitor never sees a different outcome depending
            // on exactly which of the two checks happens to catch them.
            track('signup_error_shown', { reason: 'already_registered', variant: signupVariant });
            renderInPlaceLoginStep(email, goBackToEmailStep);
            return;
          }
          // Generate-during-signup: fired in parallel with attemptSignup
          // below, not after it, so the video gets a head start on whatever
          // is left of the funnel (screens 14/15) instead of only starting
          // once the visitor reaches home.html. Goes through
          // getOrStartPendingGeneration() (not startPendingGeneration()
          // directly) so a signup retry with the same email — "email already
          // taken", a transient network error, anything — reuses the
          // already-in-flight-or-succeeded call instead of firing a second
          // real, billed generation. See that function's own comment.
          //
          // Record-it (isRecordMode) skips this entirely — captionText is
          // empty (nothing has been recorded yet), so there's no real dream
          // to submit; firing this here would start a real, billed fal.ai
          // generation off an empty caption. pendingPromise stays a resolved
          // no-op promise instead of undefined so the `.then()` below still
          // works — pendingId/pendingOperationName are simply never set in
          // this path (they stay at their null initial values), so the
          // claim-pending-generation call and DreamStore.adoptPendingGeneration
          // downstream both naturally no-op too (see their own `if` guards).
          var pendingPromise = isRecordMode ? Promise.resolve() : getOrStartPendingGeneration(email);
          attemptSignup(email, password, function(ok, err, superseded){
          // Stale -- a newer Signup attempt has since started (or this
          // one was superseded some other way). Discard everything,
          // including navigation: touching continueBtn/errEl here would
          // reach into a detached, already-replaced screen, and
          // pendingId/pendingOperationName/pendingPromise may since
          // belong to a completely different attempt. `superseded` is
          // js/store.js's OWN call-sequence guard saying it already
          // declined to commit this result -- checked here too (not just
          // mySignupToken) so this callback stays correct even if this
          // token's own bookkeeping were ever wrong; see attemptSignup's
          // comment on result.superseded above.
          if(mySignupToken !== signupAttemptToken || superseded) return;
          if(!ok){
            continueBtn.disabled = false;
            continueBtn.textContent = 'Continue';
            backBtn.disabled = false;
            errEl.textContent = err;
            // Generic bucket -- attemptSignup's own err string isn't
            // classified into distinct reasons (network vs. server
            // rejection vs. anything else), unlike the two client-side
            // validation checks and the already-registered check above,
            // which each know exactly why they failed.
            track('signup_error_shown', { reason: 'signup_failed', variant: signupVariant });
            return;
          }
          // The flush-characters / adopt-pending-generation / advance
          // sequence now lives in completeSignupAndAdvance (see that
          // function's own doc comment) so the Facebook-return path runs
          // the identical sequence instead of a second copy of it. The
          // behavior for THIS caller is unchanged: same order, same
          // already-in-flight pendingPromise, same staleness re-check.
          //
          // That re-check (isStale below) still matters for exactly the
          // reason it always did: this attempt can go stale WHILE the
          // inner promise is unsettled, even though the outer check just
          // above already passed. In normal (non-bypassed) usage
          // continueBtn/backBtn stay disabled through this whole span, so
          // nothing can bump signupAttemptToken during this specific
          // window today -- but that's an incidental property of the
          // current UI, not something this guard should rely on. Without
          // it, a future change that re-enables either button slightly
          // earlier would silently reopen exactly the hazard the outer
          // check exists to close. Discarding also means NOT touching
          // backBtn/next() -- this may be a detached/superseded attempt,
          // and a newer one already owns backBtn's state.
          completeSignupAndAdvance(email, {
            pendingPromise: pendingPromise,
            isStale: function(){ return mySignupToken !== signupAttemptToken; }
          });
          });
        });
      }, 0);
    });
  }

  // ===================================================================
  // Screen 13 — the unified signup screen (email-first sequencing).
  // Only the email field + a "Continue" affordance are shown first; once
  // a valid email is entered, the password field is revealed in place
  // via an internal, non-navigating DOM swap (renderEmailStep <->
  // renderPasswordStep below) -- NOT a goToStep()/render() navigation, so
  // this never re-fires funnel_step_viewed/ReachedEmailEntry/the
  // variant-shown tracking above a second time. Also carries clearer
  // "free to start, no card needed" framing and a short, real (never
  // fake -- see dreamsThisMonthCount's own doc comment above) social-
  // proof line reusing screen 14's existing .fn-proof-strip component.
  //
  // "No card needed" deliberately reuses the exact, currently-accurate
  // claim wizard.html's own renderSignup and this file's renderScreen14
  // already state -- NOT the retired "Free during beta" framing, which
  // stopped being true the moment Dodo Payments checkout actually went
  // live (see renderScreen14's store-launch-copy-sweep comment above and
  // shop.html's own cost-banner comment) and would be a real, live
  // contradiction if reintroduced here.
  //
  // The actual submission — email + password together, attemptSignup,
  // both token-guard layers — is completely unchanged: this only changes
  // WHEN the password field appears, not how signup itself is validated
  // or submitted. wireScreen13Fields() (above) wires the password step's
  // fields.
  //
  // WEBVIEW PASSWORD MITIGATION (2026-07-30 CRO rebuild): password
  // managers/keyboard "use suggested password" affordances generally
  // don't work inside an embedded webview -- the FB/IG in-app browser
  // this traffic overwhelmingly lands in is exactly that kind of webview
  // (same root cause the spec's §1 cites for why Google's OAuth is
  // hard-blocked there: an embedded WebView doesn't get the OS/browser-
  // chrome integration a real browser tab does). A password field there
  // is raw manual entry with none of the usual autofill assist, at
  // exactly the point of highest intent -- diagnosed as the real driver
  // of the 98->36 (-63%) signup-screen leak, not a cosmetic copy problem.
  // Three mitigations, all silent (no added on-screen text):
  //   1. Email-first sequencing itself (this whole screen) -- a visitor
  //      commits via email before ever seeing a password field at all.
  //   2. autocapitalize/autocorrect/spellcheck disabled on #fn-password
  //      below -- some mobile webviews autocorrect or auto-capitalize the
  //      first character of a text-like input absent these, silently
  //      corrupting what the visitor typed.
  //   3. Facebook Login itself (facebookSignupButtonHtml above) is the
  //      real structural fix once the flag is on -- it lets a webview
  //      visitor skip typing a password at all, rather than explaining
  //      the missing autofill assist to them.
  // Deliberately NOT a new on-screen explainer line about password
  // managers -- per FOUNDER_PRINCIPLES.md's "capability-detect and HIDE,
  // don't handhold" lesson (the Record-it fix: hiding a broken option
  // beats explaining it) and this exact screen's own store-launch-copy-
  // sweep precedent (screen 14's "too much text"/"scary" founder
  // feedback, right next door) -- an explainer paragraph right at the
  // funnel's single highest-leverage screen risks adding exactly the kind
  // of friction this whole rebuild exists to remove. The real fix for a
  // webview visitor is Facebook Login (skip the password entirely), not a
  // longer password field.
  // ===================================================================

  function renderScreen13EmailFirst(el, headline){
    var treatmentReassurance = isRecordMode
      ? 'Free to start, no card needed — you’ll record your dream right after this, then we’ll email it to you the moment it’s ready.'
      : 'Free to start, no card needed — we’ll email you your dream the moment it’s ready, that’s the only reason we ask.';
    // Same real, never-fake count screen 14 already uses (see
    // dreamsThisMonthCount's own doc comment above) — omitted entirely
    // (not a placeholder number) if the feed fetch hasn't resolved yet or
    // failed. Recomputed fresh on every internal render (not cached once
    // in this outer closure) because the getSharedFeed() fetch that
    // populates dreamsThisMonthCount is still in flight for meaningfully
    // more visitors here than on screen 14 (this is an earlier funnel
    // step) — caching the value at first-render time would freeze out the
    // proof strip for the rest of the visitor's time on screen 13 even if
    // the fetch resolves seconds later while they're still typing.
    function computeProofStripHtml(){
      return (dreamsThisMonthCount !== null) ?
        ('<div class="fn-proof-strip"><span class="avatars"><i></i><i></i><i></i></span><span>' + dreamsThisMonthCount.toLocaleString() + (dreamsThisMonthCount === 1 ? ' dream' : ' dreams') + ' brought to life this month</span></div>') :
        '';
    }

    function renderEmailStep(prefillEmail){
      el.innerHTML =
        '<div class="fn-headline">' + headline + '</div>' +
        computeProofStripHtml() +
        '<div class="fn-price-note" style="text-align:left; margin:-6px 0 14px;">' + treatmentReassurance + '</div>' +
        // Direction Y placement — see the LAYOUT NOTE above
        // facebookSignupButtonHtml. Absent entirely (empty string) while
        // the feature flag is a placeholder.
        facebookSignupButtonHtml() +
        '<input class="fn-field" id="fn-email" type="email" placeholder="you@email.com" autocomplete="email" dir="auto" style="margin-top:4px;" value="' + esc(prefillEmail || '') + '">' +
        '<div class="fn-err-text" id="fn-signup-error"></div>' +
        '<button class="fn-btn-primary" id="fn-s13-email-continue" type="button" style="margin-bottom:12px;">Continue</button>' +
        '<div class="fn-spacer"></div>';

      var emailInput = document.getElementById('fn-email');
      var errEl = document.getElementById('fn-signup-error');
      var nextBtn = document.getElementById('fn-s13-email-continue');
      // Verify -> capture -> reveal (tracker item
      // for-product-signup-email-micro-step-foun-ns8uve): before the
      // password field ever appears, (1) VERIFY the email — format
      // (below, unchanged) then check-email.js's deliverability check
      // (MX/A/AAAA-level, see lib/email-domain-check.js) — inline error on
      // either failure; (2) CAPTURE it server-side by kicking off
      // getOrStartPendingGeneration (the same real, billed pending-dream
      // record start-pending-generation.js already creates), so an
      // abandoner who never reaches the password field is still tied to a
      // pending dream the existing abandoned-signup retention email
      // (dream-webhook.js) can reach; (3) only THEN reveal the password
      // field. Mirrors wizard.html's own Contact step, which already
      // captures before its separate Signup screen appears — this brings
      // start.html's combined email/password screen in line with that
      // same shape.
      //
      // Token-guarded against a Back click (or the "Change email" link,
      // once the password step exists) settling this async gate late:
      // the topbar Back handler already bumps signupAttemptToken
      // unconditionally on every click, screen-agnostic (see its own
      // comment further down this file) — reused here as-is rather than
      // introducing a dedicated token, same reasoning wireScreen13Fields'
      // own reuse of this token gives.
      function tryAdvance(){
        var email = emailInput.value.trim();
        errEl.textContent = '';
        maybeTrackEmailEntered(email);
        // Same format check as wireScreen13Fields' own continueBtn
        // handler (and wizard.html's renderContact) -- presence AND
        // shape, not just presence. The password step re-validates this
        // same field again via wireScreen13Fields, so a directly-edited
        // #fn-email (there isn't one in normal usage, but defense in
        // depth costs nothing here) can't skip the check either.
        if(!email || email.indexOf('@') === -1){ errEl.textContent = 'Enter a valid email address.'; track('signup_error_shown', { reason: 'invalid_email', variant: signupVariant }); return; }

        nextBtn.disabled = true;
        nextBtn.textContent = 'Checking…';
        var myEmailStepToken = signupAttemptToken;
        checkEmailAvailable(email).then(function(checkResult){
          if(myEmailStepToken !== signupAttemptToken) return; // stale -- navigated away (Back) while this was in flight
          if(!checkResult.deliverable){
            nextBtn.disabled = false;
            nextBtn.textContent = 'Continue';
            errEl.textContent = 'That email address doesn’t look right — check for a typo.';
            track('signup_error_shown', { reason: 'email_undeliverable', variant: signupVariant });
            return;
          }
          if(!checkResult.available){
            // Seamless handoff, not a dead end (tracker item
            // for-product-urgent-forensic-find-the-pro-fzgghg, item 1) --
            // see renderInPlaceLoginStep's own doc comment for the full
            // forensic reasoning. This USED to leave the visitor stuck
            // right here with only a "sign in instead" link to a whole
            // separate page as their way out.
            track('signup_error_shown', { reason: 'already_registered', variant: signupVariant });
            renderInPlaceLoginStep(email, function(){ renderEmailStep(email); });
            return;
          }
          // Capture — fires the real, billed pending-generation call (or
          // reuses an already-in-flight/succeeded one for this exact
          // email, see getOrStartPendingGeneration's own doc comment)
          // BEFORE the password field ever appears. Deliberately NOT
          // awaited: this runs in parallel with the rest of signup, same
          // as it always has — only the call site moved earlier, not the
          // "wait for it" behavior (still awaited via
          // completeSignupAndAdvance's pendingPromise once the visitor
          // actually submits). Record-it (isRecordMode) skips this
          // entirely — no real dream text exists yet, see this same
          // isRecordMode check further down this file for the identical
          // reasoning.
          if(!isRecordMode) getOrStartPendingGeneration(email);
          renderPasswordStep(email);
        });
      }
      nextBtn.addEventListener('click', tryAdvance);
      emailInput.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); tryAdvance(); } });
      // Blur trigger -- same reasoning as wireScreen13Fields' own email
      // blur listener above (catches a visitor who types then abandons
      // without ever tapping Continue).
      emailInput.addEventListener('blur', function(){ maybeTrackEmailEntered(emailInput.value.trim()); });
      wireFacebookSignupButton();
      applyPendingFacebookError();
      emailInput.focus();
    }

    function renderPasswordStep(email){
      el.innerHTML =
        '<div class="fn-headline">' + headline + '</div>' +
        computeProofStripHtml() +
        '<div class="fn-price-note" style="text-align:left; margin:-6px 0 14px;">' + treatmentReassurance + '</div>' +
        // Confirmed email, shown read-only -- same real "fn-email" id and
        // .value wireScreen13Fields()/attemptSignup() below read from --
        // plus a "Change email" affordance back to the email step. This
        // is an in-screen state change, NOT a fresh screen-13 navigation
        // (goToStep/render) -- but unlike the topbar Back button, this
        // link is never disabled while an attempt is in flight (tracker
        // item start-html-variant-b-s-change-email-link-1kc3vs), so its
        // click handler below bumps signupAttemptToken (same reasoning as
        // the topbar Back handler further down this file) AND additionally
        // resets backBtn itself -- something the Back handler never needs
        // to do, since a disabled button can't fire its own click handler
        // in the first place. backBtn lives outside `el` (the topbar, not
        // this screen's own DOM), so it would otherwise survive this
        // in-screen swap still stuck disabled if an abandoned attempt had
        // already disabled it.
        '<input class="fn-field" id="fn-email" type="email" value="' + esc(email) + '" readonly style="color:var(--phase-soft, var(--fn-ink-soft)); cursor:default;">' +
        '<button type="button" class="fn-small-link" id="fn-s13-change-email" style="margin:-6px 0 12px;">Change email</button>' +
        '<div class="fn-field-pw-wrap">' +
          // autocapitalize/autocorrect/spellcheck disabled -- see this
          // function's own WEBVIEW PASSWORD MITIGATION doc comment above.
          // autocomplete="new-password" is kept (harmless, and still the
          // correct hint for the real browsers where it DOES work).
          '<input class="fn-field" id="fn-password" type="password" placeholder="Create a password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">' +
          '<button type="button" class="fn-field-pw-toggle" id="fn-pw-toggle" tabindex="-1" aria-label="Show password"></button>' +
        '</div>' +
        '<div class="fn-err-text" id="fn-signup-error"></div>' +
        '<button class="fn-btn-primary" id="fn-s13-continue" type="button" style="margin-bottom:12px;">Continue</button>' +
        // Signup small-print — this screen's password step.
        '<div class="fn-body-copy" style="font-size:11.5px; opacity:.7; text-align:center; margin-top:-4px;">By signing up, you agree to our <a href="terms.html" style="color:inherit;">Terms</a> and <a href="privacy.html" style="color:inherit;">Privacy Policy</a>.</div>' +
        '<div class="fn-spacer"></div>';

      document.getElementById('fn-s13-change-email').addEventListener('click', function(){
        // Invalidates any in-flight Signup attempt the moment the user
        // navigates back to re-enter their email -- same reasoning, and
        // same signupAttemptToken bump, as the topbar Back handler's own
        // click handler further down this file. This link is a SEPARATE
        // escape hatch from the topbar Back button -- it is never
        // disabled by wireScreen13Fields' continueBtn handler (only
        // continueBtn/backBtn are, see that handler's own comment), so
        // without this it stayed clickable for the full duration of an
        // in-flight checkEmailAvailable/attemptSignup call. Repro
        // (tracker item start-html-variant-b-s-change-email-link-1kc3vs):
        // reach this step, click Continue, immediately click Change
        // email before it resolves -- the screen swapped back to email
        // entry, but the abandoned attempt's mySignupToken===
        // signupAttemptToken check still passed once it settled late,
        // silently creating the account and force-navigating to screen
        // 14 with the OLD email/password the user was mid-change on.
        // Also resets backBtn -- it lives outside `el` (the topbar, not
        // this screen's own DOM) and so survives this in-screen swap
        // untouched; if the abandoned attempt had already disabled it,
        // it would otherwise stay stuck disabled on the email step.
        signupAttemptToken++;
        // Also invalidates any in-flight DreamStore.signup() call at the
        // STORE layer -- signupAttemptToken alone only stops THIS page's
        // callback from reacting to a stale response; it can't stop
        // js/store.js's commitLocalSignupIfCurrent from silently writing
        // state.user/state.accounts in the background, since that write
        // happens INSIDE signup(), before this callback (or its token
        // check) ever runs. See DreamStore.invalidatePendingSignup's own
        // doc comment (js/store.js) and tracker item
        // js-store-js-signupcallseq-only-invalidat-ijwpht.
        DreamStore.invalidatePendingSignup();
        backBtn.disabled = false;
        renderEmailStep(email);
      });
      wireScreen13Fields(function(){ renderEmailStep(email); });
      document.getElementById('fn-password').focus();
    }

    renderEmailStep('');
  }

  // ===================================================================
  // Screen 13, Facebook "needs email" variant (spec §2.4 / §3 step 3)
  // ===================================================================
  // Reached only when facebook-oauth-callback.js verified a real Facebook
  // identity server-side but Facebook returned no email — the user
  // declined the `email` permission, or has none on file. Rather than
  // silently creating an email-less account (unreachable by every
  // retention email this app sends, and invisible to the account store's
  // email index that makes "same email = same account" work at all), the
  // callback hands back an opaque, server-side-only marker referencing
  // that already-verified Facebook id, and this asks for the one missing
  // piece.
  //
  // No password field: the account being created is a Facebook-only
  // account (password: null — an already-accepted shape in this codebase,
  // see js/store.js's commitTransferredSession). Submitting posts the
  // marker + email to facebook-complete-signup.js, which creates the
  // account and hands back a session-transfer token; navigating to
  // ?bt=<that token> then re-enters this same file through EXACTLY the
  // normal Facebook-return path below, so there is no second
  // sign-in/resume implementation anywhere.
  //
  // The escape hatch matters: an address that already has an account is
  // deliberately refused server-side (that email is unverified here — it
  // was typed, not vouched for by Facebook — so linking it would be an
  // account-takeover vector; see facebook-complete-signup.js's header
  // comment). Without a way out, such a visitor would be stuck on a
  // screen that can never succeed, so "Sign up with email instead" drops
  // them back into the ordinary signup form.
  function renderScreen13FacebookEmail(el){
    var headline = 'One last thing — where should we send it?';
    el.innerHTML =
      '<div class="fn-headline">' + headline + '</div>' +
      '<div class="fn-price-note" style="text-align:left; margin:-6px 0 14px;">' +
        'Facebook didn’t share an email address with us, and that’s the only way we can send you your dream.' +
      '</div>' +
      '<input class="fn-field" id="fn-email" type="email" placeholder="you@email.com" autocomplete="email" dir="auto" style="margin-top:4px;">' +
      '<div class="fn-err-text" id="fn-signup-error"></div>' +
      '<button class="fn-btn-primary" id="fn-fb-email-continue" type="button" style="margin-bottom:12px;">Continue</button>' +
      '<button type="button" class="fn-small-link" id="fn-fb-email-fallback" style="margin:-6px 0 12px;">Sign up with email instead</button>' +
      '<div class="fn-body-copy" style="font-size:11.5px; opacity:.7; text-align:center; margin-top:-4px;">By signing up, you agree to our <a href="terms.html" style="color:inherit;">Terms</a> and <a href="privacy.html" style="color:inherit;">Privacy Policy</a>.</div>' +
      '<div class="fn-spacer"></div>';

    var emailInput = document.getElementById('fn-email');
    var errEl = document.getElementById('fn-signup-error');
    var continueBtn = document.getElementById('fn-fb-email-continue');

    document.getElementById('fn-fb-email-fallback').addEventListener('click', function(){
      // Drop the marker and fall back to the ordinary signup form. The
      // marker is simply abandoned (it expires on its own, ~15 minutes)
      // rather than being consumed — there is nothing to consume it for.
      facebookNeedsEmailToken = null;
      track('signup_facebook_needs_email_abandoned', { variant: signupVariant });
      renderScreen13(el);
    });

    function submit(){
      var email = emailInput.value.trim();
      errEl.textContent = '';
      if(!email || email.indexOf('@') === -1){
        errEl.textContent = 'Enter a valid email address.';
        track('signup_error_shown', { reason: 'invalid_email', variant: signupVariant });
        return;
      }
      continueBtn.disabled = true;
      continueBtn.textContent = 'Creating your account…';
      backBtn.disabled = true;
      fetch('/.netlify/functions/facebook-complete-signup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: facebookNeedsEmailToken, email: email })
      }).then(function(res){
        return res.json().then(function(data){ return { ok: res.ok, data: data }; });
      }).then(function(result){
        var data = result.data || {};
        if(data.ok && data.transferToken){
          // Re-enter through the normal Facebook-return path, carrying the
          // funnel's own resume params (trimResumeParams already strips
          // every return-trip marker and guarantees resume=1).
          location.href = 'start.html?' + trimResumeParams(location.search) + '&bt=' + encodeURIComponent(data.transferToken);
          return;
        }
        continueBtn.disabled = false;
        continueBtn.textContent = 'Continue';
        backBtn.disabled = false;
        var err = String(data.error || '');
        if(err.indexOf('email_taken') !== -1){
          errEl.innerHTML = 'You already have an account with that email — <a href="login.html">sign in instead</a>.';
          track('signup_error_shown', { reason: 'already_registered', variant: signupVariant });
          return;
        }
        if(err.indexOf('invalid_or_expired') !== -1){
          errEl.textContent = 'That Facebook sign-in expired — please sign up with email instead.';
          track('signup_error_shown', { reason: 'fb_marker_expired', variant: signupVariant });
          return;
        }
        errEl.textContent = 'Something went wrong creating your account — please try again, or sign up with email instead.';
        track('signup_error_shown', { reason: 'fb_complete_failed', variant: signupVariant });
      }).catch(function(){
        continueBtn.disabled = false;
        continueBtn.textContent = 'Continue';
        backBtn.disabled = false;
        errEl.textContent = 'Something went wrong creating your account — please try again, or sign up with email instead.';
        track('signup_error_shown', { reason: 'fb_complete_failed', variant: signupVariant });
      });
    }

    continueBtn.addEventListener('click', submit);
    emailInput.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); submit(); } });
    emailInput.focus();
  }

  // Yearly/Monthly cards, no MOTIVATION_PLAN recommendation, no
  // "Continue to payment") — every visitor gets the same free starting
  // balance (320 tokens on signup, plus a further +20/day they can claim

  // is now a plain, honest acknowledgment/
  // continue step, not a paywall to get past. shop.html (linked from
  // profile.html once signed in) is where token packs will eventually be
  // purchased for real.
  //
  // Per a real mobile-test founder pass, the earlier version of this
  // screen (value-prop checklist + a token-math card + two "coming soon"
  // token-pack price tiles) read as "too much text" and "scary" right
  // before signup — replaced with one short, honest statement instead.
  // This is deliberately NOT wired to real purchasing — this screen is
  // mid-funnel, pre-signup; shop.html (post-signup) is where token packs
  // are actually sold now that Dodo Payments is live.

  // Store-launch copy sweep (tracker item
  // for-product-store-launch-copy-sweep-purc-m6xhkx): the card used to say
  // "Still in beta" / "Free to try and enjoy right now — no card needed",

  // out-of-tokens messaging used to have — a real, live contradiction once

  // lib/entitlements.js's real INITIAL_GRANT — see that screen's comment

  var MOTIVATION_HEADLINES = {
    'Capture dreams before they fade': 'Never lose a dream again.',

  // Folded in from the former standalone screen 15 (tracker item
  // for-product-funnel-handoff-screens-theme-5ttymn): founder walked the
  // live funnel in the FB webview and called that separate confirmation
  // screen redundant, verbatim: "the dark one at the end which is
  // redundant so if anything needed there then merge it with the
  // previous one." The "you're in" confirmation beat (record-mode-aware,
  // bug fix tracker item for-product-bug-founder-high-record-it-f-8ng0nf
  // — Build/Write visitors already have a real generation in flight, see
  // getOrStartPendingGeneration above, but Record-it visitors haven't
  // recorded anything yet, so their copy points at recording instead of
  // claiming a dream already exists) now closes THIS screen instead of
  // being its own step, and this is now the funnel's LAST screen — its
  // button fires completeFunnel() directly (see below), same as the old
  // screen 15's button did. One less step in the funnel; see
  // SCREEN_RENDERERS/TAGS/PHASE_BY_STEP below for the matching array
  // update (all three shrank by one entry, in lock step).
  function renderScreen14(el){
    var primaryMotivation = quiz.motivations[0] || null;
    var headline = (primaryMotivation && MOTIVATION_HEADLINES[primaryMotivation]) || 'Never lose a dream again.';
    var confirmHeadline = isRecordMode ? "You're in. Let’s record your dream." : "You're in. Building your first dream now.";
    // Record-mode keeps its own real next-step instruction (there's
    // genuinely something to do next — go record). The non-record-mode
    // line ("This is DreamTube — quiet and dark, like the room you just
    // woke up in.") is DELETED entirely, not reworded (founder walkthrough
    // punch list, 2026-08-01, tracker item
    // for-product-founder-walkthrough-punch-li-t33k3y, item 4's "last
    // line") — there's nothing actionable left to say once generation is

    var confirmBody = isRecordMode ? 'Next: tap record and tell us about it — DreamTube will bring it to life.' : null;
    var btnLabel = isRecordMode ? 'Start recording' : 'Watch it happen';

    el.innerHTML =

  // This screen used to be a real (if bypassed) paywall — see this file's
  // git history for the old proceedPastPricing() doc comment. There is
  // nothing left to bypass now: every token a visitor can spend today is
  // free-earned (see the doc block above renderScreen14), so this is just

  function proceedPastPricing(){

    // record anymore, and "bypassed" implied skipping a real paywall,
    // which this screen no longer is). Kept as its own event (rather than

    track('funnel_token_intro_continued', { step: 14 });
    completeFunnel();

  function completeFunnel(){
    track('funnel_completed', {
      style: chosenStyle,
      recall: quiz.recall,
      dream_types: quiz.dreamTypes,
      motivations: quiz.motivations,
      mode: isRecordMode ? 'record' : null
    });
    // Record-it (isRecordMode): there's no generation in flight — the
    // generate-during-signup call was deliberately skipped above (no real
    // caption to submit) — so home.html (which shows an in-progress
    // pendingJob tile) has nothing to show yet either. Send the visitor
    // straight into create.html's Record UI instead, via a param create.html
    // checks on load to auto-open the mic-record flow (skipping the Build/
    // Write/Record choice screen — the account already exists from screen
    // 13's signup, so create.html's own auth guard passes).
    if(isRecordMode){
      location.href = 'create.html?record=1';
      return;
    }
    // Lands directly on home.html now (tracker item for-product-funnel-
    // ending-v2-founder-ins-tfuu0q, founder GO 2026-07-31 evening) —
    // processing.html's dedicated wait screen is gone. `?generate=1` is
    // the same explicit "submit fresh from the draft if there's no
    // pendingJob to resume" signal style.html's in-app Generate button
    // uses (see home.html's own "Fresh in-app generation submission"
    // script block) — needed here too for the case the pre-signup
    // generation call above failed (pendingOperationName never adopted):
    // home.html finds no pendingJob and falls back to submitting the
    // intact draft fresh, instead of silently doing nothing. When the
    // pre-signup call DID succeed, home.html's own pendingJob-first check
    // resumes that adopted job instead and ignores this param entirely —
    // both cases converge on the same landing page either way.
    location.href = 'home.html?generate=1';
  }

  // ===================================================================
  // Navigation / phase engine
  // ===================================================================
  // SCREEN_RENDERERS/TAGS/PHASE_BY_STEP are built together, entry-for-entry
  // in lock step, so cur/goToStep/renderProgress/applyPhase all index into
  // the same set of screens.
  //
  // As of 2026-07-31 (tracker item
  // for-product-urgent-founder-screenshots-i-g64gjp), this is a fixed
  // 2-screen tail — signup, then pricing+confirmation. The former
  // characters screen (renderScreenAdvChars, conditionally shown via
  // captionSuggestsPeople) and the former "coming together" preparing/
  // transition screen (renderScreen11) have both been removed outright,

  // of mid-funnel step. The funnel now goes straight from the marketing
  // handoff into signup.

  // for-product-two-post-handoff-app-pages-p-atr0r7): every real visitor
  // reaching this file's funnel tail arrives via ?resume=1 (see the Entry
  // guard above — a bare visit redirects away before ever reaching these

  // wiring are left fully intact below (see the "PARKED" comments on

  // Skip handlers still reference a PREPARING_STEP identifier that no
  // longer exists as of this change — harmless, since those handlers are

  //
  // The former screen 15 (standalone confirmation) is gone — folded into
  // renderScreen14 (tracker item
  // for-product-funnel-handoff-screens-theme-5ttymn, see that function's
  // own comment). The 'pricing' tag is renamed 'pricing_confirmation'
  // since that screen's content is no longer just the token-intro pitch.
  // PHASE_BY_STEP points both remaining screens straight at 'night'
  // instead of the old 'dusk'/'dusk-deep' entries: those two were a real,

  // phases) and 'dusk'/'dusk-deep' have all since been removed from the
