<!--
  DreamTube onboarding funnel — originally 15 screens in one page, JS-driven
  step navigation, ported from the approved mockup at
  scratchpad/funnel-mockup.html (v3.1) — see that file and
  scratchpad/research/onboarding-funnel.md for the full original design
  rationale. Do not reorder or redesign the remaining screens here; this is
  an implementation of an already-approved spec, not a place to make new
  design calls.

  ARCHITECTURE SPLIT (see the dreamtube-growth repo's AGENT_POLICY.md for
  the full story): the ad-facing, iterate-often screens — hook carousel,
  the 3-question quiz, reassurance, social proof, dream-text capture, style
  picker, and the Dream Profile recap (formerly screens 1-8, 10, 12 in
  this file) have moved entirely to the separate dreamtube-growth
  marketing repo (https://dreamtubeapp.netlify.app/), with their own
  PostHog/Pixel/CAPI tracking and A/B testing. This file now only covers
  what structurally has to run in DreamTube's own origin: Advanced
  (characters/camera/scenery — formerly one screen 9, now split into three
  separate funnel screens, one per section — see below), the "coming
  together" transition (screen 11), signup, and pricing+confirmation
  (screens 13-14 — the former standalone confirmation screen 15 was folded
  into 14, see renderScreen14's own comment, tracker item
  for-product-funnel-handoff-screens-theme-5ttymn). Two reasons those
  couldn't move:
   1. Signup DOES make a network call now — DreamStore.signup() checks/
      creates the account server-side first (register-account.js, the
      authoritative cross-device uniqueness check), then mirrors it into
      this origin's own localStorage on success (falling back to a
      local-only write if the server can't be reached at all — see that
      function's own comment). The account still has to be created from
      THIS origin either way, since the local mirror it writes only exists
      here.
   2. Character photos are staged in-memory as base64 data URLs (the
      `staged` object below) until signup — arbitrarily large, and every
      other Advanced field (camera/scenery chips) writes directly into
      DreamStore.setDraft(), which only exists in this origin.

  Every visitor now arrives here from the marketing funnel, via
  ?resume=1 plus recall/types/motivations/style/caption as URL params —
  landing directly on Advanced, with those values hydrated into
  `quiz`/`chosenStyle`/the real draft first. A bare visit with no
  ?resume=1 (stale bookmark, old link) redirects straight back to the
  funnel — see the "Entry guard" block below. There is no organic
  in-app entry point into this file anymore; index.html's "Get Started"
  now routes organic/direct visitors to wizard.html instead (see that
  file), and only the paid growth-funnel handoff still lands here.

  Real-integration notes still relevant to what's left here:
   - Advanced (characters/camera/scenery) is a real functional port of
     create.html's Advanced section, split into three separate funnel
     screens — one per section (renderScreenAdvChars/AdvCamera/AdvScenery)
     — instead of the one crowded screen 9 used to be. As of a 2026-07-24
     founder decision (tracker item
     for-product-two-post-handoff-app-pages-p-atr0r7), only
     renderScreenAdvChars is still live — renderScreenAdvCamera/
     renderScreenAdvScenery are PARKED (intentionally kept, not deleted,
     but omitted from SCREEN_RENDERERS so they never render) because the
     marketing funnel that hands off here already assembles camera/scenery
     info into captionText, making those two screens redundant for every
     real visitor. See the SCREEN_RENDERERS/TAGS/PHASE_BY_STEP
     construction below for the parked-screens comment and the "PARKED"
     comment on each function itself. Continue on the characters screen
     advances one step; Skip jumps straight to the transition screen
     (goToStep(PREPARING_STEP)) — "skip" means "stop customizing". As of
     the 2026-07-24 mobile-test fixes, renderScreenAdvChars itself may not
     even be in SCREEN_RENDERERS at all — see captionSuggestsPeople() and
     the SCREEN_RENDERERS/TAGS/PHASE_BY_STEP construction below — so
     PREPARING_STEP is looked up dynamically rather than hardcoded, since
     its index shifts depending on whether that screen is present. The
     parked camera/scenery screens' chips still call DreamStore.setDraft
     directly (login-independent) in their own dead code, unchanged.
     Characters are the
     one exception: DreamStore.saveCharacter() requires a logged-in user,
     but signup doesn't happen until screen 13 — by design, per the
     approved funnel order (dream input + Advanced moved early, paywall
     late). So characters are staged locally (the `staged` object) with the
     same validation rules as DreamStore.saveCharacter, and flushed into
     real DreamStore characters via flushStagedCharactersToStore() the
     moment signup succeeds on screen 13, before the funnel continues.
   - Screen 13 derives a username from the email's local part automatically
     (per the task spec — visitor never picks a username) and calls the
     real DreamStore.signup(username, password, email). As of the
     2026-07-24 mobile-test fixes, it ALSO fires start-pending-generation.js
     the moment Continue is clicked, in parallel with the signup call
     itself (not after it) — the same "generate during signup" mechanism
     wizard.html's renderContact/renderSignup steps use, ported here since
     start.html has no separate contact-only step to hang the kickoff off
     of. See startPendingGeneration()'s own comment for the full flow.
   - Screen 14 (pricing+confirmation) has a deliberate, clearly-marked
     payment bypass — see the big comment above proceedPastPricing()
     below. There is no payment provider integrated yet; do not "finish"
     this without a human vendor decision (see AGENT_POLICY.md escalation
     policy). Its Continue button hands off directly to the real,
     unmodified processing.html (see completeFunnel()). Most of the time
     by this point generation is already RUNNING, not starting — screen 13
     already adopted it as this browser's pendingJob (see
     DreamStore.adoptPendingGeneration), and processing.html already knows
     how to resume a pendingJob on load with zero changes needed there. If
     the pre-signup kickoff failed or never got a head start, this falls
     back to processing.html's normal fresh-generation path exactly as
     before — see startPendingGeneration()'s own comment.
-->
</head>
<body>

<div id="app" class="funnel-app">
  <div class="fn-topbar">
    <button class="fn-back" id="fnBack" aria-label="Back" type="button"></button>
    <div class="fn-progress" id="fnProgress"></div>
    <div class="fn-topbar-spacer"></div>
  </div>
  <div class="fn-screen" id="fnScreen"></div>
</div>

<style>
  /* ===================================================================
     Funnel-specific styles. Every class here is prefixed "fn-", except
     the Advanced screens' character chips/add-tiles and character sheet
     (.char-chip/.char-chip-add/.sheet-overlay/.sheet/.char-mode-row/
     .char-mode-btn/.char-photo-*), which deliberately reuse create.html's
     real classes from css/styles.css verbatim (same markup, same click
     handlers, zero JS duplicated) rather than being reimplemented under
     fn- names. Since those classes are shared with create.html's own
     (dark-themed) Advanced accordion, every light-theme override for them
     below is scoped under "#app.funnel-app ..." so it can never reach
     create.html's plain "#app" — see each override for why.
     Colors/values ported from scratchpad/funnel-mockup.html. */

  #app.funnel-app{
    --dawn-1:#FBEFEA; --dawn-2:#E9EAF5; --dawn-3:#E3E9F7;
    --fn-ink:#3A3350; --fn-ink-soft:#6E6480; --fn-ink-faint:#9C93AC;
    --fn-card:#FFFFFF; --fn-line:rgba(58,51,80,0.10);
    --fn-accent-grad:linear-gradient(135deg,#B0A8DC,#9FC6E8 55%,#F3C08C);
    --fn-accent-solid:#7C82C4;
    --fn-font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    --fn-font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    background:linear-gradient(160deg,var(--dawn-1),var(--dawn-2) 55%,var(--dawn-3));
    font-family:var(--fn-font-body);
    transition:background .4s ease;
    /* #app's own base rule (css/styles.css) only sets min-height:100dvh
       -- a floor, not a cap. .sheet-overlay is position:absolute;inset:0
       against #app (its nearest positioning ancestor), so on a real
       Advanced > Characters screen with a lot of characters, #app could
       grow taller than one viewport and the sheet would anchor to the
       bottom of THAT oversized box instead of the visible screen --
       reproducing the exact "sheet unreachable" bug this whole fix
       exists to close, via a different mechanism (tracker item
       for-product-sheet-dismissal-app-wide-fix-rlay70, review round 1).
       height:100dvh matches the same real cap result.html/profile.html
       already rely on via their own .fill/.scroll-shell classes --
       .fn-screen below already has the matching overflow-y:auto;
       min-height:0 internal-scroll half of that pattern, just missing
       this outer half until now. */
    height:100dvh;
  }
  /* Flat white CTA instead of the default pastel --fn-accent-grad button --
     reads as intentional/high-contrast against the near-black 'night'
     background. Used to apply only to the old standalone confirmation
     screen; now also covers screen 13 (signup) and the merged screen 14,
     since PHASE_BY_STEP points both at 'night' as of the theme-whiplash
     fix (tracker item for-product-funnel-handoff-screens-theme-5ttymn). */
  #app.funnel-app.fn-phase-night .fn-btn-primary{ background:#fff; color:#221d2c; box-shadow:none;}

  .fn-topbar{ display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 4px; flex:none;}
  .fn-back{
    width:34px; height:34px; border-radius:50%; flex:none; cursor:pointer;
    background:var(--phase-card, var(--fn-card)); border:1px solid var(--phase-line, var(--fn-line));
    color:var(--phase-ink, var(--fn-ink)); display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .fn-back .icon, .fn-back svg{ width:15px; height:15px;}
  .fn-topbar-spacer{ width:34px; flex:none;}
  .fn-progress{ flex:1; display:flex; gap:4px;}
  .fn-progress i{ flex:1; height:3px; border-radius:3px; background:var(--phase-line, var(--fn-line)); display:block;}
  .fn-progress i.done{ background:var(--phase-ink, var(--fn-ink)); opacity:.55;}
  .fn-progress i.now{ background:var(--phase-ink, var(--fn-ink));}

  .fn-screen{ flex:1; display:flex; flex-direction:column; padding:18px 24px calc(24px + env(safe-area-inset-bottom,0px)); position:relative; overflow-y:auto; min-height:0; color:var(--phase-ink, var(--fn-ink));}

  .fn-eyebrow{ font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--phase-faint, var(--fn-ink-faint)); margin-bottom:10px;}
  .fn-headline{ font-family:var(--fn-font-display); font-size:25px; font-weight:600; letter-spacing:-0.005em; line-height:1.25; text-wrap:balance; margin-bottom:10px; color:var(--phase-ink, var(--fn-ink));}
  .fn-body-copy{ font-size:14.5px; color:var(--phase-soft, var(--fn-ink-soft)); line-height:1.55; margin-bottom:18px;}
  .fn-mini-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--phase-faint, var(--fn-ink-faint)); margin:14px 0 8px;}
  .fn-mini-label:first-child{ margin-top:0;}
  .fn-spacer{ flex:1;}

  .fn-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .fn-chip{ padding:9px 15px; border-radius:100px; background:var(--phase-card, var(--fn-card)); border:1px solid var(--phase-line, var(--fn-line)); font-size:13px; font-weight:700; color:#2C2846; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .fn-chip.sel{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}

  /* ----- Advanced/characters: shared create.html classes, light-themed
     overrides scoped to the funnel only (see the file-level comment
     above this <style> block for why these aren't fn- classes). ----- */
  #app.funnel-app .char-chip{ background:var(--phase-card, var(--fn-card)); border-color:var(--phase-line, var(--fn-line)); color:#2C2846;}
  #app.funnel-app .char-chip .chip-check{ border-color:var(--phase-faint, var(--fn-ink-faint));}
  #app.funnel-app .char-chip.selected{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-chip.selected .chip-check{ background:#fff; border-color:#fff;}
  #app.funnel-app .char-chip.selected .chip-check .icon{ opacity:1; color:var(--fn-accent-solid);}
  #app.funnel-app .char-chip .chip-edit{ color:var(--phase-faint, var(--fn-ink-faint));}
  #app.funnel-app .char-chip.selected .chip-edit{ color:#fff; opacity:.75;}
  #app.funnel-app .char-chip-add{ background:transparent; border:1px dashed var(--phase-line, var(--fn-line)); color:var(--phase-soft, var(--fn-ink-soft));}
  #app.funnel-app .char-chip-add:hover{ border-color:var(--fn-accent-solid); color:var(--phase-ink, var(--fn-ink));}

  /* Character add/edit sheet — light card over the now-light Advanced
     screens, instead of create.html's dark bottom sheet. */
  #app.funnel-app .sheet{ background:var(--fn-card); color:#2C2846; border-top-color:var(--fn-line); box-shadow:0 -20px 50px rgba(58,51,80,.18);}
  #app.funnel-app .sheet-handle{ background:var(--fn-line);}
  #app.funnel-app .sheet-title{ color:#2C2846;}
  #app.funnel-app .char-mode-row .char-mode-btn{ background:#F3F1FA; border-color:var(--fn-line); color:var(--fn-ink-soft);}
  #app.funnel-app .char-mode-row .char-mode-btn.active{ background:var(--fn-accent-grad); color:#fff; border-color:transparent;}
  #app.funnel-app .char-photo-preview{ background:#F3F1FA; border-color:var(--fn-line);}
  #app.funnel-app .char-photo-empty{ color:var(--fn-ink-faint);}
  #app.funnel-app .char-photo-hint{ color:var(--fn-ink-soft);}
  #app.funnel-app .btn-secondary{ background:transparent; border:1px solid var(--fn-line); color:var(--fn-ink);}
  #app.funnel-app .btn-secondary:hover{ background:#F3F1FA; border-color:var(--fn-ink-faint);}

  /* color/placeholder/toggle-icon below are phase-aware (var(--phase-ink/
     faint, ...), not the hardcoded light-theme --fn-ink/-faint tokens) —
     required as of the theme-whiplash fix (tracker item
     for-product-funnel-handoff-screens-theme-5ttymn): screen 13's real
     email/password inputs now render on the 'night' phase (dark,
     near-transparent --phase-card), so text hardcoded to the light-phase
     dark ink color would be unreadable against it. Every phase this file
     defines still resolves correctly: dawn/transition (dark ink) render
     dark text on a solid-white card exactly as before; night (white ink)
     now renders white text on its dark translucent card. */
  textarea.fn-field, input.fn-field{ background:var(--phase-card, var(--fn-card)); border:1px solid var(--phase-line, var(--fn-line)); border-radius:16px; padding:14px 15px; font-family:var(--fn-font-body); color:var(--phase-ink, var(--fn-ink)); font-size:15px; width:100%; margin-bottom:12px; display:block;}
  textarea.fn-field{ resize:none; line-height:1.5;}
  textarea.fn-field::placeholder, input.fn-field::placeholder{ color:var(--phase-faint, var(--fn-ink-faint));}
  textarea.fn-field:focus, input.fn-field:focus{ outline:2px solid var(--fn-accent-solid); border-color:transparent;}

  .fn-field-pw-wrap{ position:relative; margin-bottom:12px;}
  .fn-field-pw-wrap .fn-field{ margin-bottom:0; padding-right:46px;}
  .fn-field-pw-toggle{ position:absolute; right:4px; top:0; bottom:0; width:38px; background:none; border:none; color:var(--phase-faint, var(--fn-ink-faint)); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fn-field-pw-toggle svg, .fn-field-pw-toggle .icon{ width:18px; height:18px;}

  .fn-err-text{ font-size:12.5px; color:#C4485B; min-height:16px; margin:2px 0 8px;}

  .fn-btn-primary{ background:var(--fn-accent-grad); color:#fff; font-weight:800; font-size:15.5px; border:none; border-radius:100px; padding:15px; text-align:center; width:100%; box-shadow:0 12px 26px -10px rgba(141,111,184,.5); cursor:pointer; font-family:var(--fn-font-body); -webkit-tap-highlight-color:transparent;}
  .fn-btn-primary:disabled{ opacity:.42; cursor:not-allowed; box-shadow:none;}
  .fn-small-link{ background:none; border:none; color:var(--phase-soft, var(--fn-ink-soft)); font-size:12.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; text-align:center; width:100%; padding:10px 0 0; cursor:pointer;}

  .fn-proof-strip{ display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:100px; background:#fff; border:1px solid rgba(58,51,80,0.1); margin-bottom:16px;}
  .fn-proof-strip .avatars{ display:flex;}
  .fn-proof-strip .avatars i{ width:23px; height:23px; border-radius:50%; background:var(--fn-accent-grad); border:2px solid #fff; margin-left:-9px; display:block;}
  .fn-proof-strip .avatars i:first-child{ margin-left:0;}
  .fn-proof-strip span{ font-size:11.5px; font-weight:700; color:#6E6480;}

  /* Bumped from 12px/--fn-ink-soft (#6E6480) to a larger size + the
     darkest ink token — founder feedback on a real mobile test called
     this "small faint helper text" that needed to read clearly, not as
     fine print, especially on screen 13 where it's the funnel's only
     reassurance for handing over an email. */
  .fn-price-note{ font-size:14px; font-weight:600; color:var(--phase-ink, var(--fn-ink)); text-align:center; margin:2px 0 0; line-height:1.45;}

  /* Screen 14's free-signup-grant message card (class name/styling
     predates the store-launch copy sweep that dropped its old "beta"
     copy — kept as-is, it already reads as a calm, considered callout).
     Used to hold a dense token-math/pack-pricing wall of text
     (Yearly/Monthly-card-style value props, a free-token breakdown, and
     two "coming soon" token-pack price tiles) — a real mobile test found
     it read as "too much text" and "scary" right before signup. See
     renderScreen14 below for the markup this styles and its own comment
     for the copy's more recent history. */
  .fn-token-free-card{ background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; border:1.5px solid var(--fn-accent-solid); text-align:center;}
  .fn-token-free-card .title{ font-weight:800; font-size:15px; color:var(--fn-ink); margin-bottom:6px;}
  .fn-token-free-card .body{ font-size:13.5px; color:var(--fn-ink-soft); line-height:1.55;}
  .fn-token-free-card .body b{ color:var(--fn-ink); font-weight:700;}

  .fn-check-badge{ width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,.12); border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 18px; color:#fff;}

  .fn-spin{ width:48px; height:48px; border-radius:50%; border:3px solid var(--phase-line, var(--fn-line)); border-top-color:var(--fn-accent-solid); margin:0 auto 20px; animation:fnspin 1s linear infinite;}
  @keyframes fnspin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .fn-spin{ animation:none;} }
  .fn-loading-line{ font-size:13px; color:var(--phase-soft, var(--fn-ink-soft)); text-align:center; margin-bottom:6px;}
</style>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/facebook-config.js"></script>
<script src="js/pwa.js"></script>
<script src="js/sheet-dismiss.js"></script>
<script>
(function(){
  'use strict';

  // Set true (below, right after the entry guard) when THIS page load is
  // the return leg of a Facebook Login round trip, rather than a fresh
  // arrival from the marketing funnel. Declared up here, above track(),
  // purely so track() can read it — see the analytics-fidelity note on
  // that function.
  var resumedFromFacebook = false;

  // ===== Analytics helper — guarded the same way every other page in this
  // app checks for a real PostHog key (see js/analytics-config.js). =====
  //
  // Every event fired during a Facebook-return load additionally carries
  // resumed_from_facebook_redirect:true (spec §2.6). Without it, one
  // visitor who taps "Continue with Facebook" produces TWO screen-13
  // impressions in PostHog — the original arrival and the post-redirect
  // reload — which would silently inflate the denominator of the exact
  // signup-conversion funnel this whole feature is being measured
  // against. Added as a per-event prop rather than via posthog.register()
  // deliberately: register() persists to localStorage and would keep
  // tagging every later event in this browser, long after the redirect
  // it describes.
  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{
        var payload = props || {};
        if(resumedFromFacebook){
          payload = Object.assign({}, payload, { resumed_from_facebook_redirect: true });
        }
        posthog.capture(name, payload);
      }catch(e){ /* analytics must never break the funnel */ }
    }
  }

  function esc(str){ var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  // ===== Signup email-first A/B test (screen 13) — tracker item
  // for-product-a-b-the-email-capture-signup-nri2fn =====
  // Research (2026-07-27): the email_capture -> signup funnel step passes
  // only ~36% (64% abandon) -- the single biggest deep-funnel leak,
  // independent of ad spend/CPS. Test: email-first sequencing (collect
  // email, THEN reveal the password field, instead of showing both at
  // once -- see renderScreen13EmailFirst below), clearer "free to start,
  // no card needed" framing, and a short social-proof line near the form.
  // Same additive, local assignment shape as shop.html's own
  // shop_palette_variant A/B test (see that file's "Shop palette A/B
  // test" doc comment and docs/SHOP_PALETTE_REDESIGN_SPEC.md §8) --
  // persisted in localStorage, sampled once via Math.random() < 0.5 the
  // first time this page loads with no stored variant, and never
  // reassigned after that; every later visit from this browser reads the
  // same stored value. 'a' = control (current behavior, unchanged --
  // email + password shown together). 'b' = treatment (email-first).
  var SIGNUP_VARIANT_KEY = 'dreamtube_signup_variant';
  var signupVariant = localStorage.getItem(SIGNUP_VARIANT_KEY);
  if(signupVariant !== 'a' && signupVariant !== 'b'){
    signupVariant = Math.random() < 0.5 ? 'a' : 'b';
    localStorage.setItem(SIGNUP_VARIANT_KEY, signupVariant);
  }

  // ===== Real social-proof count for screen 14 (pricing) =====
  // Replaces a hardcoded "12,400+ dreams brought to life this month" with
  // an actual count, computed client-side from the same real shared feed
  // Explore uses (DreamStore.getSharedFeed -> get-feed.js -> Blobs), since
  // there's no dedicated "dreams this month" endpoint. Kicked off here, at
  // script load, rather than when screen 14 first renders, so the fetch has
  // the whole rest of the funnel (screens 9, 11, 13) to resolve before
  // anyone actually reaches pricing. Stays null (and the proof strip is
  // omitted entirely, never a fake number) if the fetch hasn't resolved in
  // time or fails outright.
  var dreamsThisMonthCount = null;
  DreamStore.getSharedFeed().then(function(feed){
    var now = new Date();
    var y = now.getUTCFullYear(), m = now.getUTCMonth();
    dreamsThisMonthCount = feed.filter(function(d){
      if(!d.publishedAt) return false;
      var pd = new Date(d.publishedAt);
      return pd.getUTCFullYear() === y && pd.getUTCMonth() === m;
    }).length;
  }).catch(function(){ /* leave dreamsThisMonthCount null -> proof strip omitted */ });

  /**
   * Downscales/recompresses a picked photo to a JPEG data URL — copied
   * verbatim from create.html's identical helper (same reasons apply: an
   * unmodified phone photo can blow both localStorage's quota and the
   * generate-video request body cap).
   */
  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ===== Entry guard =====
  // The ad-facing hook/quiz/style/recap screens (formerly screens 1-8,
  // 10, 12 in this file) now live entirely in the separate
  // dreamtube-growth marketing repo (https://dreamtubeapp.netlify.app/).
  // This file only ever runs as the tail end of that funnel now — a
  // direct/bare visit here (no ?resume=1, e.g. a stale bookmark or old
  // link) has no quiz/style/caption context to build a dream around, so
  // it redirects to the real starting point instead of rendering a
  // broken/empty Advanced screen.
  if(getParam('resume') !== '1'){
    location.href = 'https://dreamtubeapp.netlify.app/';
    return;
  }

  // ===== Facebook Login — return-leg markers =====
  // facebook-oauth-callback.js always 302s back HERE (never anywhere
  // else), carrying exactly one of three markers plus the funnel's own
  // reconstructed resume params:
  //   ?bt=<session-transfer token>  — signed in; consume it and skip
  //                                    screen 13 entirely (spec §2.1 step 8)
  //   ?fb_error=<slug>              — failed closed; show an inline error
  //                                    on screen 13, email/password below
  //                                    still fully usable (spec §2.4)
  //   ?fb_needs_email=<marker>      — Facebook confirmed who they are but
  //                                    returned no email; ask for one field
  //                                    (spec §2.4 / §3 step 3)
  // Read BEFORE anything else touches the URL — DreamStore's own
  // consumeSessionTransferTokenFromUrlSync strips `bt` via
  // history.replaceState the moment it runs.
  var fbTransferPresent = !!getParam('bt');
  var facebookErrorSlug = getParam('fb_error');
  var facebookNeedsEmailToken = getParam('fb_needs_email');
  resumedFromFacebook = !!(fbTransferPresent || facebookErrorSlug || facebookNeedsEmailToken);

  // Cross-app PostHog identity linking (tracker item
  // for-product-pass-distinct-id-on-funnel-a-9nfxd8): the funnel
  // (dreamtubeapp.netlify.app) and this app run as separate PostHog
  // anonymous sessions today — every post-handoff pageview here starts a
  // brand-new distinct_id, so growth can't see one joined funnel from
  // welcome through signup/video. Fix: if the funnel's redirectToApp()
  // appends its own posthog.get_distinct_id() as a `distinct_id` URL
  // param, identify as it here so this browser's events on THIS app merge
  // into the SAME PostHog person the funnel side already created, instead
  // of starting a second, disconnected one. Deliberately a no-op (nothing
  // to identify, funnel and app sessions just stay separate as they do
  // today) if the param is absent — the funnel doesn't need to send it
  // for this page to keep working exactly as before; this is purely
  // additive measurement plumbing, never a functional gate. Fires once,
  // right after the resume guard passes, so it identifies before any of
  // this page's own funnel_resumed_from_marketing etc. events fire below.
  //
  // Routed through DreamStore.linkPreSignupIdentity (js/store.js) rather
  // than calling posthog.identify() directly — that same function also
  // records this distinct_id as a pending pre-account marker, which
  // identifyForAnalytics (js/store.js) reads and posthog.alias()es against
  // the moment this visitor actually signs up or logs in for real. Without
  // that, this identify() call and the later post-signup
  // identifyForAnalytics(username) call would each start a SEPARATE
  // PostHog person — PostHog only auto-merges a browser's FIRST-ever
  // identify() call, not a second one to a different distinct_id — which
  // is exactly the bug tracker item for-product-data-bug-posthog-identity-
  // br-vytqwy found (a real signup's PostHog person history starting at
  // 'signed_up', with every pre-signup funnel event orphaned on a separate
  // person). See PRE_ACCOUNT_DISTINCT_ID_KEY's doc comment in js/store.js
  // for the full writeup.
  var handoffDistinctId = getParam('distinct_id');
  if(handoffDistinctId && window.DreamStore && typeof window.DreamStore.linkPreSignupIdentity === 'function'){
    try { DreamStore.linkPreSignupIdentity(handoffDistinctId); } catch(e) { /* analytics must never break the app */ }
  }

  // Meta click-attribution cookie handoff (tracker item
  // for-product-high-read-meta-fbc-fbp-fbcli-agr639): the ad click lands
  // on the FUNNEL domain (dreamtubeapp.netlify.app), so Meta's own _fbc/
  // _fbp cookies never exist on THIS domain — js/analytics-config.js's
  // getMetaCookies() only ever reads document.cookie, so every mid-funnel
  // CAPI conversion fired from this file (ReachedEmailEntry,
  // CompleteRegistration, and later FirstVideoCreated on result.html)
  // was landing at Meta with no fbc/fbp match keys at all, unattributable
  // to any ad. Growth's redirectToApp() now appends fbc/fbp/fbclid (from
  // its OWN _fbc/_fbp cookies, set on the funnel domain where the ad
  // click actually landed) to this handoff URL — persist them here, as
  // real first-party cookies on THIS domain, before anything below can
  // fire a conversion, so getMetaCookies() picks them up for every one
  // of them. fbclid alone (no fbc — e.g. an ad-network variant that only
  // ever set _fbp) is turned into fbc using Meta's own documented
  // creation format (fb.<subdomain-index>.<creation-time-ms>.<fbclid>);
  // subdomain-index is always 1 here per growth's own contract for this
  // handoff, not computed from the actual hostname. An explicit fbc/fbp
  // param always overwrites whatever's already on this browser (correct
  // last-click-attribution behavior for a fresh ad click); only the
  // fbclid-constructed fallback checks for and skips an existing _fbc
  // first, since it's a synthesized value standing in for a real one
  // that might already be there. Same as the distinct_id block above, a
  // completely absent param set means zero behavior change from before
  // this fix.
  function setFirstPartyCookie(name, value){
    try { document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + (90 * 24 * 60 * 60) + '; SameSite=Lax; Secure'; } catch(e) { /* analytics must never break the app */ }
  }
  (function persistMetaAttributionCookies(){
    try {
      var handoffFbc = getParam('fbc');
      var handoffFbp = getParam('fbp');
      var handoffFbclid = getParam('fbclid');
      if(handoffFbc) setFirstPartyCookie('_fbc', handoffFbc);
      if(handoffFbp) setFirstPartyCookie('_fbp', handoffFbp);
      if(handoffFbclid && !handoffFbc && !getMetaCookies().fbc){
        setFirstPartyCookie('_fbc', 'fb.1.' + Date.now() + '.' + handoffFbclid);
      }
    } catch(e) { /* analytics must never break the app */ }
  })();

  // ===== Funnel-local state, hydrated from the marketing funnel's
  // handoff URL params, plus pre-signup character staging — see the
  // head-of-file comment for why characters can't just call
  // DreamStore.saveCharacter directly yet. =====
  var quiz = {
    recall: getParam('recall') || null,
    dreamTypes: (getParam('types') || '').split(',').filter(Boolean),
    motivations: (getParam('motivations') || '').split(',').filter(Boolean)
  };
  var chosenStyle = getParam('style') || null;
  var captionText = getParam('caption') || '';
  // Record-it handoff (growth-confirmed contract, tracker item
  // for-product-funnel-is-getting-its-own-co-pihldm): the funnel's
  // redirectToApp() sends this additive optional param for the Record-it
  // choice specifically — same base resume params as Build/Write, but
  // WITHOUT caption/style since nothing has been recorded yet. Read here,
  // once, and threaded through renderScreen13's continue handler (skips
  // generate-during-signup — there's no real caption to submit) and
  // completeFunnel (redirects into create.html's Record UI instead of
  // processing.html — there's no generation in flight to show/poll for).
  // Deliberately a plain top-level `mode` query param read directly off
  // start.html's own location.search — this never collides with
  // login.html's unrelated ?mode=signup/login param because start.html
  // never navigates through login.html in this flow (signup here goes
  // straight through attemptSignup() -> DreamStore.signup(), see below).
  var isRecordMode = getParam('mode') === 'record';
  var staged = { characters: [], selectedIds: [] };

  // ===== Facebook Login — surviving the redirect (spec §2.5) =====
  // A full-page navigation to facebook.com and back destroys all
  // in-memory JS state. Almost everything this funnel needs round-trips
  // fine through the `state` param (facebook-oauth-callback.js
  // reconstructs the resume query string from it), but `staged` cannot:
  // it holds arbitrarily large base64 photo data URLs, which is exactly
  // why it lives in memory instead of the draft in the first place (see
  // the head-of-file comment). Most visitors who reach screen 13 have
  // already been through the characters screen, so losing this would
  // silently discard real work they did — not an edge case.
  //
  // Persisted under one scoped localStorage key, restored and CLEARED
  // immediately on return. `savedAt` bounds how long a snapshot can
  // linger: a visitor who bails out at Facebook's dialog and wanders
  // back an hour later with a different dream must not have the old
  // one's characters silently reappear.
  var FB_STAGED_KEY = 'dreamtube_fb_staged_characters';
  var FB_STAGED_MAX_AGE_MS = 30 * 60 * 1000;

  function clearPersistedStaged(){
    try{ localStorage.removeItem(FB_STAGED_KEY); }catch(e){ /* private mode / quota — nothing to clean up */ }
  }

  /** Writes `staged` to localStorage just before leaving for facebook.com. Returns false if it couldn't (most realistically a QuotaExceededError from a large staged photo) — the caller proceeds to Facebook regardless, since losing staged characters is a far smaller failure than blocking signup outright, and the loss is tracked so it's visible if it turns out to be common. */
  function persistStagedForFacebookRedirect(){
    try{
      localStorage.setItem(FB_STAGED_KEY, JSON.stringify({ savedAt: Date.now(), staged: staged }));
      return true;
    }catch(e){
      clearPersistedStaged();
      track('signup_facebook_staged_persist_failed', { characters: staged.characters.length });
      return false;
    }
  }

  /** Restores `staged` from localStorage on the return leg, then clears the key immediately (win or lose) so a stale snapshot can never be picked up by a later, unrelated run. Mutates the existing `staged` object in place rather than reassigning it, since the character-screen closures above already captured this reference. */
  function restoreStagedFromFacebookRedirect(){
    var raw = null;
    try{ raw = localStorage.getItem(FB_STAGED_KEY); }catch(e){ raw = null; }
    clearPersistedStaged();
    if(!raw) return false;
    try{
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.staged) return false;
      if(!parsed.savedAt || (Date.now() - parsed.savedAt) > FB_STAGED_MAX_AGE_MS) return false;
      staged.characters = Array.isArray(parsed.staged.characters) ? parsed.staged.characters : [];
      staged.selectedIds = Array.isArray(parsed.staged.selectedIds) ? parsed.staged.selectedIds : [];
      return true;
    }catch(e){
      return false;
    }
  }

  track('funnel_resumed_from_marketing', { recall: quiz.recall, dream_types: quiz.dreamTypes, motivations: quiz.motivations, style: chosenStyle });

  var cur = 0;

  /**
   * Best-effort heuristic (mobile-test fix, 2026-07-24) for whether the
   * dream text plausibly involves any people at all — used to decide
   * whether to show the "Add the people in your dream" Advanced screen at
   * all (see SCREEN_RENDERERS below). Deliberately simple: a first-person/
   * people-indicating word-boundary check, plus two generic people nouns.
   * NOT correctness-critical — a false positive (showing the screen when
   * it isn't really needed) is totally fine; the only goal is catching the
   * obvious no-people case ("Standing on a mountain watching the sunset")
   * so that visitor isn't asked to define characters for nobody.
   */
  function captionSuggestsPeople(text){
    return /\b(i|i'm|im|me|my|myself|we|our|us|person|someone)\b/i.test(text || '');
  }

  // Phase color system — ported verbatim from funnel-mockup.html's PHASES
  // map, plus 'dawn' (the base #app.funnel-app pastel gradient/ink tokens
  // above, promoted to a real named phase). The 3 Advanced screens used to
  // force a special-cased 'app-dark' branch in applyPhase() instead of
  // going through this map at all — the founder has since decided that
  // direction was wrong (Advanced should never have gone dark; the earlier
  // fix corrected a real contrast bug, but by giving the app-dark path its
  // own background rather than removing it) — so 'dawn' now runs through
  // the exact same explicit phase-application path as every other screen.
  //
  // 'dusk'/'dusk-deep' (the two intermediate, progressively-lighter-purple
  // phases that used to sit between 'transition' and 'night') were removed
  // here (tracker item for-product-funnel-handoff-screens-theme-5ttymn) —
  // they were the founder-reported "theme whiplash" bug: solid-white/
  // near-white cards over a light lavender gradient, on the two most
  // important conversion screens (signup, value/pricing), sandwiched
  // between the dark marketing funnel before and this app's own dark theme
  // after. PHASE_BY_STEP below now points those screens straight at
  // 'night' instead — see its own comment for why reassigning was the
  // safer fix over recoloring these two keys in place.
  var PHASES = {
    'dawn':      { grad:'linear-gradient(160deg,#FBEFEA,#E9EAF5 55%,#E3E9F7)', ink:'#3A3350', soft:'#6E6480', faint:'#9C93AC', card:'#FFFFFF', line:'rgba(58,51,80,0.10)' },
    'transition':{ grad:'linear-gradient(160deg,#DCDCF0,#D0D5EE 55%,#C2D3EC)', ink:'#332E4A', soft:'#655E7C', faint:'#948DA8', card:'#FFFFFF', line:'rgba(51,46,74,0.12)' },
    'night':     { grad:'linear-gradient(160deg,#211B33,#14121F 55%,#0A0912)', ink:'#FFFFFF', soft:'#C9C4DA', faint:'#8A84A0', card:'rgba(255,255,255,0.08)', line:'rgba(255,255,255,0.14)' }
  };
  // TAGS and PHASE_BY_STEP are built alongside SCREEN_RENDERERS, further
  // down this file, once the "show the characters screen at all?" decision
  // is made — all three arrays must stay entry-for-entry in sync with each
  // other (cur/goToStep index into all three the same way), so they're
  // constructed together in one place rather than declared separately here.

  var appEl = document.getElementById('app');
  var screenEl = document.getElementById('fnScreen');
  var progressEl = document.getElementById('fnProgress');
  var backBtn = document.getElementById('fnBack');
  backBtn.innerHTML = Icons.back;

  // ===================================================================
  // Advanced (characters/camera/scenery) — formerly one screen 9, now
  // three separate funnel screens (renderScreenAdvChars/AdvCamera/
  // AdvScenery below), ported from create.html. See head-of-file comment
  // for the character-staging rationale (saveCharacter requires login;
  // login doesn't happen until screen 13). Helpers in this section are
  // shared across all three of the split screens (well, just the chars
  // one for the character-specific helpers) exactly as they were shared
  // across the one combined screen before.
  // ===================================================================
  var charEditingId = null;
  var charSubMode = 'describe';
  var charPendingPhotoDataUrl = null;
  // Bumped on every open AND every close (see openCharSheet/closeCharSheet
  // below) so a pending resizeImageFile call started by one sheet
  // "instance" can tell, once it resolves, whether it's still talking
  // about the instance that's still on screen. Same pattern as create.html/
  // profile.html's charSheetToken/identitySheetToken — see the photo-input
  // change handler (inside renderScreenAdvChars below), the only reader of
  // this token. Declared here (outside renderScreenAdvChars, which
  // otherwise re-runs and rebinds listeners on every screen render) so it
  // persists across those re-renders exactly like charPendingPhotoDataUrl
  // above does.
  var charSheetToken = 0;

  // Mirrors create.html's charChipDisplayName -- a self character's name is
  // genuinely optional and stored as-is (including empty); "Me" here is a
  // display-only fallback for the chip label, never written back to the
  // character. See js/store.js's saveCharacter doc comment.
  function charChipDisplayName(c){
    return c.name || (c.isSelf ? 'Me' : '');
  }
  function charChipHTML(c, selected){
    return '<div class="char-chip' + (selected ? ' selected' : '') + '" data-char-select="' + c.id + '">' +
      '<span class="chip-check"><span class="icon">' + Icons.check + '</span></span>' +
      '<span class="chip-edit-area" data-char-edit="' + c.id + '">' +
        '<span>' + esc(charChipDisplayName(c)) + '</span>' +
        '<span class="chip-edit icon">' + Icons.pencil + '</span>' +
      '</span>' +
    '</div>';
  }
  function renderStagedCharacterChips(){
    var row = document.getElementById('char-chip-row');
    if(!row) return;
    var hasSelf = staged.characters.some(function(c){ return c.isSelf; });
    var html = staged.characters.map(function(c){ return charChipHTML(c, staged.selectedIds.indexOf(c.id) !== -1); }).join('');
    if(!hasSelf) html += '<div class="char-chip-add" id="char-add-self"><span class="icon">' + Icons.userPlus + '</span> Add yourself</div>';
    html += '<div class="char-chip-add" id="char-add-other"><span class="icon">' + Icons.plus + '</span> Add a character</div>';
    row.innerHTML = html;
    var addSelfBtn = document.getElementById('char-add-self');
    if(addSelfBtn) addSelfBtn.addEventListener('click', function(){ openCharSheet('self', null); });
    document.getElementById('char-add-other').addEventListener('click', function(){ openCharSheet('other', null); });
  }

  /** Mirrors DreamStore.saveCharacter's validation/upsert rules exactly, against the local staging array instead of the real store. */
  function localSaveCharacter(patch){
    var name = (patch.name || '').trim();
    var description = (patch.description || '').trim();
    var isSelf = !!patch.isSelf;
    var photoDataUrl = (isSelf && patch.photoDataUrl) ? patch.photoDataUrl : null;
    if(!isSelf && !name) return { ok:false, error:'Give this character a name.' };
    if(!description && !photoDataUrl) return { ok:false, error: isSelf ? 'Add a description or a photo.' : 'Add a short description.' };
    var existing = patch.id ? staged.characters.filter(function(c){ return c.id === patch.id; })[0] : null;
    if(!existing && isSelf) existing = staged.characters.filter(function(c){ return c.isSelf; })[0] || null;
    if(existing){
      existing.name = name;
      existing.description = description;
      if(isSelf) existing.photoDataUrl = photoDataUrl; else delete existing.photoDataUrl;
      return { ok:true, character: existing };
    }
    var character = { id: 'local' + Math.random().toString(36).slice(2, 9), name: name, isSelf: isSelf, description: description };
    if(isSelf && photoDataUrl) character.photoDataUrl = photoDataUrl;
    staged.characters.push(character);
    return { ok:true, character: character };
  }
  function localDeleteCharacter(id){
    var before = staged.characters.length;
    staged.characters = staged.characters.filter(function(c){ return c.id !== id; });
    staged.selectedIds = staged.selectedIds.filter(function(x){ return x !== id; });
    return staged.characters.length !== before;
  }

  /** Called once, right after real signup succeeds on screen 13 — turns staged local characters into real DreamStore characters and remaps selection onto their real ids. */
  function flushStagedCharactersToStore(){
    var idMap = {};
    staged.characters.forEach(function(c){
      var result = DreamStore.saveCharacter({ isSelf: c.isSelf, name: c.name, description: c.description, photoDataUrl: c.photoDataUrl || null });
      if(result.ok) idMap[c.id] = result.character.id;
    });
    var realSelected = staged.selectedIds.map(function(localId){ return idMap[localId]; }).filter(Boolean);
    if(realSelected.length) DreamStore.setDraft({ characterIds: realSelected });
  }

      var isNewChar = !charEditingId;

      // the caption already literally contained "I"/"me", which missed

      // chip rendered unchecked right after someone filled in their own

      // Re-saving an EXISTING character (reopening it to edit) deliberately

      if(isNewChar && staged.selectedIds.indexOf(result.character.id) === -1){
