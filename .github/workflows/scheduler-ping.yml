# Scheduler wake-up pings (Product session, 2026-08-08, founder-flagged
# P1: tracker item for-product-p1-your-work-loop-died-overn-jzru7c).
#
# WHY THIS EXISTS: see SCHEDULER_ANCHOR.md at repo root -- session-local
# schedulers (in-memory cron jobs, self-rescheduling send_later/Routine
# chains) have no way to prove themselves alive from the outside; if the
# chain silently stops, nothing notices until a human checks the
# transcript. GitHub's scheduled Actions run on GitHub's own infrastructure
# and survive everything on our side. Each run posts one comment on the
# pinned scheduler PR; the product session is subscribed to that PR's
# activity, so the comment arrives as a webhook event and WAKES the
# session even after a full restart.
#
# Mirrors the already-proven pattern in ronbrightman/manager's
# .github/workflows/scheduler-ping.yml -- same mechanism, product's own
# cadence. Three pings/day, spread ~8h apart, deliberately off the
# hour/half-hour so this doesn't line up with every other cron on the
# planet:
#   06:17 UTC, 14:23 UTC, 22:41 UTC
# GitHub cron granularity can drift by a few minutes -- that's fine, the
# waking session checks the clock and the live tracker, not the ping text.
name: scheduler-ping
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '23 14 * * *'
    - cron: '41 22 * * *'
  workflow_dispatch: {}
permissions:
  pull-requests: write
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on the pinned scheduler PR
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 50
            });
            const pr = prs.data.find(p => p.title.startsWith('[scheduler]'));
            if (!pr) { core.setFailed('No open [scheduler] PR found - recreate it (see SCHEDULER_ANCHOR.md).'); return; }
            const now = new Date().toISOString();
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number,
              body: `SCHEDULER_PING ${now}\n\n(Automated wake-up for the Product session - see .github/workflows/scheduler-ping.yml and SCHEDULER_ANCHOR.md. Not for humans; do not close this PR.)`
            });
