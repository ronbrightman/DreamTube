<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>The Sage — full reading demo</title>
<!-- Temp founder demo (Manager, 2026-08-02) — Wave 1 voice + Wave 2 presence combined. Delete after decision. -->
<style>
html{background:#0c0a1a}body{font-family:Manrope,system-ui,sans-serif;color:#eae7fb;margin:0;padding:20px 16px 60px;max-width:480px;margin-inline:auto}
h1{font-size:19px;font-weight:800}p.sub{color:#a49dc4;font-size:14px;line-height:1.5}
.stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(157,144,255,.45);box-shadow:0 0 28px -6px rgba(157,144,255,.4)}
video{width:100%;display:block}
.reading{margin-top:18px;font-size:17px;line-height:1.65;min-height:190px}
.reading span{opacity:0;transition:opacity .6s}
.reading span.on{opacity:1}
.btn{display:block;width:100%;margin-top:16px;padding:16px;border-radius:99px;border:none;background:#9d90ff;color:#0c0a1a;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer}
.note{color:#8f88b3;font-size:12px;margin-top:14px}
</style></head><body>
<h1>The Sage reads your dream</h1>
<p class="sub">Voice + presence + the reading appearing as he speaks. Tap begin (sound on).</p>
<div class="stage"><video id="v" src="sage-listening-x7q4.mp4" muted loop playsinline autoplay></video></div>
<button class="btn" id="go">✨ Begin the reading</button>
<div class="reading" id="r"></div>
<audio id="a" src="sage-voice-x7q4.mp3" preload="auto"></audio>
<p class="note">Demo: Kokoro voice (the spec's Sage casting) over the ambient listening loop — production syncs segments to real timings; this demo paces them evenly.</p>
<script>
var SEGS=["Ah... the desert.","You walked a long way through burning sand, and still — you reached the water.","Listen to what your dream is telling you.","The desert is not emptiness; it is every effort you have been making lately that feels unseen.","And the oasis... the oasis is not luck.","Your own footprints led there.","You are closer to what you seek than you believe.","Tonight, notice what you reach for... and let yourself arrive."];
var r=document.getElementById('r'),a=document.getElementById('a'),go=document.getElementById('go');
SEGS.forEach(function(s){var el=document.createElement('span');el.textContent=s+' ';r.appendChild(el);});
go.addEventListener('click',function(){
  r.querySelectorAll('span').forEach(function(el){el.classList.remove('on')});
  a.currentTime=0;a.play();go.textContent='…';
  a.addEventListener('loadedmetadata',start);if(a.readyState>0)start();
  function start(){var dur=a.duration||34;var per=dur/SEGS.length;
    SEGS.forEach(function(_,i){setTimeout(function(){r.children[i].classList.add('on');},i*per*1000);});
    setTimeout(function(){go.textContent='↺ Hear it again';},dur*1000);}
},{once:false});
</script>
</body></html>
