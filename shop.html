<body>

<div id="app">
  <div class="topbar">
    <a class="icon-btn" id="shop-back" href="profile.html"></a>
    <div class="topbar-logo" style="font-size:16px;">Token shop</div>
    <div style="width:36px;"></div>
  </div>

  <div class="px" style="flex:1; padding-bottom:30px;">
    <div class="token-balance-card">
      <div class="token-balance-inner">
        <div class="token-balance-amt" id="shop-balance">–</div>
        <div class="token-balance-sub">tokens available</div>
        <div class="token-balance-sub" id="shop-countdown"></div>
      </div>
    </div>

    <div class="section-label" style="padding:0;">Need more?</div>

    <!-- Both packs now call the live Dodo Payments checkout (see the
         header comment in the script block below) — no longer disabled
         "Coming soon" placeholders. data-pack identifies which one to
         POST to create-checkout-session-dodo.js. -->
    <div class="token-pack-card">
      <div class="token-pack-row">
        <div class="token-pack-amt">100 tokens</div>
        <div class="token-pack-price">$1.99</div>
      </div>
      <div class="token-pack-sub">Enough for 1 more generation.</div>
      <button class="btn btn-secondary btn-block" id="shop-buy-pack100" data-pack="pack100">Buy</button>
    </div>

    <div class="token-pack-card best">
      <div class="token-pack-badge">10% off</div>
      <div class="token-pack-row">
        <div class="token-pack-amt">500 tokens</div>
        <div class="token-pack-price">$8.95</div>
      </div>
      <div class="token-pack-sub">Enough for 5 more generations.</div>
      <button class="btn btn-secondary btn-block" id="shop-buy-pack500" data-pack="pack500">Buy</button>
    </div>

    <div class="auth-sub" style="margin-top:8px;">Free tokens are capped — 100 every 24 hours, up to 500 banked. Buy a pack any time for more, right when you need it.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script>
  if(!DreamStore.getCurrentUser()){ location.href = 'login.html'; }
  document.getElementById('shop-back').innerHTML = Icons.back;

  // ============================================================================
  // Token packs — wired to the live Dodo Payments checkout
  // ----------------------------------------------------------------------------
  // Dodo Payments is the founder's chosen + approved processor (see
  // AGENT_POLICY.md's escalation policy for why that choice itself needed
  // human sign-off, and the tracker for the "approved + live" decision
  // record) — create-checkout-session-dodo.js creates a one-time-purchase
  // Checkout Session for whichever pack was clicked, and this redirects
  // the browser there. Tokens are NOT granted here or by that function —
  // only dodo-webhook.js, on Dodo's own signed payment.succeeded
  // confirmation, actually credits the balance. That's the durable source
  // of truth; a client-side "I just paid" signal can't be trusted (see
  // that file's header comment).
  //
  // Both buttons call the same purchasePack() below with their own
  // data-pack ("pack100"/"pack500"). A failure here (most likely: Dodo's
  // real API key/product-id env vars aren't configured in this
  // environment yet — see docs/PAYWALL_SETUP.md's "what a human still
  // needs to do" checklist) degrades to a toast and a re-enabled button,
  // never a stuck/broken UI, same "flag, don't fake it" rule this file
  // followed while the buttons were still disabled placeholders.
  //
  // Pricing (founder-specified): 100 tokens for $1.99, 500 tokens for
  // $8.95. The 500-pack price is a 10% discount off the naive 5x bundle
  // price (5 * $1.99 = $9.95 -> 10% off = $8.955), rounded DOWN to a clean
  // two-decimal price ($8.95) rather than the exact $8.955 — a deliberate
  // but arbitrary rounding choice, not a fixed one. Revisit/adjust freely;
  // it was never re-derived from a pricing model, just picked to look clean
  // on a price tag. The actual amount charged is whatever the Dodo product
  // behind DODO_PRODUCT_PACK_100/DODO_PRODUCT_PACK_500 is configured for —
  // nothing here enforces these two stay in sync; keep them matched by
  // hand when setting up (or changing) those Dodo products.
  // ============================================================================

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function purchasePack(pack, button){
    var email = DreamStore.getAccountEmail();
    if(!email){
      // Legacy accounts that predate email being required (see js/store.js's
      // getAccountEmail doc comment) have nowhere for a Dodo receipt/
      // confirmation to go — same reasoning generate-video.js's own
      // opportunistic email already relies on elsewhere in this codebase.
      showToast('Add an email to your account first (Profile) to buy tokens');
      return;
    }

    var originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = 'Redirecting…';

    fetch('/.netlify/functions/create-checkout-session-dodo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, pack: pack })
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.error || !data.url) throw new Error(data.error || 'no_checkout_url');
        location.href = data.url;
      })
      .catch(function(){
        button.disabled = false;
        button.textContent = originalLabel;
        showToast("Checkout isn't available right now — try again soon");
      });
  }

  document.getElementById('shop-buy-pack100').addEventListener('click', function(){ purchasePack('pack100', this); });
  document.getElementById('shop-buy-pack500').addEventListener('click', function(){ purchasePack('pack500', this); });

  var balanceEl = document.getElementById('shop-balance');
  var countdownEl = document.getElementById('shop-countdown');
  var tokenStatus = null;

  /** "3h 12m" / "42m" / "now" from an epoch-ms nextGrantAt — same shape as profile.html/style.html/result.html/processing.html's own copy of this (no shared JS module in this codebase, see js/store.js's header comment). */
  function formatTokenCountdown(nextGrantAt){
    if(nextGrantAt == null) return '';
    var ms = nextGrantAt - Date.now();
    if(ms <= 0) return 'now';
    var totalMin = Math.ceil(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    return h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
  }

  function renderBalance(){
    if(!tokenStatus) return;
    balanceEl.textContent = tokenStatus.balance;
    countdownEl.textContent = tokenStatus.nextGrantAt ? ('Next 100 free tokens in ' + formatTokenCountdown(tokenStatus.nextGrantAt)) : '';
  }
  function loadBalance(){
    DreamStore.getTokenStatus().then(function(status){
      tokenStatus = status;
      renderBalance();
    }).catch(function(){ balanceEl.textContent = '–'; countdownEl.textContent = ''; });
  }
  loadBalance();
  setInterval(renderBalance, 60000);

  // ============================================================================
  // Returning from a Dodo Checkout redirect (?checkout=success|cancelled)
  // ----------------------------------------------------------------------------
  // create-checkout-session-dodo.js's default return_url/cancel_url both
  // point back here with this query param. On success, the webhook that
  // actually credits tokens is asynchronous and Blobs is only eventually
  // consistent (up to ~60s — see lib/entitlements.js's own doc comment on
  // this), so the balance card may not reflect the purchase for a few
  // seconds after landing back here even though the payment already
  // succeeded. Rather than claim an exact balance that might still be
  // stale, show a plain "received" toast and re-poll the balance a few
  // times over the window where the webhook is most likely to have landed
  // — renderBalance() above already re-renders whatever loadBalance() last
  // fetched, so this just fetches a few extra times without any new UI
  // path. history.replaceState clears the query param so a manual refresh
  // of this page doesn't re-show the toast.
  // ============================================================================
  (function handleCheckoutReturn(){
    var params = new URLSearchParams(location.search);
    var checkout = params.get('checkout');
    if(!checkout) return;

    history.replaceState(null, '', location.pathname);

    if(checkout === 'success'){
      showToast('Payment received — your tokens will appear shortly');
      var attempts = 0;
      var poll = setInterval(function(){
        attempts++;
        loadBalance();
        if(attempts >= 5) clearInterval(poll);
      }, 3000);
    } else if(checkout === 'cancelled'){
      showToast('Checkout cancelled — no charge made');
    }
  })();
</script>
</body>
</html>
