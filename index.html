<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>DreamTube — Your dreams come alive</title>
<meta name="description" content="Your dreams come alive. Turn your dreams into videos with DreamTube.">
<meta name="theme-color" content="#0c0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DreamTube">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Welcome screen: page-scoped dark "night" theme (tracker item
     for-product-realign-index-html-organic-w-lzbmfu, founder 07-31).
     This file used to carry its OWN light "dawn" theme (see git history)
     deliberately matched to the marketing funnel's THEN-light Advanced/
     pricing screens — the founder had already killed exactly this kind of
     light/dark whiplash once before (index.html was originally black,
     clashing with that light funnel one tap later). Since then the
     founder directed the whole app (Home, and separately the ad funnel's
     own screens) to the same dark "night" language, which made this
     file's light override the NEW inverted version of the same whiplash:
     a light welcome screen handing off to a dark app. Fixed by reusing
     Home's own night palette values verbatim (home.html's --home-ink/
     --home-soft/--home-acc and its body background gradient — see that
     file's own head-of-file comment) under this file's own --idx-* names
     (same per-page-scoped-token convention as --dawn- and --fn- elsewhere
     in this codebase) instead of inventing a third palette, so every entry
     point (this screen, the funnel, Home) now reads as one continuous dark
     product.

     Deliberately NOT home.html's animated star field/aurora layers —
     those are cheap (CSS-only, no JS/canvas) but this screen's whole job
     is to be the fastest possible first paint for a brand-new visitor,
     often on a worse connection than an already-installed user reopening
     the app, so it stays limited to a single static gradient (one paint,
     zero animation loop) per FOUNDER_PRINCIPLES.md's "light media over
     heavy on mobile" principle. This is scoped to this one file only —
     css/styles.css's shared dark theme (--void, --bg-app, --text-primary,
     etc.) used by every other page is untouched. */
  :root{
    --idx-ink:#eae7fb; --idx-soft:#a49dc4; --idx-acc:#9d90ff;
  }
  body{ background:linear-gradient(180deg,#171233,#100d20 55%,#0d0a1e); }
  #app{ background:transparent; }
  /* Scoped under .welcome-body (not bare .wm-copy/.wm-subcopy) so this
     rule is always more specific than the base .wm-copy/.wm-subcopy
     rules in css/styles.css, regardless of <head> cascade order. */
  .welcome-body .wm-copy{ color:var(--idx-ink); }
  .welcome-body .wm-subcopy{ color:var(--idx-soft); }
  /* logo-v2.png has an opaque black background baked into the PNG itself.
     The old light "dawn" theme needed a white "badge" card behind it so
     that black square didn't look like a broken leftover — on THIS dark
     background it blends in naturally (same as it does on every other
     page's plain black theme), so no special wrapper is needed here
     anymore; .wm-visual renders exactly like login.html's own logo. */
  .welcome-body .btn-primary{ background:var(--idx-acc); color:#fff; box-shadow:0 12px 26px -10px rgba(157,144,255,.45); }
  .welcome-body .btn-primary:hover{ filter:brightness(1.08); }
  .welcome-body .btn-primary:active{ filter:brightness(0.92); }
  .welcome-body .link-text{ color:var(--idx-soft); }
  .welcome-body .link-text a{ color:var(--idx-ink); }
</style>

<!-- Analytics: PostHog (product analytics + funnels + A/B experiments) and Meta Pixel
     (ad conversion tracking for Meta ads). Both blocks below no-op safely — no script
     load, no network call, no console error — until real keys are set in
     js/analytics-config.js. See docs/ANALYTICS_SETUP.md for the full setup story,
     including why GA4 is deliberately not installed yet (no Google Ads channel yet). -->
<script src="js/analytics-config.js"></script>
<script>

    posthog.init(POSTHOG_KEY, {
      api_host: POSTHOG_HOST,
      defaults: '2026-05-30',
      session_recording: {
        // PostHog already masks every input/textarea's typed value by default in session
        // replay (maskAllInputs defaults to true) — pinned explicitly here so a future

        // sometimes vulnerable dream text people type into #dream-text and future
        // free-text quiz-funnel screens) in session replays without anyone noticing.
        // See also the `ph-no-capture` class on #dream-text in create.html, a second,
        // independent layer of the same protection for that specific field. DO NOT
        // REMOVE either of these without a deliberate privacy decision.
        maskAllInputs: true

  }
</script>
<script>
  // Meta Pixel base code — https://developers.facebook.com/docs/meta-pixel/get-started
  // The <noscript> fallback pixel <img> from Meta's standard snippet is deliberately
  // left out: it can't be gated behind the same placeholder check (a <noscript> tag only
  // renders when JS is off, so no JS-side check can stop it firing with a placeholder ID),
  // and this app requires JavaScript to function at all (js/store.js is the entire
  // client-side "backend"), so a no-JS visitor already has a non-functional app either
  // way. Add it back once META_PIXEL_ID is a real value, if desired:
  //   <noscript><img height="1" width="1" style="display:none"
  //     src="https://www.facebook.com/tr?id=REAL_ID&ev=PageView&noscript=1" /></noscript>
  if (typeof META_PIXEL_ID !== 'undefined' && META_PIXEL_ID !== 'REPLACE_WITH_REAL_PIXEL_ID') {
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', META_PIXEL_ID);
    fbq('track', 'PageView');
  }
</script>
</head>
<body>

<div id="app">
  <div class="welcome-body">
    <img class="wm-visual" src="assets/logo-v2.png" alt="DreamTube logo">
    <div class="wm-copy">Your dreams<br>come <i>alive.</i></div>
    <div class="wm-subcopy">Turn your dreams into videos.</div>
    <div class="wm-foot">
      <!-- Founder decision 2026-07-26 (tracker item
           for-product-route-organic-direct-visitor-olu8md): organic/direct
           visitors landing here now go straight into the pre-signup
           wizard.html dream-builder instead of the external growth funnel
           (https://dreamtubeapp.netlify.app/), per WIZARD_SPEC.md's
           confirmed "build the dream first, sign up after" seam. This is
           routing-only — wizard.html itself is unchanged, and does not
           read any URL params, so it works identically whether reached
           from here or hit directly. wizard.html's own Contact/Signup
           steps then hand off into the SAME processing.html/start.html
           post-signup tail the paid ad funnel uses (see
           docs/JOURNEY_MANIFEST.md for the full, reconciled screen-by-
           screen walkthrough of both entries).

           The PAID growth-funnel handoff is completely untouched by this:
           paid/ad traffic never passes through this button at all — ads
           land visitors directly on the external funnel
           (https://dreamtubeapp.netlify.app/), whose own hook/quiz/style
           screens (a separate dreamtube-growth repo) still hand off into
           start.html?resume=1&... exactly as before (see start.html's own
           "Entry guard" comment). Previously this button pointed at that
           same external funnel for EVERY visitor, organic included; per
           this decision organic/direct traffic is redirected to wizard.html
           while the paid path (which never touches index.html) is
           unaffected. See the for-product-build-the-dream-builder-wiza-28did1
           tracker item for the earlier, held-back proposal of this exact
           change. -->
      <a class="btn btn-primary btn-block" href="wizard.html">Get Started</a>
      <span class="link-text">Already have an account? <a href="login.html">Log in</a></span>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
