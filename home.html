<!--
  Home "Night Shelf" rebuild (tracker item
  for-product-build-ship-founder-go-07-31--vtsyg3, founder GO 2026-07-31
  evening) — supersedes Wave 1 (for-product-build-homepage-wave-1-the-ri-
  xr8mir, 2026-07-29). Visual spec = home-mock4-x7q4.html (repo root,
  commit ca4ada0 + edda05f's four founder amendments), itself round 3 of
  the home redesign (round 2's home-mock3-x7q4.html was rejected for
  cramming everything into one viewport) — this page is the opposite by
  design: a long, airy scrolling shelf of full-width modules rather than a
  dense grid. Every visual token/keyframe below is ported verbatim from
  that approved mock; only the wiring (real store data, real navigation,
  real analytics) is new. Same "CSS-only art, no image/video/canvas
  payload for the sky" discipline as Wave 1 (FOUNDER_PRINCIPLES.md's
  "light media over heavy on mobile") — the one exception is the
  Chamber hero's sage artwork (assets/chamber-sage.jpg, re-compressed to
  ~52KB — see this item's own build notes — specifically because this is
  the one page with a real image payload and Meta/Instagram's in-app
  webview is a real, low-bandwidth audience for it).
-->
<style>
:root{
  --bg-app:#0c0a1a; /* overrides css/styles.css's shared #000 for THIS page only — #app/.night-dock both read this variable already */
  --home-raise:rgba(36,29,71,.88);
  --home-raise2:rgba(24,19,46,.92);
  --home-ink:#eae7fb;
  --home-soft:#a49dc4;
  --home-line:rgba(157,144,255,.32);
  --home-acc:#9d90ff;
  --home-warn:#e0aa5a;
  --home-ok:#4bd39b;
  /* §2 type scale (home-mock4-x7q4.html) — nothing below 15px; interactive ≥16px */
  --t-display:28px;   /* greeting */
  --t-hero:26px;      /* hero card titles */
  --t-section:20px;   /* "My dreams" */
  --t-action:18px;    /* pill labels (pills 56px tall) */
  --t-body:16px;      /* subs, quiet links, quiet rows */
  --t-eyebrow:12px;   /* TONIGHT */
}
body{ background:linear-gradient(180deg,#171233,#100d20 55%,#0d0a1e); }
#app{ overflow:hidden; }
/* home-mock4-x7q4.html's own reset, ported verbatim: several modules below
   set their own `display` via a class (.pill{display:flex}, etc.), which
   otherwise beats the browser's plain [hidden]{display:none} UA rule
   (author origin always wins over user-agent origin, regardless of
   selector specificity) — css/styles.css has no equivalent blanket reset,
   so this page needs its own, same as the mock. Without this, every
   `el.hidden = true` toggle below (the pill/quote/entry-links/d1-line
   state transforms) would silently do nothing. */
[hidden]{ display:none !important; }

/* ===== the living night sky — CSS-only, no image/video/canvas payload ===== */
.home-bg{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(130% 60% at 25% 0%, rgba(131,58,180,.35), transparent 60%),
    radial-gradient(110% 60% at 82% 45%, rgba(90,60,190,.25), transparent 55%);
}
.home-stars-a,.home-stars-b{ position:absolute; inset:-40px; z-index:0; pointer-events:none; }
.home-stars-a{
  background-image:
    radial-gradient(1.2px 1.2px at 20px 34px, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(1px 1px at 110px 80px, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1.4px 1.4px at 200px 50px, rgba(207,200,255,.9), transparent 60%),
    radial-gradient(1px 1px at 60px 150px, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 170px 190px, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1px 1px at 240px 130px, rgba(207,200,255,.6), transparent 60%);
  background-size:260px 240px;
  animation:homeDrift 70s linear infinite, homeTwinkle 4.5s ease-in-out infinite;
}
.home-stars-b{
  background-image:
    radial-gradient(1px 1px at 40px 60px, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.3px 1.3px at 140px 30px, rgba(255,224,170,.8), transparent 60%),
    radial-gradient(1px 1px at 90px 200px, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.2px 1.2px at 220px 170px, rgba(255,255,255,.65), transparent 60%),
    radial-gradient(1px 1px at 15px 120px, rgba(207,200,255,.5), transparent 60%);
  background-size:250px 230px;
  animation:homeDrift 110s linear infinite reverse, homeTwinkle 6s ease-in-out .8s infinite;
}
.home-aurora{
  position:absolute; left:-30%; right:-30%; top:-4%; height:220px; z-index:0; pointer-events:none;
  background:linear-gradient(115deg, rgba(75,211,155,.12), rgba(157,144,255,.16) 45%, rgba(224,120,190,.1));
  filter:blur(28px); border-radius:50%;
  animation:homeAurora 13s ease-in-out infinite alternate;
}
@keyframes homeDrift{ from{ transform:translate3d(0,0,0); } to{ transform:translate3d(-60px,24px,0); } }
@keyframes homeTwinkle{ 0%,100%{ opacity:.95; } 50%{ opacity:.5; } }
@keyframes homeAurora{ from{ transform:translateX(-14px) skewX(-6deg); opacity:.6; } to{ transform:translateX(18px) skewX(5deg); opacity:.9; } }
@keyframes homePulse{ 0%,100%{ box-shadow:0 0 6px rgba(157,144,255,.45); } 50%{ box-shadow:0 0 18px rgba(157,144,255,.95); } }
@keyframes chamberBreathe{ 0%,100%{ opacity:.35; } 50%{ opacity:.8; } }
@media (prefers-reduced-motion:reduce){
  .home-stars-a,.home-stars-b,.home-aurora,.pulse,.chamber-breathe{ animation:none !important; }
}

.home-fg{ position:relative; z-index:1; display:flex; flex-direction:column; height:100%; min-height:0; }

/* --- 2 · greeting: one 28px line, nothing under it (founder amendment:
   dropped the old date sub-line — nothing else lives in the topbar
   region now) --- */
.home-greet{ padding:26px 0 22px; flex:none; }
.home-greet-line{ font-size:var(--t-display); font-weight:800; color:var(--home-ink); letter-spacing:-.02em; }

/* One long scroll — content scrolls BEHIND the overlaid night dock. 20px
   side gutters (memo's global rule); bottom padding reserves the dock's
   own footprint via the shared --nav-clearance token. */
.home-scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 20px calc(var(--nav-clearance) + 32px); }

/* ===== hero card DNA (the approved result-mock's treatment, radius 24) ===== */
.hero-card{
  position:relative; width:100%; border-radius:24px; overflow:hidden;
  border:1px solid rgba(157,144,255,.55); color:var(--home-ink);
  box-shadow:0 4px 20px -6px rgba(0,0,0,.5), 0 0 26px -4px rgba(157,144,255,.34);
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:22px;
}
.hero-stars, .hero-scrim, .chamber-breathe{ position:absolute; inset:0; pointer-events:none; }
.hero-content{ position:relative; z-index:1; }
.eyebrow{
  font-size:var(--t-eyebrow); letter-spacing:.12em; text-transform:uppercase;
  color:#cfc8ff; font-weight:800; margin-bottom:8px; text-shadow:0 1px 8px rgba(12,10,26,.6);
}
.hero-title{
  font-size:var(--t-hero); font-weight:800; letter-spacing:-.01em; line-height:1.2;
  text-shadow:0 2px 12px rgba(12,10,26,.55);
}
.hero-sub{ margin-top:8px; font-size:var(--t-body); font-weight:500; line-height:1.5; color:#cfc8ea; text-shadow:0 1px 8px rgba(12,10,26,.55); }

/* the pill — 56px tall, 18px/800 (§2 type scale) */
.pill{
  display:flex; align-items:center; justify-content:center; width:100%;
  min-height:56px; margin-top:16px; padding:14px;
  border:none; border-radius:99px; cursor:pointer;
  background:var(--home-acc); color:#0c0a1a;

.pill:active{ transform:scale(.98); }

/* --- 3 · TONIGHT hero (~430px @844) — full-bleed CSS night scene: warm
   moon top-right + blue/violet nebula (the result mock's .dreamvideo
   palette, card-sized), tiny stars, bottom scrim; content bottom-anchored --- */
.hero-tonight{

    radial-gradient(56px 56px at 76% 15%, rgba(255,236,190,.98), rgba(255,220,158,.5) 55%, transparent 74%),

/* Tonight's three quiet entry links, one centered 16px row */
.entryrow{ display:flex; align-items:center; justify-content:center; gap:4px; margin-top:6px; position:relative; z-index:1; }
.entryrow .dot{ color:#8b83b3; font-size:14px; }

.toast.show{ opacity:1; transform:translate(-50%,0); }

  <!-- Bar A, the anchored night dock, rendered by the shared js/bottom-

<script>
  if(!DreamStore.getCurrentUser()){ location.href = 'login.html'; }

  BottomNav.mount(document.getElementById('bottom-nav-slot'), { active: 'home' });

  // ===== Analytics helper — same guarded, fire-and-forget PostHog wrapper
  // every other page's inline script defines locally (see explore.html/
  // result.html). Deliberately neutral, home_*-prefixed event names — never
  // sleep/health-adjacent phrasing (this app's ad-pixel domain is scanned
  // by Meta's health classifier, a standing firewall — see
  // test/home-behavioral.test.js's neutral-naming assertion, matching
  // test/interp-analytics-behavioral.test.js's own). =====
  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{ posthog.capture(name, props || {}); }catch(e){ /* analytics must never break the app */ }
    }
  }

  function esc(str){ var d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  var user = DreamStore.getCurrentUser();
  var myDreams = DreamStore.getMyDreams(); // most-recent-first, see js/store.js's own ordering comment

  // ===== Greeting — one line, no date sub-line (founder amendment) =====
  (function renderGreeting(){
    var hour = new Date().getHours();
    var part = hour < 12 ? 'morning' : (hour < 18 ? 'afternoon' : 'evening');
    var name = DreamStore.displayHandle(user && user.handle ? user.handle : '@you');
    document.getElementById('home-greet-line').textContent = 'Good ' + part + ', ' + name + '.';
  })();

  // ===== State reads — local, no network call (js/store.js's own doc
  // comment on getDreamLogStatus/getTokenStatus) =====
  var logStatus = DreamStore.getDreamLogStatus();
  var lastTokenStatus = null;

  // ===== Tonight hero =====
  function renderTonightHero(){
    var section = document.getElementById('hero-tonight');
    var title = document.getElementById('tonight-title');
    var quote = document.getElementById('tonight-quote');
    var pill = document.getElementById('tonight-pill');
    var links = document.getElementById('tonight-links');
    var d1 = document.getElementById('tonight-d1');
    var logged = logStatus.loggedToday;

    section.classList.toggle('logged', logged);
    title.textContent = logged ? 'Logged tonight ✓' : 'What did you dream?';
    if(logged){
      var quoteText = logStatus.todayEntryType === 'dream'
        ? (logStatus.todayDreamCaption || '')
        : 'No recall, and that counts too.';
      quote.textContent = quoteText;
      quote.hidden = false;
    } else {
      quote.hidden = true;
    }
    pill.hidden = logged;
    pill.classList.toggle('pulse', !logged);
    links.hidden = logged;
    d1.hidden = logged || logStatus.hasEverLogged;
  }
  renderTonightHero();

  // ===== Chamber hero — Interpretation Wave 1 (docs/INTERPRETATION_WAVE1_SPEC.md,
  // tracker item for-product-build-interpretation-wave-1--xuftyn), now
  // living on #chamber-pill rather than the whole card (mock amendment:
  // the hero's artwork/copy is decorative, only the pill is a real tap
  // target). `href` still resolves to a genuine result.html link (no
  // ?openInterp=1 — that mechanism is gone) purely as an honest fallback
  // destination (right-click/open-in-new-tab, or a click that somehow
  // bypasses the JS handler below); the click handler is what actually
  // drives the real Chamber experience in place, same "real href +
  // preventDefault + JS override" pattern js/purchase-sheet.js's own
  // mountBalanceChip already uses. Pulse migrates here from the Tonight
  // pill once tonight is logged (single-pulse rule, mock §3). =====
  var completedDream = myDreams.filter(function(d){ return d.videoUrl || d.imageUrl; })[0] || null;
  (function renderChamberHero(){
    var pill = document.getElementById('chamber-pill');
    var sub = document.getElementById('chamber-sub');
    if(completedDream){
      pill.href = 'result.html?id=' + encodeURIComponent(completedDream.id);
      pill.textContent = 'Enter';
      sub.textContent = 'Your reading awaits.';
    } else {
      pill.href = 'create.html';
      pill.textContent = 'Begin';
      sub.textContent = 'Make your first dream to begin.';
    }
    pill.classList.toggle('pulse', logStatus.loggedToday);
    // Diagnostic-only (tracker item for-product-bug-founder-new-home-
    // tapping-yuspxa), kept since it's still useful signal independent of
    // the mechanism change above — fired at HREF-COMPUTE time,
    // deliberately not gated on the click itself.
    track('home_chamber_href_computed', {
      branch: completedDream ? 'completed_dream' : 'no_completed_dream',
      href: pill.getAttribute('href'),
      dream_id: completedDream ? completedDream.id : null
    });
  })();

  document.getElementById('chamber-pill').addEventListener('click', function(e){
    track('home_chamber_pill_tapped', { branch: completedDream ? 'completed_dream' : 'no_completed_dream' });
    if(!completedDream) return; // real link to create.html — let it navigate normally
    e.preventDefault();
    if(window.InterpretExperience) InterpretExperience.open(completedDream.id);
  });

  // ===== Ritual module — streak, constellation, daily claim, quiet
  // balance line. Transforms IN PLACE (founder amendment carried over
  // from Wave 1's This Week card): same #ritual element, same position on
  // the shelf, in every state. =====
  function renderConstellation(lit){
    lit = Math.max(0, Math.min(3, lit));
    var l1 = lit >= 1 ? ' lit' : '', l2 = lit >= 2 ? ' lit' : '', l3 = lit >= 3 ? ' lit' : '';
    var line1 = lit >= 2 ? ' lit' : '', line2 = lit >= 3 ? ' lit' : '';
    return '<svg class="constel" viewBox="0 0 84 46" aria-hidden="true">' +
      '<line class="' + line1.trim() + '" x1="12" y1="34" x2="42" y2="12"/>' +
      '<line class="' + line2.trim() + '" x1="42" y1="12" x2="72" y2="28"/>' +
      '<path class="st' + l1 + '" d="M12 28l1.8 4.2L18 34l-4.2 1.8L12 40l-1.8-4.2L6 34l4.2-1.8z"/>' +
      '<path class="st' + l2 + '" d="M42 6l1.8 4.2L48 12l-4.2 1.8L42 18l-1.8-4.2L36 12l4.2-1.8z"/>' +
      '<path class="st' + l3 + '" d="M72 22l1.8 4.2L78 28l-4.2 1.8L72 34l-1.8-4.2L66 28l4.2-1.8z"/>' +
    '</svg>';
  }

  // Mirrors js/store.js's own private startOfWeekMs (Monday 00:00 local
  // time) -- duplicated rather than exported, same rationale as Wave 1's
  // identical helper (the only page that needs it client-side).
  function startOfThisWeekMs(){
    var d = new Date();
    var day = d.getDay();
    var diffToMonday = day === 0 ? 6 : day - 1;
    var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToMonday);
    monday.setHours(0, 0, 0, 0);
    return monday.getTime();
  }

  var WEEK_SUMMARY_SHOWN_PREFIX = 'dreamtube_home_week_summary_shown_';

  function renderRitualModule(){
    var ritual = document.getElementById('ritual');
    var big = document.getElementById('ritual-big');
    var sub = document.getElementById('ritual-sub');
    var constelSlot = document.getElementById('ritual-constel');
    var streak = (lastTokenStatus && typeof lastTokenStatus.streak === 'number') ? lastTokenStatus.streak : 0;
    var n = logStatus.weekCount;
    var target = logStatus.weekTarget;
    var earned = n >= target;

    ritual.classList.toggle('warm', earned);

    if(!logStatus.hasEverLogged){
      big.textContent = 'Start your streak tonight';
      sub.hidden = true;
      constelSlot.innerHTML = renderConstellation(0);
    } else if(!earned){
      big.textContent = '🔥 ' + streak + (streak === 1 ? ' night' : ' nights');
      sub.hidden = false;
      sub.textContent = n + ' of ' + target + ' this week';
      constelSlot.innerHTML = renderConstellation(n);
    } else {
      // A real, locally-computed summary — never fabricated: this week's
      // actual dream count plus its most common style, both straight from
      // getMyDreams() (same computation Wave 1's This Week card used).
      var weekStart = startOfThisWeekMs();
      var weekDreams = myDreams.filter(function(d){ return typeof d.createdAt === 'number' && d.createdAt >= weekStart; });
      var styleCounts = {};
      weekDreams.forEach(function(d){ if(d.style){ styleCounts[d.style] = (styleCounts[d.style] || 0) + 1; } });
      var topStyle = null, topCount = 0;
      Object.keys(styleCounts).forEach(function(s){ if(styleCounts[s] > topCount){ topStyle = s; topCount = styleCounts[s]; } });
      big.textContent = '✨ ' + n + ' dreams this week';
      sub.hidden = false;
      sub.textContent = (topStyle ? ('mostly ' + topStyle) : 'recall is up') + ' · 🔥 ' + streak + (streak === 1 ? ' night' : ' nights');
      constelSlot.innerHTML = renderConstellation(3);

      // Keyed by the CURRENT account's own handle, not just the date --
      // review finding carried over from Wave 1: a shared browser where a
      // different account later logs in and legitimately earns the same
      // week's summary must not find this flag already tripped by someone
      // else's session.
      var key = WEEK_SUMMARY_SHOWN_PREFIX + (user && user.handle ? user.handle : '') + '_' + new Date(startOfThisWeekMs()).toDateString();
      try {
        if(!localStorage.getItem(key)){
          localStorage.setItem(key, '1');
          track('home_weekly_summary_earned', { week_count: n });
        }
      } catch(e){ /* private mode / storage disabled — never worth breaking the page for */ }
    }
  }
  renderRitualModule();

  function renderRitualClaim(tokenStatus){
    var btn = document.getElementById('ritual-claim');
    var balance = document.getElementById('ritual-balance');
    if(!tokenStatus){ btn.style.display = 'none'; return; }
    if(tokenStatus.claimable){
      var amount = tokenStatus.dailyClaimAmount != null ? tokenStatus.dailyClaimAmount : 20;
      btn.textContent = 'Claim +' + amount + ' ✦';
      btn.style.display = 'flex';
    } else {
      btn.style.display = 'none';
    }
    balance.innerHTML = '<span class="gold">✦</span> ' + tokenStatus.balance + ' · Vault →';
  }

  document.getElementById('ritual-claim').addEventListener('click', function(){
    if(!lastTokenStatus || !lastTokenStatus.claimable) return;
    track('home_claim_chip_tapped', { source: 'home_ritual_module' });
    PurchaseSheet.showClaimSheet({
      source: 'home_ritual_module',
      tokenStatus: lastTokenStatus,
      onClaimed: function(){ refreshTokenStatus(false); }
    });
  });

  // ===== Silent streak freeze — never a punitive message, just a
  // background, honest analytics signal that a missed night's streak was
  // quietly protected. Unchanged from Wave 1. =====
  function maybeTrackStreakFreeze(tokenStatus){
    if(!tokenStatus || !tokenStatus.streak || tokenStatus.streak < 2) return;
    if(logStatus.loggedYesterday) return; // yesterday was covered normally -- no freeze happened
    var flagKey = 'dreamtube_home_streak_freeze_shown_' + (user && user.handle ? user.handle : '') + '_' + new Date().toDateString();
    try {
      if(!localStorage.getItem(flagKey)){
        localStorage.setItem(flagKey, '1');
        track('home_streak_freeze_shown', { streak: tokenStatus.streak });
      }
    } catch(e){ /* private mode / storage disabled */ }
  }

  // ===== My Dreams row — shared js/dream-cards.js renderer
  // (DreamCards.dreamRowTileHTML), the horizontal scroll-snap strip. A
  // genuinely brand-new (D1, never-logged) account sees the whole section
  // hidden entirely (mock §7); an account that HAS logged before but has
  // no real dream yet (e.g. only "no recall" check-ins) sees the friendly
  // empty-state copy instead of an empty gallery box; otherwise the real
  // thumbnails render. Capped at a reasonable window (see the feed-
  // windowing tracker item on unbounded eager rendering) rather than
  // rendering every dream a power-user account has ever made. =====
  var DREAMS_ROW_MAX = 10;
  var thumbVideoObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var video = entry.target;
      if(entry.isIntersecting){
        if(video.paused) video.play().catch(function(){ /* autoplay can be blocked before any user gesture — muted should normally allow it regardless */ });
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.2 });

  function renderDreamsRow(){
    var section = document.getElementById('dreams');
    var rowEl = document.getElementById('dreams-row');
    var emptyEl = document.getElementById('dreams-empty');

    if(!logStatus.hasEverLogged){
      section.style.display = 'none';
      return;
    }
    section.style.display = '';

    var recent = myDreams.slice(0, DREAMS_ROW_MAX);
    if(!recent.length){
      rowEl.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }
    rowEl.style.display = 'flex';
    emptyEl.style.display = 'none';
    rowEl.innerHTML = recent.map(function(d){
      return DreamCards.dreamRowTileHTML(d, { gradient: DreamStore.gradientFor(d) });
    }).join('');

    thumbVideoObserver.disconnect();
    Array.prototype.forEach.call(rowEl.querySelectorAll('.vcard-video'), function(v){ thumbVideoObserver.observe(v); });
  }
  renderDreamsRow();

  // ===== "Add to home screen" quiet row — PERSISTENT until genuinely
  // verified installed, never hidden by a mere dismiss (there is no
  // dismiss action on this row at all, deliberately). Reuses
  // js/install-nudge.js's canOfferInstall() plus DreamStore.
  // getInstallVerified() exactly as Wave 1's install journey card did —
  // only the visual container changed (a quiet row now, absorbing what
  // used to be its own hcard). =====
  (function installJourneyRow(){
    var row = document.getElementById('install-qrow');
    var overlay = document.getElementById('install-sheet-overlay');
    var wired = false;

    function shouldShow(){
      return !!(window.InstallNudge && window.PwaInstall && window.DreamStore &&
        InstallNudge.canOfferInstall() && !DreamStore.getInstallVerified());
    }

    function refresh(){
      row.style.display = shouldShow() ? 'flex' : 'none';
    }

    function closeSheet(){ overlay.classList.remove('open'); }

    function openSheet(){
      var body = document.getElementById('install-sheet-body');
      var onIOS = PwaInstall.isIOS();
      if(onIOS){
        body.innerHTML = InstallNudge.buildIOSGuidanceHtml();
      } else {
        body.innerHTML =
          '<div class="push-ask-body">One tap and you\'re set — open your dreams like any other app, no browser tabs.</div>' +
          '<button type="button" class="btn btn-primary btn-block" id="install-sheet-android-btn" style="margin-top:14px;">Install <span class="icon">' + (window.Icons ? Icons.download : '') + '</span></button>';
        document.getElementById('install-sheet-android-btn').addEventListener('click', function(){
          PwaInstall.promptInstall().then(function(outcome){
            track('home_install_sheet_outcome', { outcome: outcome || 'unavailable' });
            if(outcome === 'accepted'){ closeSheet(); refresh(); }
          });
        });
      }
      overlay.classList.add('open');
    }

    function wireUp(){
      if(wired) return;
      wired = true;
      document.getElementById('install-qrow-icon').innerHTML = window.Icons ? Icons.download : '';
      row.addEventListener('click', function(){
        track('home_install_card_tapped', {});
        openSheet();
      });
      document.getElementById('install-sheet-close').addEventListener('click', closeSheet);
      SheetDismiss.wire(overlay, closeSheet);
      window.addEventListener('appinstalled', refresh);
    }

    refresh();
    if(row.style.display !== 'none') wireUp();

    window.addEventListener('dreamtube:install-capability-changed', function(){
      refresh();
      if(row.style.display !== 'none') wireUp();
    });
  })();

  // ===== Token status — reused, existing daily-claim mechanism (no new
  // claim logic here at all: js/store.js's getTokenStatus/claimDailyTokens
  // + js/purchase-sheet.js's claim sheet, exactly as explore.html/
  // profile.html/shop.html already use). =====
  function refreshTokenStatus(autoOpen){
    DreamStore.getTokenStatus().then(function(status){
      lastTokenStatus = status;
      renderRitualModule(); // re-render with the real streak now that tokenStatus has arrived
      renderRitualClaim(status);
      maybeTrackStreakFreeze(status);
      if(autoOpen){
        PurchaseSheet.maybeAutoOpenClaimSheet(status, {
          onClaimed: function(){ refreshTokenStatus(false); }
        });
      }
    }).catch(function(){ /* leave whatever was last rendered — never block the page on this */ });
  }
  refreshTokenStatus(true);

  // ===== Tonight hero entry points — reuse create.html's own Write/Speak
  // affordances (no reinvention); "No recall" is the one genuinely
  // content-less entry point (see js/store.js's logNoRecallToday doc
  // comment for why it never creates a fake dream record). The primary
  // pill is the Wizard — create.html's existing chip-first "Build it"
  // dream-builder (#choice-build), reached via the ?build=1 deep-link,
  // matching ?write=1/?record=1's own established convention. =====
  document.getElementById('tonight-pill').addEventListener('click', function(){
    track('home_today_entry_tapped', { method: 'wizard' });
    location.href = 'create.html?build=1';
  });
  document.getElementById('btn-write').addEventListener('click', function(){
    track('home_today_entry_tapped', { method: 'write' });
    location.href = 'create.html?write=1';
  });
  document.getElementById('btn-speak').addEventListener('click', function(){
    track('home_today_entry_tapped', { method: 'speak' });
    location.href = 'create.html?record=1';
  });
  document.getElementById('btn-norecall').addEventListener('click', function(){
    track('home_today_entry_tapped', { method: 'no_recall' });
    var result = DreamStore.logNoRecallToday();
    if(!result.ok) return;
    logStatus = DreamStore.getDreamLogStatus();
    renderTonightHero();
    renderRitualModule();
    renderDreamsRow();
    showToast('Logged — no recall counts too.');
  });

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // ===== Card-tap analytics — delegated on the whole scroll area so
  // re-renders never need to re-wire per-card listeners. Fires alongside
  // (not instead of) each module's own real navigation/action above. =====
  document.querySelector('.home-scroll').addEventListener('click', function(e){
    var cardEl = e.target.closest('[data-card]');
    if(!cardEl) return;
    track('home_card_tapped', { card: cardEl.dataset.card });
  });

  track('home_viewed', {
    logged_today: logStatus.loggedToday,
    week_count: logStatus.weekCount,
    has_ever_logged: logStatus.hasEverLogged
  });
</script>
</body>
