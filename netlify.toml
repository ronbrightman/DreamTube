[build]
  publish = "."
  functions = "netlify/functions"
  # This repo's pages themselves still have NO build step (no bundler, no
  # transpiler, plain <script> tags — see README.md/CLAUDE.md) — this
  # command exists ONLY to stamp version.json with the commit actually
  # being deployed, since that information only exists at build time, not
  # request time. See scripts/generate-version.js's own header comment for
  # the full reasoning (why this needs a build step at all, why it reads
  # Netlify's build env vars over shelling out to git where possible, and
  # why the human-readable "version" field uses a date+shortsha scheme
  # instead of a fake "nth deploy today" counter). Tracker item
  # for-product-release-visibility-founder-a-8hx5cz.
  command = "npm run build"
  # Skip a production deploy entirely when the commit range being deployed
  # ONLY touches doc-like/internal-tooling paths that are never served to
  # users and don't affect the deployed app. Tracker item
  # for-product-netlify-cost-deploys-are-97--9vbpd4: 177 deploys this
  # billing period = 2655 of 2724 total credits (97%) -- the push-per-
  # iteration workflow (many small commits, each a full deploy) is
  # effectively the entire hosting bill, and a large share of those
  # commits touch only docs/AGENT files with zero user-facing effect.
  #
  # Netlify's documented ignore-command contract (see
  # https://docs.netlify.com/build/configure-builds/ignore-builds/): this
  # command runs before every build; exit 0 = SKIP the deploy, non-zero =
  # proceed with the build. We want "skip WHEN ONLY doc-like paths
  # changed", which is exactly `git diff --quiet`'s own exit-code
  # semantics inverted-for-free: 0 = no diff found OUTSIDE the excluded
  # doc-like paths (i.e. nothing real changed) = skip; 1 = a real diff
  # exists outside those paths = build. No inversion needed -- just point
  # `git diff --quiet` at everything BUT the doc-like paths.
  #
  # Uses Netlify's own $CACHED_COMMIT_REF (last successfully deployed
  # commit for this branch/context) / $COMMIT_REF (commit being deployed
  # now) env vars rather than HEAD^/HEAD literals, since Netlify's clone
  # depth doesn't guarantee HEAD^ is available. If $CACHED_COMMIT_REF is
  # unset (no prior successful deploy for this branch/context -- e.g. the
  # very first build), there's nothing to diff against, so fail safe and
  # build (exit 1) rather than risk skipping a first deploy.
  #
  # Excluded (doc-like, never served, safe to skip a deploy for):
  # docs/**, AGENT_POLICY.md, CLAUDE.md, FOUNDER_PRINCIPLES.md,
  # MANAGER_BRIEF.md, README.md, RELEASES.md, .claude/** (agent/skill
  # config, never served). Deliberately NOT excluded: every .html page,
  # js/**, netlify/functions/**, assets/**, stylesheets, sw.js,
  # manifest.json, netlify.toml itself, package.json, scripts/** (the
  # build command above reads scripts/generate-version.js) -- anything
  # actually shipped or that affects the deployed app always builds.
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs/**' ':!AGENT_POLICY.md' ':!CLAUDE.md' ':!FOUNDER_PRINCIPLES.md' ':!MANAGER_BRIEF.md' ':!README.md' ':!RELEASES.md' ':!.claude/**'"

# Scheduled Functions (Netlify's own cron mechanism) -- tracker item
# for-product-build-stage-0-pwa-web-push-f-jbutt5, part 4
# (daily-claim-available push). Declared here per Netlify's own documented
# "specify the cron expression in netlify.toml" convention
# (https://docs.netlify.com/build/functions/scheduled-functions/), in
# ADDITION to send-daily-claim-pushes.js's own inline `schedule()` wrapper
# from @netlify/functions -- belt-and-suspenders, since this repo has no
# way to actually invoke Netlify's real scheduler from this sandbox to
# confirm which mechanism a given deploy honors first. Hourly: comfortably
# inside CLAIM_COOLDOWN_MS's 20h window (lib/entitlements.js) with room to
# spare, so a newly-claimable account is never more than about an hour
# from getting its push.
[functions."send-daily-claim-pushes"]
  schedule = "@hourly"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-real-per-job-fal-cost-loggin-360bxy (daily fal.ai
# usage-vs-spend reconciliation). @daily runs once after UTC midnight; the
# function itself reconciles the PREVIOUS UTC day (see
# reconcile-fal-cost.js's own header comment for why).
[functions."reconcile-fal-cost"]
  schedule = "@daily"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-build-whatsapp-morning-captu-skez3n (the
# Morning Capture Ritual's WhatsApp channel). Fires once daily at a single
# fixed UTC hour -- see send-whatsapp-morning-capture.js's own SCHEDULING
# header comment for why (no per-user timezone on file yet, a known
# simplification) and for this file's own inline schedule() wrapper this
# mirrors.
[functions."send-whatsapp-morning-capture"]
  schedule = "0 13 * * *"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-reliability-net-spec-v1-smok-x1o5zc, piece 1
# ("both-domain smoke runs"). Every 4 hours -- see both-domain-smoke.js's
# own header comment for the call-volume math this cadence was picked
# against (well under every existing per-IP/per-day rate limit its own
# function checks touch).
[functions."both-domain-smoke"]
  schedule = "0 */4 * * *"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-instagram-tiktok-auto-postin-cahr76 (Manager's
# SPEC v1, manual-export MVP for postpack-h4mv.html). Fires once nightly;
# the function itself enforces at most one pack item per channel
# (Instagram/TikTok) per UTC calendar day via its own dedup marker (see
# assemble-instagram-tiktok-postpack.js's own header comment) -- the exact
# hour isn't load-bearing, just picked clear of the other scheduled jobs
# above.
[functions."assemble-instagram-tiktok-postpack"]
  schedule = "0 7 * * *"
