[build]
  publish = "."
  functions = "netlify/functions"
  # This repo's pages themselves still have NO build step (no bundler, no
  # transpiler, plain <script> tags — see README.md/CLAUDE.md) — this
  # command exists ONLY to stamp version.json with the commit actually
  # being deployed, since that information only exists at build time, not
  # request time. See scripts/generate-version.js's own header comment for
  # the full reasoning (why this needs a build step at all, why it reads
  # Netlify's build env vars over shelling out to git where possible, and
  # why the human-readable "version" field uses a date+shortsha scheme
  # instead of a fake "nth deploy today" counter). Tracker item
  # for-product-release-visibility-founder-a-8hx5cz.
  command = "npm run build"

# Scheduled Functions (Netlify's own cron mechanism) -- tracker item
# for-product-build-stage-0-pwa-web-push-f-jbutt5, part 4
# (daily-claim-available push). Declared here per Netlify's own documented
# "specify the cron expression in netlify.toml" convention
# (https://docs.netlify.com/build/functions/scheduled-functions/), in
# ADDITION to send-daily-claim-pushes.js's own inline `schedule()` wrapper
# from @netlify/functions -- belt-and-suspenders, since this repo has no
# way to actually invoke Netlify's real scheduler from this sandbox to
# confirm which mechanism a given deploy honors first. Hourly: comfortably
# inside CLAIM_COOLDOWN_MS's 20h window (lib/entitlements.js) with room to
# spare, so a newly-claimable account is never more than about an hour
# from getting its push.
[functions."send-daily-claim-pushes"]
  schedule = "@hourly"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-real-per-job-fal-cost-loggin-360bxy (daily fal.ai
# usage-vs-spend reconciliation). @daily runs once after UTC midnight; the
# function itself reconciles the PREVIOUS UTC day (see
# reconcile-fal-cost.js's own header comment for why).
[functions."reconcile-fal-cost"]
  schedule = "@daily"
