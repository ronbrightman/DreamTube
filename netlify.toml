[build]
  publish = "."
  functions = "netlify/functions"
  # This repo's pages themselves still have NO build step (no bundler, no
  # transpiler, plain <script> tags — see README.md/CLAUDE.md) — this
  # command exists ONLY to stamp version.json with the commit actually
  # being deployed, since that information only exists at build time, not
  # request time. See scripts/generate-version.js's own header comment for
  # the full reasoning (why this needs a build step at all, why it reads
  # Netlify's build env vars over shelling out to git where possible, and
  # why the human-readable "version" field uses a date+shortsha scheme
  # instead of a fake "nth deploy today" counter). Tracker item
  # for-product-release-visibility-founder-a-8hx5cz.
  command = "npm run build"
  # Skip a production deploy entirely when the commit range being deployed
  # ONLY touches doc-like/internal-tooling paths that are never served to
  # users and don't affect the deployed app. Tracker item
  # for-product-netlify-cost-deploys-are-97--9vbpd4: 177 deploys this
  # billing period = 2655 of 2724 total credits (97%) -- the push-per-
  # iteration workflow (many small commits, each a full deploy) is
  # effectively the entire hosting bill, and a large share of those
  # commits touch only docs/AGENT files with zero user-facing effect.
  #
  # Netlify's documented ignore-command contract (see
  # https://docs.netlify.com/build/configure-builds/ignore-builds/): this
  # command runs before every build; exit 0 = SKIP the deploy, non-zero =
  # proceed with the build. We want "skip WHEN ONLY doc-like paths
  # changed", which is exactly `git diff --quiet`'s own exit-code
  # semantics inverted-for-free: 0 = no diff found OUTSIDE the excluded
  # doc-like paths (i.e. nothing real changed) = skip; 1 = a real diff
  # exists outside those paths = build. No inversion needed -- just point
  # `git diff --quiet` at everything BUT the doc-like paths.
  #
  # Uses Netlify's own $CACHED_COMMIT_REF (last successfully deployed
  # commit for this branch/context) / $COMMIT_REF (commit being deployed
  # now) env vars rather than HEAD^/HEAD literals, since Netlify's clone
  # depth doesn't guarantee HEAD^ is available. If $CACHED_COMMIT_REF is
  # unset (no prior successful deploy for this branch/context -- e.g. the
  # very first build), there's nothing to diff against, so fail safe and
  # build (exit 1) rather than risk skipping a first deploy.
  #
  # Excluded (doc-like/test-only, never served, safe to skip a deploy
  # for): docs/**, AGENT_POLICY.md, CLAUDE.md, FOUNDER_PRINCIPLES.md,
  # MANAGER_BRIEF.md, README.md, RELEASES.md, .claude/** (agent/skill
  # config, never served), test/** (round 2, tracker item
  # for-product-deploy-cost-round-2-extend-b-f6bnhc, founder re-raised
  # 08-04: 40 deploys/~600 credits in one day despite round 1's doc-only
  # skip -- several tests-only commits still triggered a full deploy,
  # even though a test file is exercised by `npm test`, never served or
  # read at request time, same "internal-tooling, zero user-facing
  # effect" reasoning round 1 already established for docs/AGENT files).
  # Deliberately NOT excluded: every .html page, js/**, netlify/
  # functions/**, assets/**, stylesheets, sw.js, manifest.json,
  # netlify.toml itself, package.json, scripts/** (the build command
  # above reads scripts/generate-version.js) -- anything actually
  # shipped or that affects the deployed app always builds.
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs/**' ':!AGENT_POLICY.md' ':!CLAUDE.md' ':!FOUNDER_PRINCIPLES.md' ':!MANAGER_BRIEF.md' ':!README.md' ':!RELEASES.md' ':!.claude/**' ':!test/**'"

# Disable Netlify's "Pretty URLs" HTML post-processing (round 9, 08-07
# live bug hunt finding #5): it was silently REWRITING the deployed HTML —
# e.g. index.html's `href="wizard.html?entry=index"` shipped as
# `href='/wizard?entry=index'` — so what users received was not the bytes
# this repo tested (deployed index.html hash-diffed against the repo's).
# Every behavioral test, the journey manifest, and the founder's own
# walkthroughs must exercise what actually ships; an unreviewed transform
# layer between repo and user is exactly how "works locally, buggy live"
# happens. Turning it off changes LINK REWRITING only: Netlify's normal
# routing still serves extensionless URLs (/wizard resolved to wizard.html
# before this setting existed and still does — verified live with curl:
# 200, byte-identical to wizard.html, query params preserved), so any
# /wizard-shaped links already in the wild — user history, the SW runtime
# cache, anything copied from an old share — keep working unchanged.
# sw.js's navigation handling is network-first, so the /wizard vs
# /wizard.html cache-key split this rewriting created is an offline-only
# footnote (see the note in sw.js's networkFirst).
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = false

# Scheduled Functions (Netlify's own cron mechanism) -- tracker item
# for-product-build-stage-0-pwa-web-push-f-jbutt5, part 4
# (daily-claim-available push). Declared here per Netlify's own documented
# "specify the cron expression in netlify.toml" convention
# (https://docs.netlify.com/build/functions/scheduled-functions/), in
# ADDITION to send-daily-claim-pushes.js's own inline `schedule()` wrapper
# from @netlify/functions -- belt-and-suspenders, since this repo has no
# way to actually invoke Netlify's real scheduler from this sandbox to
# confirm which mechanism a given deploy honors first. Hourly: comfortably
# inside CLAIM_COOLDOWN_MS's 20h window (lib/entitlements.js) with room to
# spare, so a newly-claimable account is never more than about an hour
# from getting its push.
[functions."send-daily-claim-pushes"]
  schedule = "@hourly"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-real-per-job-fal-cost-loggin-360bxy (daily fal.ai
# usage-vs-spend reconciliation). @daily runs once after UTC midnight; the
# function itself reconciles the PREVIOUS UTC day (see
# reconcile-fal-cost.js's own header comment for why).
[functions."reconcile-fal-cost"]
  schedule = "@daily"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-build-whatsapp-morning-captu-skez3n (the
# Morning Capture Ritual's WhatsApp channel). Fires once daily at a single
# fixed UTC hour -- see send-whatsapp-morning-capture.js's own SCHEDULING
# header comment for why (no per-user timezone on file yet, a known
# simplification) and for this file's own inline schedule() wrapper this
# mirrors.
[functions."send-whatsapp-morning-capture"]
  schedule = "0 13 * * *"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-reliability-net-spec-v1-smok-x1o5zc, piece 1
# ("both-domain smoke runs"). Every 4 hours -- see both-domain-smoke.js's
# own header comment for the call-volume math this cadence was picked
# against (well under every existing per-IP/per-day rate limit its own
# function checks touch).
[functions."both-domain-smoke"]
  schedule = "0 */4 * * *"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# tracker item for-product-instagram-tiktok-auto-postin-cahr76 (Manager's
# SPEC v1, manual-export MVP for postpack-h4mv.html). Fires once nightly;
# the function itself enforces at most one pack item per channel
# (Instagram/TikTok) per UTC calendar day via its own dedup marker (see
# assemble-instagram-tiktok-postpack.js's own header comment) -- the exact
# hour isn't load-bearing, just picked clear of the other scheduled jobs
# above.
[functions."assemble-instagram-tiktok-postpack"]
  schedule = "0 7 * * *"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# the "unwatched dream" retention nudge (founder-approved retention plan,
# piece 1). Every 3 minutes -- NOT every-minute like send-pending-first-
# dream-emails above, because this nudge's dominant bound is its 7-minute
# unwatched FLOOR (land the email ~7-10 min after ready), not "send the
# instant a thumbnail lands": max delay is floor + one interval = ~10 min,
# and a finer cadence would just triple invocations for no benefit since
# nothing here acts in the first 7 minutes. See send-unwatched-dream-
# nudges.js's own header comment for the full cadence reasoning.
[functions."send-unwatched-dream-nudges"]
  schedule = "*/3 * * * *"

# Same belt-and-suspenders reasoning as send-daily-claim-pushes above --
# the AUTOMATIC "No meaning yet" interpretation retention email (founder-
# approved 2026-08-12: "add the no interpretation email to also be
# automatically sent like not watched video"). Every 3 minutes, mirroring
# send-unwatched-dream-nudges above: this scan's dominant bound is its
# ~10-minute delay FLOOR (email a watched-but-read-nothing dream ~10 min
# later), so max delay is floor + one interval = ~13 min, and a finer cadence
# would just multiply invocations for no benefit since nothing here acts in
# the first 10 minutes. See send-interp-none-nudges.js's own header comment
# for the full cadence reasoning.
[functions."send-interp-none-nudges"]
  schedule = "*/3 * * * *"

# Same belt-and-suspenders reasoning as send-interp-none-nudges above -- the
# AUTOMATIC flagship "Unread meanings" interpretation retention email (founder-
# approved 2026-08-12: auto-send the interpretation emails "like not watched
# video"). Every 3 minutes, mirroring the sibling scans: this scan's dominant
# bound is its ~NEXT-DAY delay FLOOR (email a read-some-but-not-all dream ~20h
# after the first reading, per the retention plan's "next day" timing), so the
# +3-min interval granularity is immaterial -- a finer cadence would just
# multiply invocations for no benefit since nothing here acts in the first ~20
# hours. See send-interp-unread-nudges.js's own header comment for the full
# cadence/delay/expiry reasoning.
[functions."send-interp-unread-nudges"]
  schedule = "*/3 * * * *"

# ==========================================================================
# /go/* -- serve the marketing ads funnel under this site's own domain
# (https://dreamtube.life/go/), so paid-ad visitors can land and stay on
# dreamtube.life end-to-end instead of hopping origins mid-funnel.
#
# The funnel is its OWN Netlify site (repo ronbrightman/dreamtube-growth,
# deployed at https://dreamtubeapp.netlify.app) -- these rules don't copy
# anything into this repo, they PROXY: status 200 + a full URL `to` is
# Netlify's documented cross-site rewrite
# (https://docs.netlify.com/manage/routing/redirects/rewrites-proxies/),
# so the browser's address bar stays on dreamtube.life/go/... while
# Netlify's CDN fetches the response from the funnel site. Both sites keep
# deploying independently; the funnel's existing root address keeps
# working untouched (live ad traffic points there today).
#
# ONE rule only -- a bare-/go 301 to /go/ was tried first and REMOVED:
# Netlify normalizes trailing slashes when matching redirect rules, so
# `from = "/go"` also matched /go/ itself and 301'd it to itself forever
# (live loop, caught 08-07 minutes after deploy). Instead, /go (bare) is
# proxied like everything else and the FUNNEL's index.html carries a tiny
# self-redirect to /go/ (see dreamtube-growth index.html head) so relative
# subresources always resolve under /go/.
#
# force = true is safe here because nothing in this repo lives under /go:
# no go.html, no go/ directory, no function route (functions are all under
# /.netlify/functions/), so this prefix cannot shadow any app page --
# checked against the full repo file listing when added. Keep it that way:
# never add a top-level file or directory named `go` to this repo.
# ==========================================================================
[[redirects]]
  from = "/go/*"
  to = "https://dreamtubeapp.netlify.app/:splat"
  status = 200
  force = true
