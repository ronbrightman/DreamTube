<body>
<div id="app" class="fill" style="position:relative;">
  <div class="gen-banner" id="gen-banner" style="display:none;">

  <!-- cache-bust 2026-07-29T19:20Z: force fresh digest after Netlify dedup served stale content -->

<script>
  // Deliberately no login gate here, unlike every other page — Explore is
  // the real shared feed now (see js/store.js's getSharedFeed), and a
  // shared dream link needs to work for whoever opens it, logged in or not,
  // scrolling into the rest of the feed exactly like any other visitor.
  // Tapping +Create or Profile while logged out still needs an account
  // (those pages' own login gates would just bounce to a bare login screen
  // with no context), so intercept those taps here with a proper pitch for
  // signing up instead of a silent, unexplained redirect.
  // Renders the shared nav markup + icons + the new-likes badge dot (a
  // synchronous, no-network read of whatever profile.html's own
  // page-load fetch last computed; see DreamStore.getCachedNewLikesCount's
  // doc block in js/store.js for why this page never fetches the feed
  // itself. Safe to call logged-out too — it's just a plain localStorage
  // read, and a logged-out visitor never had anything written there in
  // the first place, only profile.html, which requires login, ever writes
  // it). See js/bottom-nav.js for what this renders.
  BottomNav.mount(document.getElementById('bottom-nav-slot'), { active: 'explore' });

  var signupNudge = document.getElementById('modal-signup-nudge');
  var signupCta = document.getElementById('signup-nudge-cta');
  function gateNavLink(id, dest){
    document.getElementById(id).addEventListener('click', function(e){
      if(DreamStore.getCurrentUser()) return;
      e.preventDefault();
      // Carries through to login.html so signing up from here lands back
      // on whatever they were actually trying to do, not just Explore.
      signupCta.href = 'login.html?mode=signup&next=' + encodeURIComponent(dest);
      signupNudge.classList.add('open');
    });
  }
  gateNavLink('nav-home', 'home.html');
  gateNavLink('nav-create', 'create.html');
  gateNavLink('nav-profile', 'profile.html');

  // Token balance chip (tracker item
  // for-product-build-the-daily-token-claim--fngrwd, item 4) — explore.html
  // was the one page missing this. Only mounted for a signed-in visitor
  // (explore itself has no login gate, unlike every other page that mounts
  // this chip) — a logged-out visitor has no account balance to show, and
  // DreamStore.getTokenStatus()'s own no-email fast path would otherwise
  // render a confusing "0 · Low" chip for someone who was never asked to
  // sign in at all.
  if (DreamStore.getCurrentUser()) {
    var exploreTokenChip = PurchaseSheet.mountBalanceChip(document.getElementById('explore-token-chip-slot'));
    function refreshExploreTokenChip(autoOpen) {
      DreamStore.getTokenStatus().then(function (status) {
        PurchaseSheet.renderBalanceChip(exploreTokenChip, status);
        if (autoOpen) {
          PurchaseSheet.maybeAutoOpenClaimSheet(status, {
            onClaimed: function () { refreshExploreTokenChip(false); }
          });
        }
      }).catch(function () { /* leave whatever was last rendered — never block the feed on this */ });
    }
    refreshExploreTokenChip(true);
  }
  signupNudge.addEventListener('click', function(e){
    if(e.target.id === 'modal-signup-nudge') signupNudge.classList.remove('open');
  });

  function esc(str){ var d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function formatCount(n){ if(n>=1000) return (n/1000).toFixed(n%1000===0?0:1)+'k'; return String(n); }
  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  // ===== Analytics helper — same guarded, fire-and-forget PostHog wrapper
  // every other page's inline funnel script defines locally (see
  // result.html/start.html) — this page didn't have one yet. =====
  function track(name, props){
    if(window.posthog && typeof window.posthog.capture === 'function'){
      try{ posthog.capture(name, props || {}); }catch(e){ /* analytics must never break the app */ }
    }
  }

  // Feed-user-row avatar circle (tracker item for-product-ui-founder-
  // directed-2026-07--djgjn0): this circle used to render permanently
  // empty ('<div class="feed-avatar"></div>', nothing ever populated it).
  // Three-way fallback, in priority order:
  //   1. `d.mine` (this viewer's OWN published dream, per getSharedFeed's
  //      ownerHandle-vs-current-user check) -- backfill straight from this
  //      device's local Me character photo, per the founder's explicit ask,
  //      rather than waiting on the small server-synced `avatar` thumbnail
  //      (see js/store.js's syncPublishedDreamToFeed) to have round-tripped
  //      through get-feed.js. Always the freshest, full-quality copy this
  //      device has, and works even for a dream published before the
  //      avatar field existed at all.
  //   2. `d.avatar` -- the small avatar thumbnail synced at publish time,
  //      for every OTHER viewer whose device has no local copy of this
  //      author's photo to fall back on.
  //   3. Deterministic per-username colored fallback (DreamStore.
  //      avatarFallback) -- covers both "this author never set a Me photo"
  //      and "this dream was published before the avatar field existed"
  //      (legacy records simply have no d.avatar at all). Never a blank/
  //      empty circle, regardless of which case applies.
  function avatarHTML(d){
    var src = d.mine ? (DreamStore.getMeAvatarDataUrl() || d.avatar) : d.avatar;
    if(src) return '<div class="feed-avatar"><img src="'+esc(src)+'" alt=""></div>';
    var fb = DreamStore.avatarFallback(d.ownerHandle);
    return '<div class="feed-avatar feed-avatar-fallback" style="background:'+esc(fb.gradient)+'">'+esc(fb.initial)+'</div>';
  }

  // globalIndex is stamped onto the card as data-index (see the returned
  // markup below) purely so dehydrateSlot() can look the right dream back
  // up out of currentDreams if this card later scrolls far enough away to
  // be virtualized back down to a placeholder -- see the windowing/
  // virtualization comment block further down for the full mechanism.
  function cardHTML(d, isFirst, isDreamOfDay, globalIndex){
    // No autoplay attribute — every card would otherwise start playing the
    // instant it's inserted into the DOM regardless of whether it's the
    // visible one, so by the time you scrolled to card #2 it had already
    // been running in the background since page load. Playback is instead
    // driven entirely by the IntersectionObserver set up below, which only
    // plays whichever card is actually the current scroll-snap target and
    // restarts it from 0 every time it becomes active.
    var soundOn = DreamStore.getSoundPref();
    // Three-way: video -> image -> gradient fallback (was two-way) — see
    // docs/IMAGE_GENERATION_SPEC.md §4. Mute/play controls below stay
    // video-only (a still image has no playback concept), driven purely by
    // d.videoUrl exactly as before this change.
    // Windowing (tracker.html: feed-pages-explore-html-home-html-render-6t7udd)
    // -- preload="metadata" is only correct for the card that's actually in
    // the first viewport (index 0 of whatever list is currently rendered,
    // filtered or not -- this is a one-card-per-screen scroll-snap feed, so
    // "first viewport" really is just the first card). Every other card
    // gets preload="none" so the browser doesn't start fetching metadata
    // ahead of actual playback -- see appendNextBatch()/hydrateSlot() below:
    // this function is now ONLY ever called once a card is already about to
    // be (or already is) on screen (real DOM/memory virtualization handles
    // "don't even create this yet" for everything further away), so there's
    // no longer a separate data-src/src split to defer network activity
    // pre-hydration -- preload=none is the sole remaining lever for that,
    // same as before.
    var media = d.videoUrl
      ? '<video class="feed-video" src="'+esc(d.videoUrl)+'"'+(soundOn?'':' muted')+' loop playsinline preload="'+(isFirst?'metadata':'none')+'"></video>'
      : d.imageUrl
        ? '<img class="feed-image" src="'+esc(d.imageUrl)+'" alt="">'
        : '<div class="feed-bg" style="background:'+DreamStore.gradientFor(d)+'"></div>';
    var muteBtn = d.videoUrl
      ? '<button class="icon-btn feed-mute-btn" data-mute="'+d.id+'" title="'+(soundOn?'Mute':'Unmute')+'" style="position:absolute; right:14px; top:calc(env(safe-area-inset-top,0px) + 16px); z-index:50; background:rgba(0,0,0,.5); border-color:rgba(255,255,255,.14);">'+(soundOn?Icons.volumeOn:Icons.volumeMuted)+'</button>'
      : '';
    // Manual recovery control for when autoplay doesn't kick in (blocked,
    // slow network, a decode/load error) — otherwise the card just sits on
    // a frozen frame forever with nothing to tap. See observeVideos() for
    // the play/pause listeners that keep this synced, and the click
    // handler below for the actual toggle.
    var playBadge = d.videoUrl
      ? '<div class="play-badge feed-play" data-play="'+d.id+'"><div class="badge-circle"><span class="icon">'+Icons.play+'</span></div></div>'
      : '';
    // Idea #3 — "Dream of the Day": not a separate page or section, just a
    // badge overlaid on whichever card the server picked as today's
    // highlight (see get-feed.js's resolveDreamOfDay — most-liked among
    // dreams that haven't already had a previous day's turn, same pick for
    // every visitor). Only shown in the unfiltered feed — a filtered view
    // (one style/user) is an intentional subset, not "the first thing
    // anyone sees."
    // tracker item for-product-split-prompttext-storytext-f-yt5kc7: `d`
    // comes from the shared feed (DreamStore.getSharedFeed, above) — a
    // dream only ever reaches this feed via syncPublishedDreamToFeed
    // (js/store.js), whose own payload sends `caption: dream.caption`,
    // and js/store.js's finalizeDream guarantees dream.caption already
    // EQUALS dream.storyText (the human-readable description) for every
    // dream saved after this feature shipped — see that function's own
    // doc comment. So d.caption here is already storyText's value; there
    // is no separate d.storyText on the feed's own wire shape to prefer
    // (publish-dream.js/get-feed.js's request/response schema is
    // deliberately untouched by this feature — no reason to grow it when
    // the existing field already carries the right value).
    var dowBadge = isDreamOfDay
      ? '<div class="dow-badge"><div class="dow-eyebrow">Dream of the day</div><div class="dow-title" dir="auto">"'+esc(d.caption)+'"</div><div class="dow-sub">by '+esc(DreamStore.displayHandle(d.ownerHandle))+' · '+formatCount(d.likes)+' likes</div></div>'
      : '';
    return '<div class="feed-card" data-id="'+d.id+'" data-index="'+globalIndex+'">' +
      media +
      muteBtn +
      playBadge +
      dowBadge +
      '<div class="feed-scrim"></div>' +
      '<div class="feed-info">' +
        '<div class="feed-user-row">'+avatarHTML(d)+'<div class="feed-user" data-filter-user="'+esc(d.ownerHandle)+'">'+esc(DreamStore.displayHandle(d.ownerHandle))+'</div></div>' +
        '<div class="feed-caption clamped" dir="auto">'+esc(d.caption)+'</div>' +
        '<div class="feed-tag-row"><span data-filter-style="'+esc(d.style)+'">Style: '+esc(d.style)+'</span>' + (d.dur ? '<span class="dot"></span><span>'+esc(d.dur)+'</span>' : '') + '</div>' +
      '</div>' +
      '<div class="feed-actions">' +
        '<div class="feed-action'+(d.likedByMe?' liked':'')+'" data-like="'+d.id+'">' +
          '<div class="icon">'+(d.likedByMe?Icons.heartFilled:Icons.heartOutline)+'</div><span data-count="'+d.id+'">'+formatCount(d.likes)+'</span>' +
        '</div>' +
        '<div class="feed-action" data-share="'+d.id+'"><div class="icon">'+Icons.share+'</div><span>Share</span></div>' +
        // Report/block (tracker item for-product-public-feed-safety-in-app-re-ppuw77)
        // — hidden on the viewer's own dream, since reporting/blocking yourself
        // has no meaning here.
        (d.mine ? '' : '<div class="feed-action" data-more="'+d.id+'"><div class="icon">'+Icons.moreHorizontal+'</div><span>More</span></div>') +
      '</div>' +
      (isFirst ? '<div class="feed-swipe-hint">↕ SWIPE FOR NEXT DREAM</div>' : '') +
    '</div>';
  }

  // Lightweight stand-in for a card that isn't near the viewport yet (or no
  // longer is) -- see the virtualization comment block below. Deliberately
  // NOT given the "feed-card" class: DOM/test assertions that count
  // ".feed-card" elements should only ever count real, fully hydrated
  // cards, not these placeholders, since the whole point is that the
  // hydrated count stays small and bounded regardless of feed size. Layout-
  // critical rules (full-bleed sizing + scroll-snap participation) are
  // inlined rather than relying on the .feed-card CSS class for exactly
  // that reason -- a placeholder still needs to occupy the same one-
  // container-height slot in the scroll flow as a real card would, so
  // swapping between the two never shifts scroll position or other cards'
  // layout, but it must not be mistaken for a real card by anything
  // querying .feed-card.
  function slotHTML(d, globalIndex){
    return '<div class="feed-slot" data-id="'+d.id+'" data-index="'+globalIndex+'" style="width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;"></div>';
  }

  var root = document.getElementById('feed-scroll');
  var chip = document.getElementById('filter-chip');
  var filter = null; // { type: 'style'|'user', value: string }

  // Fetched once from the real shared feed (see js/store.js's
  // getSharedFeed) and filtered client-side, rather than re-fetching per
  // filter click.
  var allDreams = [];
  var feedLoaded = false;
  var dreamOfDayId = null;

  // ===== Feed windowing + virtualization (tracker.html: feed-pages-explore-html-home-html-render-6t7udd) =====
  // Was: root.innerHTML = dreams.map(cardHTML).join('') -- every fetched
  // dream got its own <video preload=metadata> the instant the feed loaded,
  // unbounded by feed size. As the published-dream library grows this is an
  // unbounded number of simultaneous metadata fetches on page load, a real
  // scaling risk on memory-constrained mobile webviews now that FB/IG ad
  // traffic funnels visitors straight here (see
  // for-product-check-app-for-the-same-mobil-5ng2cg's marketing-funnel
  // precedent for exactly this class of bug). Two mechanisms, working
  // together:
  //   1. BATCHING: only the first BATCH_SIZE dreams get a DOM slot at all
  //      up front; the next BATCH_SIZE are lazy-appended (as more slots --
  //      see (2)) once the user scrolls near the end, via a sentinel
  //      element observed by a second IntersectionObserver (scrollObserver
  //      below) -- the same primitive videoObserver already uses for
  //      playback gating, just watching scroll position against the list's
  //      end instead of a single card's visibility.
  //   2. VIRTUALIZATION: appending a batch does NOT mean rendering
  //      BATCH_SIZE full cards. Every slot starts (or becomes) a cheap
  //      placeholder div (see slotHTML above); presenceObserver below
  //      swaps a placeholder for the real, fully hydrated card (via
  //      hydrateSlot) only once it's actually near the viewport, and swaps
  //      a hydrated card back to a placeholder (dehydrateSlot) once it
  //      scrolls far enough away. This is what actually keeps total DOM
  //      weight (not just hydrated video src count) flat on a long scroll
  //      through a long feed -- a first version of this fix only released
  //      each off-screen card's video `src` while leaving the rest of the
  //      card's DOM subtree (info panel, like/share buttons, icons, etc.)
  //      in place forever, so total .feed-card DOM nodes still grew
  //      linearly and unboundedly with how far the user scrolled -- caught
  //      in review before merge. Placeholder and hydrated card are both
  //      forced to the exact same one-container-height box (via inline
  //      style / the .feed-card CSS rule respectively), so swapping
  //      between them via Element.replaceWith() never changes total
  //      scrollHeight and needs no manual scroll-position compensation.
  var BATCH_SIZE = 10;
  var currentDreams = []; // the filtered (or unfiltered) list render() is currently working through
  var renderedCount = 0;  // how many of currentDreams have been appended to the DOM so far
  var scrollSentinel = null;
  var scrollObserver = null;

  function findLoadedDream(id){
    for(var i=0; i<allDreams.length; i++) if(allDreams[i].id === id) return allDreams[i];
    return null;
  }

  // Plays only the card that's actually the current scroll-snap target,
  // restarting it from 0 each time it becomes active, and pauses every
  // other card's video. threshold 0.6 picks a single "winner" during the
  // brief moment two cards are both partially visible mid-swipe, instead
  // of flickering between them. root is the scroll container itself
  // (.feed-scroll), not the window, since that's the actual scrolling
  // context for scroll-snap-type cards nested inside #app.
  var videoObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var video = entry.target;
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6){
        if(video.paused){
          video.currentTime = 0;
          video.play().catch(function(){ /* autoplay can be blocked before any user gesture — muted should normally allow it regardless */ });
        }
      } else {
        video.pause();
      }
    });
  }, { root: root, threshold: [0, 0.6, 1] });

  // Card-level virtualization (see the windowing comment block above).
  // Watches every currently-present slot -- both real ".feed-card"s and
  // ".feed-slot" placeholders -- and swaps between the two as they cross a
  // much larger rootMargin than videoObserver above. videoObserver only
  // cares about the single card that's the current scroll-snap winner;
  // this keeps a somewhat wider window of real, hydrated neighbors
  // (previous/current/next, roughly) around it so scrolling one card in
  // either direction never has to wait on a fresh network fetch or a
  // visible pop-in, and only actually tears a card's DOM down once it's
  // well outside that window.
  var presenceObserver = new IntersectionObserver(function(entries){
    var changed = false;
    entries.forEach(function(entry){
      var el = entry.target;
      if(entry.isIntersecting){
        if(el.classList.contains('feed-slot')){ hydrateSlot(el); changed = true; }
      } else if(el.classList.contains('feed-card')){
        dehydrateSlot(el); changed = true;
      }
    });
    // videoObserver/wireVideoRecovery only need re-running once per batch
    // of changes, not once per individual swap above.
    if(changed) observeVideos();
  }, { root: root, rootMargin: '100% 0px 100% 0px', threshold: 0 });

  /** Swaps a placeholder for the real, fully hydrated card -- built fresh from currentDreams (already-fetched, in-memory dream data -- never re-fetched over the network) rather than anything cached in the DOM, since the placeholder never held more than the dream's id/index. */
  function hydrateSlot(el){
    var index = Number(el.dataset.index);
    var d = currentDreams[index];
    if(!d) return; // stale reference (e.g. a filter change already reset currentDreams) -- nothing to hydrate
    var wrapper = document.createElement('div');
    wrapper.innerHTML = cardHTML(d, index === 0, !filter && d.id === dreamOfDayId, index);
    var newEl = wrapper.firstElementChild;
    presenceObserver.unobserve(el);
    el.replaceWith(newEl);
    presenceObserver.observe(newEl);
  }

  /** Swaps a real hydrated card back down to a cheap placeholder once it's scrolled well out of range -- this is what actually frees the card's video (src, decode/buffer resources) along with everything else in its subtree (info panel, buttons, icons), not just the video's src attribute. */
  function dehydrateSlot(el){
    var d = currentDreams[Number(el.dataset.index)];
    if(!d) return;
    var wrapper = document.createElement('div');
    wrapper.innerHTML = slotHTML(d, Number(el.dataset.index));
    var newEl = wrapper.firstElementChild;
    presenceObserver.unobserve(el);
    el.replaceWith(newEl);
    presenceObserver.observe(newEl);
  }

  /** (Re)observes every currently-present slot (hydrated or placeholder) with presenceObserver -- called after any batch append or full render() reset, mirroring observeVideos()'s own disconnect-and-rescan-everything simplicity (see its comment for why that's fine to do repeatedly). */
  function observePresence(){
    presenceObserver.disconnect();
    Array.prototype.forEach.call(root.querySelectorAll('.feed-slot, .feed-card'), function(el){
      presenceObserver.observe(el);
    });
  }

  // Switching away to a different tab/app doesn't change anything about
  // scroll position or intersection ratio, so the observer above has no
  // reason to pause anything on its own -- left alone, a video (and its
  // audio, if unmuted) just kept playing in the background tab, unlike
  // e.g. YouTube pausing when you tab away. Page Visibility API fixes
  // this directly: pause whichever card is actually playing when the tab
  // is hidden, and resume that same one (not just re-evaluate the
  // observer, which wouldn't fire again on its own here) when it's
  // visible again.
  var pausedByVisibility = null;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      Array.prototype.forEach.call(root.querySelectorAll('.feed-video'), function(v){
        if(!v.paused){ v.pause(); pausedByVisibility = v; }
      });
    } else if(pausedByVisibility){
      if(root.contains(pausedByVisibility)) pausedByVisibility.play().catch(function(){});
      pausedByVisibility = null;
    }
  });

  // Keeps each card's play badge (see cardHTML) in sync with its video's
  // actual state, and gives a stalled video one chance to recover on its
  // own by reloading the source once on error, on top of the manual play
  // badge fallback (this is the primary content here, not a decorative
  // thumbnail, so unlike processing.html's preview row there's no gradient
  // to fall back to -- the badge is the recovery path).
  function wireVideoRecovery(v){
    // observeVideos() below re-scans and re-registers EVERY currently
    // rendered .feed-video each time a new batch is appended (simplest way
    // to keep a freshly-appended batch's cards wired without tracking which
    // ones are "new"), so without this guard a card from an earlier batch
    // would pick up a duplicate set of these listeners on every later
    // append. The listeners themselves are idempotent (classList add/
    // remove, and the retry below is already dataset-guarded) so a
    // duplicate wouldn't misbehave, but it's needless and grows unbounded
    // over a long scroll -- skip anything already wired.
    if(v.dataset.recoveryWired) return;
    v.dataset.recoveryWired = '1';
    var badge = v.closest('.feed-card').querySelector('.feed-play');
    if(badge){
      // 'play' fires the instant .play() is CALLED, not when playback
      // actually starts -- a video that's still buffering, or about to
      // fail with a network/decode error, fires 'play' immediately and
      // then never fires 'pause' to match (load()'s internal reset after
      // an error is silent, no event). Hiding on 'play' hid the only
      // recovery control exactly when it was needed most. 'playing' only
      // fires once real playback has actually begun.
      v.addEventListener('playing', function(){ badge.classList.add('hidden'); });
      v.addEventListener('pause', function(){ badge.classList.remove('hidden'); });
      v.addEventListener('error', function(){ badge.classList.remove('hidden'); });
    }
    // One retry only -- a permanently broken URL (not just a transient
    // network blip) would otherwise re-trigger 'error' immediately on every
    // retry and loop forever, hammering the network. After that, the play
    // badge above is the fallback: a real tap that calls play() again, not
    // an automatic retry loop.
    //
    // load() alone doesn't resume playback here -- unlike result.html/
    // processing.html, these videos deliberately have no autoplay
    // attribute (see cardHTML's comment: only the IntersectionObserver
    // above is allowed to start them, so a card never plays before it's
    // actually the visible one). Without an explicit play() after the
    // reload, a single transient error left the card sitting loaded-but-
    // paused indefinitely, since the observer only calls play() again when
    // the intersection ratio actually crosses a threshold -- which might
    // not happen again until the visitor scrolls away and back. This was a
    // real regression: it silently killed autoplay on any card that hit
    // so much as a momentary network hiccup.
    v.addEventListener('error', function(){
      if(v.dataset.retried) return;
      v.dataset.retried = '1';
      v.load();
      v.play().catch(function(){});
    });
  }

  // Re-scans and re-registers every currently rendered (i.e. currently
  // hydrated -- placeholders have no .feed-video) video with videoObserver
  // -- called after every batch append and after any presenceObserver-
  // driven hydrate/dehydrate swap, so newly-hydrated cards get wired up
  // and torn-down ones stop being tracked. Disconnecting+re-observing the
  // FULL current set (rather than tracking just what's new) is
  // deliberately simple: videoObserver's callback is idempotent against
  // re-firing on an element already in the right state (video.paused
  // checks), and wireVideoRecovery guards itself against double-wiring the
  // same element (see its own comment) -- so re-running this over cards
  // that didn't change is harmless, just a bit of avoidable-but-cheap
  // re-evaluation.
  function observeVideos(){
    videoObserver.disconnect();
    Array.prototype.forEach.call(root.querySelectorAll('.feed-video'), function(v){
      videoObserver.observe(v);
      wireVideoRecovery(v);
    });
  }

  // Lazily creates the sentinel element + its observer the first time a
  // feed actually has more than one batch's worth of dreams to show. The
  // sentinel always stays the last child of #feed-scroll -- appendNextBatch
  // inserts each new batch's HTML immediately BEFORE it (insertAdjacentHTML
  // 'beforebegin'), so the sentinel never has to be re-created or manually
  // moved, just left in place while content grows above it. Same
  // IntersectionObserver primitive videoObserver already uses for playback
  // gating, just watching scroll position against the list's end instead
  // of a single card's visibility.
  function ensureScrollObserver(){
    if(scrollObserver) return;
    scrollObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting) appendNextBatch();
      });
    // rootMargin extends the trigger zone past the container's real bottom
    // edge, so the next batch starts appending a bit before the user
    // actually hits the end of what's rendered, not only once they're
    // already stuck there.
    }, { root: root, rootMargin: '0px 0px 600px 0px', threshold: 0 });
  }

  /**
   * Appends the next BATCH_SIZE dreams (fewer for the final batch) from
   * currentDreams to the DOM, creating/removing the scroll sentinel as
   * needed. No-ops once everything has been rendered.
   *
   * Every appended dream gets a DOM slot, but only global index 0 is ever
   * built as a real hydrated card directly here -- it's the one thing the
   * visitor sees the instant the page loads, so it can't wait on an async
   * IntersectionObserver round-trip (however fast that typically settles,
   * there's no reason to risk a visible blank flash for the single most
   * important card). Every other index -- including the rest of THIS same
   * batch -- starts as a cheap placeholder; presenceObserver (via
   * observePresence() below) promotes whichever ones are already near the
   * viewport to real cards on its very next tick, and leaves the rest as
   * placeholders until the user actually scrolls close.
   */
  function appendNextBatch(){
    if(renderedCount >= currentDreams.length) return;
    var slice = currentDreams.slice(renderedCount, renderedCount + BATCH_SIZE);
    var startIndex = renderedCount;
    var html = slice.map(function(d, i){
      var globalIndex = startIndex + i;
      return globalIndex === 0
        ? cardHTML(d, true, !filter && d.id === dreamOfDayId, globalIndex)
        : slotHTML(d, globalIndex);
    }).join('');
    renderedCount += slice.length;

    if(scrollSentinel){
      scrollSentinel.insertAdjacentHTML('beforebegin', html);
    } else {
      root.insertAdjacentHTML('beforeend', html);
    }

    if(renderedCount < currentDreams.length){
      if(!scrollSentinel){
        scrollSentinel = document.createElement('div');
        scrollSentinel.className = 'feed-load-sentinel';
        scrollSentinel.style.cssText = 'height:1px;';
        root.appendChild(scrollSentinel);
        ensureScrollObserver();
        scrollObserver.observe(scrollSentinel);
      }
    } else if(scrollSentinel){
      scrollObserver.unobserve(scrollSentinel);
      scrollSentinel.remove();
      scrollSentinel = null;
    }

    observePresence();
    observeVideos();
  }

  function render(){
    if(!feedLoaded){
      root.innerHTML = '<div class="grid-empty" style="color:#fff;">Loading dreams…</div>';
      chip.style.display = 'none';
      return;
    }
    // Blocked authors (tracker item for-product-public-feed-safety-in-app-re-ppuw77)
    // are excluded from the feed entirely, not just flagged -- this is the
    // one place that actually enforces DreamStore.getSharedFeed()'s
    // per-viewer blockedByMe flag.
    var dreams = allDreams.filter(function(d){ return !d.blockedByMe; });
    if(filter){
      dreams = dreams.filter(function(d){
        return filter.type === 'style' ? d.style === filter.value : d.ownerHandle === filter.value;
      });
    }

    // Full reset -- render() only runs on initial load and on a filter
    // change, both of which mean "start the windowed rendering over from
    // scratch" rather than "append more of the same list".
    if(scrollSentinel){ scrollObserver.unobserve(scrollSentinel); }
    scrollSentinel = null;
    currentDreams = dreams;
    renderedCount = 0;
    root.innerHTML = '';

    if(dreams.length){
      appendNextBatch();
    } else {
      root.innerHTML = '<div class="grid-empty" style="color:#fff;">' + (filter ? 'No dreams match this filter.' : 'No published dreams yet.') + '</div>';
    }

    if(filter){
      chip.style.display = 'flex';
      chip.innerHTML = esc(filter.type === 'style' ? 'Style: ' + filter.value : DreamStore.displayHandle(filter.value)) + ' <span class="fc-x">✕</span>';
    } else {
      chip.style.display = 'none';
    }
  }
  render();

  // A share-dream.js link (netlify/functions/share-dream.js) for a
  // deleted/never-existed dream id redirects here with ?notice=
  // dream_gone rather than erroring — surfaced as a one-time gentle
  // toast, then stripped from the URL (history.replaceState, same
  // consume-once shape as js/purchase-sheet.js's readCheckoutParam) so a
  // manual refresh doesn't show it again.
  (function(){
    var params = new URLSearchParams(location.search);
    if(params.get('notice') !== 'dream_gone') return;
    params.delete('notice');
    var rest = params.toString();
    history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
    showToast("That dream isn't available anymore");
  })();

  function loadFeed(){
    // Hydrate this device's local block list from the signed-in account's
    // durable server-side copy (tracker item
    // for-product-public-feed-safety-in-app-re-ppuw77) BEFORE computing the
    // feed's own blockedByMe flags below, so a different device (or a
    // cleared browser) picks up existing blocks on its very first load
    // rather than briefly showing already-blocked authors. Never rejects
    // (see its own doc comment) -- always safe to chain straight into
    // getSharedFeed regardless of outcome.
    DreamStore.syncBlockedHandlesFromServer().then(function(){
      return DreamStore.getSharedFeed();
    }).then(function(dreams){
      allDreams = dreams;
      // The pick itself is the server's job now (get-feed.js's
      // resolveDreamOfDay — same dream for every visitor on a given
      // calendar day, excluding ones that already had a previous day's
      // turn). This only decides whether THIS browser still needs the
      // pin-to-top + badge treatment for today's pick: without that check,
      // it'd get forced back to the top of the feed on every single visit
      // within the same day, not just the first. Once seen, it just sits
      // in its normal feed position like any other dream until tomorrow's
      // pick changes the id and the comparison trips again. See
      // DreamStore.getSeenDreamOfDayId/markDreamOfDaySeen.
      var dowId = DreamStore.getLastDreamOfDayId();
      var dow = dowId ? findLoadedDream(dowId) : null;
      if(dow && DreamStore.getSeenDreamOfDayId() !== dow.id){
        dreamOfDayId = dow.id;
        var idx = allDreams.indexOf(dow);
        if(idx > 0){ allDreams.splice(idx, 1); allDreams.unshift(dow); }
        DreamStore.markDreamOfDaySeen(dow.id);
      } else {
        dreamOfDayId = null;
      }
      // A shared-dream deep link (explore.html?id=...) used to rely on the
      // ENTIRE feed being rendered up front, then scrollIntoView()-ing to
      // wherever the target card happened to land -- windowing (this
      // change) breaks that: a deep-linked dream far down a long feed
      // might not be in the DOM at all yet, since only the first
      // BATCH_SIZE dreams render initially. Move it to the very front
      // instead (same technique dream-of-day above already uses, and
      // deliberately applied AFTER dream-of-day so a deep link always wins
      // position 0 over today's pick) -- this guarantees it's in the first
      // batch and already the first thing visible on load, with no
      // scrollIntoView needed at all.
      var targetId = getParam('id');
      var target = targetId ? findLoadedDream(targetId) : null;
      if(target){
        var tIdx = allDreams.indexOf(target);
        if(tIdx > 0){ allDreams.splice(tIdx, 1); allDreams.unshift(target); }
      }
      feedLoaded = true;
      render();
    }).catch(function(){
      feedLoaded = true;
      root.innerHTML = '<div class="grid-empty" style="color:#fff;">Couldn\'t load the feed — check your connection and try again.</div>';
    });
  }
  loadFeed();

  // Picks back up a generation left running when the user navigated away
  // from Processing (browser back, closed tab, etc.) instead of waiting
  // for it to finish there — this used to live on the now-removed Home
  // page, ported here since Explore is the landing surface a resumed
  // generation would complete on now. Harmless no-op for a logged-out
  // visitor or anyone with nothing in flight (getPendingJob() is null).
  var pending = DreamStore.getPendingJob();
  if(pending){
    var banner = document.getElementById('gen-banner');
    banner.style.display = 'flex';
    DreamStore.resumePendingJob().then(function(dream){
      banner.style.display = 'none';
      loadFeed();
      showToast('Your dream is ready!');
      fireFirstVideoCreatedIfEligible(dream);
    }).catch(function(){
      banner.style.display = 'none';
    });
  }

  // ===== "First video created" conversion event — resume-completion path =====
  // Mirrors result.html's own call site (see that page's identical-purpose
  // comment + docs/EVENT_TAXONOMY.md's "FirstVideoCreated" section), for the
  // OTHER place a generation can finish: a pending job left running when the
  // user navigated away from processing.html, resumed and completed right
  // here instead (see the resumePendingJob() call above). Without this, an
  // account whose first-ever completed dream finishes via THIS path never
  // fires the event at all, and — because DreamStore.markFirstVideoCreatedIfEligible
  // gates on the account's dream count being exactly 1 — never gets a
  // second chance: by the time they generate dream #2 and (maybe) land on
  // result.html for it, the count is already 2 and the eligibility check
  // correctly (but permanently) declines to fire retroactively for dream #1.
  //
  // Deliberately does NOT need result.html's extra sessionStorage
  // "dreamtube_just_generated_id" guard: that marker exists there solely to
  // distinguish a fresh post-generation redirect from a later plain
  // revisit/reload of an old result.html?id= URL (see
  // docs/EVENT_TAXONOMY.md). There's no equivalent revisit risk here — this
  // function only ever runs inside resumePendingJob()'s own .then(), which
  // resolves only on a genuine, just-happened completion of a job that was
  // actually in flight, never on a page reload/revisit.
  // markFirstVideoCreatedIfEligible's own account-flag + dream-count check
  // is sufficient on its own to cover that revisit risk. NOT an unqualified
  // "fires exactly once no matter what" guarantee, though: that check is
  // only atomic within a single JS execution context, same as it always
  // was on result.html's own call site — two tabs open on the same
  // account's pendingJob at once (e.g. one here, one on
  // processing.html/result.html) could both read the flag as unset before
  // either write lands, and both fire. Pre-existing limitation in
  // markFirstVideoCreatedIfEligible's own design, not something this
  // call site introduces, but this second call site does add a second
  // independent poller against the same shared state, which widens that
  // latent window. Accepted/tracked, not fixed here.
  function fireFirstVideoCreatedIfEligible(dream){
    try {
      if(!dream || !DreamStore.markFirstVideoCreatedIfEligible(dream.id)) return;
      track('first_video_created', { style: dream.style });
      fireMetaConversion('FirstVideoCreated', { email: DreamStore.getAccountEmail(), custom_data: { style: dream.style } }, true);
      // Retention email -- see result.html's identical-purpose call site's
      // comment + js/store.js's sendFirstDreamEmailBestEffort doc comment.
      DreamStore.sendFirstDreamEmailBestEffort(dream);
    } catch (e) { /* analytics must never break the app */ }
  }

  chip.addEventListener('click', function(){
    filter = null;
    render();
  });

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // Delegated click handling so re-rendering (filtering) never needs to
  // re-attach per-card listeners.
  root.addEventListener('click', function(e){
    // A long caption used to grow unbounded and push into the video/
    // controls above it — same underlying issue as result.html's quote,
    // fixed the same way: clamp to 3 lines by default, tap to expand.
    var captionEl = e.target.closest('.feed-caption');
    if(captionEl){
      captionEl.classList.toggle('clamped');
      return;
    }
    var styleTag = e.target.closest('[data-filter-style]');
    if(styleTag){
      filter = { type: 'style', value: styleTag.dataset.filterStyle };
      render();
      return;
    }
    var userTag = e.target.closest('[data-filter-user]');
    if(userTag){
      filter = { type: 'user', value: userTag.dataset.filterUser };
      render();
      return;
    }
    var muteEl = e.target.closest('[data-mute]');
    if(muteEl){
      // Sound preference is global (not per-video), matching the standard
      // feed-app pattern — unmuting one card keeps the rest unmuted too,
      // including the ones you scroll to next. See DreamStore.setSoundPref.
      var soundOn = !DreamStore.getSoundPref();
      DreamStore.setSoundPref(soundOn);
      Array.prototype.forEach.call(root.querySelectorAll('.feed-video'), function(v){ v.muted = !soundOn; });
      Array.prototype.forEach.call(root.querySelectorAll('.feed-mute-btn'), function(btn){
        btn.innerHTML = soundOn ? Icons.volumeOn : Icons.volumeMuted;
        btn.title = soundOn ? 'Mute' : 'Unmute';
      });
      return;
    }
    // Tapping the video itself, or the play badge that sits on top of it
    // (see cardHTML/wireVideoRecovery), manually toggles playback -- the
    // fallback for whenever autoplay didn't actually start (blocked, slow
    // network, a load error) and the card would otherwise just be stuck.
    var videoEl = e.target.closest('.feed-video');
    var playEl = e.target.closest('[data-play]');
    if(videoEl || playEl){
      var vid = videoEl || playEl.closest('.feed-card').querySelector('.feed-video');
      if(vid){ vid.paused ? vid.play().catch(function(){}) : vid.pause(); }
      return;
    }
    var likeEl = e.target.closest('[data-like]');
    if(likeEl){
      var id = likeEl.dataset.like;
      var d = findLoadedDream(id);
      if(!d || likeEl.dataset.pending) return;
      var wasLiked = d.likedByMe;
      // Optimistic update — flip immediately, reconcile (or roll back) once
      // the real shared count comes back.
      likeEl.dataset.pending = '1';
      d.likedByMe = !wasLiked;
      d.likes += wasLiked ? -1 : 1;
      likeEl.classList.toggle('liked', d.likedByMe);
      likeEl.querySelector('.icon').innerHTML = d.likedByMe ? Icons.heartFilled : Icons.heartOutline;
      likeEl.querySelector('[data-count]').textContent = formatCount(d.likes);
      DreamStore.toggleSharedLike(id, wasLiked).then(function(result){
        d.likes = result.likes;
        d.likedByMe = result.likedByMe;
        delete likeEl.dataset.pending;
        likeEl.classList.toggle('liked', d.likedByMe);
        likeEl.querySelector('.icon').innerHTML = d.likedByMe ? Icons.heartFilled : Icons.heartOutline;
        likeEl.querySelector('[data-count]').textContent = formatCount(d.likes);
      }).catch(function(){
        // Roll back the optimistic flip.
        d.likedByMe = wasLiked;
        d.likes += wasLiked ? 1 : -1;
        delete likeEl.dataset.pending;
        likeEl.classList.toggle('liked', d.likedByMe);
        likeEl.querySelector('.icon').innerHTML = d.likedByMe ? Icons.heartFilled : Icons.heartOutline;
        likeEl.querySelector('[data-count]').textContent = formatCount(d.likes);
        showToast("Couldn't update like — try again.");
      });
      return;
    }
    var shareEl = e.target.closest('[data-share]');
    if(shareEl){
      var dream = findLoadedDream(shareEl.dataset.share);
      if(!dream) return;
      // Opens the share mini-sheet (js/share-sheet.js) — tracker item
      // for-product-build-share-mini-sheet-share-r42tc4. No publish-gate
      // needed here (unlike result.html's own share-btn): every dream in
      // this feed is, by definition, already published. shareText
      // preserves this page's own pre-existing "this dream" wording (a
      // feed visitor sharing someone ELSE's dream, not necessarily their
      // own) — result.html's doShare() keeps its distinct "my dream"
      // wording for the owner's own perspective.
      ShareSheet.show({
        dream: dream,
        shareText: 'Check out this dream: "' + dream.caption + '" — create your own on DreamTube!',
        onToast: showToast
      });
      return;
    }
    var moreEl = e.target.closest('[data-more]');
    if(moreEl){
      var target = findLoadedDream(moreEl.dataset.more);
      if(!target) return;
      ReportSheet.show({
        dream: target,
        isLoggedIn: !!DreamStore.getCurrentUser(),
        onRequireLogin: function(){
          // Same signup-nudge modal explore.html already uses for the
          // +Create/Profile nav taps (see gateNavLink above) -- blocking
          // needs a real signed-in identity to durably sync (see
          // js/store.js's blockUser doc comment), so a logged-out tap
          // routes here instead of silently doing nothing.
          signupCta.href = 'login.html?mode=signup&next=' + encodeURIComponent('explore.html');
          signupNudge.classList.add('open');
        },
        onBlocked: function(handle){
          // Reflect the block immediately in THIS already-loaded feed
          // (both the in-memory flag, so a later render() call stays
          // consistent, and an immediate re-render) rather than waiting
          // for a full reload.
          allDreams.forEach(function(d){ if(d.ownerHandle === handle) d.blockedByMe = true; });
          render();
        },
        onToast: showToast
      });
    }
  });
</script>
</body>
</html>
